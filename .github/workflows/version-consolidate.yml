name: Version consolidate

# Merge-time versioning. DevFlow versions itself with changesets (see .changeset/README.md):
# each PR adds a uniquely-named .changeset/*.md instead of editing plugin.json / CHANGELOG.md,
# so concurrent PRs never conflict on those two hot spots. When a PR merges to main, this job
# consolidates every pending changeset into ONE version bump + CHANGELOG entry and commits it
# back to main with a `chore: bump version` subject.
#
# That same commit also repins every DERIVED pinned-release-tag site (the installer download
# URL and `DEVFLOW_REF=` payload ref in the docs — scripts/version_pins.py owns the
# derivation), and the job then creates the annotated tag `v<new version>` at it. Bump, repin
# and tag are therefore one self-consistent unit: the docs at tag vN say vN. Before issue #953
# the tag step did not exist and nothing coupled the docs to plugin.json, so one merge left the
# install instructions a release behind.
#
# A published GitHub *Release* is raised only for a `minor` or `major` bump (issue #970): a
# Release emails every watcher subscribed to Releases, and patch merges land several times a
# day. Patch bumps still get their annotated tag, so nothing about pinning or reproducibility
# changes — only the announcement.
#
# This job commits a version bump back to main, so branch protection on `main` (the required
# `lib + python tests` check) must permit its write-scoped bump commit. Editing any file under
# `.github/workflows/` needs a `workflows`-scoped push — the DevFlow bot's installation token
# lacks it, so workflow changes land via a human/PAT, not an agent run. Content-pinned by
# lib/test/run.sh.
on:
  push:
    branches: [main]

# Least privilege. `contents: write` is the scope for BOTH remaining writes: pushing the bump
# commit to main, and creating the release ref + its GitHub Release (tags and releases are
# repository *contents*, not a separate permission — there is no `tags:` or `releases:` scope).
# The App token minted below is likewise requested with `permission-contents: write` only.
permissions:
  contents: write

# Serialize runs so two near-simultaneous merges to main don't consolidate from stale
# tips in parallel (cancel-in-progress: false queues rather than drops — every merge is
# still processed). The reset-and-retry loop in the consolidate step is the real
# correctness guard; this just avoids redundant concurrent work.
concurrency:
  group: version-consolidate
  cancel-in-progress: false

jobs:
  consolidate:
    name: Consolidate changesets
    runs-on: ubuntu-latest
    # Self-trigger guard: the bump commit this job creates is itself a push to main. Skip
    # when the head commit is our own `chore: bump version` commit so the job never loops.
    # (A run with no pending changesets is already a clean no-op via the porcelain guard
    # below; this `if` just avoids even booting the runner for the bump commit's own push.)
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: bump version') }}"
    steps:
      # Mint a DevFlow App installation token to push the bump commit. The default
      # GITHUB_TOKEN cannot bypass main's required-checks ruleset (GitHub rejects the
      # first-party github-actions app as a bypass actor — "must be part of the ruleset
      # source or owner organization"), so a direct `git push origin HEAD:main` with it is
      # declined (GH013). The DevFlow App IS a valid org integration and is added to the
      # ruleset's bypass list, so its token's push is exempt. Same client-id/private-key pair
      # the other DevFlow cloud workflows mint from. (#294 post-merge follow-up.)
      - name: Mint DevFlow App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          # Fetch enough history that the commit lands on a real main tip.
          fetch-depth: 0
          # Persist the App token as the git remote credential so the consolidate step's
          # `git push origin HEAD:main` authenticates as the DevFlow App (the bypass actor),
          # not the default GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Consolidate changesets and commit the version bump
        id: consolidate
        # Reset to the freshest main and (re)consolidate on every attempt, so a run that was
        # queued/checked-out behind a concurrent merge always consolidates the CURRENT set of
        # pending changesets from the real main tip — no changeset is ever left behind and the
        # push is a fast-forward. If the push still loses a race, reset to the new tip and
        # retry (the consolidator is idempotent — it re-reads whatever is pending now).
        #
        # `consolidate-changesets.py` fails loud (non-zero, naming the file) on a malformed
        # changeset, so the step goes red rather than silently skipping it or defaulting the
        # version; with no pending changesets it is a clean no-op (no commit, exit 0). The
        # explicit strict-shell mode (`set -e -u -o pipefail`) plus the
        # `if python3 …; then :; else … exit 1; fi` exit-status check make that fail-loud
        # explicit rather than relying on the runner's
        # implicit default shell: the consolidator fails *closed* (no writes on a malformed
        # changeset → clean tree), so without the explicit check a fall-through would hit the
        # clean-tree guard below and exit 0 green, inverting the contract. The
        # subject prefix `chore: bump version` is a load-bearing contract with docs-release-notes
        # Step 4b (kept verbatim; pinned in lib/test/run.sh). Staging is explicit (never
        # `git add -A`) so only the consolidation's own outputs land on main.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Both side channels live in RUNNER_TEMP, OUTSIDE the repository, so neither can
          # ever be picked up by staging or dirty the tree the porcelain guard inspects.
          NOTES="$RUNNER_TEMP/release-notes.md"
          WRITE_SET="$RUNNER_TEMP/consolidator-write-set.txt"
          BUMP_KIND_FILE="$RUNNER_TEMP/consolidator-bump-kind.txt"
          # `pushed` is written ONLY on the success path. An output a step never wrote reads
          # as the empty string, so the tag step's `== 'true'` gate is false by default — no
          # `pushed=false` line to be overridden by a later duplicate key.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -f "$NOTES" "$WRITE_SET" "$BUMP_KIND_FILE"
            if python3 scripts/consolidate-changesets.py \
                 --emit-entry-to "$NOTES" --emit-write-set-to "$WRITE_SET" \
                 --emit-bump-to "$BUMP_KIND_FILE"; then :; else
              echo "::error::consolidator failed"
              exit 1
            fi
            if [ -z "$(git status --porcelain)" ]; then
              echo "No pending changesets consolidated — nothing to commit."
              exit 0
            fi
            # issue #1445: `main` is the SOLE writer of the cloud-writer manifest. Regenerate
            # it here — after `git reset --hard origin/main` above, so the tree carries the
            # just-merged pinned-file changes — immediately before the bump commit, so the
            # digests it publishes derive from the exact bytes this commit ships. Feature
            # branches never regenerate it (its regenerate-artifacts.py batched-pass row was
            # removed) and a hand-authored divergence on a branch is caught by
            # lib/test/cloud-writer-retention-check.py. Staged on its own line below (never
            # `git add -A`); the unstaged-writes backstop further down fails closed if it is
            # left unstaged, so a regeneration is never silently discarded by the next
            # attempt's reset.
            if python3 lib/test/cloud_writer_contract.py generate; then :; else
              echo "::error::cloud-writer manifest regeneration failed"
              exit 1
            fi
            git add scripts/devflow-cloud-writer-contract.json
            # Coupled site of scripts/consolidate-changesets.py's write-set: every file the
            # consolidator writes must be staged here, or its edit is silently discarded by the
            # next attempt's `git reset --hard origin/main`. Deliberately explicit (never
            # `git add -A`). lib/test/run.sh pins this list against the consolidator's writes.
            git add .claude-plugin/plugin.json .claude-plugin/marketplace.json CHANGELOG.md CITATION.cff .changeset
            # The pinned-release-tag rewrite set is DERIVED (issue #953), so it cannot be
            # enumerated here — stage exactly the paths the consolidator reports writing. A
            # pure-builtin read loop, never `xargs`/`tr`: a value that decides an emitted
            # result must not depend on a non-preflight PATH tool.
            while IFS= read -r staged_path; do
              [ -n "$staged_path" ] && git add -- "$staged_path"
            done < "$WRITE_SET"
            # Fail CLOSED on any consolidator write neither list reached. This is the
            # general backstop the two explicit lists cannot be: an unstaged write is
            # silently discarded by the next `git reset --hard`, so the advertised bump
            # would land dead on main while every test stayed green.
            if [ -n "$(git diff --name-only)" ]; then
              echo "::error::the consolidator wrote files that were not staged:"
              git diff --name-only
              exit 1
            fi
            # Derive the tag version BEFORE the push, on its own assignment statement.
            # Two reasons, both fail-direction. (1) Inside the `{ echo …; } >> $GITHUB_OUTPUT`
            # group a command substitution's failure is invisible to `set -e` — the `echo`
            # itself succeeds — so a non-zero `--print-version` would have emitted
            # `pushed=true` with an EMPTY `version`, the gated tag step would then run with
            # an empty BUMP_VERSION, publish-release.sh would die, and the run would end with
            # the bump pushed to main and NO tag: precisely the "docs pin a tag that does not
            # exist" drift this workflow exists to prevent, reached through a swallowed error.
            # As an assignment it is a simple command, so `set -e` observes the failure.
            # (2) Deriving it before `git commit`/`git push` means such a fault aborts while
            # the tree is still local and the reset-and-retry loop can be re-entered safely,
            # rather than after the one irreversible step.
            new_version="$(python3 scripts/version_pins.py --print-version)"
            # Belt-and-braces for a hypothetical exit-0-but-silent producer: an empty version
            # must never reach the tag step, where it becomes an untagged pushed bump.
            if [ -z "$new_version" ]; then
              echo "::error::version_pins.py --print-version produced an empty version; refusing to push an untaggable bump"
              exit 1
            fi
            # The consolidator's own highest-pending-bump answer, read with the `read`
            # BUILTIN (never `cat`/`head`: a value that decides an emitted result must not
            # depend on a non-preflight PATH tool). Deliberately NOT defaulted — an
            # unreadable side channel leaves this empty and publish-release.sh fails loud
            # on an undecidable release rather than silently suppressing an announcement.
            # (An `if`, not `[ … ] && …`: under `set -e` a false one-liner test would abort
            # the step on the ordinary "side channel absent" case.)
            bump_kind=""
            if [ -s "$BUMP_KIND_FILE" ]; then
              read -r bump_kind < "$BUMP_KIND_FILE" || true
            fi
            git commit -m "chore: bump version (consolidate changesets)"
            if git push origin HEAD:main; then
              echo "Pushed version bump on attempt $attempt."
              {
                echo "pushed=true"
                echo "version=$new_version"
                echo "notes=$NOTES"
                echo "bump=$bump_kind"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (main advanced); resetting and retrying (attempt $attempt)."
          done
          echo "::error::could not push the version bump after 5 attempts (main kept advancing)"
          exit 1

      # Tag the bump commit, and publish a Release only when the bump warrants announcing
      # one. Gated on the push having happened, so a no-pending-changesets run stays a clean
      # no-op. EVERY bump is tagged — pinned install URLs and reproducibility are unchanged;
      # `--release minor-major` makes only the *announcement* conditional, because a
      # published Release emails every watcher and patch merges arrived several times a day
      # (issue #970). The bump kind is the consolidator's own highest-pending-bump answer,
      # relayed through a step output, never re-inferred from a version diff. The arm
      # selection and every message live in the helper (CLAUDE.md: inline workflow shell that
      # selects a branch is extracted so lib/test/run.sh can drive each arm); the helper is
      # idempotent and verifies the tag resolves on the remote afterwards — the network half
      # of the release-pin drift guard.
      - name: Tag the bump commit and publish its GitHub Release
        if: steps.consolidate.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Through env, never interpolated into the script body — the standard
          # workflow-injection guard, even though both values are our own derivations.
          BUMP_VERSION: ${{ steps.consolidate.outputs.version }}
          RELEASE_NOTES: ${{ steps.consolidate.outputs.notes }}
          BUMP_KIND: ${{ steps.consolidate.outputs.bump }}
        # No shell hardening preamble here on purpose: this step is a single command, the
        # runner's default `bash -e {0}` already fails the step on a non-zero exit, and the
        # helper hardens its own shell. Repeating the consolidate step's preamble here would
        # also break the #298 uniqueness pin that guards it.
        run: |
          scripts/publish-release.sh --version "$BUMP_VERSION" --notes-file "$RELEASE_NOTES" --release minor-major --bump "$BUMP_KIND"
