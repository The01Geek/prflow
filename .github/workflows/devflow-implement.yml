name: DevFlow (implement)

# `run-name` embeds the issue thread the command was posted on so the gate's
# duplicate check can recognise a second /prflow:implement on the same thread
# while a run is in flight (see scripts/dedupe-implement-run.sh). Quoted because
# the value contains characters YAML would otherwise mis-parse.
run-name: "DevFlow implement (issue ${{ github.event.issue.number }})"

# Heavy listener for /prflow:implement (the transitional /devflow:implement is
# accepted for the alias window). Fires ONLY on a BARE `/prflow:implement <#>`
# real comment on an ISSUE — a genuine user action. It is issues-only: a PR
# comment is also an `issue_comment` in GitHub's API, but the gate `if:` requires
# `github.event.issue.pull_request == null` and the resolver re-checks via
# IS_PULL_REQUEST, so a comment on a pull request never starts a run (this is
# what stops the weekly audit-report comment from self-triggering on the state
# PR). It does NOT trigger from an issue description body or title (the phrase
# merely *quoted* in a description must never start a run), it does NOT require
# `@claude`, and there is NO label trigger.
#
# Why bare-command only: this workflow runs claude-code-action in AGENT mode
# with an explicit, synthesised `/prflow:implement <n>` prompt (the `gate` job
# resolves the number). Agent mode needs no trigger phrase. The gate `if:`
# negates `@claude`, so an `@claude /prflow:implement` comment is ceded to
# Anthropic's stock claude.yml (TAG mode) — an anti-pattern, since that listener
# has no DevFlow plugin — and the two workflows can never double-fire. DevFlow
# never touches claude.yml.
#
# Cost control: agent mode runs for ANY actor, so the `gate` job authorizes the
# sender (an allowed bot OR an `allowed_users` login with write/admin/maintain
# access) before the heavy `claude` job runs. See scripts/resolve-implement-trigger.sh.
#
# This workflow reads `prflow_implement.effort` (e.g. "high") so the planning +
# write-the-tests phases get more reasoning budget than the light `/prflow:*`
# flows in devflow.yml, without inflating every command's cost.
#
# Keep the plugin_marketplaces, plugins, and claude_args sections in sync with
# devflow.yml so the skill surface is identical across listeners. ONE deliberate
# exception (issue #1049): the plugin_marketplaces action INPUT is consumed from the
# implement-only `vendor_marketplace` step, which resolves the prflow plugin root to the
# vendored subtree — do NOT "re-sync" it back to steps.plugins. The skill surface stays
# identical; only the resolution root differs.

on:
  issue_comment:
    types: [created]

defaults:
  run:
    shell: bash

jobs:
  # Duplicates the config job in devflow.yml verbatim except for the
  # `effort` source (`prflow_implement.effort` vs `prflow.effort`). A
  # workflow_call indirection would buy nothing here — the config is
  # ~15 lines and the call would be more.
  config:
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    outputs:
      enabled: ${{ steps.extract.outputs.enabled }}
      base_branch: ${{ steps.extract.outputs.base_branch }}
      claude_model: ${{ steps.extract.outputs.claude_model }}
      allowed_bots: ${{ steps.extract.outputs.allowed_bots }}
      allowed_users: ${{ steps.extract.outputs.allowed_users }}
      effort: ${{ steps.extract.outputs.effort }}
      allowed_tools_extra: ${{ steps.extract.outputs.allowed_tools_extra }}
      prflow_version: ${{ steps.extract.outputs.prflow_version }}
      workpad_marker: ${{ steps.extract.outputs.workpad_marker }}
      # Optional path to a pre-installed Claude Code executable (issue #601),
      # sourced from setup.claude_code_executable. Passed to claude-code-action's
      # path_to_claude_code_executable input in the claude job below. Empty (the
      # default) leaves the action's automatic-install path unchanged.
      claude_code_executable: ${{ steps.extract.outputs.claude_code_executable }}
      # The whole trigger-time config document, forwarded verbatim so the claude
      # job's git-env pin step (issue #645) can resolve setup.git_dir_pin /
      # setup.git_work_tree_pin through the bundled helper rather than re-parsing
      # them inline here. This job checks out the DEFAULT BRANCH at trigger time,
      # so the forwarded document is the trusted tree's — never the PR head's —
      # which is what makes those keys post-merge-only.
      config_json: ${{ steps.cfg.outputs.json }}
    steps:
      - uses: actions/checkout@v6
      - id: cfg
        uses: ./.github/actions/read-project-config
      - id: extract
        env:
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
        run: |
          set -euo pipefail
          ENABLED=$(echo "$CONFIG_JSON" | jq -r '.workflows.prflow // false')
          # SILENT-DISABLE SKEW GUARD (issue #1041) — the ONE guard in this step that is
          # deliberately NOT gated on $ENABLED, because the skew it detects is exactly what
          # forces $ENABLED false. Tier 4 renamed the enable key workflows["devflow"] ->
          # workflows.prflow. While that spelling was FROZEN a refreshed workflow and the
          # config key could never skew; the rename removed that guarantee, and install.sh's
          # workflow copy loop is PER FILE over an install_managed that deliberately
          # PRESERVES a hand-edited workflow (writing a .prflow-new sidecar beside it). So
          # refresh one shipped workflow while the other stays hand-edited on the superseded
          # key: scaffold-config.sh's freshness gate correctly REFUSES the config migration,
          # and this workflow is left reading workflows.prflow against a config that still
          # carries the superseded key. ENABLED resolves absent -> false, every trigger
          # silently no-ops, and the per-family guard below cannot report it because that
          # guard sits inside the enable gate this skew already forced shut.
          #
          # has() throughout, never `//`: a deliberate superseded-key `false` is a
          # valid-falsy value `//` would collapse into "absent" (issue #312).
          #
          # EVERY mention here spells the superseded key in BRACKET form on purpose. The
          # freshness gate in scaffold-config.sh decides staleness by searching this file for
          # a DOTTED read of the superseded key, and it does not care whether the hit is code
          # or a comment. A diagnostic that named the key in dotted form — anywhere, this
          # sentence included — would mark both shipped workflows permanently stale and wedge
          # the very migration it exists to protect. A guard must not defeat another guard;
          # tier1-rename-migration asserts this pair still scans clean.
          SUPERSEDED_ENABLE=$(echo "$CONFIG_JSON" | jq -r 'if (type=="object") and ((.workflows|type)=="object") and ((.workflows|has("prflow"))|not) and (.workflows|has("devflow")) then (.workflows["devflow"]|tostring) else "" end')
          # Bash builtins select the arm — no PATH tool may decide an EMITTED result. The
          # `true` arm mirrors the enable read's string-truthiness (a JSON true and a string
          # "true" both read as enabled), so the ERROR fires on exactly the configs whose
          # author intended this workflow ON and whom the rename has silenced. A superseded
          # key holding any other value already meant "off", so its outcome still matches
          # intent and it warrants a warning rather than a failed run.
          case "$SUPERSEDED_ENABLE" in
            "") : ;;
            true)
              echo "::error::.prflow/config.json still carries the superseded workflows[\"devflow\"] key and has no workflows.prflow, but this workflow reads workflows.prflow — so it resolves as DISABLED and every trigger silently does nothing. This is a PARTIAL upgrade: a hand-edited shipped workflow was preserved rather than refreshed, so the config-key migration was refused while this file was already refreshed. Merge any .github/workflows/*.prflow-new sidecar left beside a hand-edited workflow, then re-run install.sh --apply so the workflow read and the config key move together."
              exit 1 ;;
            *)
              echo "::warning::.prflow/config.json still carries the superseded workflows[\"devflow\"] key and has no workflows.prflow. This workflow reads workflows.prflow, so it is disabled — which matches the superseded key's own value, but the key is un-migrated. Re-run install.sh --apply to migrate it." ;;
          esac
          # STRAY SUPERSEDED FAMILY DETECTION (issue #1083) — advisory, deliberately NOT gated
          # on the enable read. A stray superseded top-level family present beside a canonical
          # prflow* family is a half-migrated config: the stray family's keys resolve to their
          # `// default` everywhere, so any tool grant, allowlist narrowing, or provider
          # selection written under it silently does nothing. The fully-un-migrated shape (no
          # prflow* family present) is left to the loud MISSING_FAMILIES gate below; this warns
          # only when a canonical family sits beside the stray one, which is exactly the
          # population the MISSING_FAMILIES set-difference passes silently (issue #1083).
          #
          # The superseded family names are matched by SHAPE (a `^devflow(_|$)` top-level key),
          # never spelled out, and this comment names NEITHER a dotted superseded read NOR a
          # bare superseded-family literal: the freshness gate in scaffold-config.sh marks a
          # workflow stale on either form, so writing one here — in jq, message, or comment —
          # would wedge every consumer's config-key migration (a guard must not defeat another
          # guard). lib/test/run.sh reconciles this shape against lib/rename-map.json's
          # config_keys so it cannot drift from the rename inventory. `keys` (not `//`) is what
          # keeps a valid-falsy stray value visible: presence is read from the key set, never
          # the value, so a stray family holding false/0/"" is still detected (issue #312).
          STRAY_FAMILIES=$(echo "$CONFIG_JSON" | jq -r '
            if type != "object" then ""
            else
              (keys) as $k
              | (any($k[]; test("^prflow(_|$)"))) as $has_canon
              | if $has_canon then ($k | map(select(test("^devflow(_|$)"))) | join(" ")) else "" end
            end')
          # Bash builtin word-splitting selects the emitted arm — no non-preflight PATH tool
          # decides the result. One warning per stray family, naming it and the remedy.
          if [ -n "$STRAY_FAMILIES" ]; then
            for fam in $STRAY_FAMILIES; do
              echo "::warning::.prflow/config.json carries the superseded top-level config key '$fam' beside a canonical prflow* family. Its keys are ignored — they resolve to their built-in defaults, so any tool grant, allowlist narrowing, or provider selection written under '$fam' silently does nothing. Run /prflow:init to migrate the Tier 1 config keys, then delete the stray '$fam' object."
            done
          fi
          # `// empty` collapses a missing/null allowlist to a real empty string.
          # Fail loud only when the workflow is ENABLED — a config left on the
          # pre-2.2.5 `claude.allowed_bots` key would otherwise propagate a
          # literal "null" allowlist that silently matches no bot. Disabled repos
          # skip the check (allowed_bots is read only downstream of the enabled
          # gate), so this never breaks an intentionally-off install. Mirrors the
          # guard in devflow-runner.yml.
          ALLOWED_BOTS=$(echo "$CONFIG_JSON" | jq -r '.prflow.allowed_bots // empty')
          if [ "$ENABLED" = "true" ] && [ -z "$ALLOWED_BOTS" ]; then
            echo "::error::prflow.allowed_bots is missing from .prflow/config.json (a pre-2.2.5 config may still use the old 'claude.allowed_bots' key — see CHANGELOG 2.2.5 migration)"
            exit 1
          fi
          # PER-FAMILY FAIL-LOUD GUARD (issues #988, #1002). The trigger-time channel
          # reads config through inline jq and NEVER through config-get.sh, so the
          # resolver superseded-key breadcrumb cannot reach it — this is that
          # breadcrumb's counterpart on the one channel it cannot see. Without it a
          # config still on the superseded key names resolves every read below to its
          # `// default`: the human-trigger gate silently WIDENS to everyone, the tool
          # grants vanish to `[]`, and the effort becomes one nobody chose.
          #
          # FAMILY granularity, not leaf: the schema marks none of the optional leaves
          # required, so a consumer who never set `allowed_users` or `effort` must stay
          # unaffected. Only the absence of the whole top-level family object is an error.
          #
          # Same side of the enable gate as the allowed_bots guard above, so an
          # intentionally-disabled repository is never failed.
          if [ "$ENABLED" = "true" ]; then
            MISSING_FAMILIES=$(echo "$CONFIG_JSON" | jq -r --arg fams "prflow prflow_implement prflow_version" '
              if type != "object" then $fams | split(" ") | join(" ")
              else ($fams | split(" ")) - [keys[]] | join(" ") end')
            if [ -n "$MISSING_FAMILIES" ]; then
              echo "::error::.prflow/config.json is missing the config key famil(ies): $MISSING_FAMILIES. If this repository still carries the superseded devflow_* names, run /prflow:init to migrate the whole Tier 1 set atomically; every read below would otherwise silently resolve to its default."
              exit 1
            fi
          fi
          {
            echo "enabled=$ENABLED"
            echo "base_branch=$(echo "$CONFIG_JSON" | jq -r '.base_branch')"
            echo "claude_model=$(echo "$CONFIG_JSON" | jq -r '.claude_model')"
            echo "allowed_bots=$ALLOWED_BOTS"
            # Human logins allowed to trigger /devflow:implement (AND-filter on
            # top of the collaborator-permission gate; '*' = any collaborator).
            echo "allowed_users=$(echo "$CONFIG_JSON" | jq -r '.prflow.allowed_users // "*"')"
            echo "effort=$(echo "$CONFIG_JSON" | jq -r '.prflow_implement.effort // "high"')"
            # Repo-specific extra allowlist for the implement path. Independent
            # from devflow.yml's `prflow.allowed_tools` — the heavy path does NOT
            # inherit the light path's extras, so adopters list every extra tool
            # they want during /devflow:implement under `prflow_implement.allowed_tools`.
            # Emits a leading-comma string (",Bash(make:*),…") or "".
            #
            # Workspace re-anchoring (the deferred half of issue #928). A token may
            # carry the hosted-runner workspace prefix `/home/runner/work/<a>/<b>/`,
            # which embeds the repository name TWICE. Renaming the repository moves
            # $GITHUB_WORKSPACE and every such token stops matching — and per this
            # repo's own documented behaviour an ungranted head is SILENTLY denied,
            # so the loss would surface as a run that quietly does less, never as an
            # error. `sub` re-anchors exactly that prefix onto the live workspace, the
            # same transform `.github/workflows/matcher-probe.yml` applies to its own
            # baseline. Properties that make this safe to land blind:
            #   * It is a NO-OP today — $GITHUB_WORKSPACE already equals the literal
            #     the tokens carry, so the resolved --allowed-tools string is
            #     byte-identical until the day of a rename.
            #   * The pattern is anchored at the token's opening `Bash(` and matches
            #     only GitHub's hosted workspace shape, so a deliberate
            #     out-of-workspace absolute grant — one naming, say, /usr/local/bin/foo
            #     — is left untouched, as is any repo-relative token.
            #   * An empty $GITHUB_WORKSPACE selects the identity branch rather than
            #     rewriting tokens onto a root-anchored /scripts/… path that would
            #     match nothing.
            #   (Both examples are spelled without their literal grant syntax on
            #   purpose: the issue-#405 AC8 pin greps this whole file for an
            #   absolute-path grant rule, and a comment citing one would trip it.)
            #   * The `type == "string"` test guards `sub` only — it never drops an
            #     entry. A non-string entry still reaches `join` and is handled
            #     exactly as before this change (a number joins; an object/array
            #     aborts the step), so the malformed-config behaviour is unchanged
            #     rather than newly silent. Dropping such an entry would instead hand
            #     the run a short allowlist with no diagnostic.
            echo "allowed_tools_extra=$(echo "$CONFIG_JSON" | jq -r --arg ws "$GITHUB_WORKSPACE" '.prflow_implement.allowed_tools // [] | (if $ws == "" then . else map(if type == "string" then sub("^Bash\\(/home/runner/work/[^/]+/[^/]+/"; "Bash(" + $ws + "/") else . end) end) | if length > 0 then "," + join(",") else "" end')"
            # Pinned plugin ref for the vendor-plugin fetch branch (thin installs).
            echo "prflow_version=$(echo "$CONFIG_JSON" | jq -r '.prflow_version // empty')"
            # Effective workpad marker, passed to the resolver's self-trigger guard.
            echo "workpad_marker=$(echo "$CONFIG_JSON" | jq -r '.prflow.workpad_marker // "<!-- prflow:workpad -->"')"
          } >> "$GITHUB_OUTPUT"
          # Optional pre-installed Claude Code executable path (issue #601). For
          # self-hosted runners (typically Windows) whose OS the action's Unix-only
          # bundled installer cannot serve. `// empty` emits an empty *stream* when the key
          # is absent, so the substitution yields the empty string, which the action treats as "not provided" (auto-install unchanged).
          # `try … catch` guards a hand-corrupted non-object `setup` (so the config job
          # never aborts on a malformed setup block); `| strings` drops a non-string
          # leaf value (array/object/number) to empty; `select(test("[\n\r]") | not)`
          # drops even a *valid* string that carries an embedded newline/CR — those
          # would otherwise make jq -r emit a multi-line value that corrupts the
          # key=value GITHUB_OUTPUT line; `select(test("^[[:space:]]*$") | not)` drops a
          # whitespace-only string, which is never a usable executable path and whose
          # intended meaning is "unset" (auto-install). Any rejected shape falls back to
          # empty. Because "rejected" and "unset" both resolve to empty, a *non-empty*
          # raw value that resolves to empty emits a `::warning::` — otherwise a mistyped
          # path on the one platform where this key is load-bearing silently reverts to
          # the broken auto-install path and the operator debugs the installer's
          # misleading "Windows is not supported" error instead of their own typo
          # (the repo's breadcrumb-on-fallback convention; an explicit `""` is a
          # deliberate unset and warns nothing). The raw
          # probe emits the SENTINEL "set" rather than the value itself: command
          # substitution strips trailing newlines, so a value composed entirely of
          # newlines would collapse to the empty string and be misread as "unset",
          # silently skipping the warning for a rejected shape. The probe filters on
          # `!= null` rather than `// empty` because `//` is FALSY-triggered: `// empty`
          # would swallow a valid-falsy `false` leaf, rejecting it to auto-install with
          # no breadcrumb (the documented-off-switch class). JSON `null` stays an unset,
          # like an absent key. `catch "set"` (not `catch empty`) makes a NON-OBJECT
          # `setup` — which raises a jq index error in BOTH filters, so the guarded one
          # cannot resolve a value — warn rather than fail open silently.
          CLAUDE_CODE_EXECUTABLE_RAW=$(echo "$CONFIG_JSON" | jq -r 'try (.setup.claude_code_executable | select(. != null) | tostring | select(. != "") | "set") catch "set"')
          CLAUDE_CODE_EXECUTABLE=$(echo "$CONFIG_JSON" | jq -r 'try (.setup.claude_code_executable // empty | strings | select(test("[\n\r]") | not) | select(test("^[[:space:]]*$") | not)) catch empty')
          if [ -n "$CLAUDE_CODE_EXECUTABLE_RAW" ] && [ -z "$CLAUDE_CODE_EXECUTABLE" ]; then
            echo "::warning::setup.claude_code_executable is set but was rejected (non-string leaf, embedded newline/CR, or whitespace-only); falling back to the action's automatic Claude Code install."
          fi
          echo "claude_code_executable=$CLAUDE_CODE_EXECUTABLE" >> "$GITHUB_OUTPUT"

  # Authorization + target-number gate. The action runs in AGENT mode below
  # (explicit prompt), which executes for ANY actor, so this job is the cost
  # control: it runs the resolver, which authorizes the sender (allowed bot OR
  # write/admin/maintain collaborator) and resolves the issue number. The
  # `claude` job runs ONLY when should_run=true. Coarse event/issue-context
  # matching stays in this job's `if:` (issue_comment with no PR context) so
  # irrelevant events — including PR comments — never spin a runner.
  gate:
    needs: config
    if: |
      needs.config.outputs.enabled == 'true' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (contains(github.event.comment.body, '/prflow:implement') || contains(github.event.comment.body, '/devflow:implement')) && !contains(github.event.comment.body, '@claude')
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read        # checkout the resolver script; collaborator check uses GITHUB_TOKEN
      issues: write         # react step + duplicate notice on issue comments
      pull-requests: write  # parity with devflow.yml's gate (shared react-to-trigger.sh); harmless on the issues-only path
      actions: read         # dedupe step: `gh run list` to detect an in-flight run
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      number: ${{ steps.resolve.outputs.number }}
      duplicate: ${{ steps.dedupe.outputs.duplicate }}
      # Workpad provenance for this run (issue #537, AC1): exactly one of
      # created-current-run / adopted-existing / unknown, decided by the
      # early-workpad step below. The claude job normalizes it into the
      # ephemeral handoff record so Phase 1 can choose truthful lifecycle wording.
      workpad_handoff: ${{ steps.early_workpad.outputs.handoff }}
    steps:
      - uses: actions/checkout@v6
      # Materialize the plugin into the workspace so the resolver/dedupe/react
      # scripts exist at .prflow/vendor/prflow/scripts/ (committed → self →
      # fetch). Without it a thin consumer — or this source repo — fails closed
      # at "resolver not found".
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ needs.config.outputs.prflow_version }}
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # `sender` is present on the issue_comment event and equals the
          # commenter (the actor).
          ACTOR: ${{ github.event.sender.login }}
          ALLOWED_BOTS: ${{ needs.config.outputs.allowed_bots }}
          ALLOWED_USERS: ${{ needs.config.outputs.allowed_users }}
          # The issue the comment is attached to; the fallback target when
          # TRIGGER_TEXT carries no explicit number.
          CONTEXT_NUMBER: ${{ github.event.issue.number }}
          # Only a real issue comment body contributes — never an issue
          # description. Passed as an env var (not interpolated into bash), so
          # arbitrary body text cannot inject.
          TRIGGER_TEXT: ${{ github.event.comment.body }}
          SELF_COMMENT_MARKER: ${{ needs.config.outputs.workpad_marker }}
          # Non-null only for a comment on a PR (a PR comment is also an
          # issue_comment). The resolver declines such a trigger — issues-only
          # backstop for the gate `if:`'s `pull_request == null` filter.
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          # Vendored path: install.sh copies the plugin into
          # .prflow/vendor/prflow/, so consumer repos have the script there,
          # NOT at scripts/ (repo root). Matches every other workflow's
          # invocation convention (e.g. devflow-review.yml's
          # .prflow/vendor/prflow/scripts/dismiss-stale-rejections.sh).
          RESOLVER=.prflow/vendor/prflow/scripts/resolve-implement-trigger.sh
          # Fail CLOSED (not a hard red workflow) if the plugin wasn't vendored,
          # with an actionable root cause. A bare `bash <missing>` under set -e
          # would exit non-zero with only a cryptic "No such file or directory"
          # and no signal to the requester about why their command did nothing.
          if [ ! -f "$RESOLVER" ]; then
            echo "::error::devflow resolver not found at $RESOLVER — has install.sh vendored the plugin into this repo? Skipping the /devflow:implement run." >&2
            { echo "should_run=false"; echo "number="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$RESOLVER" >> "$GITHUB_OUTPUT"

      # Duplicate detection: only when the resolver authorized + resolved a run.
      # Decides `duplicate=true` if an OLDER /devflow:implement run for this same
      # issue/PR thread is still active, so the heavy `claude` job below is
      # skipped and the in-flight run is left untouched. Fails OPEN (the script
      # emits duplicate=false on any error), so a query blip never swallows a
      # legitimate single request.
      - id: dedupe
        if: ${{ steps.resolve.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONTEXT_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEDUPE=.prflow/vendor/prflow/scripts/dedupe-implement-run.sh
          # Fail OPEN if the plugin wasn't vendored: a missing dedupe check must
          # not block a legitimate run — emit duplicate=false and let it proceed.
          if [ ! -f "$DEDUPE" ]; then
            echo "::warning::dedupe script not found at $DEDUPE; not deduping (run proceeds)." >&2
            echo "duplicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$DEDUPE" >> "$GITHUB_OUTPUT"

      # Optional, opt-in: mint ONE App token DOWNSCOPED to this job's
      # user-visible posts — the trigger reaction and the duplicate-ignored
      # notice below (no contents/workflows: this job neither reads code with
      # it nor pushes; the early workpad comment below deliberately stays on
      # github.token — detection is marker-based, so authorship never matters). Same opt-in/fail-loud/downscope contract as the review
      # mint in devflow-runner.yml — see docs/internal/cloud-setup.md. NOTE: fail-loud
      # means a configured-but-broken App fails THIS gate job (and so blocks
      # the run) — deliberate, so a broken App is never silently degraded
      # around. Minted only when a consumer will actually run (should_run
      # gates both the reaction and the notice), so the common
      # unauthorized/non-command rejection path stays mint-free.
      - name: Mint downscoped reaction token (optional)
        id: gate_app_token
        if: ${{ vars.DEVFLOW_APP_ID != '' && steps.resolve.outputs.should_run == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # Early acknowledgement: react on the triggering comment the moment we know
      # /devflow:implement is authorized, resolvable, AND not a duplicate, long
      # before the heavy `claude` job runs. Best-effort and continue-on-error so
      # a reaction hiccup never blocks the run. Skipped for duplicates — those
      # get the explanatory notice below instead of a silent reaction.
      - name: Acknowledge trigger
        if: ${{ steps.resolve.outputs.should_run == 'true' && steps.dedupe.outputs.duplicate != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.gate_app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Invoked via `bash` (not bare-exec) so it works regardless of whether
        # the vendored copy kept its executable bit — matching the resolver's
        # `bash "$RESOLVER"` above. A missing file errors visibly but is
        # absorbed by continue-on-error (best-effort ack).
        run: bash .prflow/vendor/prflow/scripts/react-to-trigger.sh

      # Create the canonical workpad before the heavy job; Phase 1.3 resumes its marker.
      # Best-effort id lookup plus upstream dedupe minimize duplicate creation, but the
      # lookup/create sequence is not atomic under concurrency.
      - name: Create workpad (early acknowledgement)
        id: early_workpad
        if: ${{ steps.resolve.outputs.should_run == 'true' && steps.dedupe.outputs.duplicate != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.resolve.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # AC1: initialize the provenance output to `unknown` BEFORE any fallible
          # work, so every early exit (missing helper, a lookup failure, a create
          # failure) leaves a well-formed neutral token rather than an empty output
          # the claude job would then have to special-case. The three fallible arms
          # below overwrite it only on a positively-observed outcome.
          echo "handoff=unknown" >> "$GITHUB_OUTPUT"
          WP=.prflow/vendor/prflow/scripts/workpad.py
          CLS=.prflow/vendor/prflow/scripts/classify-id-exit.sh
          if [ ! -f "$WP" ] || [ ! -f "$CLS" ]; then
            echo "::warning::workpad.py not vendored at $WP (or classify-id-exit.sh at $CLS); skipping early workpad (the claude job will create it). handoff=unknown." >&2
            exit 0
          fi
          # AC2: handle the THREE `workpad.py id` outcomes distinctly — exit 0 found,
          # exit 2 cleanly absent (the SOLE create authorization), everything else
          # (exit 1 unreadable, or a crash/127/segfault) → NO create. The old
          # `if id …; then` collapsed every non-zero exit into one create branch, so a
          # transient read failure could be misread as absence and attempt a DUPLICATE
          # workpad. Read `id`'s OWN exit status inline (`|| id_exit=$?` — no intervening
          # command, the fail-closed coupled twin of phase-1-setup.md §1.3's three-way
          # form, never a cross-statement `$?` capture, issue #284) and let the
          # suite-tested classify-id-exit.sh map that exit → a dispatch action. The
          # exit→action mapping (the reorderable/invertible logic a presence-pin cannot
          # catch) lives in the helper, driven per-arm from lib/test/run.sh; the arms
          # below emit the provenance tokens. `create` is authorized on exit 2
          # SPECIFICALLY and any unexpected code falls to `skip`, never a duplicate.
          id_exit=0
          python3 "$WP" id "$NUMBER" >/dev/null 2>&1 || id_exit=$?
          case "$(bash "$CLS" "$id_exit")" in
          adopt)
            # Found: this is an ADOPTED existing workpad (a re-trigger / earlier run,
            # incl. a stall-backstop auto-resume). Refresh its Run: link to THIS run so
            # an operator watching a stalled/retried run can click through to the
            # active job's logs, THEN record the gate-adopted startup checkpoint. These
            # are two SEPARATE best-effort calls, not one combined update: the
            # `--checkpoint` requires a canonical `## Progress` section, so a workpad
            # carrying a DUPLICATE one (or an empty body) would make a combined call
            # abort structurally and silently drop the Run-link refresh too (the gate
            # has no legacy-migration path) — issue #537 review. Issue #1347 narrowed
            # which shapes those are: a merely ABSENT `## Progress` is now repaired
            # rather than aborted, but the remaining shapes keep the split earning its
            # keep, so it stands. Splitting adds one PATCH only
            # on the adopted/resume path, never on a normal fresh run (which creates
            # rather than adopts), so AC19's fresh-run write budget is unchanged.
            if ! python3 "$WP" update "$NUMBER" --run-link "[View run]($RUN_URL)"; then
              echo "::warning::early workpad Run-link refresh failed for #$NUMBER; the claude job will refresh it in Phase 1.3 instead." >&2
            fi
            if ! python3 "$WP" update "$NUMBER" --checkpoint "gha:${RUN_ID}:${RUN_ATTEMPT}:gate-adopted" "trigger accepted; existing workpad adopted"; then
              echo "::warning::gate-adopted checkpoint failed for #$NUMBER (a duplicated ## Progress, an empty body, or a transient error — a merely absent ## Progress is repaired since issue #1347, so it is no longer a cause); the Run-link refresh above still landed." >&2
            fi
            echo "handoff=adopted-existing" >> "$GITHUB_OUTPUT"
            echo "Workpad already exists for #$NUMBER — refreshed Run link + gate-adopted checkpoint; leaving the rest for the claude job to resume."
            exit 0
            ;;
          create)
            # Cleanly absent (id exit 2, the SOLE create authorization): fall through to
            # the create block below.
            :
            ;;
          *)
            # `skip` — exit 1 (unreadable gh/API/parse failure) OR any unexpected
            # non-{0,2} code (a killed/segfaulted/absent python3): do NOT create — a
            # duplicate workpad is worse than a delayed one, and the claude job's Phase 1
            # retries the read. handoff stays `unknown` (already emitted above).
            echo "::warning::workpad.py id for #$NUMBER returned a non-absent exit (unreadable or unexpected); NOT creating a workpad to avoid a duplicate — the claude job will retry the read in Phase 1. handoff=unknown." >&2
            exit 0
            ;;
          esac
          # classify-id-exit.sh returned `create` (id exit 2): cleanly absent — create.
          BODY="$(mktemp)"
          # Deterministic label-based PRE-RENDER only: YAML cannot judge issue
          # content, so this trims the bug-only "reproduction captured" sub-item by
          # the 'bug' LABEL. It is a heuristic, NOT the authority: Phase 1.3's
          # `--reconcile-reproduction` (keyed on the recorded CONTENT classification,
          # issue #449) is the authoritative correction that reconciles this skeleton
          # to the classification on every entry — so a bug filed without the label
          # gains the row and a mislabelled feature request loses it there. Only trim
          # when the label lookup SUCCEEDS and a 'bug' label is absent; if the lookup
          # fails, fall back to rendering it (render-on-lookup-failure — a bug issue
          # must not silently lose the row, and 1.3 reconciles it regardless). The
          # assignment in the `if` condition is exempt from set -e.
          REPRO_FLAG=""
          if LABELS="$(gh issue view "$NUMBER" --json labels --jq '.labels[].name' 2>/dev/null)"; then
            grep -qix bug <<<"$LABELS" || REPRO_FLAG="--no-reproduction"
          fi
          # Emit an explicit warning on failure rather than letting
          # continue-on-error swallow it silently — the claude job still
          # creates the workpad in Phase 1.3, so the run is unaffected, but an
          # operator gets a breadcrumb (mirrors the missing-workpad.py warning).
          if ! { python3 "$WP" new-body "$NUMBER" --run-link "[View run]($RUN_URL)" $REPRO_FLAG > "$BODY" \
                 && python3 "$WP" create "$NUMBER" "$BODY"; }; then
            echo "::warning::early workpad create failed for #$NUMBER; the claude job will create it instead. handoff=unknown." >&2
            exit 0
          fi
          # AC1: a clean create is `created-current-run` — the gate observed no
          # workpad and successfully created one, so Phase 1 will use fresh-run
          # wording ("agent initialized"), never a false "run resumed".
          echo "handoff=created-current-run" >> "$GITHUB_OUTPUT"

      # Duplicate notice: tell the requester their command was ignored because a
      # run for this issue/PR is already in flight. Best-effort. CRITICAL: the
      # body must contain NO DevFlow trigger phrase — this comment is itself an
      # issue_comment[created] event, and a trigger phrase here would re-enter
      # the gate and could loop. Worded to avoid `/devflow:` and `@claude`.
      - name: Notice — duplicate ignored
        if: ${{ steps.resolve.outputs.should_run == 'true' && steps.dedupe.outputs.duplicate == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.gate_app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.resolve.outputs.number }}
        run: |
          set -euo pipefail
          NOTE="⏳ An implement run for this issue is already in progress — ignoring this duplicate request and leaving the running one untouched. It will finish on its own; re-issue the command once it completes if you need another pass."
          # Capture gh's stderr into the warning so a permissions/rate-limit
          # failure is distinguishable from a transient blip (same diagnostic
          # discipline as react-to-trigger.sh) — without it, the requester gets
          # no notice AND the log gives no actionable reason.
          # REST (not `gh issue comment` porcelain): this step now runs under
          # the repo-scoped App installation token when configured, and
          # GraphQL-resolving porcelain fails silently under repo-scoped
          # tokens (CLAUDE.md gotcha, #228).
          if ! err="$(gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$NOTE" 2>&1 >/dev/null)"; then
            echo "::warning::could not post duplicate-ignored notice on #$NUMBER (continuing): ${err//$'\n'/ }" >&2
          fi

  claude:
    needs: [config, gate]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.duplicate != 'true'
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write # write scope so actions/cache can save the pip cache (read alone → "cache write denied: token has no writable scopes"); superset still lets Claude read CI results on PRs
    env:
      # Authorize the Stop-hook `--persist` telemetry PUSH on this WRITABLE tier
      # (issue #469 AC5). This job holds contents:write, so the branch push
      # succeeds here; the read-only `review` tier (devflow-runner.yml) deliberately
      # leaves this UNSET so `--persist` fails closed to staging-only. Set at JOB
      # level so it reaches the Stop-hook subprocess claude-code-action spawns —
      # the base-branch .claude/settings.json (restored in every claude-code-action
      # job) cannot distinguish tiers, so the operand must come from the job env,
      # not the hook command. (Platform premise — the job env propagates into the
      # Stop-hook subprocess; see the workpad's unverified-boundary note.)
      DEVFLOW_TELEMETRY_PUSH: '1'
    steps:
      # Optional, opt-in: mint a GitHub App installation token at full
      # installation scope (notably Contents: write + Workflows: write — no
      # permission-* downscope, unlike the per-site tokens elsewhere in these
      # workflows) so the agent's git push can edit
      # .github/workflows/ files (which the built-in GITHUB_TOKEN is hard-blocked
      # from). Gated on the DEVFLOW_APP_ID repository VARIABLE: unset/empty → the
      # step is skipped and both the checkout token and github_token below fall
      # back to GITHUB_TOKEN, leaving behavior byte-for-byte unchanged for
      # consumers who do not opt in. NO continue-on-error: a configured-but-broken
      # App (invalid/rotated key) fails the job here rather than silently
      # degrading to GITHUB_TOKEN. The App permissions come from the installation,
      # not the job's permissions: block.
      #
      # MUST precede the checkout below, whose `token:` it feeds — see the
      # checkout comment. Kept in sync with the same step in devflow.yml.
      - name: Mint workflow-capable token (optional)
        id: app-token
        if: ${{ vars.DEVFLOW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 (all history) — matches devflow.yml and ci.yml.
          # Two requirements, and the second is the binding one (issue #1219):
          #  1. Diff base. /prflow:implement reads the diff via three-dot
          #     notation against `origin/main` (`git diff origin/main...HEAD`),
          #     which computes a merge-base. A bounded depth (this was
          #     `fetch-depth: 50`) covers that for a typical PR.
          #  2. Historical baseline. This job runs the project's own test suite
          #     in-env, and lib/test/run.sh's #719 baseline-corpus control reads
          #     blobs at a FIXED past commit via `git show <ref>:<path>`. That
          #     commit only moves further behind the branch tip, so no bounded
          #     depth keeps resolving it; when it stops, the control self-skips
          #     `blocking-gate` — and a skip exits 0, so the failure is silent
          #     until the run's completion gate refuses the evidence. Evidence
          #     of record: Actions run 30832631347 discarded a 4 min 20 s shard
          #     run and repeated it after `git fetch --unshallow`.
          #     Requirement 1 alone cannot justify a number that satisfies 2.
          # Chosen mechanism: full history rather than a targeted fetch of the
          # required commits. The targeted fetch does work (verified: a
          # `git fetch --depth=1 origin <sha>` onto a depth-50 clone makes
          # `git show <sha>:<path>` resolve while the repo stays shallow) and is
          # cheaper, but it would couple this workflow to `_WSR_RETIRED_REFS`
          # inside lib/test/run.sh — a second copy of that SHA list here would
          # silently stop covering the suite the day a retirement adds a
          # different ref. Cost was NOT re-measured on a runner for this change;
          # issue #1219's figures stand (+9 to +16 s of checkout at this
          # repository's size).
          fetch-depth: 0
          # LOAD-BEARING (issue #357): the credential actions/checkout persists
          # here is what `git push` actually authenticates with — NOT the
          # `github_token` handed to claude-code-action below. checkout@v6 writes
          # the auth header to an external config file wired in via
          # `includeIf.gitdir:` (covering `.git/worktrees/*` too), NOT to
          # `.git/config`; claude-code-action's `git config --unset-all
          # http.<server>/.extraheader` therefore matches nothing ("No existing
          # authentication headers to remove"), and its subsequent
          # `git remote set-url origin https://x-access-token:<app-token>@…`
          # loses to that surviving preemptive `Authorization:` header. Result
          # with an unseeded checkout: every push authenticates as
          # github-actions[bot], whose App has no `workflows` permission, so a
          # push touching .github/workflows/ dies with "refusing to allow a
          # GitHub App to create or update workflow … without workflows
          # permission" while every other push succeeds. Seed the App token here
          # and the header carries it instead. Skipped mint → GITHUB_TOKEN,
          # identical to checkout's own default.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Materialize the plugin (committed → self → fetch) so claude-code-action
      # loads it from .prflow/vendor/prflow/ and the agent's helper scripts
      # resolve at the literal workspace path the allowlist below grants.
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ needs.config.outputs.prflow_version }}

      # Validate the vendored helpers this run cannot degrade around AND write the
      # ephemeral handoff record (issue #537). Runs AFTER vendor-materialization and
      # BEFORE the action so a broken vendor tree fails loud here rather than launching
      # an agent that cannot maintain its workpad (AC25) or one whose prompt carries no
      # engine-ground-truth block, and so Phase 1 can read truthful provenance (AC3).
      - name: Validate vendored helpers + write handoff record
        env:
          NUMBER: ${{ needs.gate.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GATE_HANDOFF: ${{ needs.gate.outputs.workpad_handoff }}
        run: |
          set -euo pipefail
          WP=.prflow/vendor/prflow/scripts/workpad.py
          # AC25: incomplete-vendor guard, extended past workpad.py to the two helpers
          # that compose the agent's own prompt. A committed plugin directory missing
          # any of them launches an agent that cannot maintain its workpad, or one whose
          # prompt carries no engine-ground-truth block — the block being this run's only
          # statement of the headless-run discipline and of the commands it may execute.
          # A directory's presence is not proof a helper exists, so fail BEFORE the
          # action with an actionable diagnostic.
          #
          # workpad.py is required at the VENDORED path alone, the only path the agent is
          # granted to invoke it at. The two prompt-composition helpers are probed
          # vendored-then-repo-root, exactly as compose-implement-prompt.sh probes them,
          # so this guard fails only where the compose step would itself have failed.
          MISSING=""
          [ -f "$WP" ] || MISSING="$WP (the agent cannot maintain its workpad)"
          for _h in render-grounding-block.sh compose-implement-prompt.sh; do
            [ -f ".prflow/vendor/prflow/scripts/$_h" ] || [ -f "scripts/$_h" ] \
              || MISSING="${MISSING:+$MISSING; }.prflow/vendor/prflow/scripts/$_h (the implement prompt would carry no engine-ground-truth block)"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::incomplete vendor: missing after materialization: $MISSING. Repair the committed .prflow/vendor/prflow tree, or check the vendor-plugin fetch (prflow_version). Failing BEFORE Run Claude Code rather than launching a degraded agent." >&2
            exit 1
          fi
          # AC3: normalize the gate provenance to exactly one of the three origin
          # tokens (an empty value from a partially-upgraded consumer, or any
          # unexpected string, becomes `unknown`) and write the five-field JSON
          # handoff record. Workflow-owned, gitignored, non-secret, advisory — NOT
          # passed through Claude action settings. The normalize + write is the
          # suite-tested workpad.py `write-handoff-record` subcommand (the write-side
          # counterpart to `handoff-state`, sharing its `_HANDOFF_ORIGINS` vocabulary so
          # producer and consumer cannot drift) rather than inline heredoc Python, so
          # the empty-string and bogus-value normalization paths are driven by
          # lib/test/run.sh. A write failure degrades to `unknown` at read time
          # (handoff-state), so the `if !` wrapper keeps it best-effort here.
          mkdir -p .prflow/tmp
          REC=".prflow/tmp/implement-handoff-${NUMBER}-${RUN_ID}-${RUN_ATTEMPT}.json"
          if ! python3 "$WP" write-handoff-record "$REC" "$NUMBER" "$RUN_ID" "$RUN_ATTEMPT" "${GATE_HANDOFF:-}"; then
            echo "::warning::could not write handoff record $REC; Phase 1 will degrade to unknown provenance." >&2
          fi

      # Provision the runtime (Python / Node / pip cache / deps) from
      # `.prflow/config.json`'s `setup` block. The logic lives in the
      # setup-project-env composite action so devflow.yml and
      # devflow-implement.yml share ONE copy (checkout above gives the action
      # the repo + config to read). See docs/internal/cloud-setup.md for the rationale.
      - id: cfg
        uses: ./.github/actions/read-project-config
      - uses: ./.github/actions/setup-project-env
        with:
          config_json: ${{ steps.cfg.outputs.json }}

      # ── Long-run credential refresh (issue #487) ──────────────────────────
      # A GitHub App installation token expires 60 minutes after minting and
      # cannot be renewed. The two steps below keep a writer-job run push- and
      # gh-capable past that hour when the opt-in App is configured (gated on the
      # SAME vars.DEVFLOW_APP_ID != '' condition as the app-token mint above, so
      # an unconfigured consumer's behavior is byte-identical to today).
      #
      # DELIBERATELY a DETACHED process, not a `background:` step: actionlint
      # (CI's raven-actions/actionlint@v2) rejects the unrecognized `background:`
      # step key, so the refresher is spawned with `nohup … &` in a normal step
      # that survives into the claude step. The private key is piped to the
      # refresher's stdin (never argv, never disk — a pipe, not a here-string),
      # and the detached refresher is launched with `env -u` (dropping the key var)
      # so its exec-time environment — hence /proc/<pid>/environ, readable by the
      # concurrent same-uid (prompt-injectable) claude step — never holds the PEM.
      # The step-level env var exists ONLY so THIS short-lived launcher shell (gone
      # before the claude step) can pipe it; an in-process `unset` alone would NOT
      # scrub the long-lived refresher's /proc environ, which snapshots exec time
      # (proc(5)). The loop traps TERM/exits 0, so the job conclusion never rides on
      # it; the `if: always()` pidfile-kill step retires it. See docs/internal/cloud-setup.md.
      - name: Start credential refresher (optional)
        id: refresher
        if: ${{ vars.DEVFLOW_APP_ID != '' }}
        env:
          DEVFLOW_APP_ID: ${{ vars.DEVFLOW_APP_ID }}
          DEVFLOW_APP_PRIVATE_KEY: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # No scripts/… self-repo fallback here (unlike the always() Stop step): this
          # step runs right after `vendor-plugin` on the same sequential job, so the
          # vendored path is always present — a fallback would be dead code. Do NOT add
          # one in a wrong-direction "reconcile" with the Stop step.
          # Job-scoped state (issue #1882): so a later job on this runner never reads or
          # retires another job's token file/pidfile/log, and the loop retires itself
          # once its job is no longer the runner's current one (the pointer below).
          HANDLE="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}"
          PTR="$RUNNER_TEMP/devflow-refresh.current-job"
          PID="$RUNNER_TEMP/devflow-refresh-$HANDLE.pid"
          TOK="$RUNNER_TEMP/devflow-gh-token-$HANDLE"
          LOG="$RUNNER_TEMP/devflow-refresh-$HANDLE.log"
          STMARK="$RUNNER_TEMP/devflow-refresh-$HANDLE.selftest-failed"
          printf '%s' "$HANDLE" > "$PTR"
          rm -f "$STMARK" 2>/dev/null || true
          # Publish the job-scoped paths to later steps: gh-fresh reads the token file, the teardown
          # reads the pidfile/log/job pointer. The self-test marker path is NOT published job-wide
          # (issue #1925) — the Stop step derives it from the same HANDLE, mirroring the DEVFLOW_GH decision.
          {
            echo "DEVFLOW_GH_TOKEN_FILE=$TOK"
            echo "DEVFLOW_REFRESH_PIDFILE=$PID"
            echo "DEVFLOW_REFRESH_LOG=$LOG"
            echo "DEVFLOW_REFRESH_JOB_POINTER=$PTR"
          } >> "$GITHUB_ENV"
          # Pre-launch self-test (issue #1882): sign a throwaway input with the real key
          # BEFORE the agent launches, so a host that cannot sign is loud immediately
          # rather than after the token's hour. A signer that refuses the key, or an
          # unresolved/too-old interpreter, FAILS THE JOB here (set -e on the non-zero
          # exit); an absent signer helper (older vendored slice) is warn-and-continue.
          # Told apart by the helper's presence and exit status, never by its output.
          SELFTEST=.prflow/vendor/prflow/scripts/refresher-selftest.sh
          if [ -f "$SELFTEST" ]; then
            printf '%s' "$DEVFLOW_APP_PRIVATE_KEY" \
              | DEVFLOW_REFRESH_SELFTEST_FAILED="$STMARK" bash "$SELFTEST"
          else
            echo "::warning::credential refresher self-test skipped: no signer helper in this vendored plugin slice (older pin) — launching without a pre-flight signer check"
          fi
          # Detached loop. env -u drops the PEM from the long-lived process's environ;
          # the job-scoped paths + pointer are passed DIRECTLY (GITHUB_ENV reaches only
          # LATER steps, not this backgrounded subprocess). Key on stdin, never argv/disk.
          printf '%s' "$DEVFLOW_APP_PRIVATE_KEY" \
            | env -u DEVFLOW_APP_PRIVATE_KEY \
                DEVFLOW_REFRESH_JOB_ID="$HANDLE" DEVFLOW_REFRESH_JOB_POINTER="$PTR" \
                DEVFLOW_REFRESH_PIDFILE="$PID" DEVFLOW_REFRESH_TOKEN_FILE="$TOK" \
                nohup bash .prflow/vendor/prflow/scripts/refresh-app-credentials.sh loop \
                >"$LOG" 2>&1 &
          disown || true
          echo "credential refresher started (detached); log: $LOG"

      # Install scripts/gh-fresh.sh as a `gh` wrapper so agent-side gh resolves
      # its token at call time from the refresher-maintained token file. Wired
      # ahead of the real gh on PATH via GITHUB_PATH — direct skill-fence gh
      # calls, DevFlow's resolver-routed gh-callers (whose PATH probe finds the
      # wrapper when DEVFLOW_GH is unset), and post-claude steps all reach it.
      # Deliberately NOT exported as a process-global DEVFLOW_GH (issue #533):
      # GITHUB_ENV values persist into every later step — including a repo test
      # process — where a non-empty DEVFLOW_GH outranks fixture PATH stubs by
      # resolver design; DEVFLOW_GH stays an explicit caller/test seam. The body
      # is the checked-in seven-output-validated installer, which resolves the
      # real gh's ABSOLUTE path before the GITHUB_PATH prepend takes effect (a
      # name-based lookup in later steps would otherwise recurse into the
      # wrapper) and fails the job before the agent on the first missing output.
      # No scripts/… self-repo fallback here (same rationale as the Start step
      # above): this runs right after `vendor-plugin`, so the vendored tree is
      # present — at the consumer's pinned `prflow_version`. A pin predating
      # this installer has no such file, and the step fails LOUDLY (rc 127,
      # before the agent) until workflows and the pin are refreshed together
      # (see docs/internal/install.md's update section). The installer's own output-2
      # wrapper-SOURCE lookup carries a vendored-or-repo fallback — that is a
      # different path (the gh-fresh.sh bytes to copy), not this invocation.
      - name: Install fresh-gh wrapper (optional)
        if: ${{ vars.DEVFLOW_APP_ID != '' }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          bash .prflow/vendor/prflow/scripts/install-gh-wrapper.sh
      # Without this the #1621 Python-lint gate self-skips (blocking-gate) on every
      # cloud implement run — the tier whose completion gate IS the in-env suite.
      # Keep it conditional and non-fatal: this workflow ships to consumer repos that
      # may track no Python at all, and a failed install must not abort the run.
      - name: Install ruff (arms the #1621 Python-lint gate for in-env verification)
        run: |
          set -uo pipefail
          if [ -z "$(git ls-files '*.py' | head -n 1)" ]; then
            echo "no tracked *.py — skipping ruff install"
            exit 0
          fi
          python3 -m pip install --quiet 'ruff==0.15.*' \
            || echo "::warning::ruff install failed; the Python lint gate will self-skip in this run"
      # ── Third-party model provider resolution (issue #313) ─────────────────
      # Resolve this section's (prflow_implement) provider decision from
      # .prflow/config.json via the single-sourced inline jq RESOLVER below.
      # The RESOLVER program is byte-identical across devflow.yml,
      # devflow-implement.yml, and devflow-runner.yml (lib/test/run.sh pins that
      # identity); only the `--arg section` value differs. An empty decision (no
      # provider) reproduces today's Anthropic-OAuth wiring for a given
      # `claude_model` (one deliberate change: an empty resolved model now fails
      # loud instead of rendering `--model null`) — the provider path is strictly
      # opt-in. See docs/internal/cloud-setup.md.
      - name: Resolve model provider
        id: provider
        env:
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
          SECTION: prflow_implement
        run: |
          set -euo pipefail
          # devflow-provider-resolver BEGIN (single-sourced; keep byte-identical across the three cloud workflows — lib/test/run.sh pins it)
          RESOLVER='
          (if (. | type) == "object" then . else {} end) as $cfg
          | (if (($cfg[$section]) | type) == "object" then $cfg[$section] else {} end) as $sec
          | ($sec.provider) as $praw
          | (if (($sec.claude_model) | type) == "string" and ($sec.claude_model != "") then $sec.claude_model else ($cfg.claude_model // "") end) as $model
          | if ($praw == null or $praw == "") then
              {provider:"", base_url:"", auth:"", timeout_ms:"", effort_supported:true, model:$model, env:{}}
            elif (($praw) | type) != "string" then
              {error:"invalid_provider", section:$section, provider:"", detail:"section provider must be a string"}
            else
              (if (($cfg.providers) | type) == "object" then $cfg.providers else {} end) as $provs
              | if (($provs[$praw]) | type) != "object" then
                  {error:"undefined_provider", section:$section, provider:$praw, detail:"provider is not defined in the providers map"}
                elif (($provs[$praw].auth) as $a | ($a != "bearer" and $a != "api_key" and $a != "bedrock_api_key")) then
                  {error:"incomplete_provider", section:$section, provider:$praw, detail:"provider auth must be one of bearer, api_key, bedrock_api_key"}
                elif (($provs[$praw].auth) as $a | (($a == "bearer" or $a == "api_key") and ((($provs[$praw].base_url) | type) != "string" or ($provs[$praw].base_url == "")))) then
                  {error:"incomplete_provider", section:$section, provider:$praw, detail:"provider entry has no base_url"}
                else
                  ($provs[$praw]) as $p
                  | {provider:$praw, base_url:(if (($p.base_url) | type) == "string" then $p.base_url else "" end), auth:$p.auth, timeout_ms:($p.timeout_ms // ""), effort_supported:(($p.effort_supported // false) == true), model:$model, env:(if (($p.env) | type) == "object" then $p.env else {} end)}
                end
            end
          '
          # devflow-provider-resolver END
          DECISION=$(printf '%s' "$CONFIG_JSON" | jq -c --arg section "$SECTION" "$RESOLVER")
          # jq on EMPTY stdin emits nothing with rc 0, so an empty CONFIG_JSON would
          # otherwise sail through as a zero-output "decision" and silently select the
          # default path (or a misdirected empty-model error downstream). Both producers
          # provably never emit empty today, so this is a fail-loud tripwire, not a live path.
          if [ -z "$DECISION" ]; then
            echo "::error::provider resolver produced no decision for section '$SECTION' (empty config input?). Refusing to run."
            exit 1
          fi
          if [ "$(printf '%s' "$DECISION" | jq -r '.error // ""')" != "" ]; then
            PNAME=$(printf '%s' "$DECISION" | jq -r '.provider // ""')
            DETAIL=$(printf '%s' "$DECISION" | jq -r '.detail // "provider configuration is invalid"')
            echo "::error::.prflow/config.json section '$SECTION' provider '$PNAME': $DETAIL. Fix the providers.$PNAME entry or remove the section provider key. Refusing to run."
            exit 1
          fi
          # One jq pass emits every scalar decision field to the step output, each as a
          # newline-safe heredoc block: a config-sourced value carrying an embedded newline
          # would otherwise split a plain KEY=VALUE line and forge further step outputs. The
          # timestamped+PID delimiter mirrors the decision<< output below.
          sdelim="OUT_EOF_$(date +%s%N)_$$"
          printf '%s' "$DECISION" | jq -r --arg d "$sdelim" '
            ["provider","model","auth","base_url","timeout_ms","effort_supported"][] as $k
            | "\($k)<<\($d)", "\(.[$k])", $d' >> "$GITHUB_OUTPUT"
          # Forward the full decision (it carries the provider env map) to the
          # inject step via a heredoc output so embedded values survive verbatim.
          delim="DEC_EOF_$(date +%s%N)_$$"
          {
            printf 'decision<<%s\n' "$delim"
            printf '%s\n' "$DECISION"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # Inject the provider endpoint into the JOB env — ONLY when a provider is
      # active. A `run:` step writing $GITHUB_ENV (never a static step `env:`
      # block of always-present expressions) is the only mechanism that can carry
      # config-driven dynamic keys, and gating on `provider != ''` keeps the
      # default path free of even empty-valued ANTHROPIC_* vars (AC 1/4). This
      # step also carries the fail-loud empty-secret guard (AC 6), before the
      # action step runs.
      - name: Inject provider endpoint (provider-routed sections only)
        if: ${{ steps.provider.outputs.provider != '' }}
        env:
          DECISION: ${{ steps.provider.outputs.decision }}
          AUTH: ${{ steps.provider.outputs.auth }}
          BASE_URL: ${{ steps.provider.outputs.base_url }}
          TIMEOUT_MS: ${{ steps.provider.outputs.timeout_ms }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          PROVIDER_API_KEY: ${{ secrets.DEVFLOW_PROVIDER_API_KEY }}
          SECTION: prflow_implement
        run: |
          set -euo pipefail
          if [ -z "$PROVIDER_API_KEY" ]; then
            echo "::error::.prflow/config.json section '$SECTION' selects provider '$PROVIDER' but the DEVFLOW_PROVIDER_API_KEY repository secret is empty. Set that secret (the provider API key) before running a provider-routed job. Refusing to run."
            exit 1
          fi
          # SECURITY: the env-map KEY is interpolated RAW into the `KEY<<DELIM` heredoc
          # header — the newline-safe heredoc protects VALUES, not keys, so a key
          # carrying a newline or `<<` could forge a further job env var name or break
          # the heredoc terminator (leaving an opaque "matching delimiter not found"
          # abort). Keys come from maintainer-controlled config, but validate them
          # POSITIVELY against a real env-var-name charset and fail loud on any stray
          # key rather than emit a malformed/forged $GITHUB_ENV block.
          if printf '%s' "$DECISION" | jq -e '.env | keys[] | select(test("^[A-Za-z_][A-Za-z0-9_]*$") | not)' >/dev/null 2>&1; then
            echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' has an env-map key that is not a valid environment variable name ([A-Za-z_][A-Za-z0-9_]*). Fix the providers.$PROVIDER.env keys. Refusing to run."
            exit 1
          fi
          # SECURITY (issue #1773): the shape guard above accepts any valid env-var NAME — do not
          # drop this guard, and keep the assignment bare: a local/declare prefix or an if/&&/||
          # context makes set -e swallow a jq failure, and a denied key is then exported job-wide.
          denied_env_keys="$(printf '%s' "$DECISION" | jq -r '[.env // {} | keys[] | select(ascii_upcase | IN("PATH","GITHUB_TOKEN","GH_TOKEN","GITHUB_ENV","GITHUB_OUTPUT","GITHUB_PATH","ANTHROPIC_API_KEY","ANTHROPIC_AUTH_TOKEN","CLAUDE_CODE_OAUTH_TOKEN","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","AWS_SESSION_TOKEN","AWS_BEARER_TOKEN_BEDROCK","BASH_ENV","ENV","LD_PRELOAD","LD_LIBRARY_PATH","DYLD_INSERT_LIBRARIES","NODE_OPTIONS","PYTHONPATH","CLAUDE_CODE_SUBAGENT_MODEL"))] | join(" ")')"
          if [ -n "$denied_env_keys" ]; then
            echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' env map contains forbidden key(s): $denied_env_keys — a credential name, a variable that would shadow the job environment or its Actions plumbing, an interpreter/loader hook that can make every later step load code you did not intend, or the subagent-model override that flattens the review roster. Set credentials via the DEVFLOW_PROVIDER_API_KEY repository secret, and remove these keys from providers.$PROVIDER.env. Refusing to run."
            exit 1
          fi
          # Keep the assignment bare, exactly as denied_env_keys above (issue #1911): a local/declare
          # or an if/&&/|| context lets set -e swallow a jq failure and the warning silently never fires.
          warned_env_keys="$(printf '%s' "$DECISION" | jq -r '[.env // {} | keys[] | select(ascii_upcase | IN("ANTHROPIC_BASE_URL","API_TIMEOUT_MS","HOME","RUNNER_TEMP"))] | join(" ")')"
          if [ -n "$warned_env_keys" ]; then
            echo "::warning::.prflow/config.json section '$SECTION' provider '$PROVIDER' env map sets key(s): $warned_env_keys — the env map is written last, so its value overrides the dedicated provider field (base_url/timeout_ms) or the job's own HOME/RUNNER_TEMP for every later step. The env map's value takes effect; remove these keys from providers.$PROVIDER.env if that override was not intended."
          fi
          # Every $GITHUB_ENV write below uses GitHub's newline-safe multiline (heredoc) form —
          # the scalar endpoint values via genv(), the provider env map via the inline jq heredoc
          # emit at the end — so a config-sourced value carrying an embedded newline cannot split
          # a plain KEY=VALUE line and inject/forge a further job env var. Mirrors the resolver's
          # decision<< output; the timestamped+PID delimiter makes value collision negligible.
          genv() { local d; d="ENV_EOF_$(date +%s%N)_$$"; { printf '%s<<%s\n' "$1" "$d"; printf '%s\n' "$2"; printf '%s\n' "$d"; } >> "$GITHUB_ENV"; }
          # base_url is guaranteed non-empty by the resolver for bearer/api_key; the
          # bedrock_api_key arm needs none and reaches Bedrock via AWS_REGION instead.
          if [ "$AUTH" = "bedrock_api_key" ]; then
            # AWS region is required and travels in the env map (passthrough below); fail
            # loud when absent/empty so the run does not authenticate then die on every
            # model call. A non-string region reads as absent (strings|select) — fail closed.
            if ! printf '%s' "$DECISION" | jq -e '.env.AWS_REGION | strings | select(. != "")' >/dev/null 2>&1; then
              echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' uses bedrock_api_key auth but its env map sets no AWS_REGION. Add AWS_REGION to providers.$PROVIDER.env (the Bedrock client requires a region). Refusing to run."
              exit 1
            fi
            # base_url is unused here; warn (never fail) if one was set, and export NO
            # ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN on this arm.
            if [ -n "$BASE_URL" ]; then
              echo "::warning::.prflow/config.json section '$SECTION' provider '$PROVIDER' uses bedrock_api_key auth; its base_url is ignored (Bedrock is reached via AWS_REGION, not base_url). Remove base_url from providers.$PROVIDER."
            fi
            genv AWS_BEARER_TOKEN_BEDROCK "$PROVIDER_API_KEY"
          else
            genv ANTHROPIC_BASE_URL "$BASE_URL"
            # Bearer-token gateways read Authorization from ANTHROPIC_AUTH_TOKEN; the
            # same key also rides as the anthropic_api_key action input below (the
            # documented two-slot recipe). auth: api_key passes it via the input only.
            if [ "$AUTH" = "bearer" ]; then genv ANTHROPIC_AUTH_TOKEN "$PROVIDER_API_KEY"; fi
          fi
          # API_TIMEOUT_MS applies to either arm, so write it once after the branch.
          if [ -n "$TIMEOUT_MS" ]; then genv API_TIMEOUT_MS "$TIMEOUT_MS"; fi
          # Do not describe these as filtered: a denied key aborts the whole run above, so nothing
          # is ever dropped and exported alongside. Only the API key above is a masked secret.
          edelim="ENV_EOF_$(date +%s%N)_$$"
          printf '%s' "$DECISION" | jq -r --arg d "$edelim" '.env | to_entries[] | "\(.key)<<\($d)", "\(.value)", $d' >> "$GITHUB_ENV"

      # Export the routed provider's effort capability to the JOB env for the
      # in-session resolve-review-overrides.py. Keep it ungated: a `provider != ''`
      # gate leaves the default path relying on the resolver's fail-open (#1772).
      - name: Export provider effort capability to job env
        env:
          EFFORT_SUPPORTED: ${{ steps.provider.outputs.effort_supported }}
        run: |
          set -euo pipefail
          printf 'PRFLOW_EFFORT_SUPPORTED=%s\n' "$EFFORT_SUPPORTED" >> "$GITHUB_ENV"

      # Compute the claude_args head so --model is always present and --effort is
      # dropped only for a provider whose effort_supported is false (AC 7). The
      # Anthropic default path resolves effort_supported=true, so effort is
      # preserved there (for a non-empty effort value — the run body's
      # flag-injection guard enum-validates effort and allowlist-validates the
      # model id, rejecting flag-shaped or out-of-charset values).
      - name: Build claude_args head (model + conditional effort)
        id: cargs
        env:
          MODEL: ${{ steps.provider.outputs.model }}
          EFFORT: ${{ needs.config.outputs.effort }}
          EFFORT_SUPPORTED: ${{ steps.provider.outputs.effort_supported }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL" ]; then
            echo "::error::claude_model is missing from .prflow/config.json (set a top-level claude_model, or a per-section claude_model). Refusing to run."
            exit 1
          fi
          # SECURITY: MODEL and EFFORT are spliced UNQUOTED into claude_args (a folded
          # CLI string), and the runner can read either from PR-head config (EFFORT
          # always via steps.extract when the caller passes no effort input; MODEL in
          # the bootstrap fallback) — so refuse any value that could smuggle an extra
          # CLI flag. A blacklist is NOT enough here: the action tokenises claude_args
          # shell-style, so a flag-shaped single token (`--model --evil`) records
          # --model as valueless and passes --evil through as its own flag, and a
          # bytewise [[:space:]] check misses Unicode whitespace (NBSP/U+2028/U+3000)
          # under a non-UTF-8 runner locale while the JS tokeniser still splits on it.
          # So MODEL is validated POSITIVELY: reject a leading dash, then reject any
          # character outside the conservative model-id allowlist
          # A-Za-z0-9 . _ / : @ [ ] -  (covers claude-*, provider/model,
          # bracket-suffix context-window ids like name-1.2[1m], and Bedrock-style
          # colon ids) — a
          # multibyte character is rejected in every locale because none of its bytes
          # (C locale) nor its codepoint (UTF-8 locale) is in the allowlist. EFFORT is
          # pinned to its schema enum (or empty, which drops the flag below). In the
          # negated bracket expression, `]` sits first after `!` and `-` last, making
          # both literal members of the set.
          case "$MODEL" in
            -*)
              echo "::error::claude_model value is flag-shaped (leading dash) — refusing to compose claude_args (flag-injection guard; the model must be a single non-dash-leading token)."
              exit 1 ;;
            *[!]A-Za-z0-9._/:@[-]*)
              echo "::error::claude_model value contains a character outside the model-id allowlist (A-Za-z0-9 . _ / : @ [ ] -) — refusing to compose claude_args (flag-injection guard)."
              exit 1 ;;
          esac
          case "$EFFORT" in
            '' | low | medium | high | xhigh | max) : ;;
            *)
              echo "::error::effort value is not one of low/medium/high/xhigh/max — refusing to compose claude_args (flag-injection guard)."
              exit 1 ;;
          esac
          ARGS="--model $MODEL"
          # --effort only when the provider supports it AND a value actually resolved. The
          # config effort defaults to "high", so the default path always has one; the -n
          # co-guard just avoids ever handing the CLI a valueless --effort on a pathological
          # empty effort.
          if [ "$EFFORT_SUPPORTED" = "true" ] && [ -n "$EFFORT" ]; then
            ARGS="$ARGS --effort $EFFORT"
          fi
          # Newline-safe heredoc output (mirrors the resolver's decision<< / scalar-output form).
          adelim="OUT_EOF_$(date +%s%N)_$$"
          { printf 'args<<%s\n' "$adelim"; printf '%s\n' "$ARGS"; printf '%s\n' "$adelim"; } >> "$GITHUB_OUTPUT"

      # Compose the plugins/plugin_marketplaces inputs (issue #505): the baked
      # baseline (byte-identical across the three call sites — run.sh pins it)
      # PLUS the entries this repo's trusted default-branch .claude/settings.json
      # declares (enabledPlugins=true; github-kind extraKnownMarketplaces), so a
      # consumer repo's cloud plugin surface matches what its local team sees —
      # "commit the settings file once, every tier honors it." This write tier's
      # checkout IS the default branch (issue_comment checks out the default), so
      # .claude/settings.json is maintainer-committed, trusted. The single-line
      # `printf '%s\n' <args>` baseline form avoids the YAML-indent-corrupts-
      # multiline-literals gotcha and is grep-pinnable for the sync invariant.
      - name: Compose plugin inputs (baseline + settings-declared)
        id: plugins
        run: |
          set -euo pipefail
          BAKED_PLUGINS="$(printf '%s\n' code-review@claude-plugins-official claude-md-management@claude-plugins-official prflow@devflow-marketplace)"
          BAKED_MARKETPLACES="$(printf '%s\n' https://github.com/anthropics/claude-plugins-official.git ./)"
          SETTINGS=.claude/settings.json
          HELPER=.prflow/vendor/prflow/scripts/resolve-extra-plugins.sh
          COMPOSE=.prflow/vendor/prflow/scripts/describe-plugin-compose.sh
          EX_P="$(mktemp)"; EX_M="$(mktemp)"; ERR_P="$(mktemp)"; ERR_M="$(mktemp)"; ENTRIES="$(mktemp)"
          trap 'rm -f "$EX_P" "$EX_M" "$ERR_P" "$ERR_M" "$ENTRIES"' EXIT
          if [ ! -f "$HELPER" ]; then
            # Skew arm (issue #455 two-halves; inline + grep-pinned by run.sh): the
            # helper is absent at the vendored path — a consumer whose pinned
            # prflow_version predates issue #505 running an upgraded workflow.
            # Proceed with the baked baseline; one ::warning:: names prflow_version
            # as the remedy. This arm fires precisely when describe-plugin-compose.sh
            # (absent alongside it) cannot be invoked, so the warning stays inline
            # rather than routed through the helper.
            echo "::warning::devflow resolve-extra-plugins.sh not found at $HELPER — a pinned prflow_version predating issue #505 running an upgraded workflow; proceeding with the baked plugin baseline. Bump prflow_version in .prflow/config.json to compose settings-declared plugins."
            : > "$EX_P"; : > "$EX_M"; : > "$ERR_P"; : > "$ERR_M"
          else
            bash "$HELPER" plugins "$SETTINGS" > "$EX_P" 2>"$ERR_P" || true
            bash "$HELPER" marketplaces "$SETTINGS" > "$EX_M" 2>"$ERR_M" || true
          fi
          # Join breadcrumbs into one defect string (bash builtins; guard-class 2 —
          # the joined value that decides the degraded-arm message is not derived
          # through cat/tr/sed, non-preflight PATH tools).
          DEFECT=""
          for f in "$ERR_P" "$ERR_M"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              if [ -z "$DEFECT" ]; then DEFECT="$line"; else DEFECT="$DEFECT; $line"; fi
            done < "$f"
          done
          # Spliced entries (extras beyond baseline) for the splice ::notice::.
          : > "$ENTRIES"
          for f in "$EX_P" "$EX_M"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              printf '%s\n' "$line" >> "$ENTRIES"
            done < "$f"
          done
          # Dedupe baseline + extras, keeping the first occurrence (bash builtins;
          # guard-class 2 — no tr/sed/wc/cut/head for the emitted list). The `|`
          # separator never occurs in a plugin@marketplace entry or a marketplace URL.
          dedupe() {
            local baseline="$1" extras="$2" seen="" line out=""
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$seen" in *"|$line|"*) ;; *) seen="$seen|$line|"; out="${out:+$out$'\n'}$line" ;; esac
            done <<< "$baseline"
            if [ -f "$extras" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [ -z "$line" ] && continue
                case "$seen" in *"|$line|"*) ;; *) seen="$seen|$line|"; out="${out:+$out$'\n'}$line" ;; esac
              done < "$extras"
            fi
            printf '%s\n' "$out"
          }
          COMBINED_PLUGINS="$(dedupe "$BAKED_PLUGINS" "$EX_P")"
          COMBINED_MK="$(dedupe "$BAKED_MARKETPLACES" "$EX_M")"
          pdelim="PLG_EOF_$(date +%s%N)_$$"
          { printf 'plugins<<%s\n' "$pdelim"; printf '%s\n' "$COMBINED_PLUGINS"; printf '%s\n' "$pdelim"; } >> "$GITHUB_OUTPUT"
          mdelim="MKT_EOF_$(date +%s%N)_$$"
          { printf 'plugin_marketplaces<<%s\n' "$mdelim"; printf '%s\n' "$COMBINED_MK"; printf '%s\n' "$mdelim"; } >> "$GITHUB_OUTPUT"
          # Annotation — arm classification lives in describe-plugin-compose.sh (the
          # describe-denial-count.sh extraction convention; run.sh drives every arm).
          # Inline fallback for the partial-vendor skew (HELPER present, COMPOSE
          # absent): the helper ran and may have set DEFECT (a degraded settings
          # entry) AND/OR emitted valid extras into ENTRIES (which were already
          # spliced into the credentialed runner's plugin surface unconditionally
          # above). DEFECT and a splice can COEXIST (PR #513) — a degraded entry
          # must NOT suppress the splice ::notice:: for the valid extras. Without
          # COMPOSE to render the annotation, mirror the helper's arms inline and
          # emit each independently, so a spliced entry is never added without an
          # audit line (docs/internal/cloud-setup.md: every spliced entry logged, never silent).
          if [ -f "$COMPOSE" ]; then
            # Capture the renderer's status rather than `|| true`-swallowing it: the
            # extras were already spliced above, so a non-zero renderer must still
            # leave an audit line (PR #513 "never silent"). The run is never
            # broken — the failure is caught, not propagated.
            if ! bash "$COMPOSE" ok "$ENTRIES" "$DEFECT"; then
              echo "::warning::describe-plugin-compose.sh failed (rc≠0); extras (if any) were composed but the audit annotation could not be rendered."
            fi
          else
            # Join the spliced entries via a bash-builtin loop (guard-class 2 — no
            # cat/tr/sed for the emitted list), mirroring describe-plugin-compose.sh's
            # splice ::notice::.
            _splice=""
            if [ -s "$ENTRIES" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [ -z "$line" ] && continue
                if [ -z "$_splice" ]; then _splice="$line"; else _splice="$_splice, $line"; fi
              done < "$ENTRIES"
            fi
            if [ -n "$DEFECT" ] && [ -n "$_splice" ]; then
              echo "::warning::.claude/settings.json has degraded entries ($DEFECT); those are skipped, the valid extras below are composed."
              echo "::notice::Composed plugin/marketplace entries beyond the baked baseline (describe-plugin-compose.sh unavailable): $_splice"
            elif [ -n "$DEFECT" ]; then
              echo "::warning::.claude/settings.json is degraded ($DEFECT); proceeding with the baked plugin baseline."
            elif [ -n "$_splice" ]; then
              echo "::notice::Composed plugin/marketplace entries beyond the baked baseline (describe-plugin-compose.sh unavailable): $_splice"
            fi
          fi

      # Resolve the prflow plugin root to the VENDORED subtree (issue #1049) — the
      # implement tier ONLY (devflow.yml and devflow-runner.yml deliberately keep the
      # repo-root `./`). The composed marketplace list from the step above registers
      # `devflow-marketplace` from the repo-root `./`: the tracked marketplace.json
      # sources `prflow` at `./`, so here $CLAUDE_SKILL_DIR resolves to
      # <workspace>/skills/<name> and the portable helper anchor lands at the repo root.
      # A CONSUMER instead resolves the same shipped bytes from `.prflow/vendor/prflow`.
      # This step swaps the `./` marketplace entry for a job-local marketplace rooted at
      # `./.prflow/vendor` (written by the helper, `prflow` sourced at `./prflow`), so the
      # anchor lands under `.prflow/vendor/prflow/scripts/` here too — the shape this
      # repo emits becomes the shape a consumer emits, and a denial here is a denial
      # there. It leaves the tracked marketplace.json AND the baked baseline literal
      # untouched (issue #1049 constraints): only this composed, job-local list is
      # rewritten, and `plugins` passes through steps.plugins unchanged. The composed-
      # vs-degraded branch selection lives in compose-vendor-marketplace.sh, driven by
      # lib/test/run.sh (the describe-denial-count.sh extraction convention); the outer
      # file-absent guard is the #505-class vendored-helper skew arm and names
      # prflow_version, mirroring the compose step's HELPER guard. Best-effort: the helper
      # never hard-fails (always exits 0) and every non-clean path is audited (never a
      # silently-wrong resolution). THE `./` PREFIX ON THE EMITTED ENTRY IS LOAD-BEARING:
      # claude-code-action validates every plugin_marketplaces entry and rejects a bare
      # relative path outright (`Invalid marketplace URL format`), which broke every cloud
      # implement run in this repo when PR #1137 first shipped this step; the helper
      # normalizes it, and lib/test/run.sh asserts the emitted value satisfies the
      # action's local-path predicate. The step itself runs under `set -euo pipefail`, so a
      # mktemp/output-write failure would fail loudly (never silently) — consistent with
      # the compose step above, which likewise mktemps under set -euo.
      - name: Resolve plugin root to the vendored subtree (issue #1049)
        id: vendor_marketplace
        env:
          COMPOSED_MK: ${{ steps.plugins.outputs.plugin_marketplaces }}
        run: |
          set -euo pipefail
          VENDORMK=.prflow/vendor/prflow/scripts/compose-vendor-marketplace.sh
          MKF="$(mktemp)"; printf '%s\n' "$COMPOSED_MK" > "$MKF"
          if [ -f "$VENDORMK" ]; then
            bash "$VENDORMK" "$MKF" .prflow/vendor \
              || echo "::warning::devflow compose-vendor-marketplace.sh failed (rc≠0); the prflow plugin resolves from the repo-root marketplace (./)."
          else
            echo "::warning::devflow compose-vendor-marketplace.sh not found at $VENDORMK — a pinned prflow_version predating issue #1049 running an upgraded workflow; the prflow plugin resolves from the repo-root marketplace (./). Bump prflow_version in .prflow/config.json."
          fi
          # Re-read the (possibly transformed) list via bash builtins (guard-class 2 —
          # no cat/tr/sed/wc/cut/head for the emitted marketplace list). Blank lines are
          # dropped deliberately, so an empty entry never reaches plugin_marketplaces.
          OUT=""
          while IFS= read -r mkline || [ -n "$mkline" ]; do
            [ -z "$mkline" ] && continue
            OUT="${OUT:+$OUT$'\n'}$mkline"
          done < "$MKF"
          rm -f "$MKF"
          vdelim="MKV_EOF_$(date +%s%N)_$$"
          { printf 'plugin_marketplaces<<%s\n' "$vdelim"; printf '%s\n' "$OUT"; printf '%s\n' "$vdelim"; } >> "$GITHUB_OUTPUT"

      # AC13 boundary 2 (issue #537): record the "Claude job provisioning complete"
      # startup checkpoint immediately before the action, AFTER runtime provisioning
      # and plugin composition, so its timestamp marks the actual action boundary.
      # Best-effort: continue-on-error so a checkpoint hiccup (or an old pinned
      # helper lacking --checkpoint) never blocks the run — it warns and continues.
      # A standalone PATCH (one of the ≤2 the fresh-run write budget allows, AC19).
      - name: Checkpoint — Claude job invoking agent
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NUMBER: ${{ needs.gate.outputs.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          WP=.prflow/vendor/prflow/scripts/workpad.py
          if [ ! -f "$WP" ]; then
            echo "::warning::workpad.py not vendored at $WP; skipping claude-invoke checkpoint." >&2
            exit 0
          fi
          if ! python3 "$WP" update "$NUMBER" \
               --checkpoint "gha:${RUN_ID}:${RUN_ATTEMPT}:claude-invoke" "Claude job setup complete; invoking agent"; then
            echo "::warning::claude-invoke checkpoint failed for #$NUMBER (old helper lacking --checkpoint, or a transient error); continuing." >&2
          fi

      # Resolve the two DEFAULT-OFF git-env pin flags and export the enabled ones
      # (issue #645). Both keys default to false, so on a stock consumer this step
      # emits NOTHING and neither GIT_DIR nor GIT_WORK_TREE is present in the
      # action's environment — the pre-#643 behavior, which is the configuration
      # that works everywhere. #643 set both unconditionally so configureGitAuth
      # would resolve the repo on a self-hosted Windows runner (issue #602), but
      # GIT_WORK_TREE also reaches the Claude Code CLI subprocess that installs
      # plugins, where it makes `git clone` refuse an existing working tree — so
      # every run died at plugin install with `fatal: working tree '<path>'
      # already exists.`, before the agent did any work, producing no verdict at
      # all. The helper is now the SINGLE producer of both variables; the action
      # step below deliberately carries neither in its own `env:` block.
      #
      # THIS TIER IGNORES the GIT_DIR key (--tier implement) and the helper prints
      # a breadcrumb saying so: this tier stages and pushes commits, and ambient
      # GIT_DIR makes a stage issued from a non-root working directory record
      # deletions across the rest of the tree (measured). Only GIT_WORK_TREE can
      # be opted into here.
      #
      # JOB-SCOPED, not step-scoped: `$GITHUB_ENV` appends assignments and offers
      # no removal verb, and the empty-value form that would approximate one is
      # measured fatal (`GIT_DIR=` → `fatal: not a git repository: ''`), which is
      # precisely why the mechanism is an append rather than an `env:` expression
      # (GitHub's workflow syntax accepts no expression evaluating to a whole
      # `env:` mapping, so a variable's KEY cannot be made conditionally absent
      # there). So an enabled variable is in force for `Run Claude Code` AND every
      # step after it, including the agent's own git operations.
      #
      # Fails OPEN to the working default. An absent helper emits nothing and
      # exits 0 rather than failing the job: this workflow reaches consumers via
      # install.sh's file-copy while the helper reaches them via the
      # prflow_version vendor fetch, so a consumer can carry this step before it
      # carries the helper, and that skew must not reproduce the outage above.
      - name: Resolve git-env pins
        env:
          # The trigger-time `config` job's default-branch checkout — a trusted
          # tree, never the PR head. That is what makes these keys post-merge-only.
          GITENV_CFGJSON: ${{ needs.config.outputs.config_json }}
          GITENV_WS: ${{ github.workspace }}
        run: |
          set -uo pipefail
          HELPER='.prflow/vendor/prflow/scripts/emit-git-env.sh'
          if [ ! -f "$HELPER" ]; then
            echo "::notice::devflow git-env pins: bundled helper '$HELPER' is absent (this workflow ships via install.sh's file-copy, the helper via the prflow_version vendor fetch, so a consumer can carry the step first). Failing open to the working default: neither GIT_DIR nor GIT_WORK_TREE is exported."
            exit 0
          fi
          CFG="${RUNNER_TEMP}/devflow-gitenv-config.json"
          if ! printf '%s' "$GITENV_CFGJSON" > "$CFG" 2>/dev/null; then
            echo "::warning::devflow git-env pins: could not materialize the trigger-time config into RUNNER_TEMP; failing open to the working default (neither variable exported)."
            exit 0
          fi
          bash "$HELPER" --workspace "$GITENV_WS" --config-file "$CFG" --tier implement >> "$GITHUB_ENV"

      # Resolve the DEFAULT-OFF prflow.attribute_commits_to_triggerer flag and,
      # when enabled, export the four GIT_AUTHOR_*/GIT_COMMITTER_* variables so the
      # agent's commits are authored by the human who triggered the run (issue #682).
      # Off by default, so on a stock consumer this step emits NOTHING and commits are
      # authored exactly as before. Read at TRIGGER time from the trusted `config`
      # job's default-branch checkout (never the PR head), which makes the flag
      # post-merge-only. Unlike the git-env-pins step above, this step DOES make a
      # `gh api users/<login>` call, so it wires GH_TOKEN into its own env: — without
      # it the call runs unauthenticated against the 60/hr anonymous limit and degrades
      # every run to the login-only fallback. Fails OPEN: an absent helper (install.sh
      # ships the workflow, the prflow_version vendor fetch ships the helper, so a
      # consumer can carry this step first) or an unmaterializable config emits nothing
      # and exits 0. Attribution is advisory and NEVER gates the run. Commit
      # author/committer is git metadata, independent of the push token (which stays the
      # App/github-actions[bot] identity), so this needs no new credential.
      - name: Resolve committer identity
        env:
          ATTR_CFGJSON: ${{ needs.config.outputs.config_json }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          # The step makes a gh api call, so it must carry a token of its own — the
          # minted App token when DEVFLOW_APP_ID is set, else the built-in github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -uo pipefail
          HELPER='.prflow/vendor/prflow/scripts/resolve-committer-identity.sh'
          if [ ! -f "$HELPER" ]; then
            echo "::notice::devflow commit attribution: bundled helper '$HELPER' is absent (this workflow ships via install.sh's file-copy, the helper via the prflow_version vendor fetch, so a consumer can carry the step first). Falling back to current authorship: no GIT_* identity exported."
            exit 0
          fi
          CFG="${RUNNER_TEMP}/devflow-committer-config.json"
          if ! printf '%s' "$ATTR_CFGJSON" > "$CFG" 2>/dev/null; then
            echo "::warning::devflow commit attribution: could not materialize the trigger-time config into RUNNER_TEMP; falling back to current authorship (no GIT_* identity exported)."
            exit 0
          fi
          # The helper's own contract is always-exit-0 (advisory attribution never
          # gates the run); the `|| echo` makes that guarantee real at the step
          # boundary rather than contract-dependent — a helper that ever exits
          # non-zero degrades to current authorship with a breadcrumb, never a
          # failed writer job over an advisory read.
          bash "$HELPER" --login "$SENDER_LOGIN" --config-file "$CFG" >> "$GITHUB_ENV" \
            || echo "::warning::devflow commit attribution: the identity helper exited non-zero; continuing with current authorship (attribution never gates the run)."

      # Resolve the allowed-tools string ONCE, as a step output (issue #1170). It used
      # to be an inline literal inside `claude_args` below, which the grounding block
      # could not read — and a second, hand-copied list would drift from the real one
      # the moment either changed. Hoisting it lets the block quote the exact string
      # this run resolved, by construction (the same single-source shape the
      # `command`/`runner-review` regions already use in devflow.yml/devflow-runner.yml).
      #
      # The TOOLS='…' literal below is a GENERATED region — do NOT hand-edit it. It is
      # compiled from the `implement` profile in lib/capability-profiles.json by
      # lib/generate-capability-profiles.py; change a grant there and regenerate. The
      # banner comment above the assignment carries the manifest_version + the region's
      # sha256, and lib/test/run.sh's --check turns any manifest↔literal drift RED. The
      # step appends `allowed_tools_extra` (`${TOOLS}${EXTRA}`) so the resolved output
      # is the exact string the agent runs under, extras included.
      - name: Resolve allowed-tools
        id: tools
        env:
          EXTRA: ${{ needs.config.outputs.allowed_tools_extra }}
        run: |
          set -euo pipefail
          # devflow-capability-manifest: region=implement manifest_version=28 sha256=a0cbcd06b53f8fc78b371f0affd3f6f7235dc380100b9e8ce1a4d0ce8b9db85b
          TOOLS='Read, Write, Edit, Glob, Grep, LS, Skill, Agent, TodoWrite, EnterPlanMode, ExitPlanMode, WebFetch, WebSearch, Bash(git add:*), Bash(git commit:*), Bash(git push:*), Bash(git pull:*), Bash(git fetch:*), Bash(git ls-remote:*), Bash(git status:*), Bash(git diff:*), Bash(git log:*), Bash(git show:*), Bash(git hash-object:*), Bash(git checkout:*), Bash(git branch:*), Bash(git stash:*), Bash(git rm:*), Bash(git mv:*), Bash(git restore:*), Bash(git revert:*), Bash(git blame:*), Bash(git ls-files:*), Bash(git rev-parse:*), Bash(git merge-base:*), Bash(git merge:*), Bash(gh pr create:*), Bash(gh pr edit:*), Bash(gh pr comment:*), Bash(gh pr diff:*), Bash(gh pr view:*), Bash(gh pr ready:*), Bash(gh pr list:*), Bash(gh pr checks:*), Bash(gh pr status:*), Bash(gh pr reopen:*), Bash(gh issue view:*), Bash(gh issue comment:*), Bash(gh issue list:*), Bash(gh issue edit:*), Bash(gh issue create:*), Bash(gh issue reopen:*), Bash(gh issue status:*), Bash(gh search:*), Bash(gh label list:*), Bash(gh repo view:*), Bash(gh run view:*), Bash(gh run list:*), Bash(gh workflow view:*), Bash(gh workflow list:*), Bash(gh api:*), Bash(jq:*), Bash(.prflow/vendor/prflow/scripts/run-jq.sh:*), Bash(.prflow/vendor/prflow/scripts/config-get.sh:*), Bash(.prflow/vendor/prflow/scripts/workpad.py:*), Bash(.prflow/vendor/prflow/scripts/seed-review-progress.sh:*), Bash(.prflow/vendor/prflow/scripts/compose-run-url.sh:*), Bash(.prflow/vendor/prflow/scripts/verification-flight.py:*), Bash(.prflow/vendor/prflow/scripts/reception-record.py:*), Bash(.prflow/vendor/prflow/scripts/checkout-fingerprint.py:*), Bash(.prflow/vendor/prflow/scripts/check-completion-evidence.py:*), Bash(.prflow/vendor/prflow/scripts/parse-acs.py:*), Bash(.prflow/vendor/prflow/scripts/check-verified-premises.py:*), Bash(.prflow/vendor/prflow/scripts/reconcile-ac-verifiers.py:*), Bash(.prflow/vendor/prflow/scripts/validate-issue-claim-audit.py:*), Bash(.prflow/vendor/prflow/scripts/preflight.py:*), Bash(.prflow/vendor/prflow/scripts/branch-for-issue.py:*), Bash(.prflow/vendor/prflow/scripts/update-branch-checkpoint.sh:*), Bash(.prflow/vendor/prflow/scripts/phase2-durability-checkpoint.sh:*), Bash(.prflow/vendor/prflow/scripts/file-deferrals.py:*), Bash(.prflow/vendor/prflow/scripts/discover-deferral-manifests.py:*), Bash(.prflow/vendor/prflow/scripts/match-deferrals.py:*), Bash(.prflow/vendor/prflow/scripts/resolve-review-overrides.py:*), Bash(.prflow/vendor/prflow/scripts/apply-labels.sh:*), Bash(.prflow/vendor/prflow/scripts/ensure-label.sh:*), Bash(.prflow/vendor/prflow/scripts/apply-pr-triggerer.sh:*), Bash(.prflow/vendor/prflow/scripts/render-pr-provenance-line.py:*), Bash(.prflow/vendor/prflow/scripts/apply-issue-dependencies.py:*), Bash(.prflow/vendor/prflow/scripts/resolve-existing-pr.sh:*), Bash(.prflow/vendor/prflow/lib/efficiency-trace.sh:*), Bash(.prflow/vendor/prflow/scripts/stale-prose-lint.py:*), Bash(.prflow/vendor/prflow/scripts/dismiss-stale-rejections.sh:*), Bash(.prflow/vendor/prflow/scripts/post-review-verdict.sh:*), Bash(.prflow/vendor/prflow/scripts/loop-verdict-marker.py:*), Bash(.prflow/vendor/prflow/scripts/match-lint-adjudications.py:*), Bash(.prflow/vendor/prflow/scripts/normalize-verdicts.py:*), Bash(.prflow/vendor/prflow/scripts/load-prompt-extension.sh:*), Bash(.prflow/vendor/prflow/scripts/render-prompt-extension.sh:*), Bash(*/render-prompt-extension.sh:*), Bash(.prflow/vendor/prflow/scripts/react-to-trigger.sh:*), Bash(.prflow/vendor/prflow/scripts/extract-doc-needed-paths.sh:*), Bash(.prflow/vendor/prflow/scripts/read-doc-needed-deliverables.sh:*), Bash(.prflow/vendor/prflow/scripts/prompt-surface-growth.py:*), Bash(pip install:*), Bash(pip:*), Bash(python:*), Bash(python3:*), Bash(python -m:*), Bash(python3 -m:*), Bash(ruff:*), Bash(ruff check:*), Bash(ruff format:*), Bash(pytest:*), Bash(mypy:*), Bash(grep:*), Bash(rg:*), Bash(find:*), Bash(wc:*), Bash(sort:*), Bash(uniq:*), Bash(cut:*), Bash(tr:*), Bash(xargs:*), Bash(awk:*), Bash(sed:*), Bash(diff:*), Bash(cmp:*), Bash(comm:*), Bash(cat:*), Bash(head:*), Bash(tail:*), Bash(less:*), Bash(ls:*), Bash(tree:*), Bash(file:*), Bash(stat:*), Bash(date:*), Bash(pwd:*), Bash(realpath:*), Bash(dirname:*), Bash(basename:*), Bash(which:*), Bash(type:*), Bash(env:*), Bash(echo:*), Bash(printf:*), Bash(test:*), Bash(touch:*), Bash(mkdir:*), Bash(rmdir:*), Bash(rm:*), Bash(mv:*), Bash(cp:*), Bash(tee:*)'
          # Randomized-delimiter heredoc, not `tools=<value>`: EXTRA is config-derived
          # (`prflow_implement.allowed_tools`), so a newline anywhere in it would truncate
          # the appended value at that point and silently shorten the allowlist feeding
          # BOTH `--allowed-tools` and the injected grounding block. Parity with the
          # `Compose implement grounding block` step's own append. Defense in depth — the
          # generated TOOLS region is newline-free by construction.
          tdelim="TOOLS_EOF_$(date +%s%N)_$$"
          { printf 'tools<<%s\n' "$tdelim"; printf '%s\n' "${TOOLS}${EXTRA}"; printf '%s\n' "$tdelim"; } >> "$GITHUB_OUTPUT"

      # Compose the implement-tier prompt (issue #1170): prepend the engine-ground-truth
      # block so the agent carries the exact resolved allowed-command list in its own
      # prompt and can self-diagnose a silently-refused command against it, instead of
      # guessing. Rendered through the SAME shared helper the review tiers use
      # (scripts/render-grounding-block.sh), in MODE=implement — so there is no second
      # copy of the allowed-tools text (the coupled-mirror hazard the block avoids). The
      # implement mode omits the three review-only sections (CI-results, sole-publisher,
      # trusted-source displacement).
      # Verify the OUTCOME (a non-empty block), not the file's existence: a truncated
      # vendored copy that exits 0 printing nothing FAILS THE JOB rather than shipping an
      # empty block or a bare prompt. The block is the single home of the cloud
      # headless-run discipline, so there is no acceptable degraded prompt here. This does
      # NOT make a denial visible at the moment it happens and does not change the
      # matcher's response; it only gives the agent the list to check against.
      #
      # The three-way selection (renderer absent / renderer produced nothing / compose
      # and publish) lives in scripts/compose-implement-prompt.sh, NOT inline here, so the
      # suite can drive each arm and the arm ORDER — CLAUDE.md's inline-shell-extraction
      # convention: a grep-pin on any one of the ::error:: literals is not coverage of
      # the selection that chooses between them. Vendored copy, repo-path fallback for a
      # self-repo run, exactly like the Stop-refresher step below.
      - name: Compose implement grounding block
        id: compose
        env:
          ALLOWED_TOOLS: ${{ steps.tools.outputs.tools }}
          NUMBER: ${{ needs.gate.outputs.number }}
        run: |
          set -euo pipefail
          H=.prflow/vendor/prflow/scripts/compose-implement-prompt.sh
          [ -f "$H" ] || H=scripts/compose-implement-prompt.sh
          # The helper is FAIL-LOUD by contract: it exits non-zero on every arm that
          # cannot publish a grounded prompt, and the runner's `-e` shell propagates that
          # here — so no `||` tail may absorb it. This check covers only the one case the
          # helper cannot report, a composer absent from BOTH paths (a partial vendor
          # slice); the guard step above already fails on it, so reaching this line means
          # the tree changed under the job.
          if [ ! -f "$H" ]; then
            echo "::error::devflow: compose-implement-prompt.sh is absent from both .prflow/vendor/prflow/scripts/ and scripts/ — the implement prompt would carry no engine-ground-truth block, this run's only statement of the headless-run discipline and of the commands it may execute. Repair the vendored .prflow/vendor/prflow tree, or check the vendor-plugin fetch (prflow_version). Refusing to run." >&2
            exit 1
          fi
          bash "$H"

      # ── Classify prompt-extension arrival (issue #1446) ────────────────────
      # The independent channel: BEFORE the agent runs, read the extension root
      # DIRECTLY (not through the load-prompt-extension.sh delivery channel under
      # test) and record the expected delivery state as a step output. The
      # post-agent reconcile step below checks that expectation against the run's
      # durable workpad, so a lost skill body / extension is observable no matter
      # what the agent self-reports — the class facts (a)/(b) in issue #1446 name.
      # Runs on THIS tier's own checkout (the implement tier never sets
      # DEVFLOW_PROMPT_EXTENSION_ROOT, so the detector resolves the same repo-root
      # extension dir the ladder does).
      - name: Classify prompt-extension arrival
        id: extarrival
        run: |
          set -euo pipefail
          H=.prflow/vendor/prflow/scripts/prompt-extension-arrival.py
          [ -f "$H" ] || H=scripts/prompt-extension-arrival.py
          if [ ! -f "$H" ]; then
            # A vendored tree pinned to an older prflow_version carries no detector;
            # record it so the post-agent reconcile fails CLOSED (a lost detector is
            # unknown, never clean) rather than silently skipping the check.
            echo "::warning::prompt-extension-arrival.py absent from both .prflow/vendor/prflow/scripts/ and scripts/ (older prflow_version); recording detector-absent"
            echo "state=detector-absent" >> "$GITHUB_OUTPUT"
            echo "root=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # classify exits 3 on a present-but-undeliverable fault; keep the recorded
          # line either way (-e must not abort on that loud exit), then publish the
          # resolved root so the run states which root it read (issue #1446 AC8).
          OUT="$(python3 "$H" classify --skill implement)" || true
          echo "$OUT"
          STATE="${OUT#state=}"; STATE="${STATE%% *}"
          ROOT="${OUT#*root=}"; ROOT="${ROOT%% *}"
          echo "state=${STATE:-detector-absent}" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "prompt-extension-arrival: implement extension classified state=${STATE:-detector-absent} root=$ROOT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Surfaces the workflow-capable-token signal to the /devflow:implement
          # agent's Phase 1.6 execution-capability pass (Pass 5, issues #346/#350).
          # NON-EMPTY ⇒ the App token minted above (Contents + Workflows write) is
          # seeded into actions/checkout (#357), so the agent CAN push
          # .github/workflows/ and workflow-resident ACs are NOT deferred. EMPTY ⇒
          # the checkout credential is the built-in GITHUB_TOKEN (github-actions[bot]),
          # which cannot push .github/workflows/, so Pass 5 defers those ACs at plan
          # time. Always exported (empty-valued when the variable is unset) so the
          # pass reads a definite signal rather than an absent one. Coupled to Pass 5's
          # keying in skills/implement/phases/phase-1-setup.md and its lib/test/run.sh pins.
          DEVFLOW_APP_ID: ${{ vars.DEVFLOW_APP_ID }}
          # Propagate the authorized issue-comment sender to the writer so Phase 3.1.1
          # can assign the newly-created draft PR to the developer who triggered the run
          # (issue #1165). This is the SAME trusted login the commit-attribution step and
          # authorization already use (github.event.sender.login). apply-pr-triggerer.sh
          # is FAIL-CLOSED on identity: an empty value (an older workflow paired with a
          # newer skill, or a non-issue-comment trigger) makes it skip assignment rather
          # than substitute the token owner / App identity / GITHUB_ACTOR. Kept under the
          # frozen DEVFLOW_ env prefix (the rename contract freezes env identifiers).
          DEVFLOW_TRIGGERING_USER: ${{ github.event.sender.login }}
          # Harness floor for the dispatch barrier (issue #801) — full rationale in
          # devflow-runner.yml's copy of this entry. On this tier it binds the Phase 2
          # code-explorer/code-architect dispatches, the Phase 3 inline review pass,
          # and the Phase 4.1 docs subagent; the runner-agnostic half is the barrier
          # statement in skills/implement/SKILL.md.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # Anthropic-default path only: pass the OAuth token when no provider is
          # active. A provider-routed section passes '' here (the action treats
          # empty as absent) and authenticates via anthropic_api_key below.
          claude_code_oauth_token: ${{ steps.provider.outputs.provider == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Provider path only: the fixed DEVFLOW_PROVIDER_API_KEY secret satisfies
          # the action's launch check (and, for bearer auth, is ALSO exported as
          # ANTHROPIC_AUTH_TOKEN by the inject step). Empty on the default path.
          # use_bedrock selects Amazon Bedrock at the action layer; it must travel as this
          # input (not a job-env export) because the action's step-level env overrides the
          # job env, blanking a job-env CLAUDE_CODE_USE_BEDROCK. Empty off the Bedrock arm.
          use_bedrock: ${{ steps.provider.outputs.auth == 'bedrock_api_key' && 'true' || '' }}
          # anthropic_api_key rides on the bearer/api_key arms; the bedrock_api_key arm
          # passes '' here and authenticates via AWS_BEARER_TOKEN_BEDROCK.
          anthropic_api_key: ${{ steps.provider.outputs.provider != '' && steps.provider.outputs.auth != 'bedrock_api_key' && secrets.DEVFLOW_PROVIDER_API_KEY || '' }}
          # Use the minted App token for git auth when the opt-in App is
          # configured; otherwise fall back to the built-in GITHUB_TOKEN (the
          # skipped-step path, identical to pre-change behavior).
          github_token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          allowed_bots: ${{ needs.config.outputs.allowed_bots }}

          # Always agent mode: the gate resolved a single issue number, so the
          # action never depends on `@claude` or on reading the raw body.
          # Anthropic's stock claude.yml (tag mode) therefore never double-fires
          # on a bare `/devflow:implement <n>` comment.
          # The `Compose implement grounding block` step prepends the
          # engine-ground-truth block (issue #1170) and FAILS the job when it cannot,
          # because that block is this run's only statement of the headless-run
          # discipline. The `||` bare-prompt default is therefore unreachable in
          # practice; it is kept as the last line of defense so a future step that
          # publishes no `prompt` output cannot hand the action an empty prompt.
          prompt: ${{ steps.compose.outputs.prompt || format('/prflow:implement {0}', needs.gate.outputs.number) }}

          # Agent mode is silent by default; surface a progress comment so the
          # requester sees the run was picked up (applies to all paths now).
          track_progress: false

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Raise the Bash tool's per-command ceiling on THIS tier (issue #1179).
          # Claude Code's BASH_MAX_TIMEOUT_MS defaults to 600000 ms (10 min). Observed on
          # this tier (5 of 5 implement runs analysed 2026-08-02 for #1179): that wall
          # killed the parallel verification coordinator (lib/test/run-parallel.sh, #1086)
          # — the run's final whole-suite gate — with NO output, and the same work was then
          # redone shard by shard, so ~28% of measured run wall-clock produced nothing.
          #
          # The value is sized against a MEASUREMENT, not an estimate. Issue #1180 lowered
          # POOL_RESERVATION_CEILING to 2 and measured the coordinator end to end at
          # 7.9 min at BUDGET=4 — the budget this job's ubuntu-latest 4 vCPU runner yields
          # — against that 10-minute ceiling. That 7.9 min is
          # optimistic in one named way: #1180's stub dispatcher SLEEPS rather than
          # consuming CPU, so it reproduces the scheduler's packing decisions exactly but
          # NOT the contention between shards sharing four cores. The real in-env total is
          # therefore above 7.9 min by an unmeasured amount, against a 10-minute wall —
          # thin, never-observed headroom, and protecting it is what this raise is for.
          #
          # So: a DELIBERATELY BOUNDED 20-minute (1200000 ms) ceiling — room for the
          # unmeasured contention gap above that 7.9-min measurement without the
          # coordinator being killed mid-run, while still terminating a genuinely hung
          # command well inside the job budget. It is a bound, NOT a removal: an unbounded
          # or very large ceiling would convert a hang into a job-timeout-length stall with
          # no diagnostic.
          #
          # MECHANISM — AND WHY THIS CANNOT DROP THE BASE `.claude/settings.json` HOOKS.
          # This is the PR-#1205 review's blocking question, and it is answered from
          # claude-code-action's own source rather than left as the "merge or overwrite?"
          # unknown devflow-runner.yml records. The input is written to the USER settings
          # file, NOT to this repo's project settings: base-action/src/index.ts calls
          # setupClaudeCodeSettings(INPUT_SETTINGS, undefined /* homeDir */), and
          # base-action/src/setup-claude-code-settings.ts resolves that undefined homeDir
          # to os.homedir(), i.e. $HOME/.claude/settings.json, merging the input over
          # whatever that file already held with a shallow top-level spread. The repo's
          # three `Stop` hooks — lib/efficiency-trace.sh --persist (whose PUSH this job
          # authorizes via the job-level DEVFLOW_TELEMETRY_PUSH), lib/implement-stop-guard.sh
          # (the #356/#498 stall/dead-run backstop) and scripts/stop-hook-probe.sh — live in
          # the PROJECT settings file, $GITHUB_WORKSPACE/.claude/settings.json, which the
          # action restores from the base branch and which this input never opens. And
          # base-action/src/parse-sdk-options.ts passes
          # settingSources: ["user", "project", "local"] to the Agent SDK, so the user file
          # this input writes and the project file carrying those hooks are loaded
          # together. On that reading there is no merge-vs-overwrite exposure for those
          # three hooks here, and a copy of them does not belong in this block — copying
          # them in would register each of the three twice (once per settings source) and
          # fire the stall backstop and the telemetry persist twice per stop.
          #
          # REGISTER OF THE PARAGRAPH ABOVE (PR #1205 review round 2). It is a READ of
          # claude-code-action's source — not a measurement taken here, and not a documented
          # input contract — held to the same standard as the runner-source inference
          # further down. The `uses:` on this step floats at `@v1`, so a minor or patch
          # release moves that source with nothing here to notice it: re-verify those source
          # facts after ANY claude-code-action upgrade, not only a major one. Leaving the
          # action unpinned is the deliberate choice — a SHA pin would freeze the source
          # this paragraph reads, but it would also drop the automatic patch pickup `@v1`
          # gives every other input on this step, and which `uses:` form this repo wants is
          # a repo-wide policy question rather than one for this block to settle. The open
          # measurement tracked in #919 (matcher-probe.yml's `pretooluse-probe`) answers a
          # DIFFERENT question — whether a settings-input hook fires — so it neither
          # confirms nor refutes the scope read above, and this block does not wait on it.
          #
          # Two residuals for a future editor. (1) The merge is shallow, so a second
          # top-level key added here REPLACES (never deep-merges) a same-named key already
          # in the user settings file. (2) A `hooks` key added to THIS block would register
          # ADDITIVELY alongside the project hooks rather than replacing them — which is why
          # lib/test/run.sh's #908 AC1 guard permits an env-only settings block on this tier
          # and fails closed on any `hooks`/PreToolUse shape.
          #
          # Why the settings `env` object and not a step-level `env:` (issue #1179's
          # option 2): #1179 makes option 1 the default unless a step-level `env:` is
          # DEMONSTRATED to reach the CLI process the composite action spawns. GitHub
          # documents NOTHING either way for the step-level-env -> composite-action case
          # (the `env` context reference and `steps[*].env` never join the two; the
          # explicit non-propagation sentence GitHub does publish is about REUSABLE
          # WORKFLOWS, not composite actions), and claude-code-action's own action.yml
          # steers callers to job-level `env:` / $GITHUB_ENV for variables it does not
          # itself forward — which is why this repo sets DEVFLOW_TELEMETRY_PUSH at JOB
          # level for its own subprocess reach. Reading actions/runner source suggests a
          # step-level `env:` WOULD in fact arrive (CompositeActionHandler.cs merges the
          # calling step's env overrides into each embedded step's env context, and
          # parse-sdk-options.ts then hands the Agent SDK {...process.env}) — but that is
          # inference from an unpinned runner implementation, not a documented contract
          # and not a measurement taken here, so it does not clear #1179's bar. The
          # settings `env` object is the route the action documents as an input, and the
          # scope question above is answered for it as far as a source read can answer one
          # — so there is nothing to gain by moving the value.
          #
          # The #1132 shard-decomposition fallback stays the in-run route if a command
          # is ever terminated at this raised ceiling.
          #
          # THE FREE ALLOWANCE IS A SECOND, DISTINCT VARIABLE. Claude Code documents
          # BASH_DEFAULT_TIMEOUT_MS (the timeout a Bash call gets when it requests none,
          # default 120000 ms) separately from BASH_MAX_TIMEOUT_MS (the largest timeout the
          # model may request). #1179 raised only the ceiling, so an unparameterized command
          # still died at two minutes: Actions run 31424543691 spent 480 s — 9.2% of an
          # 87-minute run — on four commands killed at 120000 ms and then re-issued with an
          # explicit longer timeout. All four succeeded on retry at <= 600000 ms.
          #
          # 600000 and not 1200000, for three reasons. (a) Every observed kill retried
          # successfully within 600000 ms, so nothing measured needs more. (b) Keeping a gap
          # between the free allowance and the ceiling means a genuinely hung UNPARAMETERIZED
          # command costs ten minutes rather than twenty. (c) The effective per-command wall
          # resolves to the LARGER of the two, so a default at or above the max would
          # silently redefine the bound #1179 chose — which is why lib/test/run.sh asserts
          # default < max per step rather than merely asserting the key is present.
          settings: |
            {
              "env": {
                "BASH_DEFAULT_TIMEOUT_MS": "600000",
                "BASH_MAX_TIMEOUT_MS": "1200000"
              }
            }

          # Composed by the `Compose plugin inputs` step above (issue #505): the
          # baked baseline (byte-identical across the three call sites — run.sh
          # pins it) PLUS the entries .claude/settings.json declares. Kept in sync
          # with devflow.yml so both listeners expose the same skill surface.
          # Consumed here from the `vendor_marketplace` step (issue #1049), which
          # post-processes that composed list so `devflow-marketplace` resolves from
          # the vendored subtree instead of the repo-root `./` — implement tier only;
          # devflow.yml/devflow-runner.yml still consume steps.plugins directly.
          plugin_marketplaces: ${{ steps.vendor_marketplace.outputs.plugin_marketplaces }}

          # code-review@ and claude-md-management@ are ambient-command conveniences (the
          # /code-review and /revise-claude-md slash commands), NOT engine dependencies —
          # DevFlow's engine dispatches neither. The "zero companion-plugin dependencies"
          # claim is scoped to the consumer install + what the engine dispatches; see
          # docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md §6. devflow@ is DevFlow itself. The baked
          # baseline three are composed by the step above; settings-declared extras are
          # appended beyond them.
          plugins: ${{ steps.plugins.outputs.plugins }}

          base_branch: ${{ needs.config.outputs.base_branch }}
          # Optional pre-installed Claude Code executable (issue #601). Empty (the
          # default) is the empty-as-absent idiom of claude_code_oauth_token above:
          # the action auto-installs, unchanged for Linux. Full rationale + the
          # self-hosted-Windows use case are on the config-job extraction above.
          path_to_claude_code_executable: ${{ needs.config.outputs.claude_code_executable }}
          # claude_args head is a COMPUTED string (steps.cargs): --model always,
          # --effort conditional on effort_supported (issue #313). The --allowed-tools
          # tail consumes the `Resolve allowed-tools` step's output (issue #1170) —
          # the hoisted, GENERATED `implement` region now lives in that step, so the
          # grounding block and this flag quote the SAME resolved string and cannot
          # drift. Change a grant in lib/capability-profiles.json and regenerate; the
          # banner + --check gate live with the TOOLS='…' assignment in the step above
          # (devflow-runner.yml/devflow.yml/matcher-probe.yml are generated from the
          # same manifest). Reachable bundled helpers from skills/review*/SKILL.md are
          # granted in that region as vendored literals because Phase 3 runs the review
          # engine INLINE under this allowlist (#484) — otherwise the engine silently
          # refuses them (#363).
          claude_args: >-
            ${{ steps.cargs.outputs.args }}
            --allowed-tools "${{ steps.tools.outputs.tools }}"

      # Retire the detached credential refresher (issue #487). Best-effort,
      # always() so it runs on every exit path. The kill-by-pidfile, log-tail, and
      # defeated-refresher ::warning:: logic lives in scripts/stop-refresher.sh so
      # the branch/message selection is suite-drivable (CLAUDE.md inline-shell-
      # extraction convention). Vendored copy, repo-path fallback for a self-repo run.
      - name: Stop credential refresher (optional)
        if: ${{ always() && vars.DEVFLOW_APP_ID != '' }}
        env:
          # The Start step's outcome. stop-refresher.sh treats the launcher as having
          # RAN when this is `success` OR `failure` (a ran-and-failed launcher is still
          # a genuine never-started defeat — arm18), and as NOT run when `skipped` OR
          # `cancelled` (an upstream early-abort), where a missing pidfile is expected
          # rather than a defeat. (In practice the Start step's run: ends on a bare echo
          # and never waits on its backgrounded nohup, so it realistically only yields
          # success or skipped/cancelled — but the contract handed to the helper is the
          # broader four-way one above.)
          DEVFLOW_REFRESH_STARTED: ${{ steps.refresher.outcome }}
        run: |
          # Derive the self-test marker path in this step's own body (issue #1925),
          # from the same HANDLE the Start step used — it is no longer published job-wide.
          # GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT/GITHUB_JOB are available in every step.
          HANDLE="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}"
          export DEVFLOW_REFRESH_SELFTEST_FAILED="$RUNNER_TEMP/devflow-refresh-$HANDLE.selftest-failed"
          H=.prflow/vendor/prflow/scripts/stop-refresher.sh
          [ -f "$H" ] || H=scripts/stop-refresher.sh
          bash "$H"

      # Surface the claude-code-action run's execution diagnostics (run summary +
      # permission-denial detail) to the job log and $GITHUB_STEP_SUMMARY so a
      # maintainer debugging a stalled / incomplete / unexpectedly-denied cloud
      # run sees the denial detail and run shape directly — the exact information
      # that was irrecoverable for PR #325 (issue #331; helper + config key
      # shipped in #329). Read-only: the helper always exits 0, this step adds no
      # permissions grant / minted-token scope and uploads no artifact, so it
      # never changes the job's pass/fail. always() so it runs even when the
      # claude step errored — which is exactly when the diagnostics matter. Gated
      # on .prflow.execution_diagnostics_enabled (default true) via the vendored
      # config-get.sh (repo-path fallback for a self-repo checkout); only the
      # exact string "false" disables it, and an empty read (config-get soft/hard
      # failure) falls safe to enabled.
      - name: Surface execution diagnostics
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$CG" ] || CG=scripts/config-get.sh
          # `|| true` so config-get's hard-fail exit (malformed config.json / missing
          # python3) can't abort this step under GitHub's default `-e` run shell — which
          # would fail the job and break the "never changes the job's pass/fail" contract
          # above. The empty read then falls safe to enabled on the next line. (Mirrors the
          # `|| echo false` assignment guard in devflow-runner.yml's engine-error step.)
          ENABLED="$("$CG" .prflow.execution_diagnostics_enabled true || true)"
          [ -n "$ENABLED" ] || ENABLED=true
          if [ "$ENABLED" = "false" ]; then
            echo "execution diagnostics: disabled via .prflow.execution_diagnostics_enabled=false; skipping."
            exit 0
          fi
          SED=.prflow/vendor/prflow/scripts/surface-execution-diagnostics.sh
          [ -f "$SED" ] || SED=scripts/surface-execution-diagnostics.sh
          if [ -f "$SED" ]; then
            # `|| echo ::notice::` for the same reason as the config-get guard above:
            # the helper's always-exit-0 contract holds for the committed file, but a
            # partial-copy / truncated vendored helper (a documented deployment hazard)
            # could exit non-zero, which under GitHub's default `-e` run shell would
            # abort this always() step and fail the job. Guard it so the read-only
            # "never changes the job's pass/fail" contract holds even then.
            bash "$SED" "${EXECUTION_FILE:-}" || echo "::notice::surface-execution-diagnostics.sh exited non-zero; execution diagnostics unavailable (best-effort)."
          else
            echo "::notice::surface-execution-diagnostics.sh absent; execution diagnostics not surfaced (best-effort)."
          fi

      # ── Execution-transcript artifact channel (issue #1064 D3) ──────────────
      # Per-workflow D3 inclusion decisions (AC13), recorded here in the shipped code:
      #   devflow-implement.yml (THIS file): INCLUDE — the longest, most expensive
      #     autonomous runs and the tier where a silent denial most often ends a run
      #     with nothing to show; highest forensic value, previously had none.
      #   devflow.yml: INCLUDE — runs the same shared review engine on the surviving
      #     manual path; a denial there is the same no-verdict failure mode (symmetry).
      #   devflow-runner.yml: KEEP AS-IS — already has it; retained per CLAUDE.md's
      #     withheld-tier reconstructability rule (a pre-#937 consumer still runs it).
      #   matcher-probe.yml: EXCLUDE — already uploads a STRUCTURALLY-REDACTED shape
      #     record purpose-built for it; a second un-redacted channel on a maintainer
      #     probe adds exposure without a diagnosis it lacks.
      #   agents-seam-probe.yml: EXCLUDE — single-purpose, short, maintainer-dispatched;
      #     verdict computed deterministically; no denial-diagnosis story to preserve.
      #   telemetry-push.yml: n/a — invokes no engine.
      # Opt-in and DEFAULT-OFF via execution_transcript_artifact_enabled (a transcript can
      # carry a dumped environment, so a consumer must never start publishing transcripts
      # merely by upgrading). This is the OPPOSITE default from the D5 denial-command key,
      # which is default-ON because it is a bounded, scrubbed, command-only field — the two
      # are deliberately NOT harmonized. The scrub/gate/caveat/fail-closed lives in the
      # shared scripts/scrub-transcript.sh helper (D4), not inline here.
      - name: Scrub execution transcript for upload
        id: scrub_transcript
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$CG" ] || CG=scripts/config-get.sh
          # Default-OFF: only the exact string "true" enables (builtin comparison, not a
          # sed/grep pipeline); `|| true` guards config-get's hard-fail under set -e.
          TRANSCRIPT="$("$CG" .prflow.execution_transcript_artifact_enabled false || true)"
          if [ "$TRANSCRIPT" != "true" ]; then
            echo "::notice::execution transcript artifact disabled (execution_transcript_artifact_enabled != true); nothing uploaded."
            exit 0
          fi
          OUT="$RUNNER_TEMP/claude-execution-scrubbed.json"
          ST=.prflow/vendor/prflow/scripts/scrub-transcript.sh
          [ -f "$ST" ] || ST=scripts/scrub-transcript.sh
          if [ -f "$ST" ]; then
            bash "$ST" "$EXECUTION_FILE" "$OUT" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::warning::transcript scrub inert: $ST missing (an older vendored tree); NOT uploading (fail-closed)."
          fi

      - name: Upload execution transcript artifact
        if: always() && steps.scrub_transcript.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scrub_transcript.outputs.path }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Persist review-and-fix observability artifacts (backstop)
        if: ${{ always() }}
        env:
          # Harness-side cost floor inputs (issue #475). On devflow-implement.yml the
          # command class is always `implement` and the candidate is the ISSUE number
          # (needs.gate.outputs.number); prepare-harness-floor.sh resolves the PR opened
          # for it (the skeleton slug) via the closes-issue predicate.
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          DEVFLOW_COMMAND: implement
          DEVFLOW_CANDIDATE_NUMBER: ${{ needs.gate.outputs.number }}
          # Job-lifetime-valid token for the floor's gh PR resolution: the job-start App
          # token can already be past its ~60-minute lifetime by backstop time (#287).
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          HELPER=.prflow/vendor/prflow/lib/efficiency-trace.sh
          [ -f "$HELPER" ] || { echo "::warning::observability backstop: $HELPER missing; skipped"; exit 0; }
          # Harness-side cost floor (issue #475): the glue helper runs the execution-file
          # reader, resolves the PR, and emits the floor env values consumed by --persist.
          # Guard its existence exactly like $HELPER: a vendored tree pinned to an OLDER
          # prflow_version lacks it, and that must draw a NAMED ::warning:: (floor inert),
          # never a raw `No such file` under `set +e`.
          FLOOR=.prflow/vendor/prflow/scripts/prepare-harness-floor.sh
          DEVFLOW_EXECUTION_COST=""
          DEVFLOW_EXECUTION_PR=""
          DEVFLOW_COMMAND_CLASS=""
          if [ -f "$FLOOR" ]; then
            COST_FILE="${RUNNER_TEMP:-/tmp}/devflow-harness-cost-$$.json"
            # The glue prints two eval-able env assignments (PR + class) to stdout and
            # writes the cost JSON to $COST_FILE; its breadcrumbs go to the step log.
            eval "$(bash "$FLOOR" "${EXECUTION_FILE:-}" "${DEVFLOW_COMMAND:-}" "${DEVFLOW_CANDIDATE_NUMBER:-}" "$COST_FILE")"
            [ -s "$COST_FILE" ] && DEVFLOW_EXECUTION_COST="$(cat "$COST_FILE")"
            rm -f "$COST_FILE"
          else
            echo "::warning::harness cost floor inert: $FLOOR missing (a vendored tree pinned to an older prflow_version); the cost floor is skipped this run"
          fi
          # Permission-denial forensics floor (issue #1064 D2/D5). Read the default-ON
          # command-text gate through config-get.sh (the RUNTIME channel, live in this
          # run), then decide enabled/disabled with a bash-builtin `case` (AC9: this
          # SELECTION is never a sed/grep pipeline). The key defaults to TRUE — the
          # OPPOSITE default from execution_transcript_artifact_enabled, because this
          # key gates only a bounded, scrubbed, command-only field while that one gates
          # the whole execution transcript (prompt text, repo content, a possible env
          # dump); do NOT harmonize them. Documented residual (AC6): config-get.sh
          # renders JSON `0` as `0` and coerces `""`/null/[] to the default, so `0`/`""`
          # read as ENABLED — the accepted safe direction for a default-on key; a real
          # JSON `false` is passed through and DOES disable. The builder scrubs the
          # command text (shared blocklist) and fails closed; the count and tool_name
          # are always persisted regardless of this key.
          DENIAL_CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$DENIAL_CG" ] || DENIAL_CG=scripts/config-get.sh
          DENIAL_ENABLED_RAW="$("$DENIAL_CG" .prflow.execution_denial_commands_enabled true || true)"
          case "$DENIAL_ENABLED_RAW" in
            false) DENIAL_CMDS_ENABLED=false ;;
            *)     DENIAL_CMDS_ENABLED=true ;;
          esac
          DENIAL_BUILDER=.prflow/vendor/prflow/scripts/build-denial-record.sh
          [ -f "$DENIAL_BUILDER" ] || DENIAL_BUILDER=scripts/build-denial-record.sh
          DEVFLOW_DENIAL_RECORD=""
          if [ -f "$DENIAL_BUILDER" ]; then
            DEVFLOW_DENIAL_RECORD="$(bash "$DENIAL_BUILDER" "${EXECUTION_FILE:-}" "$DENIAL_CMDS_ENABLED")"
          else
            echo "::warning::denial forensics inert: $DENIAL_BUILDER missing (a vendored tree pinned to an older prflow_version); the denial record is skipped this run"
          fi
          # --persist derives each run's record + durable workpad copy and writes them to
          # the dedicated telemetry branch via git plumbing, then pushes with a fetch/
          # re-parent retry loop — all inside the helper. With the floor env set it ALSO
          # merge-fills harness_cost into this run's record (or writes a minimal cost
          # skeleton) AND the permission_denials record (issue #1064); unset, it is
          # byte-identical to before (issue #441/#475). It never touches HEAD or the
          # TRACKED working tree. Best-effort/exit-0.
          DEVFLOW_EXECUTION_COST="$DEVFLOW_EXECUTION_COST" \
          DEVFLOW_EXECUTION_PR="$DEVFLOW_EXECUTION_PR" \
          DEVFLOW_COMMAND_CLASS="$DEVFLOW_COMMAND_CLASS" \
          DEVFLOW_DENIAL_RECORD="$DEVFLOW_DENIAL_RECORD" \
            bash "$HELPER" --persist
          exit 0

      # ── Fresh App token for the stall backstop (issue #287) ────────────────
      # The `app-token` step above is minted at the START of the `claude` job,
      # which can run well over an hour — longer than a GitHub App installation
      # token's ~60-minute lifetime. The stall backstop that fires AFTER that
      # long run would otherwise inherit an already-expired token, so its
      # workpad read 401s, a healthy workpad is misclassified, and auto-resume
      # can never fire on exactly the long runs that need it. Mint a fresh token
      # here, just-in-time (< 1 min old), mirroring the writer mint (same
      # client-id/private-key, full installation scope); the gate adds `always()`
      # so it still mints after a failed claude job (do NOT "reconcile" it back
      # to the writer's bare `if:` — that would break the backstop on failed
      # runs). When
      # DEVFLOW_APP_ID is unset this step is skipped and its output token is
      # empty, so the backstop's GH_TOKEN falls back to GITHUB_TOKEN exactly as
      # before — the non-adopter path is byte-for-byte unchanged.
      - name: Mint stall-backstop token (optional)
        id: backstop-token
        if: ${{ always() && vars.DEVFLOW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}

      # ── Stall backstop (issue #268; primitives from #266) ──────────────────
      # A headless single-shot claude-code-action run can end mid-lifecycle yet
      # report success (the SDK ends the session on a tool-call-free turn), so
      # this deterministic post-run step keys on the issue workpad Status —
      # never PR draft state — and acts on the pure decision helper's verdict:
      # terminal → no-op; interim → audit comment + re-dispatch (bounded by
      # stall_backstop.max_resume_attempts); cap exhausted or unreadable →
      # distinct comment + non-zero exit (the job goes honestly red). A gh-api/
      # transport/auth failure reading the workpad is a distinct auth-failure
      # class — it fails loud without consuming a resume attempt and is never
      # mislabeled unreadable. Auto-resume needs the optional DEVFLOW_APP_ID App
      # token AND that App's bot login in prflow.allowed_bots; fail-loud works
      # under either token — see docs/internal/implement-skill.md for the full boundary
      # discussion.
      - name: Stall backstop
        if: ${{ always() }}
        env:
          # The freshly-minted backstop token (issue #287), NOT the stale
          # claude-job-scoped app-token — falls back to GITHUB_TOKEN when the
          # opt-in App is unconfigured, identical to the pre-change behavior.
          GH_TOKEN: ${{ steps.backstop-token.outputs.token || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.number }}
          # Whether the workflow-capable App token was actually minted: a
          # GITHUB_TOKEN-authored resume comment never re-triggers the workflow
          # (GitHub suppresses recursive GITHUB_TOKEN events), so a resume
          # decision without the App token must fail loud, not read as green.
          # Keyed on the fresh backstop token (issue #287): when DEVFLOW_APP_ID
          # is set both mints yield a token so this stays true, and when unset
          # both are empty so it stays false — same value either way.
          APP_TOKEN_PRESENT: ${{ steps.backstop-token.outputs.token != '' }}
          # The claude step's outcome disambiguates the missing-vendored-dir
          # case: on a failed/skipped claude step the job is already red (or
          # deliberately not running), so skipping here is benign; on a
          # successful claude step a vanished vendored dir means the backstop
          # was silently disarmed — fail loud instead of masking it.
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          # The job's status (issue #498): success / failure / cancelled. The
          # decide helper's fifth argument; only the exact string `cancelled`
          # selects the cancellation-exclusion path (a cancel is a decided end,
          # not a stall). Deliberately the documented job-context string, not a
          # status-check function (the docs scope those to `if:` conditionals).
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          V=.prflow/vendor/prflow/scripts
          if [ ! -d "$V" ]; then
            if [ "$CLAUDE_OUTCOME" = "success" ]; then
              echo "::error::stall backstop: vendored scripts dir '$V' missing on a successful run — the backstop is disarmed; failing loud"
              exit 1
            fi
            echo "::warning::stall backstop: vendored scripts dir '$V' missing (claude step outcome: ${CLAUDE_OUTCOME:-unknown}); skipped — the job is already non-green"
            exit 0
          fi
          # Dead-run Status flip (issue #356): when this backstop step takes a
          # fail-loud exit AND the workpad Status was successfully read as a
          # genuinely interim (🚀) value, flip it to the terminal 💥 Failed word
          # so the workpad stops lying that a dead run is still working. Best-
          # effort: a flip failure emits a ::warning:: and never changes which
          # exit statement is reached (kept inside the step's `set +e`
          # discipline). Guarded on CLASS=interim, so a terminal/unreadable/
          # auth-failure class is never clobbered (fail closed) — this makes the
          # fail-auth and fail-unreadable arms no-ops for the flip even though
          # they reach the shared final exit. The guard is POSITIONAL, not
          # temporal: the flip is called only at genuine fail-loud exits, never
          # on the green resume path (a terminal Failed written before a resume
          # would make the resumed run's backstop read the workpad as a decided
          # terminal end and misjudge it — pre-#1025 that read terminal→noop and
          # silently disarmed the resume; post-#1025 a `failed` class instead
          # concludes fail-blocked, which would spuriously fail the resumed run —
          # either way the flip must never precede a resume). The dropped-resume
          # and no-App-token aborts ARE fail-loud exits
          # despite living on the resume decision, so they flip: the resume did
          # not actually take, so no run is disarmed.
          # Maintenance obligation of the positional guard: a trap would cover
          # new exits automatically, but cannot (it would fire on the resume
          # path). So every fail-loud exit ADDED to this step must call
          # flip_to_failed itself — omitting the call silently regresses the
          # flip on that arm.
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Base branch for the empty-branch probe (issue #1261). Resolved the same
          # way §1.4 does — config .base_branch, default main. config-get prints a
          # fully-resolved value or nothing, so one emptiness fallback covers both
          # its soft and hard failure paths.
          BASE_BRANCH="$("$V/config-get.sh" .base_branch main)"
          [ -n "$BASE_BRANCH" ] || BASE_BRANCH=main
          # Empty-branch producer (issue #1261): when a terminated run pushed no
          # commit to its remote branch, record that fact on the workpad so an
          # empty branch does not read as a partial success. The three-valued
          # decision (no commit / at least one commit / could-not-establish) and
          # the note it writes live in scripts/record-empty-branch.sh (beside the
          # step, NOT inside the pure decision helper, which keeps its no-I/O
          # purity — AC1) so the suite can drive every outcome against a scratch
          # repo + stubbed workpad. It is
          # called ONLY from the two flip helpers below, which inherit their
          # POSITIONAL CLASS=interim guard — so it is written only at a genuine
          # terminal flip and NEVER on the resume path (issue #1261 gotcha: a
          # no-commit statement written before a resume would be stale the moment
          # the resumed run pushes). The run's feature branch is read from the
          # workpad Branch line best-effort; when it cannot be resolved the helper
          # itself records the unestablished case. Best-effort throughout: the
          # helper always exits 0 and self-warns on a write failure, so the exit
          # arm is never changed (AC5).
          record_empty_branch() {
            [ "${CLASS:-}" = "interim" ] || return 0
            local wp_id wp_body
            wp_id="$(python3 "$V/workpad.py" id "$ISSUE_NUMBER" 2>/dev/null)" || wp_id=""
            wp_body=""
            [ -n "$wp_id" ] && { wp_body="$(python3 "$V/workpad.py" body "$wp_id" 2>/dev/null)" || wp_body=""; }
            # BRANCH is left empty: the helper parses it from the workpad body it
            # receives as EB_WORKPAD_BODY (which is also its idempotency source), so
            # the fragile line parse is driven by the suite rather than stranded in
            # untestable workflow YAML.
            # V is deliberately NOT passed in the env prefix: the helper self-anchors
            # it off its own BASH_SOURCE, which is the same "$V" directory we invoke
            # it from, and an assignment in this prefix would not be visible to the
            # "$V/..." expansion in the same command anyway (SC2097/SC2098).
            ISSUE_NUMBER="$ISSUE_NUMBER" BRANCH="" BASE="$BASE_BRANCH" REMOTE=origin \
              RUN_URL="$RUN_URL" EB_WORKPAD_BODY="$wp_body" \
              bash "$V/record-empty-branch.sh" \
              || echo "::warning::stall backstop: empty-branch producer exited non-zero; workpad note may be unwritten"
          }
          flip_to_failed() {
            [ "${CLASS:-}" = "interim" ] || return 0
            python3 "$V/workpad.py" update "$ISSUE_NUMBER" --status Failed \
              --note "run died: ${1:-dead-end exit} — ${RUN_URL}" \
              || echo "::warning::stall backstop: could not flip workpad Status to 💥 Failed (${1:-dead-end exit}); leaving it unchanged"
            # Record the empty-branch fact alongside the terminal flip (AC6): the
            # 💥 Failed Status and the no-commit statement coexist.
            record_empty_branch
          }
          # Cancelled-run flip (issue #498): mirror of flip_to_failed — the same
          # POSITIONAL CLASS=interim guard, best-effort ::warning:: on failure,
          # never changes the exit arm. Flips an interim workpad to 🛑 Cancelled
          # so a deliberately-cancelled run stops lying it is still working.
          # Called only from the flip-cancelled arm (a green exit), never on the
          # resume path. The note names the signal (job.status=cancelled), never
          # operator intent — same reason-line idiom as flip_to_failed. 🛑 joins
          # 💥 as a workpad-only terminal glyph with no reaction equivalent.
          flip_to_cancelled() {
            [ "${CLASS:-}" = "interim" ] || return 0
            python3 "$V/workpad.py" update "$ISSUE_NUMBER" --status Cancelled \
              --note "run cancelled (job.status=cancelled) — ${RUN_URL}" \
              || echo "::warning::stall backstop: could not flip workpad Status to 🛑 Cancelled; leaving it unchanged"
            # Record the empty-branch fact alongside the terminal flip (AC6): the
            # 🛑 Cancelled Status and the no-commit statement coexist.
            record_empty_branch
          }
          # Master switch first: disabled → fully skipped (no status read, no
          # comment, no resume, no fail). Unrecognized/missing resolves to
          # enabled (only the exact string "false" disables — the decide
          # helper's rule; an empty read is rewritten to "true" here).
          # config-get prints a fully-resolved value or nothing, so one
          # emptiness fallback covers both its soft and hard failure paths.
          ENABLED="$("$V/config-get.sh" .prflow_implement.stall_backstop.enabled true)"
          [ -n "$ENABLED" ] || ENABLED=true
          if [ "$ENABLED" = "false" ]; then
            echo "stall backstop: disabled via stall_backstop.enabled=false; skipping (no status read)"
            exit 0
          fi
          MAX="$("$V/config-get.sh" .prflow_implement.stall_backstop.max_resume_attempts 2)"
          [ -n "$MAX" ] || MAX=2
          # Sanitize MAX here too (mirrors the decide helper): the helper
          # substitutes 2 for a non-integer cap internally, so without this the
          # comments would print a raw corrupt value ("attempt 1 of banana")
          # that the decision never used.
          [[ "$MAX" =~ ^[0-9]+$ ]] || MAX=2
          # Workpad Status read (issue #287): capture the rc into a variable —
          # `$?` is only valid for one test, and we branch on it twice.
          #   exit 3  → a gh-api/transport/auth failure (e.g. an EXPIRED App
          #             token): the workpad may be perfectly healthy, the READ
          #             failed. Classify as 'auth-failure' (its own decision
          #             class), NOT 'unreadable' — fail loud without burning a
          #             resume attempt on a workpad we never actually read.
          #   exit 1  → unparseable/absent/unrecognized Status (content-shape).
          #   exit 2  → no workpad. Both map to the 'unreadable' class.
          #   rc-0 empty output → defensively 'unreadable'.
          # stderr deliberately flows to the run log — the helper's exit-1/exit-3
          # causes emit distinct diagnostics there; the no-workpad exit-2 and
          # rc-0-empty causes are silent, distinguished only by the status= echo
          # below.
          STATUS_OUT="$(python3 "$V/workpad.py" status "$ISSUE_NUMBER")"
          STATUS_RC=$?
          if [ "$STATUS_RC" -eq 3 ]; then
            echo "::error::stall backstop: reading the workpad Status failed with a gh-api/transport/auth error (workpad.py status exit 3; the specific gh error is on workpad.py's stderr above) — this is an API/transport failure (most often an expired GitHub App installation token, but any gh-api/transport error or an unparseable API response lands here), NOT an unreadable workpad, which may be perfectly healthy. Failing loud WITHOUT consuming a resume attempt; check the specific error above (and DEVFLOW_APP_ID / the App token's freshness) and re-run"
            CLASS=auth-failure
            STATUS_OUT="(auth/API failure reading the workpad Status)"
          elif [ "$STATUS_RC" -eq 0 ] && [ -n "$STATUS_OUT" ]; then
            # Strip backticks/CR before the value is interpolated inside a
            # markdown code span in the posted comments — a hand-corrupted
            # Status line must not be able to break the comment markup.
            STATUS_OUT="${STATUS_OUT//\`/}"; STATUS_OUT="${STATUS_OUT//$'\r'/}"
            CLASS="${STATUS_OUT%% *}"
          else
            CLASS=unreadable
            STATUS_OUT="(unreadable: workpad missing or Status unparseable)"
          fi
          # Prior auto-resume attempts = audit comments carrying the marker
          # below. The marker is written into each resume comment AND counted
          # here through this single variable (coupled with the lib/test/run.sh
          # pin). Counted lazily — only an interim status can lead to a decision
          # that reads it — so the healthy terminal path skips the paginated
          # fetch. The count input is CR-stripped so a CRLF-bearing body cannot silently
          # zero the count. A failed comment read makes the attempt count
          # UNKNOWABLE: it maps to the unreadable (fail-loud) class rather
          # than assuming 0 — a persistent read failure must not defeat the
          # cap with an unbounded green resume loop. The count is
          # lifetime-per-issue by design: once a stall episode exhausted the
          # cap, later stalls on the same issue fail loud immediately (the
          # safe, visible direction) until a human intervenes.
          MARKER='<!-- prflow:stall-backstop-audit -->'
          # The superseded spelling (issue #1003). The cap is LIFETIME-per-issue,
          # so counting only the current spelling would RESET an already-exhausted
          # issue to attempts=0 across the rename boundary and grant up to MAX
          # extra resume runs. `grep -cxF -e A -e B` counts LINES matching either,
          # so this is a union over comment lines, not a sum over spellings.
          MARKER_SUPERSEDED='<!-- devflow:stall-backstop-audit -->'
          ATTEMPTS=0
          if [ "$CLASS" = "interim" ]; then
            GH_ERRF="$(mktemp 2>/dev/null || echo /dev/null)"
            if COMMENT_BODIES="$(gh api --paginate "repos/{owner}/{repo}/issues/${ISSUE_NUMBER}/comments?per_page=100" --jq '.[].body' 2>"$GH_ERRF")"; then
              # -x: count only lines that ARE the marker (the resume comment
              # emits it alone on its first line), so a human QUOTING an audit
              # comment ("> <!-- ... -->") does not inflate the attempt count
              # into a spurious fail-exhausted.
              ATTEMPTS="$(printf '%s\n' "$COMMENT_BODIES" | tr -d '\r' | grep -cxF -e "$MARKER" -e "$MARKER_SUPERSEDED")"
            else
              echo "::error::stall backstop: could not read the issue comments (gh api failed: $(tail -c 300 "$GH_ERRF" 2>/dev/null | tr '\n' ' ')); the attempt count is unknowable, so the cap cannot be enforced. This is a gh-api/transport/auth failure (e.g. an expired App token), NOT an unreadable workpad — treating as auth-failure (fail loud, no resume attempt consumed) rather than resuming unbounded (issue #287)"
              CLASS=auth-failure
            fi
            [ "$GH_ERRF" = /dev/null ] || rm -f "$GH_ERRF"
            [[ "$ATTEMPTS" =~ ^[0-9]+$ ]] || ATTEMPTS=0
          fi
          DECISION="$(bash "$V/stall-backstop-decide.sh" "$ENABLED" "$CLASS" "$ATTEMPTS" "$MAX" "$JOB_STATUS")"
          echo "stall backstop: status='${STATUS_OUT}' class=${CLASS} attempts=${ATTEMPTS} max=${MAX} decision=${DECISION} job_status=${JOB_STATUS}"
          # (The helper's 'skip' arm is unreachable here — the early exit above
          # already returned on ENABLED=false — so 'noop' is the only decision
          # that exits at THIS point; 'resume' also ends green, but lower down
          # via the FAIL mapping.)
          # Cancelled-run exclusion (issue #498): a cancelled run is a decided
          # ending, not a stall. flip-cancelled flips an interim workpad to 🛑
          # Cancelled and exits green — no comment posted (no audit marker, no
          # diagnostic), no resume attempt consumed. skip-cancelled (unreadable/
          # auth-failure/unknown class on a cancel) logs one line and exits green
          # without posting the fail-loud diagnostic comment. Both arms post NO
          # comment: the run's own `cancelled` conclusion in the Actions UI is
          # the record. These green exits do NOT call flip_to_failed — only the
          # fail-loud arms below flip to 💥, and a cancel is not a failure.
          if [ "$DECISION" = "flip-cancelled" ]; then
            flip_to_cancelled
            exit 0
          fi
          if [ "$DECISION" = "skip-cancelled" ]; then
            echo "stall backstop: run cancelled (job.status=${JOB_STATUS}) — class=${CLASS}; no resume, no comment (cancelled runs are not stalls, issue #498)"
            exit 0
          fi
          if [ "$DECISION" = "noop" ]; then
            exit 0
          fi
          # fail-blocked (issue #1025): the run ended at a terminal workpad
          # Status that is NOT 🎉 Complete (👎 Blocked or 💥 Failed). Conclude the
          # job non-`success` so `gh run list` plus this annotation tell a blocked
          # run from a completed one WITHOUT opening the workpad. The annotation
          # names the issue number AND the workpad Status (STATUS_OUT carries the
          # full class+glyph+word, e.g. 'blocked 👎 Blocked' — only CLASS is split
          # off into its own var). No comment is posted — the workpad already carries the
          # blocked/failed reflection — and no flip_to_failed: its CLASS=interim
          # guard makes it a no-op on a terminal status, so 👎/💥 stay truthful.
          if [ "$DECISION" = "fail-blocked" ]; then
            echo "::error::stall backstop: issue #${ISSUE_NUMBER} — this run ended at a terminal workpad Status of '${STATUS_OUT}', which is not 🎉 Complete. Concluding the job non-success so a blocked/failed run (one that produced no branch/PR, or blocked mid-lifecycle) is visible in gh run list without opening the workpad (issue #1025). The workpad Status is left unchanged."
            exit 1
          fi
          # resume keeps the job green (the new run takes over); every other
          # decision fails the job loud.
          FAIL=1
          [ "$DECISION" = "resume" ] && FAIL=0
          # An mktemp failure means NO comment can be posted — on the resume
          # arm that would silently drop the re-dispatch (a masked stall, the
          # exact green-but-stalled outcome this backstop exists to prevent),
          # so it always fails the job loud, whatever the decision was.
          BODY="$(mktemp)" || { flip_to_failed "mktemp failed; cannot post the ${DECISION} comment"; echo "::error::stall backstop: mktemp failed; cannot post the ${DECISION} comment — failing loud (a resume comment that was never posted must not read as green)"; exit 1; }
          case "$DECISION" in
            resume)
              K=$((ATTEMPTS + 1))
              # The ONLY comment that may carry the trigger phrase. It must not
              # embed the workpad marker (the gate's self-trigger guard declines
              # any comment containing it). This comment is posted while the
              # current run is still in_progress; the new run's gate dedupe no
              # longer classifies it as a duplicate, because the dedupe carve-out
              # (issue #280 / PR #354) is now implemented: dedupe-implement-run.sh
              # reads the triggering comment from GITHUB_EVENT_PATH and, seeing the
              # stall-backstop-audit marker ($MARKER, above) this resume comment
              # carries, skips deduping so the taking-over run proceeds instead of
              # being swallowed as a duplicate of the still-finishing original.
              {
                printf '%s\n\n' "$MARKER"
                printf '**DevFlow stall backstop** — this cloud run ended while the workpad Status was still in-progress (`%s`). Auto-resume attempt %s of %s:\n\n' "$STATUS_OUT" "$K" "$MAX"
                # Helper-invocation discipline travels inside the resume comment so a
                # resumed run receives it even if it never re-reads the skill prose:
                # bundled helpers resolve only as the repo-relative vendored literal with
                # that path as the LEADING token — an absolute or repo-root scripts/ form
                # is silently denied and is exactly why prior auto-resume runs died.
                printf 'Resume note: invoke bundled helpers as `.prflow/vendor/prflow/scripts/…` (and `.prflow/vendor/prflow/lib/…`) with that path as the leading token — never an absolute path, never repo-root `scripts/…`, never behind a `VAR=` prefix or `bash <path>` wrapper (those forms are silently denied).\n\n'
                # Headless-wait discipline travels inside the resume comment too, as a
                # one-line mirror of skills/implement/SKILL.md's always-resident
                # Cloud headless-wait rule (coupled sites — one commit, pinned in
                # lib/test/run.sh), so a resumed run receives it even if it never
                # re-reads the skill prose.
                printf 'Headless note: this is a headless run — ending the turn ends the process, with no re-invocation. Never end the turn while any dispatched agent has not returned; poll to keep the turn alive; treat ScheduleWakeup and any future task-notification as unavailable.\n\n'
                printf '/prflow:implement %s\n' "$ISSUE_NUMBER"
              } > "$BODY"
              ;;
            fail-exhausted)
              printf '**DevFlow stall backstop** — this cloud run ended while the workpad Status was still in-progress (`%s`), and the auto-resume cap (max_resume_attempts=%s, attempts already made: %s) is exhausted. The job has been failed so the stall is visible; to retry, post a fresh implement trigger comment naming this issue number.\n' "$STATUS_OUT" "$MAX" "$ATTEMPTS" > "$BODY"
              ;;
            fail-auth)
              # A gh-api/transport/auth failure (e.g. an expired App token)
              # reading the workpad Status or the comment list — distinct from an
              # unreadable/corrupt workpad, which may be perfectly healthy. Fail
              # loud so the problem is visible; NO resume attempt was consumed.
              printf '**DevFlow stall backstop** — could not read the outcome of this run because of a gh-api/transport/auth error while reading the workpad Status or the issue comment list (most often an expired GitHub App installation token, but any gh-api/transport failure or an unparseable API response lands here). This is distinct from an unreadable/corrupt workpad — the workpad itself may be perfectly healthy. The job has been failed so the problem is visible, and NO auto-resume attempt was consumed. **The run log names the specific gh error** — inspect it first (and verify DEVFLOW_APP_ID / the App token if it is an auth error), then post a fresh implement trigger comment to retry.\n' > "$BODY"
              ;;
            *)
              # fail-unreadable (or any unknown/empty decision token — fail closed).
              printf '**DevFlow stall backstop** — could not classify the outcome of this run: the issue workpad Status or the issue comment list was unreadable (workpad comment missing, Status line unparseable, or the comments could not be fetched to count prior attempts), or the backstop decision could not be computed (decision token: `%s`). The run log names the specific cause. The job has been failed so the stall is visible; inspect the run log and the workpad, then post a fresh implement trigger comment to retry.\n' "${DECISION:-none}" > "$BODY"
              ;;
          esac
          # The comment funnel below is always-exit-0 by contract, so read its
          # stderr breadcrumb to learn whether the POST actually landed. On the
          # resume arm the comment IS the action: a dropped POST means no
          # re-dispatch, so fail loud (manual retrigger) instead of reading a
          # never-posted resume as green. On the fail arms the job is already
          # exiting non-zero; a dropped comment there only loses the courtesy
          # notice, and the breadcrumb below still names it in the run log.
          POST_ERR="$(bash "$V/post-issue-comment.sh" "$ISSUE_NUMBER" "$BODY" 2>&1)"
          printf '%s\n' "$POST_ERR"
          if [ "$FAIL" -eq 0 ] && ! printf '%s' "$POST_ERR" | grep -qxF "devflow: posted comment on #${ISSUE_NUMBER}"; then
            flip_to_failed "resume re-dispatch comment did not land"
            echo "::error::stall backstop: the resume re-dispatch comment did not land (see the breadcrumb above) — failing loud so the stall stays visible for a manual retrigger"
            exit 1
          fi
          # A resume comment authored by the built-in GITHUB_TOKEN posts fine
          # but never re-triggers the workflow, so without the App token the
          # "resume" would be a green no-op — the masked stall this backstop
          # exists to prevent. The comment (with the trigger phrase a human
          # can re-post) is already up; fail loud so the stall shows red.
          if [ "$FAIL" -eq 0 ] && [ "$APP_TOKEN_PRESENT" != "true" ]; then
            flip_to_failed "resume comment posted but no App token to start a new run"
            echo "::error::stall backstop: resume comment posted, but no DEVFLOW_APP_ID App token is configured — a GITHUB_TOKEN-authored comment cannot start a new run, so auto-resume is inert; failing loud (configure DEVFLOW_APP_ID for auto-resume, or re-post the trigger comment manually)"
            exit 1
          fi
          # The shared final exit is reached by the green resume path (FAIL=0)
          # and every fail-loud decision (FAIL=1: fail-exhausted, fail-auth,
          # fail-unreadable). Flip ONLY on a fail-loud exit (FAIL=1) — never on
          # the resume green path — and flip_to_failed itself guards CLASS=interim
          # so fail-auth/fail-unreadable (non-interim) are no-ops here; only the
          # fail-exhausted arm (interim + cap reached) actually flips.
          [ "$FAIL" -eq 1 ] && flip_to_failed "${DECISION}"
          exit "$FAIL"

      # ── Reconcile prompt-extension arrival (issue #1446) ───────────────────
      # The enforcing half of the job-level surface: reconcile the pre-agent
      # expectation (steps.extarrival) against the run's own durable workpad. When
      # deliverable extension content was present but no positive arrival record
      # exists — the exact shape a lost skill body / extension produces, since a lost
      # body can tick no row — derive `unestablished`: fail the job with an
      # ::error::, force the non-arrival record onto the workpad, and flip its Status
      # OFF Complete. A genuinely `absent` extension, or a reconciled `arrived`, is
      # left clean. This runs OUTSIDE the tool matcher (a job-level step), so no
      # capability grant is needed.
      - name: Reconcile prompt-extension arrival
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ steps.backstop-token.outputs.token || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.number }}
          EXPECTED: ${{ steps.extarrival.outputs.state }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set +e
          if [ -z "${EXPECTED:-}" ]; then
            # No pre-agent expectation recorded — the classify step failed or was skipped.
            # When the agent step itself succeeded, that gap disabled the whole check, so
            # fail closed rather than exit clean; when the job is already non-green, there
            # is nothing to enforce.
            if [ "$CLAUDE_OUTCOME" = "success" ]; then
              echo "::error::prompt-extension-arrival: the pre-agent classify step recorded no expectation, so the post-agent arrival check could not run on a run the agent reported successful — refusing to treat it as clean."
              exit 1
            fi
            echo "prompt-extension-arrival: no pre-agent expectation and claude outcome '${CLAUDE_OUTCOME:-unknown}' (already non-green); nothing to reconcile"
            exit 0
          fi
          if [ "$EXPECTED" = "absent" ]; then
            echo "prompt-extension-arrival: implement extension absent (a clean consumer state); Complete permitted"
            exit 0
          fi
          V=.prflow/vendor/prflow/scripts
          W="$V/workpad.py"; [ -f "$W" ] || W=scripts/workpad.py
          H="$V/prompt-extension-arrival.py"; [ -f "$H" ] || H=scripts/prompt-extension-arrival.py
          # permission_denials_count is structurally blind to a lost skill-body load (it
          # surfaces as a Skill tool result, not a permission_denied event), so every
          # ::error:: below says so — a low denial count is not evidence the body loaded.
          fail_closed() {
            echo "::error::prompt-extension-arrival: $1 — cannot establish that the implement skill body / consumer extension arrived, so this run's Complete claim is unverified. NOTE: permission_denials_count does NOT cover a lost skill-body load (the refused Skill-tool load surfaces as a Skill tool result, not a permission_denied event), so a low denial count is not evidence the body loaded."
          }
          if [ "$EXPECTED" = "detector-absent" ] || [ ! -f "$H" ] || [ ! -f "$W" ]; then
            fail_closed "the arrival detector or workpad helper is absent (older prflow_version)"
            exit 1
          fi
          WID="$(python3 "$W" id "$ISSUE_NUMBER" 2>/dev/null)"
          if [ -z "$WID" ]; then
            # No workpad: the run halted before one existed. Enforce only when the agent
            # step itself reported success — a failed/cancelled job is already non-green,
            # so AC2's job-conclusion arm is already satisfied.
            if [ "$CLAUDE_OUTCOME" != "success" ]; then
              echo "prompt-extension-arrival: no workpad and claude outcome '${CLAUDE_OUTCOME:-unknown}' (already non-green); no enforcement needed"
              exit 0
            fi
            OUT="$(python3 "$H" reconcile --expected "$EXPECTED" --arrival-marker 'extension resolved: implement' --durable-source none --skill implement)"
            FINAL="${OUT#final=}"; FINAL="${FINAL%% *}"
            if [ "$FINAL" != "arrived" ] && [ "$FINAL" != "absent" ]; then
              fail_closed "the run reported success but wrote no workpad recording the extension's arrival"
              exit 1
            fi
            exit 0
          fi
          # A workpad exists. Read its Status, failing CLOSED on a read that did not
          # establish the Status — workpad.py status exits 0 (Status read), 1 (Status
          # missing/empty/unrecognized), 2 (workpad disappeared), 3 (gh/transport/auth).
          # Only exit 0 establishes the Status; every non-zero read is unknown-is-not-zero,
          # so it must fail closed here rather than be reinterpreted as "not Complete" — a
          # transport/auth failure reading the Status is exactly the fail-open path this
          # surface exists to close.
          STATUS_LINE="$(python3 "$W" status "$ISSUE_NUMBER" 2>/dev/null)"; STATUS_RC=$?
          if [ "$STATUS_RC" != 0 ]; then
            fail_closed "could not read the workpad Status (workpad.py status exit $STATUS_RC) to confirm the run is not claiming Complete"
            exit 1
          fi
          # Status established. If it is already non-Complete, the unestablished-terminal
          # criterion (a lost load must merely not report Complete) is already satisfied.
          case "$STATUS_LINE" in
            *Complete*) : ;;
            *) echo "prompt-extension-arrival: workpad Status is not Complete ('${STATUS_LINE:-unknown}'); the unestablished-terminal criterion is already satisfied"; exit 0 ;;
          esac
          # Status reads Complete: reconcile arrival against the durable body, failing
          # closed if the body could not be read (an unreadable body cannot establish
          # arrival — unknown is not zero).
          BODY="$(python3 "$W" body "$WID" 2>/dev/null)"; BODY_RC=$?
          if [ "$BODY_RC" != 0 ]; then
            fail_closed "the workpad reads Complete but its body could not be read (workpad.py body exit $BODY_RC) to confirm the extension arrived"
            exit 1
          fi
          OUT="$(printf '%s' "$BODY" | python3 "$H" reconcile --expected "$EXPECTED" --arrival-marker 'extension resolved: implement' --durable-source workpad --skill implement)"
          echo "$OUT"
          FINAL="${OUT#final=}"; FINAL="${FINAL%% *}"
          # Block unless reconcile positively returned arrived or absent. An empty or
          # unrecognized FINAL (reconcile crashed, exited on a bad token, or was refused)
          # is unestablished, never clean — the allow-list shape the no-workpad arm uses.
          if [ "$FINAL" != "arrived" ] && [ "$FINAL" != "absent" ]; then
            REC="$(printf '%s\n' "$OUT" | sed -n 's/^record=//p')"
            fail_closed "${REC:-the implement skill body / extension did not arrive (reconcile returned '${FINAL:-no parseable result}')}"
            # Force the durable non-arrival record onto the workpad and flip Status OFF
            # Complete (best-effort; the ::error:: + non-zero exit already fails the job).
            python3 "$W" update "$ISSUE_NUMBER" --status Blocked --reflection-kind blocked --reflection "${REC:-prompt-extension arrival unestablished (implement) — the skill body / consumer extension did not reach the agent}" || echo "::warning::prompt-extension-arrival: could not write the durable non-arrival record / flip Status off Complete"
            exit 1
          fi
          echo "prompt-extension-arrival: implement extension arrival reconciled: $FINAL"
          exit 0
