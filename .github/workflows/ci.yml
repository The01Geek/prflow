name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The default types (opened, synchronize, reopened) are NOT enough for
    # our own bot PRs. The /devflow:implement flow opens a PR as a draft
    # (skills/implement: `gh pr create --draft`), pushes its commits, then
    # toggles ready-for-review (`gh pr ready`). devflow-implement.yml checks
    # out and pushes with the default GITHUB_TOKEN, so GitHub's recursion
    # guard suppresses the `synchronize` event for those commits — and
    # `ready_for_review` is not a default type. Listening only to the
    # defaults meant CI never ran on the bot's HEAD; because `lib + python
    # tests` is a REQUIRED status check, the PR wedged at "Expected —
    # waiting for status" forever. Adding `ready_for_review` makes CI fire
    # on the ready toggle against the current HEAD — the same event
    # devflow-review.yml already keys off (see its `on:` comment) to catch
    # these bot PRs. We do NOT switch to `pull_request_target`: this job
    # runs arbitrary PR code (preflight + the test suite), which under
    # pull_request_target would expose repo secrets to untrusted code.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Supersession-cancellation (issue #1236), WORKFLOW-LEVEL and deliberately distinct
# from the job-scoped `auto_review_trigger` block far below. When a new commit is
# pushed to a pull-request branch, the CI run for the now-superseded commit keeps
# executing a full suite for a commit that has already been replaced, on runners the
# new commit is waiting for — cancel it.
#
# This does NOT contradict the repository's standing doctrine that GitHub-native
# `concurrency` is not a duplicate-SUPPRESSION primitive (scripts/dedupe-review-command.sh,
# docs/internal/workflow-triggers.md). That doctrine governs DUPLICATE COMMANDS — two requests for
# the same work, where the wanted behavior is "ignore the second, leave the first
# untouched", which neither `concurrency` mode expresses. Supersession is the opposite
# shape: two CI runs for two DIFFERENT commits are not duplicates — the first has been made
# obsolete by the second and the wanted behavior IS "cancel the in-flight one", which is the
# one thing `cancel-in-progress: true` does natively well.
#
# The group is keyed on the pull request (its number), so two pushes to one PR branch
# share a group and two DIFFERENT pull requests never do. On a `main` push
# `github.event.pull_request.number` is empty, so `github.run_id` gives each main run its
# OWN group — main runs are neither cancelled (each merged commit is a distinct artifact,
# not a superseded draft; version-consolidate.yml pushes bump commits that arrive in bursts)
# nor serialized behind one another. And `cancel-in-progress` resolves `true` ONLY for
# `pull_request` events, a second guard on the same intent. This block stays on ci.yml ONLY:
# a `concurrency` cancel on devflow.yml / devflow-implement.yml would feed a deliberate
# cancel into the run-identity machinery (issues #498/#1054/#1172).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suite is split across concurrent SHARD jobs (issue #877) so wall-clock is
  # bounded by the slowest shard rather than the sum. Each shard runs a subset via
  # lib/test/run-shard.sh — the `monolith` shard runs lib/test/run.sh with the module
  # tier skipped (DEVFLOW_SKIP_SUITE_MODULES=1) and the pooled Python suites skipped
  # (DEVFLOW_SKIP_PYTHON_POOL=1), the `python-pool` shard runs exactly those pooled
  # Python suites, and each `modules-*` shard runs its group of registered test
  # modules. The union of the module groups is exactly the
  # registered module set, so NO test is dropped (lib/test/run.sh asserts this against
  # the registry). Each shard writes a small tally directory (passed/failed/skipped +
  # skip detail + failure names) and uploads it; the `lib + python tests` aggregator
  # below downloads them, recombines the accounting, and is the REQUIRED status check.
  #
  # `python-pool` exists because the monolith shard was measured (lib/test/profile-suite.py)
  # spending ~22% of its wall-clock sitting IDLE at the pool join, waiting for Python
  # work it had run out of shell assertions to overlap with. Splitting it out moves that
  # cost onto a concurrent shard rather than removing any assertion: the same pool, the
  # same membership, the same reconciliation, counted in exactly one shard either way.
  shard:
    name: shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Job-scoped so the installing step and the verifying step read ONE literal. Two
    # copies of a pinned version is a coupled pair that drifts on the next bump, and
    # the drift would be silent in the direction that matters: a bumped installer with
    # a stale verifier asserts the old version against the new binary.
    env:
      CLAUDE_CLI_VERSION: 2.1.212
    strategy:
      fail-fast: false
      matrix:
        # Coupled with lib/test/run-shard.sh's SHARD_NAMES, in the same order:
        # lib/test/run.sh compares the two sequences and goes RED on either drift.
        shard: [monolith, python-pool, modules-pin, modules-large, modules-rest]
    steps:
      # fetch-depth: 0 (all history for all branches) so refs/remotes/origin/main resolves
      # in the checkout — actions/checkout fetches a single commit by default, under which
      # origin/main does NOT exist, so the #434 stale-prose self-scan in lib/test/run.sh
      # silently self-skipped on every CI run (issue #456). It runs in the monolith shard;
      # history is fetched on every shard uniformly so the checkout config is single-form.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Removing this step does not RED the suite — the #1621 gate in lib/test/run.sh
      # self-skips and `lib + python tests` stays green with no Python lint running.
      # Coupled pin: bump together with the `lint` job's ruff spec.
      - name: Install ruff (arms the #1621 Python-lint gate)
        run: python3 -m pip install --quiet 'ruff==0.15.*'

      - name: Preflight (dependency check)
        run: bash lib/preflight.sh

      # Install the Claude Code CLI so the #671 `claude plugin validate --strict`
      # gate ARMS instead of self-skipping. Until this step existed the CLI was on no
      # runner, so that gate took its `blocking-gate` skip branch on every CI run. It
      # was the only skip in the run cited here (run 30274021296 @ fb5256b7: "12523
      # passed, 0 failed, 1 skipped") — a dated snapshot, NOT a standing invariant.
      # A skip does not fail the suite (issue #456), so the gate was disarmed silently
      # while CI stayed green.
      #
      # Arming this gate closes ONE skip, not the skip population — nothing here should be
      # read as promising a particular total. Measured, not assumed: `main` at 30399500061
      # reported 2 skips, this gate (#671, CLI absent) and the #434 stale-prose self-scan
      # ("working tree dirty"). Those have different causes and different fixes. The second
      # was a tally directory written inside the working tree with no .gitignore rule, and
      # is closed by that .gitignore entry — not by installing a CLI. Read the skip
      # population off a run's own NOTE lines rather than from this comment, which is a
      # dated observation exactly like the figure above.
      #
      # The gate is not cosmetic. It stages the SHIPPED PAYLOAD — the tracked index minus
      # .claude-plugin/marketplace.json, whose presence would route the CLI to marketplace
      # mode instead — so root files are validated too, and the one known root warning is
      # allowlisted as a withheld path inside a differential pair rather than by filtering
      # validator output (see the block's own comment in lib/test/run.sh for the arms). And
      # that validation DESCENDS into the skills/ and agents/ trees rather than stopping
      # at the manifest: a malformed-YAML, absent, or empty frontmatter block exits 1 —
      # and so does one that parses cleanly but omits a required key, which is the shape
      # a validator that stopped at "is it valid YAML" would wave through.
      # That is asserted executably, not by hand — lib/test/run.sh drives each of those
      # frontmatter shapes against both component trees, each arm preceded by its own
      # positive control, so the claim is a test that can fail rather than a comment
      # that can rot. (Deliberately count-free: an arm count here rots the next time an
      # arm is added — the self-referential-ordinal class CLAUDE.md names.)
      # Validation is auth-free. Measured while authoring this step, on a bench, not a
      # description of this job's configuration: with ANTHROPIC_API_KEY and
      # CLAUDE_CODE_OAUTH_TOKEN unset and HOME redirected to an empty dir, validation
      # still exits 0. (This job redirects nothing — this step's last line writes
      # "$HOME/.local/bin" into GITHUB_PATH.) So the step needs no secret, which matters because this
      # job runs arbitrary PR code (see the `on:` comment on why we do not use
      # pull_request_target). Confirmed in situ: the gate passes in a PR-triggered job
      # that is `contents: read` and carries no secrets.
      #
      # PINNED rather than `stable`/`latest`, for the reason the lint job pins ruff
      # (an unpinned `pip install ruff` picked up 0.16.0, flagged ~645 pre-existing
      # findings repo-wide, and turned that job red on every branch at once): here the
      # CLI *is* the validator, so an unpinned upgrade that adds a new warning would
      # redden this REQUIRED check on an unrelated PR with no repo change. (The
      # ShellCheck pin nearby is a FLOOR — 0.9.0 predates `--extended-analysis` — which
      # is a different argument; ruff's is the one that applies here.) Bump it deliberately, and note the pin is one level shallower than it
      # looks: install.sh itself is refetched unpinned and unchecksummed each run, so
      # the version argument pins the CLI, not the installer. The blast radius is
      # bounded — this job is `contents: read` and holds no secrets — and the verify
      # step below asserts the version actually landed.
      #
      # The gate lives in lib/test/run.sh (the `monolith` shard), but the CLI is
      # installed on EVERY shard uniformly — like the checkout depth above, though for
      # a different reason: that one is uniform to keep the checkout config single-form,
      # this one so a gate that later moves into a module shard does not quietly revert
      # to self-skipping. That uniformity has a real cost worth stating: it puts one
      # network install per shard behind a REQUIRED check, so a claude.ai outage can redden
      # `lib + python tests` via a shard that consumes nothing from the CLI. The retry
      # below absorbs the transient case; a sustained outage fails the check loudly,
      # which is the intended direction for a gate whose whole defect class is failing
      # QUIETLY. Narrow it to `if: matrix.shard == 'monolith'` only if that trade stops
      # being worth it — accepting the silent-revert exposure it reopens.
      - name: Install Claude Code CLI (arms the #671 plugin-validate gate)
        run: |
          # The retry/backoff/terminal-exit logic lives in scripts/retry-with-backoff.sh
          # so the suite can drive each arm; inline, nothing exercised them.
          #
          # `set -o pipefail` inside the command string is load-bearing, and NOT because of
          # this step's own shell. Two facts decide it, and neither is a claim about what a
          # child shell inherits. First, this step does not run the pipeline at all:
          # retry-with-backoff.sh runs it, through `bash -c "$command_string"`, one process
          # removed from here. Second, `pipefail` is never set anywhere up that chain — with
          # no `shell:` key and no `defaults:` block this step runs under `bash -e {0}`,
          # which sets `-e` only. So giving this step an explicit `shell: bash` — the thing
          # that would supply `-eo pipefail` — still would not reach the pipeline. The
          # option has to be set inside the string; do not "simplify" this by editing the
          # step's shell.
          # Without it a failed download feeds bash an empty script that exits 0, so the
          # install would be recorded as a success.
          # The verify step below would still redden the check, so pipefail is what
          # attributes the failure to the download rather than to a missing binary.
          bash scripts/retry-with-backoff.sh 3 2 \
            'set -o pipefail; curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CLI_VERSION"'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Asserts the version rather than merely printing it, so the pin above is
      # self-verifying: the pin's whole mechanism is one positional argument to a
      # third-party installer, and an installer that ignored or renamed it would
      # otherwise hand us an unpinned CLI while this step still passed. Also the
      # load-bearing detector that the install landed on PATH at all (GITHUB_PATH only
      # takes effect in LATER steps, so this cannot be folded into the step above).
      #
      # The decision logic lives in scripts/assert-cli-version.sh, not inline here, so
      # lib/test/run.sh can drive each arm (empty pin / exact match / prefix rejection).
      # Inline, the whole step could be deleted and the suite would stay green.
      #
      # An empty CLAUDE_CLI_VERSION does NOT make this step vacuous: the helper exits 2
      # on an empty pin, so the check fails closed. It would still leave the INSTALL
      # half unpinned (`bash -s ""` takes the installer's default), which is why run.sh
      # separately pins that the env: key carries a version-SHAPED value (not the exact
      # literal, which would trap every deliberate bump) — that pin is what catches the
      # key being dropped OR emptied.
      - name: Verify the claude CLI resolves on PATH at the pinned version
        run: |
          v="$(claude --version)"
          echo "$v"
          bash scripts/assert-cli-version.sh "$CLAUDE_CLI_VERSION" "$v"

      - name: Run shard (${{ matrix.shard }})
        env:
          DEVFLOW_SHARD_TALLY_DIR: ${{ github.workspace }}/shard-tally-out
        run: bash lib/test/run-shard.sh "${{ matrix.shard }}"

      - name: Upload shard tally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-${{ matrix.shard }}
          path: ${{ github.workspace }}/shard-tally-out
          if-no-files-found: warn

  # The REQUIRED merge-gate status check. Its name (`lib + python tests`) is the exact
  # branch-protection contract — renaming or dropping it silently un-gates merges — so it
  # is preserved here as the aggregator. `if: always()` + the shard-result gate mean a
  # failed, cancelled, or skipped shard fails this job (a skipped required check that
  # auto-passes is the classic un-gating trap). The combine step recombines the aggregate
  # passed/failed/skipped accounting and surfaces the full skip population (issue #456: a
  # skipped check is never laundered into a clean pass), failing closed if a shard's tally
  # is missing or malformed.
  test:
    name: lib + python tests
    needs: [shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download shard tallies
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: tally-*
          path: shard-tallies

      - name: Recombine shard tallies (aggregate pass/fail/skip accounting)
        run: python3 lib/test/shard-tally.py combine --scan shard-tallies --expect 5

      # The branch selection and its user-facing message live in the helper, not
      # inline here, so lib/test/run.sh can drive every arm (success / failure /
      # cancelled / skipped / unestablished) rather than grep-pinning a literal.
      - name: Gate on shard results
        run: bash lib/test/gate-shard-result.sh "${{ needs.shard.result }}"

  lint:
    name: lint (shellcheck + actionlint + ruff)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the coverage-map key-retention check (issue #1194) can resolve
      # the merge base against origin/<base_branch>; a single-commit checkout has no base.
      #
      # This coupling ENFORCES ITSELF — do not read the comment as its only guard. The
      # check distinguishes "no key was lost" (exit 0) from "I could not establish whether
      # a key was lost" (exit 3), so removing `fetch-depth: 0` cannot silently drop the
      # protection: a shallow checkout leaves origin/<base_branch> unresolvable (exit 1)
      # or the merge base uncomputable / its tree empty (exit 3), and either way the step
      # below goes RED. `--allow-degraded-base` would suppress exit 3 and MUST NOT be
      # added here — CI is exactly the caller that has a real comparand.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # issue #1194: the coverage map is two large string-sorted JSON objects, so a
      # semantic-free adjacent-key conflict resolved by taking one side silently drops the
      # other branch's entry — a class no coverage-guard arm inspects. The JSON-aware merge
      # driver removes it on the local merge path, but it cannot run on GitHub's servers or
      # in the web conflict editor; this CI-side check covers that path regardless of local
      # config, failing RED when any key or its note/owner content disappears relative to
      # the merge base. A legitimate removal is declared in coverage-map-retention-allow.json.
      - name: Coverage-map key-retention check
        run: python3 lib/test/coverage-map-retention-check.py .

      # issue #1445: keep this step in a job that checks out with fetch-depth: 0 — without the
      # full history the merge base does not resolve and the check degrades to exit 3.
      - name: Cloud-writer manifest mutation check
        run: python3 lib/test/cloud-writer-retention-check.py .

      # issue #1287: a test module's assertion floor lives in two coupled sites
      # (`minimum_assertions` in the flight-recorder registry and the run.sh call-site
      # literal). The suite enforces they AGREE and that a tally is not BELOW them, but
      # only the `exact`-policy modules get a measured equality — so for the modules
      # carrying no `assertion_floor_policy` a coordinated LOWERING of both sites is
      # green everywhere. (That population is named by its property, never counted:
      # it changes as modules are added and re-policed.)
      # This diff-time gate makes a decrease a declared act: it fails RED on any lowered
      # registry floor, for every registered module, unless declared in
      # assertion-floor-retention-allow.json. It needs the same full history the
      # coverage-map check above relies on (fetch-depth: 0) to resolve the merge base.
      - name: Assertion-floor retention check
        run: python3 lib/test/assertion-floor-retention-check.py .

      # Pin ShellCheck instead of using the runner image's (issue #745). Two
      # coupled requirements force this, and BOTH are load-bearing:
      #   1. lib/test/run.sh (>50k lines) cannot be analysed with ShellCheck's
      #      dataflow ("extended analysis") pass on: it allocates ~15 GB and the
      #      16 GB runner is evicted mid-analysis with "The runner has received a
      #      shutdown signal" (observed 6/6 runs across 5 head SHAs, PR #734).
      #      --extended-analysis=false brings it to 1.15 GB / ~10 s. Cost, as
      #      measured on 2026-07-23 against ShellCheck 0.11.0: none on this file
      #      — a chunked A/B of the whole file produced a byte-identical finding
      #      set both ways. (Issue #745 recorded SC2319 x4 dropping corpus-wide
      #      at authoring time; that no longer reproduces under 0.11.0. Both are
      #      past-time snapshots, not invariants — re-measure after an upgrade.)
      #   2. ubuntu-latest (Ubuntu 24.04) ships ShellCheck 0.9.0, which predates
      #      --extended-analysis (added in 0.10.0 — per its release notes; the
      #      runner's tool version is an external fact, observed in PR #734, not
      #      a repo-verified invariant). On 0.9.0 the flag ERRORS, and the
      #      equivalent `# shellcheck extended-analysis=false` directive has no
      #      effect — it is reported as an unknown directive (SC1107) and
      #      ignored — so the lint OOMs exactly as if the flag were absent. Pin
      #      >= 0.10.0 rather than depending on the image's tool version, which
      #      drifts with the runner image. lib/test/run.sh asserts the floor.
      # Installed onto PATH so every ShellCheck step below uses the pinned build.
      - name: Pin ShellCheck (>= 0.10.0, required by --extended-analysis)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          # pipefail so a failed download (404, rate limit, network) is reported as the
          # curl failure it is, rather than as tar's downstream "not found in archive". The
          # step fails either way — tar exits nonzero on the missing member and `set -e`
          # stops the job — so this is attribution, not the only thing standing between the
          # job and the image's 0.9.0. The flag itself is self-verifying: 0.9.0 rejects
          # --extended-analysis outright, so a wrong binary reddens the run.sh step rather
          # than silently under-linting. `shellcheck --version` below prints for the log; it
          # asserts nothing — the version FLOOR is asserted in lib/test/run.sh.
          set -o pipefail
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJf - "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo install -m 0755 "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      # --severity=warning keeps the gate on real issues and drops info/style
      # nags. SC1091 ("can't follow sourced file") is excluded: helpers source
      # each other via ${CLAUDE_SKILL_DIR}-relative paths that don't resolve at
      # lint time. The lib/test gh-stubs are deliberately minimal fixtures, not
      # shipped code, so they're out of scope. Piping into xargs (rather than
      # shellcheck $(...)) avoids the SC2046 word-split this very job would flag.
      - name: ShellCheck (lib + scripts)
        run: |
          git ls-files '*.sh' | grep -v '^lib/test/' \
            | xargs -r shellcheck --severity=warning -e SC1091
          # lib/test/ is excluded above (the gh-stub fixtures are not shipped code), but
          # these lib/test files are shipped code (the sourced harness/renderer/
          # module and the standalone focused runner) rather than fixtures, so
          # they are added explicitly rather than shipping unlinted.
          shellcheck --severity=warning -e SC1091 \
            lib/test/module-harness.sh lib/test/run-module.sh lib/test/summary.sh \
            lib/test/run-shard.sh lib/test/gate-shard-result.sh \
            lib/test/run-parallel.sh \
            lib/test/modules/parallel-suite-runner.sh \
            lib/test/run-python-pool.sh \
            lib/test/modules/workflow-flight-recorder.sh \
            lib/test/modules/review-and-fix-contract.sh \
            lib/test/modules/create-issue-contract.sh \
            lib/test/modules/capability-profiles.sh \
            lib/test/modules/regenerate-artifacts.sh \
            lib/test/modules/installer-wiring.sh \
            lib/test/modules/harness-python-guards.sh \
            lib/test/modules/prompt-extension-reader.sh \
            lib/test/modules/review-trigger-helpers.sh \
            lib/test/modules/review-stall-backstop.sh \
            lib/test/modules/tier1-rename-migration.sh \
            lib/test/modules/retrospective-lifecycle.sh \
            lib/test/modules/experiment-records.sh \
            lib/test/modules/efficiency-trace-telemetry.sh \
            lib/test/modules/issue-audit-state.sh \
            lib/test/modules/phase2-durability-checkpoint.sh \
            lib/test/modules/terminal-result-class.sh \
            lib/test/cloud-form-layout-test.sh \
            lib/test/path-portability-test.sh \
            lib/test/warn-ignored-signals.sh

      # lib/test/run.sh is the suite driver — the largest and most-edited shell
      # file in the repo, and the last one brought under the lint (issue #745).
      # It gets its own step (rather than joining the list above) because it is
      # the sole file that needs --extended-analysis=false; see the pin step's
      # comment for why the flag and the >= 0.10.0 pin are both required. This
      # runs on the standard ubuntu-latest runner, and its failure is not tolerated.
      - name: ShellCheck (lib/test/run.sh)
        run: |
          shellcheck --severity=warning -e SC1091 --extended-analysis=false lib/test/run.sh

      # actionlint validates workflow syntax and runs shellcheck over run: blocks.
      # SHELLCHECK_OPTS mirrors the severity policy; SC2034 is excluded because
      # each step's run: block is analysed in isolation, so GitHub-context vars
      # assigned in one block but consumed in another read as "unused".
      - name: actionlint (workflows)
        uses: raven-actions/actionlint@v2
        env:
          SHELLCHECK_OPTS: --severity=warning --exclude=SC2034

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ruff (python)
        run: |
          # Pin ruff: an unpinned `pip install ruff` picked up 0.16.0 the day it
          # released, whose expanded default ruleset (EXE001/PIE810/SIM102/TRY004/…)
          # flagged ~645 pre-existing findings repo-wide and turned this job red on
          # every branch at once. Pin to a known-green minor so a ruff release is an
          # explicit, reviewable bump rather than a silent tree-wide breakage.
          python3 -m pip install --quiet 'ruff==0.15.*'
          git ls-files '*.py' | xargs -r ruff check

  # Ask for a standalone review the moment CI is green on a pull request, so the
  # review the repo already expects before merge does not wait on a human
  # remembering to type the trigger. THIS REPO ONLY: install.sh's workflow copy
  # loop ships devflow.yml and devflow-implement.yml and NOT this file, so no
  # consumer repo gains an auto-trigger and the shipped documentation's standing
  # "a collaborator comments the trigger" statement stays literally true.
  #
  # Deliberately NOT once-per-PR and NOT once-per-red-to-green transition: it
  # notifies on EVERY green head, deduped only at an identical head SHA. Replayed
  # against a real busy PR's history that is several standalone reviews in an
  # afternoon. That cost was weighed and accepted; a reviewer's HEAD is the unit
  # that matters, and a review of a superseded commit is worth less than the
  # spend it saved.
  #
  # Deliberately NOT a `workflow_run` listener, which would have been the other
  # obvious shape: that trigger needs a `workflows:` name list (a strandable
  # surface — the guard that used to police it went with the withheld review tier
  # in issue #936), it runs the DEFAULT BRANCH's copy of the workflow rather than
  # the PR's, so a change to this job could never be exercised by the PR that
  # makes it, and it fires for fork pull requests too, which is precisely what the
  # head-repo gate below exists to prevent.
  #
  # WHY AN APP TOKEN, AND WHY THAT IS THE WHOLE MECHANISM: a comment posted with
  # the built-in GITHUB_TOKEN does not trigger workflows (the same recursion guard
  # this file's `on:` comment relies on for the bot's own pushes). A comment posted
  # with a GitHub App installation token DOES. So the mint is not a convenience
  # here — it is the only thing that makes the trigger fire at all, and it is the
  # pattern scripts/post-review-backstop-comment.sh already uses from devflow.yml.
  #
  # LOOP SAFETY. The payload is the PLAIN review command and must stay that way.
  # devflow.yml skips its `app-token` mint on a `/prflow:review ` command, so that
  # path runs under the read-only reviewer token and pushes nothing; even a push it
  # somehow made would use GITHUB_TOKEN and be swallowed by the recursion guard.
  # The fix-loop command is the opposite on both counts — it mints the App token
  # and pushes with it, outside the recursion guard — so widening this payload
  # would re-run CI, re-post, and loop without bound. The review-trigger-helpers
  # test module drives the composed body through the real standalone-command
  # detector; that assertion is the structural brake on exactly that edit.
  #
  # NAMED FOR ITS SKIPPED STATE. The CI-signal summarizer that composes the review
  # engine's injected engine-ground-truth block renders every job's name and
  # conclusion into it, and this job reads `skipped` on most runs — draft pull
  # requests, fork pull requests, pushes to main. In a repo whose governing rule is
  # that a skip is never laundered into a pass, the name has to make a skipped row
  # self-evidently a notification that was not sent rather than a verification that
  # did not run.
  #
  # EDITING THIS COMMENT BLOCK: do not name a `<something>.sh` helper here unless
  # you mean it. The #312 endpoint-permission lint attributes every such basename it
  # finds in a job's lines — comments included — to that job's permission
  # requirement, and a comment block sitting ABOVE a job key parses as part of the
  # PREVIOUS job. Naming the summarizer here required `checks`/`actions` of the lint
  # job, which calls neither. It fails closed (RED), so the suite catches it, but the
  # diagnosis lands two jobs away from the edit.
  auto_review_trigger:
    name: auto-review notification (not a check; skipped = not sent)
    needs: [test, lint]
    # `needs: [test, lint]` names BOTH jobs, because `lint` is not downstream of
    # `test` — the only `needs:` elsewhere in this file is `test: needs: [shard]`.
    # But the two dependency-RESULT tests are NOT in this `if:` anymore: they moved
    # onto the individual steps below. The job now runs whenever both dependencies
    # have CONCLUDED (`!cancelled()`), so a red `lint` — which is NOT a required
    # status check, hence a mergeable PR — is ANNOUNCED rather than skipped in
    # silence. The credential-safety property is preserved by step-level gating:
    # the checkout, mint, and post steps each require both results to be `success`,
    # so an ineligible run still reaches no App-token mint and no PR-code checkout.
    #
    # The remaining `if:` guards are all GitHub-evaluated, so an ineligible run
    # reaches no shell. The head-repo comparison is the fork gate and it is the
    # actual security property of this job: it excludes fork pull requests BEFORE
    # the App token is minted, rather than relying on secrets being withheld from
    # fork runs. Dependabot branches live in this repo, so they satisfy the
    # head-repo test and need their own exclusion. The `pull_request` test is
    # load-bearing rather than cosmetic: this workflow also runs on pushes to main,
    # where `github.event.pull_request` is null and the draft comparison would read
    # as satisfied.
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      vars.DEVFLOW_APP_ID != ''
    runs-on: ubuntu-latest
    # Serialize concurrent runs at ONE head SHA so the helper's read-then-post
    # dedupe is atomic. Two runs at the same head (a manual re-run overlapping the
    # push run) could otherwise each read an absent marker and each post, double-
    # billing the review. This does NOT contradict the repository's standing
    # doctrine that GitHub-native `concurrency` is not a duplicate-SUPPRESSION
    # primitive (scripts/dedupe-review-command.sh): here queueing is exactly the
    # wanted behavior — `cancel-in-progress: false` lets the first run finish and
    # post, then the queued run reads the marker it posted and takes the helper's
    # already-posted arm. The group is keyed on the workflow, this job, and the
    # head SHA, so distinct heads never serialize against each other.
    concurrency:
      group: auto-review-trigger-${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    # JOB-SCOPED, never workflow-level. Raising `pull-requests: write` to the file's
    # top-level block would widen `shard`, `test`, and `lint`, which run arbitrary
    # pull-request code; declared here it reaches this job alone.
    #
    # It is declared even though the POST does not use it. The comment is written
    # with the minted App installation token, whose scope comes from the mint's
    # `permission-*` inputs and ignores this block entirely — so these keys are not
    # what authorizes the call. They are here because the repo's own #312
    # endpoint-permission lint requires a job to declare the permission for every
    # `gh api` endpoint family it or its helpers invoke, and this job invokes the
    # issues-comments family. Declaring it is also the honest fallback posture: if
    # the mint were ever removed the step would still work.
    #
    # The grant is safe in a job that checks out pull-request code because the
    # built-in GITHUB_TOKEN never reaches that code — the checkout persists no
    # credential, and no step interpolates the token into the environment. Only
    # GH_TOKEN, the already-downscoped App token, is in the helper's environment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A checkout, taken deliberately over the smaller checkout-less shape. The
      # post-or-skip decision is a branch selection over a user-visible outcome, and
      # this repo's convention is that such a selection lives in a scripts/*.sh
      # helper the suite can drive arm by arm rather than inline in YAML — which
      # needs the helper on disk. The trade is that this checks out the pull
      # request's own code, so a collaborator's branch controls the helper that then
      # runs alongside a token holding `pull-requests: write`. The fork gate above
      # bounds that to people who already have write access to this repository, and
      # the minted token is strictly NARROWER than the access they already hold, so
      # there is no escalation to reach for. Checking out the base ref instead would
      # close even that, but at a cost that is not worth paying: a change to this
      # helper could then never be exercised by the pull request that makes it.
      # persist-credentials: false because nothing here talks to git over the
      # network — gh authenticates from GH_TOKEN — so the checkout leaves no
      # credential behind for later steps to inherit.
      #
      # Step-gated on both dependencies succeeding: on the announcement path
      # (a red/pending dependency) this checkout of the pull request's own code
      # does NOT run, preserving the "ineligible run reaches no PR-code checkout
      # and mints no credential" property across the widened job `if:`.
      - uses: actions/checkout@v6
        if: needs.test.result == 'success' && needs.lint.result == 'success'
        with:
          persist-credentials: false

      # Downscoped to the single permission the helper needs. The issues-comments
      # endpoints accept the Pull requests permission when the target is a pull
      # request, which is the only target this job ever has — the same grant
      # devflow.yml's `dedupe_app_token` uses to post on a PR. No checkout token is
      # seeded from it (issue #357 governs PUSHING jobs; this one pushes nothing and
      # hands its token straight to gh, like devflow.yml's `gate` and
      # `review_dedupe` mints).
      - name: Mint downscoped comment token
        id: app_token
        if: needs.test.result == 'success' && needs.lint.result == 'success'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # Keyed on the pull request's HEAD sha, not the merge commit github.sha —
      # the head is what a review reviews and what the marker must dedupe on.
      # EXPECTED_AUTHOR is the mint's own `app-slug` output: the helper suppresses
      # only a marker comment THIS App authored, so a human (or another bot) merely
      # quoting the marker no longer kills the review request.
      - name: Request a review for this head
        if: needs.test.result == 'success' && needs.lint.result == 'success'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_AUTHOR: ${{ steps.app_token.outputs.app-slug }}
        run: bash scripts/post-ci-review-trigger.sh

      # --- Announcement path (a dependency did NOT conclude success) -----------
      # Reached only when the post path above was gated out. It mints no token and
      # checks out no pull-request code: it checks out the BASE ref (trusted, not
      # the PR's own code) solely to put the helper on disk, then runs it in
      # MODE=announce, which posts nothing and emits a `::warning::` naming which
      # dependency withheld the request. This is what makes a red `lint` — not a
      # required check, so the PR is mergeable — visible instead of a silent skip.
      - name: Check out base ref (no PR code) for the announcement
        if: needs.test.result != 'success' || needs.lint.result != 'success'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Announce the withheld review request
        if: needs.test.result != 'success' || needs.lint.result != 'success'
        env:
          MODE: announce
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: bash scripts/post-ci-review-trigger.sh
