name: DevFlow

# DevFlow-owned LIGHT COMMAND LISTENER. Fires on a BARE `/devflow:review`,
# `/devflow:review-and-fix`, or `/devflow:pr-description` comment (issue #1163: the
# sole trigger is issue_comment; a review-submission or inline-diff body no longer fires) and runs
# claude-code-action in AGENT mode with a synthesised prompt (jobs: `config` /
# `review_dedupe` / `gate` / `command`). This is the body that used to live in
# the standalone claude.yml.
#
# The reusable review runner lives in its OWN file, devflow-runner.yml — NOT
# here. Its caller was devflow-review.yml, the automatic pull-request-triggered
# review tier, which issue #936 WITHHELD from this release: that file is no
# longer in the tree, install.sh ships none of the tier's files, and
# devflow-runner.yml is retained without a caller. The always-available review
# path is therefore a collaborator commenting `/devflow:review` — this file's
# `command` job. A consumer can additionally opt into having that same comment
# posted automatically once their CI is green, with the documented snippet in
# docs/internal/workflow-triggers.md (issue #990); it routes into this same `command`
# job. The runner was split out in the first place because a called reusable
# workflow's permission ceiling is validated against the caller's grant across
# the whole graph: co-locating the high-privilege `command` job (contents:write
# to push, issues:write to react) with the low-privilege runner made that
# caller — a workflow holding read permissions alone — fail with
# `startup_failure`. This file therefore
# has NO `workflow_call` trigger — it is purely event-driven.
#
# Why bare commands (no `@claude`): Anthropic's Claude GitHub App owns the
# `claude.yml` it generates and the `@claude` mention surface (plus generic Q&A
# and /security-review). DevFlow never touches that file. EVERY DevFlow trigger
# below negates `@claude`, so an `@claude …` comment routes ONLY to Anthropic's
# listener and a bare `/devflow:*` comment routes ONLY here — the two can never
# double-fire. The heavy /devflow:implement path lives in devflow-implement.yml
# under the same partition. See docs/internal/cloud-setup.md.

on:
  # issue_comment is the SOLE subscription (issue #1163). Its jobs check out the
  # default branch by GitHub's own event-resolution rules — GitHub reads both the
  # workflow file and the workspace for issue_comment from the default branch — and
  # the checkouts below additionally pin `ref: ${{ github.event.repository.default_branch }}`
  # so the trusted-workspace property is stated in the file, not merely inferred
  # from the trigger set. The two review subscriptions (pull_request_review[submitted]
  # and pull_request_review_comment[created]) were removed: on those events GITHUB_REF
  # resolves to refs/pull/N/merge, so every job checked out PR-author content — the
  # composite actions, the vendored plugin tree, .prflow/config.json (from which the
  # config job resolves the values that authorize the run and grant the agent its
  # tools), and .claude/settings.json. Requesting a review by commenting on the PR
  # conversation still works (that is an issue_comment); requesting one from the
  # review-submission box or an inline diff comment no longer does. See
  # docs/workflow-triggers.md. The ACCIDENT class is closed here; the adversarial
  # residual (a branch re-adding a trigger in its own copy of this file — PR #404's
  # "a floor the pull request controls is no floor", applied to the workflow itself)
  # is out of scope by construction and tracked in #1300.
  issue_comment:
    types: [created]

defaults:
  run:
    shell: bash

jobs:
  config:
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    outputs:
      enabled: ${{ steps.extract.outputs.enabled }}
      base_branch: ${{ steps.extract.outputs.base_branch }}
      claude_model: ${{ steps.extract.outputs.claude_model }}
      allowed_bots: ${{ steps.extract.outputs.allowed_bots }}
      effort: ${{ steps.extract.outputs.effort }}
      allowed_tools_extra: ${{ steps.extract.outputs.allowed_tools_extra }}
      allowed_users: ${{ steps.extract.outputs.allowed_users }}
      prflow_version: ${{ steps.extract.outputs.prflow_version }}
      # Optional path to a pre-installed Claude Code executable (issue #601),
      # sourced from setup.claude_code_executable. Passed to claude-code-action's
      # path_to_claude_code_executable input in the command job below. Empty (the
      # default) leaves the action's automatic-install path unchanged.
      claude_code_executable: ${{ steps.extract.outputs.claude_code_executable }}
      # The whole trigger-time config document, forwarded verbatim so the command
      # job's git-env pin step (issue #645) can resolve setup.git_dir_pin /
      # setup.git_work_tree_pin through the bundled helper rather than re-parsing
      # them inline here. This job checks out the DEFAULT BRANCH at trigger time,
      # so the forwarded document is the trusted tree's — never the PR head's —
      # which is what makes those keys post-merge-only.
      config_json: ${{ steps.cfg.outputs.json }}
    steps:
      # Pin the default branch explicitly (issue #1163). issue_comment already
      # resolves GITHUB_REF to the default branch, so this states the trusted-tree
      # property in the file rather than inferring it from the trigger. No fallback
      # expression: an empty `ref` input makes actions/checkout fall back to
      # GITHUB_REF silently, reinstating the defect. No literal branch name: a
      # consumer's default branch may not be `main`.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - id: cfg
        uses: ./.github/actions/read-project-config
      - id: extract
        env:
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
        run: |
          set -euo pipefail
          ENABLED=$(echo "$CONFIG_JSON" | jq -r '.workflows.prflow // false')
          # SILENT-DISABLE SKEW GUARD (issue #1041) — the ONE guard in this step that is
          # deliberately NOT gated on $ENABLED, because the skew it detects is exactly what
          # forces $ENABLED false. Tier 4 renamed the enable key workflows["devflow"] ->
          # workflows.prflow. While that spelling was FROZEN a refreshed workflow and the
          # config key could never skew; the rename removed that guarantee, and install.sh's
          # workflow copy loop is PER FILE over an install_managed that deliberately
          # PRESERVES a hand-edited workflow (writing a .prflow-new sidecar beside it). So
          # refresh one shipped workflow while the other stays hand-edited on the superseded
          # key: scaffold-config.sh's freshness gate correctly REFUSES the config migration,
          # and this workflow is left reading workflows.prflow against a config that still
          # carries the superseded key. ENABLED resolves absent -> false, every trigger
          # silently no-ops, and the per-family guard below cannot report it because that
          # guard sits inside the enable gate this skew already forced shut.
          #
          # has() throughout, never `//`: a deliberate superseded-key `false` is a
          # valid-falsy value `//` would collapse into "absent" (issue #312).
          #
          # EVERY mention here spells the superseded key in BRACKET form on purpose. The
          # freshness gate in scaffold-config.sh decides staleness by searching this file for
          # a DOTTED read of the superseded key, and it does not care whether the hit is code
          # or a comment. A diagnostic that named the key in dotted form — anywhere, this
          # sentence included — would mark both shipped workflows permanently stale and wedge
          # the very migration it exists to protect. A guard must not defeat another guard;
          # tier1-rename-migration asserts this pair still scans clean.
          SUPERSEDED_ENABLE=$(echo "$CONFIG_JSON" | jq -r 'if (type=="object") and ((.workflows|type)=="object") and ((.workflows|has("prflow"))|not) and (.workflows|has("devflow")) then (.workflows["devflow"]|tostring) else "" end')
          # Bash builtins select the arm — no PATH tool may decide an EMITTED result. The
          # `true` arm mirrors the enable read's string-truthiness (a JSON true and a string
          # "true" both read as enabled), so the ERROR fires on exactly the configs whose
          # author intended this workflow ON and whom the rename has silenced. A superseded
          # key holding any other value already meant "off", so its outcome still matches
          # intent and it warrants a warning rather than a failed run.
          case "$SUPERSEDED_ENABLE" in
            "") : ;;
            true)
              echo "::error::.prflow/config.json still carries the superseded workflows[\"devflow\"] key and has no workflows.prflow, but this workflow reads workflows.prflow — so it resolves as DISABLED and every trigger silently does nothing. This is a PARTIAL upgrade: a hand-edited shipped workflow was preserved rather than refreshed, so the config-key migration was refused while this file was already refreshed. Merge any .github/workflows/*.prflow-new sidecar left beside a hand-edited workflow, then re-run install.sh --apply so the workflow read and the config key move together."
              exit 1 ;;
            *)
              echo "::warning::.prflow/config.json still carries the superseded workflows[\"devflow\"] key and has no workflows.prflow. This workflow reads workflows.prflow, so it is disabled — which matches the superseded key's own value, but the key is un-migrated. Re-run install.sh --apply to migrate it." ;;
          esac
          # STRAY SUPERSEDED FAMILY DETECTION (issue #1083) — advisory, deliberately NOT gated
          # on the enable read. A stray superseded top-level family present beside a canonical
          # prflow* family is a half-migrated config: the stray family's keys resolve to their
          # `// default` everywhere, so any tool grant, allowlist narrowing, or provider
          # selection written under it silently does nothing. The fully-un-migrated shape (no
          # prflow* family present) is left to the loud MISSING_FAMILIES gate below; this warns
          # only when a canonical family sits beside the stray one, which is exactly the
          # population the MISSING_FAMILIES set-difference passes silently (issue #1083).
          #
          # The superseded family names are matched by SHAPE (a `^devflow(_|$)` top-level key),
          # never spelled out, and this comment names NEITHER a dotted superseded read NOR a
          # bare superseded-family literal: the freshness gate in scaffold-config.sh marks a
          # workflow stale on either form, so writing one here — in jq, message, or comment —
          # would wedge every consumer's config-key migration (a guard must not defeat another
          # guard). lib/test/run.sh reconciles this shape against lib/rename-map.json's
          # config_keys so it cannot drift from the rename inventory. `keys` (not `//`) is what
          # keeps a valid-falsy stray value visible: presence is read from the key set, never
          # the value, so a stray family holding false/0/"" is still detected (issue #312).
          STRAY_FAMILIES=$(echo "$CONFIG_JSON" | jq -r '
            if type != "object" then ""
            else
              (keys) as $k
              | (any($k[]; test("^prflow(_|$)"))) as $has_canon
              | if $has_canon then ($k | map(select(test("^devflow(_|$)"))) | join(" ")) else "" end
            end')
          # Bash builtin word-splitting selects the emitted arm — no non-preflight PATH tool
          # decides the result. One warning per stray family, naming it and the remedy.
          if [ -n "$STRAY_FAMILIES" ]; then
            for fam in $STRAY_FAMILIES; do
              echo "::warning::.prflow/config.json carries the superseded top-level config key '$fam' beside a canonical prflow* family. Its keys are ignored — they resolve to their built-in defaults, so any tool grant, allowlist narrowing, or provider selection written under '$fam' silently does nothing. Run /prflow:init to migrate the Tier 1 config keys, then delete the stray '$fam' object."
            done
          fi
          # `// empty` collapses a missing/null allowlist to a real empty string.
          # Fail loud only when the workflow is ENABLED — a config left on the
          # pre-2.2.5 `claude.allowed_bots` key would otherwise propagate a
          # literal "null" allowlist that silently matches no bot. Disabled repos
          # skip the check (allowed_bots is read only downstream of the enabled
          # gate), so this never breaks an intentionally-off install. Mirrors the
          # guard in devflow-runner.yml.
          ALLOWED_BOTS=$(echo "$CONFIG_JSON" | jq -r '.prflow.allowed_bots // empty')
          if [ "$ENABLED" = "true" ] && [ -z "$ALLOWED_BOTS" ]; then
            echo "::error::prflow.allowed_bots is missing from .prflow/config.json (a pre-2.2.5 config may still use the old 'claude.allowed_bots' key — see CHANGELOG 2.2.5 migration)"
            exit 1
          fi
          # PER-FAMILY FAIL-LOUD GUARD (issues #988, #1002). The trigger-time channel
          # reads config through inline jq and NEVER through config-get.sh, so the
          # resolver superseded-key breadcrumb cannot reach it — this is that
          # breadcrumb's counterpart on the one channel it cannot see. Without it a
          # config still on the superseded key names resolves every read below to its
          # `// default`: the human-trigger gate silently WIDENS to everyone, the tool
          # grants vanish to `[]`, and the effort becomes one nobody chose.
          #
          # FAMILY granularity, not leaf: the schema marks none of the optional leaves
          # required, so a consumer who never set `allowed_users` or `effort` must stay
          # unaffected. Only the absence of the whole top-level family object is an error.
          #
          # Same side of the enable gate as the allowed_bots guard above, so an
          # intentionally-disabled repository is never failed.
          if [ "$ENABLED" = "true" ]; then
            MISSING_FAMILIES=$(echo "$CONFIG_JSON" | jq -r --arg fams "prflow prflow_version" '
              if type != "object" then $fams | split(" ") | join(" ")
              else ($fams | split(" ")) - [keys[]] | join(" ") end')
            if [ -n "$MISSING_FAMILIES" ]; then
              echo "::error::.prflow/config.json is missing the config key famil(ies): $MISSING_FAMILIES. If this repository still carries the superseded devflow_* names, run /prflow:init to migrate the whole Tier 1 set atomically; every read below would otherwise silently resolve to its default."
              exit 1
            fi
          fi
          {
            echo "enabled=$ENABLED"
            echo "base_branch=$(echo "$CONFIG_JSON" | jq -r '.base_branch')"
            echo "claude_model=$(echo "$CONFIG_JSON" | jq -r '.claude_model')"
            echo "allowed_bots=$ALLOWED_BOTS"
            # Human logins allowed to trigger the command path (AND-filter on top
            # of the collaborator-permission gate; '*' = any collaborator).
            echo "allowed_users=$(echo "$CONFIG_JSON" | jq -r '.prflow.allowed_users // "*"')"
            echo "effort=$(echo "$CONFIG_JSON" | jq -r '.prflow.effort // "high"')"
            # Repo-specific extra allowlist entries, appended on top of the
            # built-in devflow base list in the `claude` job's claude_args.
            # Emits a leading-comma string (",Bash(make:*),…") or "" so it can
            # be concatenated directly after the final base entry. Tool patterns
            # never contain commas/newlines, so a single-line output is safe.
            echo "allowed_tools_extra=$(echo "$CONFIG_JSON" | jq -r '.prflow.allowed_tools // [] | if length > 0 then "," + join(",") else "" end')"
            # Pinned plugin ref for the vendor-plugin fetch branch (thin installs).
            echo "prflow_version=$(echo "$CONFIG_JSON" | jq -r '.prflow_version // empty')"
          } >> "$GITHUB_OUTPUT"
          # Optional pre-installed Claude Code executable path (issue #601). For
          # self-hosted runners (typically Windows) whose OS the action's Unix-only
          # bundled installer cannot serve. `// empty` emits an empty *stream* when the key
          # is absent, so the substitution yields the empty string, which the action treats as "not provided" (auto-install unchanged).
          # `try … catch` guards a hand-corrupted non-object `setup` (so the config job
          # never aborts on a malformed setup block); `| strings` drops a non-string
          # leaf value (array/object/number) to empty; `select(test("[\n\r]") | not)`
          # drops even a *valid* string that carries an embedded newline/CR — those
          # would otherwise make jq -r emit a multi-line value that corrupts the
          # key=value GITHUB_OUTPUT line; `select(test("^[[:space:]]*$") | not)` drops a
          # whitespace-only string, which is never a usable executable path and whose
          # intended meaning is "unset" (auto-install). Any rejected shape falls back to
          # empty. Because "rejected" and "unset" both resolve to empty, a *non-empty*
          # raw value that resolves to empty emits a `::warning::` — otherwise a mistyped
          # path on the one platform where this key is load-bearing silently reverts to
          # the broken auto-install path and the operator debugs the installer's
          # misleading "Windows is not supported" error instead of their own typo
          # (the repo's breadcrumb-on-fallback convention; an explicit `""` is a
          # deliberate unset and warns nothing). The raw
          # probe emits the SENTINEL "set" rather than the value itself: command
          # substitution strips trailing newlines, so a value composed entirely of
          # newlines would collapse to the empty string and be misread as "unset",
          # silently skipping the warning for a rejected shape. The probe filters on
          # `!= null` rather than `// empty` because `//` is FALSY-triggered: `// empty`
          # would swallow a valid-falsy `false` leaf, rejecting it to auto-install with
          # no breadcrumb (the documented-off-switch class). JSON `null` stays an unset,
          # like an absent key. `catch "set"` (not `catch empty`) makes a NON-OBJECT
          # `setup` — which raises a jq index error in BOTH filters, so the guarded one
          # cannot resolve a value — warn rather than fail open silently.
          CLAUDE_CODE_EXECUTABLE_RAW=$(echo "$CONFIG_JSON" | jq -r 'try (.setup.claude_code_executable | select(. != null) | tostring | select(. != "") | "set") catch "set"')
          CLAUDE_CODE_EXECUTABLE=$(echo "$CONFIG_JSON" | jq -r 'try (.setup.claude_code_executable // empty | strings | select(test("[\n\r]") | not) | select(test("^[[:space:]]*$") | not)) catch empty')
          if [ -n "$CLAUDE_CODE_EXECUTABLE_RAW" ] && [ -z "$CLAUDE_CODE_EXECUTABLE" ]; then
            echo "::warning::setup.claude_code_executable is set but was rejected (non-string leaf, embedded newline/CR, or whitespace-only); falling back to the action's automatic Claude Code install."
          fi
          echo "claude_code_executable=$CLAUDE_CODE_EXECUTABLE" >> "$GITHUB_OUTPUT"

  # Dedupe a MANUAL bare `/devflow:review` comment against an AUTOMATED
  # pull-request-triggered review. Issue #936 WITHHELD that automatic tier from
  # this release, so nothing in this tree fires one and both signals below
  # resolve to zero (fail-open — the manual review proceeds). The gate is
  # retained because a consumer that installed the tier before it was withheld
  # keeps its own copy, and there the two triggers stay independent: a commit
  # push fires that copy's re-review, and the human who pushed it typically also
  # comments `/devflow:review` within a second or two. Without this gate BOTH
  # run a full (billable) LLM review of the same HEAD and post their own status
  # comment — the observed "two comments" bug (PR #113, 15:06:55 synchronize +
  # 15:06:56 comment).
  #
  # Policy ("auto suppresses manual"): if such an automated review is already
  # in-flight for this PR's CURRENT head — either an in_progress `Devflow
  # Review` check on that exact SHA, or a queued/in_progress
  # auto-review workflow run on the PR's branch (covers the sub-second
  # race before that tier's create_check POSTs the check) — skip the manual
  # review and leave a one-line pointer instead. Deliberately fail-OPEN (default
  # suppress=false): a missed suppression just reproduces the recoverable
  # double-comment, whereas a wrong suppression would silently swallow a
  # review the user explicitly asked for. This is the opposite failure
  # direction from that tier's fail-closed gates, by design.
  #
  # SCOPE — all three signals are HEAD-scoped. The two legacy signals above key on
  # the resolved head directly; Signal 3 (issue #989, the one that fires in this
  # tree) became commit-scoped in issue #1010, when the review engine started
  # stamping a seed-time head key — `<!-- prflow:review-seeded-head <sha> -->` —
  # into the progress comment it seeds at Phase 0.3.5. That key is DISTINCT from
  # the comment's `Reviewed HEAD:` line, which is stamped at Phase 4 and means "a
  # review FINISHED at this head"; two consumers depend on that meaning, so it was
  # not reused. The head this job resolves is passed into the helper's detect mode
  # and compared against the seeded key, so a review of a DIFFERENT head does not
  # suppress this request. An in-flight comment carrying no such key (an older
  # installed copy) fails OPEN. Describe this job as commit-scoped deduping.
  #
  # Only `/devflow:review` is deduped — NOT `/devflow:review-and-fix` (that
  # auto-applies fixes and has no automated equivalent), and not the
  # pr-description flow, which falls through with suppress=false untouched.
  review_dedupe:
    needs: config
    if: ${{ needs.config.outputs.enabled == 'true' }}
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
      checks: read
      actions: read
    outputs:
      suppress: ${{ steps.guard.outputs.suppress }}
    steps:
      # Pin the default branch explicitly (issue #1163) — see the config job's
      # checkout comment; no fallback expression, no literal branch name.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Materialize the plugin so detect-standalone-command.sh exists at
      # .prflow/vendor/prflow/scripts/ (committed → self → fetch). Mirrors the
      # gate job so the dedupe body match routes through the SAME shared detector
      # the resolver uses — the two matchers cannot drift (issue #321).
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ needs.config.outputs.prflow_version }}
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          emit() { echo "suppress=$1" >> "$GITHUB_OUTPUT"; }
          emit false  # fail-OPEN default: manual review proceeds unless we prove auto is in-flight

          # Route body detection through the SAME shared standalone-command
          # detector the resolver uses (vendored above), so a quoted/documented
          # /devflow:review mention neither dedupes nor posts a suppression
          # notice, and the trigger gate and this matcher cannot drift (#321).
          # The detector is markdown-aware and fires only on a command that is
          # the sole content of its own line; it emits `command=<token>` on
          # stdout. First-match-wins is preserved by the detector's
          # most-specific-first ordering (review-and-fix outranks review).
          DETECTOR=.prflow/vendor/prflow/scripts/detect-standalone-command.sh
          if [ ! -x "$DETECTOR" ]; then
            # Fail OPEN (the job's contract): a missing detector must never
            # suppress a manual review. Surface it so a vendoring miss is
            # distinguishable from "not a review request".
            echo "::warning::devflow detector not found at $DETECTOR — has install.sh vendored the plugin? Fail-open (manual review proceeds)."
            exit 0
          fi
          # Verify the OUTCOME, not just the -x precondition: a present-but-broken
          # detector (corrupt/partial vendored copy, awk error) or a missing sed
          # exits non-zero, and under `set -euo pipefail` that would abort this step
          # and FAIL the job — which then SKIPS the downstream `command` job (it
          # `needs: review_dedupe` with no always()), silently swallowing the manual
          # review. That is the fail-CLOSED direction this job's contract forbids, so
          # absorb any run failure into the same fail-OPEN exit the -x branch uses (#321).
          if ! CMD="$(printf '%s' "$BODY" | bash "$DETECTOR" | sed -n 's/^command=//p')"; then
            echo "::warning::devflow detector at $DETECTOR failed to run (broken vendored copy, or missing sed/bash); fail-open (manual review proceeds)."
            exit 0
          fi
          case "$CMD" in
            /prflow:review-and-fix)
              echo "::notice::/prflow:review-and-fix has no auto path; not deduping."
              exit 0 ;;
            /prflow:review) : ;;
            *)
              echo "::notice::Not a standalone /prflow:review request; nothing to dedupe."
              exit 0 ;;
          esac

          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then
            echo "::notice::No PR number on this event; fail-open (manual review proceeds)."
            exit 0
          fi

          # HEAD/BRANCH resolution adopts Signals 1/2's fail-open-with-::warning::
          # pattern below, but additionally captures the `gh` failure's stderr
          # (to a separate file so a partial-stdout-plus-error response can't
          # pollute the resolved value) and surfaces it in the warning — Signals
          # 1/2 themselves discard stderr (`2>/dev/null`). A success-but-empty/
          # null result stays the existing ::notice:: fail-open path. Both arms
          # still fail open (exit 0 / IR=0).
          # mktemp itself is guarded (falls back to /dev/null, matching
          # devflow-implement.yml's stall-backstop precedent) so a mktemp failure
          # can never abort this step via set -e and defeat the fail-open contract;
          # captured stderr is newline-collapsed before embedding so a multi-line
          # gh error can't break the ::warning:: annotation's single-line parsing.
          HEAD_ERR="$(mktemp 2>/dev/null || echo /dev/null)"
          if ! HEAD=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid 2>"$HEAD_ERR"); then
            echo "::warning::Could not resolve PR #$PR HEAD (gh pr view failed: $(tr '\n' ' ' < "$HEAD_ERR")); fail-open (manual review proceeds)."
            [ "$HEAD_ERR" = /dev/null ] || rm -f "$HEAD_ERR"
            exit 0
          fi
          [ "$HEAD_ERR" = /dev/null ] || rm -f "$HEAD_ERR"
          BRANCH_ERR="$(mktemp 2>/dev/null || echo /dev/null)"
          if ! BRANCH=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName 2>"$BRANCH_ERR"); then
            echo "::warning::Could not resolve PR #$PR BRANCH (gh pr view failed: $(tr '\n' ' ' < "$BRANCH_ERR")); treating as unresolved (fail-open — Signal 2 treated as 0)."
            BRANCH=""
          fi
          [ "$BRANCH_ERR" = /dev/null ] || rm -f "$BRANCH_ERR"
          if [ -z "$HEAD" ] || [ "$HEAD" = "null" ]; then
            echo "::notice::Could not resolve PR #$PR HEAD; fail-open (manual review proceeds)."
            exit 0
          fi

          # Signal 1: an in-flight `Devflow Review` check on THIS exact HEAD.
          # A query failure stays fail-open (IC=0 → not suppressed) but is
          # surfaced as a ::warning:: so a permanently-failing signal is
          # distinguishable from "no auto run existed".
          if RAW_IC=$(gh api --paginate "repos/$REPO/commits/$HEAD/check-runs" \
                 --jq '.check_runs[] | select(.name=="Devflow Review" and (.status=="queued" or .status=="in_progress")) | .id' \
                 2>/dev/null); then
            IC=$(printf '%s' "$RAW_IC" | grep -c . || true)
          else
            echo "::warning::Signal 1 (check-runs) query failed for $HEAD; treating as 0 (fail-open — manual review may proceed)."
            IC=0
          fi
          [[ "$IC" =~ ^[0-9]+$ ]] || IC=0

          # Signal 2: a queued/in_progress devflow-review.yml run on the
          # PR's branch. Issue #936 withheld that workflow, so in this tree the
          # query resolves nothing and Signal 2 never suppresses (an
          # unresolvable query takes the fail-open arm below). It still fires for
          # a consumer whose installed copy predates the withholding, where it
          # covers the sub-second auto-vs-comment race in which the auto run has
          # started but create_check has not POSTed the check yet (an in-flight
          # auto run on the same branch is, by that tier's own
          # first-ready/re-review design, reviewing the latest HEAD).
          IR=0
          if [ -n "$BRANCH" ] && [ "$BRANCH" != "null" ]; then
            if ! IR=$(gh run list --repo "$REPO" \
                   --workflow devflow-review.yml \
                   --branch "$BRANCH" \
                   --json status \
                   --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length' \
                   2>/dev/null); then
              echo "::warning::Signal 2 (run-list) query failed for branch $BRANCH; treating as 0 (fail-open)."
              IR=0
            fi
          fi
          [[ "$IR" =~ ^[0-9]+$ ]] || IR=0

          # Signal 3 (Candidate C, issue #989): an IN-FLIGHT review of THIS PR,
          # detected from the review engine's seeded live progress comment
          # (`prflow:review-progress`, `🚀 Reviewing`, bot-authored, fresh). This
          # is the signal that fires in THIS tree (Signals 1/2 target the withheld
          # auto-review tier and only fire for a consumer whose installed copy
          # predates the withholding). The branch-selecting decision lives in a
          # bundled helper so the suite can drive each arm; it is invoked at its
          # VENDORED path (a repo-relative `scripts/` path is rc 127 in every
          # consumer checkout, and — this job failing OPEN — that breakage would be
          # silent). The invocation is GUARDED so a non-zero exit routes to the
          # fail-open arm (CC=false) instead of aborting this step under
          # `set -euo pipefail` and skipping the downstream `command` job. The
          # helper is self-contained (its own gh query + jq); it fails open on every
          # degraded arm with its own ::warning:: breadcrumb, surfaced to the log
          # here (its stderr is not captured). The deciding value is parsed from its
          # stdout with bash builtins only (no tr/sed/grep for the decision).
          # A /prflow:review carrying the review-backstop marker is a no-verdict
          # auto-resume posted from inside a still-active run, and is NEVER
          # suppressed — this OVERRIDES every signal (legacy included), so the
          # resume always fires (issue #989). The helper applies this to its own
          # Signal 3, but the short-circuit below skips the helper when a legacy
          # signal already fired, so the override is applied HERE to IC/IR too.
          # Marker literal coupled with the helper's BACKSTOP_MARKER and
          # scripts/request-review-backstop.sh (pinned in lib/test/).
          # BOTH marker spellings are matched (issue #1003): a resume comment
          # posted before the rename carries the superseded one, and this arm
          # fails OPEN in the wrong direction -- a miss lets ordinary dedupe
          # SUPPRESS the auto-resume, so the dead review is never resumed.
          case "$BODY" in
            *"<!-- prflow:review-backstop"*|*"<!-- devflow:review-backstop"*)
              echo "::notice::dedupe-review: triggering /prflow:review carries the review-backstop marker (a no-verdict auto-resume); not suppressing (all signals overridden)."
              IC=0; IR=0 ;;
          esac

          # Signal 3 (Candidate C) is only consulted when neither legacy signal
          # fired: whenever IC/IR already decide suppression, the helper's full
          # paginated comments fetch + jq pass would be computed and discarded
          # (efficiency), so short-circuit it.
          CC=false
          if [ "$IC" = "0" ] && [ "$IR" = "0" ]; then
            CC_HELPER=.prflow/vendor/prflow/scripts/dedupe-review-command.sh
            if [ ! -x "$CC_HELPER" ]; then
              echo "::warning::dedupe-review helper not found/executable at $CC_HELPER (has install.sh/vendor-plugin vendored the plugin at the pinned prflow_version?); Candidate-C signal skipped (fail-open — manual review proceeds)."
            elif ! CC_OUT="$(MODE=detect REPO="$REPO" PR="$PR" HEAD="$HEAD" RUN_ID="${GITHUB_RUN_ID:-}" TRIGGER_BODY="$BODY" bash "$CC_HELPER")"; then
              echo "::warning::dedupe-review helper exited non-zero for PR #$PR; Candidate-C signal treated as 0 (fail-open)."
              CC=false
            else
              # The helper writes exactly one `suppress=<bool>` line to stdout
              # (breadcrumbs go to stderr, uncaptured, into the log). Parse it with
              # a bash case — no tr/sed/grep for the deciding value.
              case "$CC_OUT" in
                *suppress=true*) CC=true ;;
                *) CC=false ;;
              esac
            fi
          fi

          # Select the cause that decided suppression, in precedence order. The
          # legacy check-run/workflow-run causes name the `Devflow Review` check
          # and its Re-run button (on the consumer where they fire those are the
          # reader's real actions); the new in-flight-review cause names its own
          # reason. The notice step below composes the text from this cause via the
          # same helper.
          CAUSE=""
          if [ "$IC" != "0" ]; then
            CAUSE=legacy-check-run
          elif [ "$IR" != "0" ]; then
            CAUSE=legacy-workflow-run
          elif [ "$CC" = "true" ]; then
            CAUSE=inflight-review
          fi

          if [ -n "$CAUSE" ]; then
            emit true
            # The user-facing suppression notice is posted by the dedicated
            # step below (under the optional downscoped App token); this step
            # keeps only the queries + decision on github.token.
            echo "head=$HEAD" >> "$GITHUB_OUTPUT"
            echo "cause=$CAUSE" >> "$GITHUB_OUTPUT"
            echo "::notice::Suppressed manual /prflow:review for PR #$PR (cause=$CAUSE; in-flight check=$IC run=$IR inflight-review=$CC)."
            exit 0
          fi
          echo "::notice::No in-flight auto review for PR #$PR HEAD $HEAD; manual review proceeds."

      # Optional, opt-in: mint an App token DOWNSCOPED to the notice's needs —
      # PR comment only (no contents/workflows/issues). Same opt-in/fail-loud/
      # downscope contract as the review mint in devflow-runner.yml — see
      # docs/internal/cloud-setup.md. Minted only when the notice below will actually
      # post (suppress), so the common non-suppressed path stays mint-free.
      - name: Mint downscoped notice token (optional)
        id: dedupe_app_token
        if: ${{ vars.DEVFLOW_APP_ID != '' && steps.guard.outputs.suppress == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
          permission-pull-requests: write

      # Split out of the guard step so the notice posts under the App identity
      # when configured (the guard's queries stay on github.token — a scoped
      # token there could 403 the check-runs/run-list reads and flip the
      # fail-open default). Best-effort for the post itself: the gh call is
      # the only fallible command and is guarded (no continue-on-error on this
      # step), with the gh stderr surfaced as a ::warning:: (same diagnostic
      # discipline as devflow-implement.yml's duplicate-ignored notice)
      # instead of the old silent `2>/dev/null || true` swallow.
      - name: Notice — manual review suppressed
        if: ${{ steps.guard.outputs.suppress == 'true' }}
        env:
          GH_TOKEN: ${{ steps.dedupe_app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          HEAD: ${{ steps.guard.outputs.head }}
          CAUSE: ${{ steps.guard.outputs.cause }}
        run: |
          set -euo pipefail
          # CRITICAL: the body must contain NO DevFlow trigger phrase (mirrors
          # the devflow-implement.yml duplicate-notice discipline). Under the
          # App token this comment fires a real issue_comment event (unlike
          # GITHUB_TOKEN comments, which GitHub suppresses), so a trigger
          # substring here could re-enter the gate and loop.
          #
          # The notice TEXT is composed by the bundled helper (MODE=notice), not
          # inline here: a grep over an inline `NOTE=` literal protects the literal,
          # not the produced message, so the trigger-token guarantee is asserted
          # against the helper's actual output. Invoked at the VENDORED path (rc 127
          # in every consumer otherwise) and guarded (a non-zero exit or an absent
          # helper skips the post rather than aborting under set -euo pipefail — the
          # command was already suppressed, so a missing notice is cosmetic). The
          # helper selects the text from CAUSE: the legacy causes name the
          # `Devflow Review` check + Re-run button, the in-flight-review cause names
          # its own reason.
          NOTICE_HELPER=.prflow/vendor/prflow/scripts/dedupe-review-command.sh
          NOTE=""
          if [ ! -x "$NOTICE_HELPER" ]; then
            echo "::warning::dedupe-review helper not found/executable at $NOTICE_HELPER; skipping suppression notice for PR #$PR (the command was already suppressed)." >&2
            exit 0
          fi
          # The helper writes exactly one `notice=<text>` line to stdout; strip the
          # key prefix with parameter expansion (no heredoc — a heredoc terminator
          # dedents inside a YAML `run: |` block).
          if NOTE_OUT="$(MODE=notice CAUSE="$CAUSE" HEAD="$HEAD" bash "$NOTICE_HELPER")"; then
            case "$NOTE_OUT" in
              notice=*) NOTE="${NOTE_OUT#notice=}" ;;
            esac
          fi
          if [ -z "$NOTE" ]; then
            echo "::warning::dedupe-review: could not compose the suppression notice for PR #$PR (cause='$CAUSE'); skipping notice post (the command was already suppressed)." >&2
            exit 0
          fi
          # REST (not `gh pr comment` porcelain): this step can run under the
          # repo-scoped App installation token, and GraphQL-resolving porcelain
          # fails silently under repo-scoped tokens (CLAUDE.md gotcha, #228). A
          # PR is an issue for the comments endpoint.
          if ! err="$(gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$NOTE" 2>&1 >/dev/null)"; then
            echo "::warning::could not post review-suppressed notice on PR #$PR (continuing): ${err//$'\n'/ }" >&2
          fi

  # Authorization + command-detection gate for the LIGHT command path. The
  # `command` job below runs claude-code-action in AGENT mode (explicit prompt),
  # which executes for ANY actor, so this job is the cost control: it runs
  # resolve-command-trigger.sh, which authorizes the sender (allowed bot, or an
  # allowed_users login with write/admin/maintain access) and resolves which
  # /devflow:* command + target number to synthesise. Coarse event matching
  # stays in this job's `if:` so irrelevant events never spin a runner.
  #
  # PARTITION INVARIANT: every branch negates `@claude` and the implement command
  # in BOTH accepted namespaces. `@claude …` is ceded to Anthropic's claude.yml;
  # `/prflow:implement` (and the transitional `/devflow:implement`) is the heavy
  # path (devflow-implement.yml). The positive set and the exclusion set are one
  # coupled pair — a namespace added to either MUST be added to both in the same
  # commit, or a comment naming implement in one namespace and a light command in
  # the other fires this workflow AND devflow-implement.yml. `/prflow:review`
  # substring-matches `/prflow:review-and-fix`, so both are covered by the review
  # clause and the resolver disambiguates. Triggers fire ONLY on real comment bodies —
  # never on an issue/PR description, so a command merely *quoted* in a
  # description cannot start a run. Only the issue_comment clause remains: the two
  # review-event clauses were removed with their subscriptions (issue #1163), so no
  # unreachable branch is left behind.
  gate:
    needs: config
    if: |
      needs.config.outputs.enabled == 'true' &&
      (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '/prflow:review') || contains(github.event.comment.body, '/devflow:review') || contains(github.event.comment.body, '/prflow:pr-description') || contains(github.event.comment.body, '/devflow:pr-description')) && !contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '/prflow:implement') && !contains(github.event.comment.body, '/devflow:implement'))
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: read        # checkout the resolver; collaborator check uses GITHUB_TOKEN
      issues: write         # react step: ack reaction on issue comments
      pull-requests: write  # react step: ack reaction on PR review comments
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      command: ${{ steps.resolve.outputs.command }}
    steps:
      # Pin the default branch explicitly (issue #1163) — see the config job's
      # checkout comment; no fallback expression, no literal branch name.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Materialize the plugin so resolve-command-trigger.sh / react-to-trigger.sh
      # exist at .prflow/vendor/prflow/scripts/ (committed → self → fetch).
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ needs.config.outputs.prflow_version }}
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
          ALLOWED_BOTS: ${{ needs.config.outputs.allowed_bots }}
          ALLOWED_USERS: ${{ needs.config.outputs.allowed_users }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          # Only a real comment body contributes — never an issue/PR
          # description. Passed as an env var (never interpolated into bash) so
          # arbitrary body text cannot inject.
          TRIGGER_TEXT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # Vendored path: install.sh copies the plugin into .prflow/vendor/prflow/.
          RESOLVER=.prflow/vendor/prflow/scripts/resolve-command-trigger.sh
          if [ ! -x "$RESOLVER" ]; then
            echo "::error::devflow resolver not found at $RESOLVER — has install.sh vendored the plugin into this repo? Skipping." >&2
            { echo "should_run=false"; echo "command="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$RESOLVER" >> "$GITHUB_OUTPUT"

      # Optional, opt-in: mint an App token DOWNSCOPED for the trigger reaction
      # (issues:write + pull-requests:write — the narrowest grant GitHub offers
      # for comment reactions; no contents/workflows: this job neither reads
      # code with it nor pushes). Same opt-in/fail-loud/downscope contract as
      # the review mint in devflow-runner.yml — see docs/internal/cloud-setup.md. NOTE:
      # fail-loud means a configured-but-broken App fails THIS gate job (and so
      # blocks the command path) — deliberate, so a broken App is never
      # silently degraded around. Minted only when the reaction below will
      # actually run (should_run), so the common unauthorized/non-command
      # rejection path stays mint-free.
      - name: Mint downscoped reaction token (optional)
        id: gate_app_token
        if: ${{ vars.DEVFLOW_APP_ID != '' && steps.resolve.outputs.should_run == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # Early acknowledgement: react on the triggering comment/issue the moment
      # we know the command is authorized + resolvable, long before the heavy
      # `command` job runs. Best-effort and continue-on-error so a reaction
      # hiccup never blocks the run. (The dedupe job runs in parallel, so a
      # later-suppressed manual /devflow:review may still get a reaction here —
      # that acknowledges the trigger; review_dedupe's comment explains routing.)
      - name: Acknowledge trigger
        if: ${{ steps.resolve.outputs.should_run == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.gate_app_token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # Invoked via `bash` (not bare-exec) so it works regardless of whether
        # the vendored copy kept its executable bit — same robustness rationale
        # as the implement resolver's `bash "$RESOLVER"`. A missing file errors
        # visibly but is absorbed by continue-on-error (best-effort ack).
        run: bash .prflow/vendor/prflow/scripts/react-to-trigger.sh

  command:
    needs: [config, review_dedupe, gate]
    if: ${{ needs.gate.outputs.should_run == 'true' && needs.review_dedupe.outputs.suppress != 'true' }}
    # Promote the two run-end observables the out-of-job review_finalize backstop
    # (issue #1174) uses to name a RICHER dead-run cause when this job completed
    # its steps but reported no verdict (an alive failure). They are deliberately
    # the only two promoted: they are the operands describe-dead-run-cause.sh
    # consumes, and they are exactly the operands that are UNAVAILABLE on a
    # runner-DEATH path — a job whose runner is lost emits no outputs, so
    # review_finalize reads them as empty and falls back to the generic
    # arm message (see that job's "unavailable on a dead-job path" note). Every
    # other in-job observable (steps.claude.outputs.execution_file and everything
    # derived from it) is a path on the dead runner's filesystem and cannot be
    # promoted at all.
    outputs:
      claude_outcome: ${{ steps.claude.outcome }}
      engine_is_error: ${{ steps.engine.outputs.is_error }}
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write # write scope so actions/cache can save the pip cache (read alone → "cache write denied: token has no writable scopes"); superset still lets Claude read CI results on PRs
      # Required by summarize-ci-checks.sh's commits/{sha}/check-runs query, run by
      # the `Compose engine grounding block` step (issue #363). Without it that query
      # 403s and the block correctly degrades to `CI status unavailable` — but the
      # engine then loses the CI ground truth the block exists to give it. The
      # actions/runs + jobs queries ride the `actions: write` superset above.
      checks: read
    env:
      # Authorize the Stop-hook `--persist` telemetry PUSH on this WRITABLE tier
      # (issue #469 AC5). The manual `/devflow:review` comment path (and every other
      # command this job runs) holds contents:write, so the branch push succeeds
      # here — unlike the read-only auto-review `review` tier (devflow-runner.yml),
      # which deliberately leaves this UNSET so `--persist` fails closed to
      # staging-only. Job-level so it reaches the Stop-hook subprocess
      # claude-code-action spawns. Kept in sync with devflow-implement.yml's claude
      # job. (Platform premise — job env propagates into the Stop-hook subprocess.)
      DEVFLOW_TELEMETRY_PUSH: '1'
      # The protected prompt-extension set (issue #1075) — every skill name whose
      # extension bytes can reach an agent's own prompt inside THIS job. The gate
      # above dispatches exactly three commands, so the set is closed by this same
      # file: `/prflow:review` and `/prflow:review-and-fix` reach the review engine
      # (`review`, and `requesting-code-review` for the Phase 3.1 final-pass
      # reviewer), the fix wrapper adds its own two (`review-and-fix`,
      # `receiving-code-review`), and `/prflow:pr-description` adds one.
      #
      # This is the SINGLE declaration site — the materialization call below is its
      # only reader — and lib/test/run.sh's #1075 drift guard fails when it differs
      # from the names actually reachable as `load-prompt-extension.sh <name>` from
      # those three skill trees. A name MISSING here is not a silent no-op but a
      # silent EMPTY read: the closure is exported unconditionally, so the loader
      # composes `<closure>/<name>.md` for every name and finds nothing for one this
      # list omits. That is the failure mode the drift guard exists to catch.
      DEVFLOW_PROTECTED_PROMPT_EXTENSIONS: "pr-description receiving-code-review requesting-code-review review review-and-fix"
    steps:
      # Optional, opt-in: mint a primary-App installation token at full
      # installation scope (notably Contents: write + Workflows: write — no
      # permission-* downscope, unlike the per-site tokens elsewhere in this
      # workflow) so the /devflow:review-and-fix push can
      # edit .github/workflows/ files (which the built-in GITHUB_TOKEN is
      # hard-blocked from), and so /devflow:pr-description posts under the App.
      # Gated on the DEVFLOW_APP_ID repository VARIABLE and skipped on a
      # `/devflow:review` command (that path uses the DevFlow-Reviewer token
      # below so it never shares the PR-authoring identity — issue #300):
      # unset/empty → the step is skipped and both the checkout token and
      # github_token below fall back to GITHUB_TOKEN, leaving behavior
      # byte-for-byte unchanged for consumers who do not opt in. NO
      # continue-on-error: a configured-but-broken App (invalid/rotated key)
      # fails the job here rather than silently degrading.
      #
      # MUST precede the checkout below, whose `token:` it feeds — see the
      # checkout comment. Kept in sync with the same step in
      # devflow-implement.yml.
      - name: Mint workflow-capable token (optional)
        id: app-token
        if: ${{ vars.DEVFLOW_APP_ID != '' && !startsWith(needs.gate.outputs.command, '/prflow:review ') }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Pin the default branch explicitly (issue #1163) — see the config job's
          # checkout comment; no fallback expression, no literal branch name.
          ref: ${{ github.event.repository.default_branch }}
          # fetch-depth: 0 (all history) — matches devflow-implement.yml and
          # ci.yml. Two requirements, and the second is the binding one
          # (issue #1219):
          #  1. Diff base. /prflow:pr-description (and /prflow:review-and-fix's
          #     head-override diff) reads the diff via three-dot notation against
          #     the base (a `git diff <base>...HEAD` merge-base — an ancestor walk
          #     on both sides). Standalone /prflow:review's diff is API-sourced
          #     (`gh pr diff`), NOT this three-dot diff; its claim verification
          #     reads reviewed-head bytes via `git show <PR_HEAD_SHA>:<path>` for
          #     diff-touched paths, so a same-repo PR head must resolve locally.
          #     A bounded depth (this was `fetch-depth: 50`) covers neither.
          #  2. Historical baseline. This job also hosts /prflow:review-and-fix,
          #     whose in-env verification runs the project's own test suite under
          #     the same no-skip accounting as the implement tier, so leaving
          #     this job bounded would reproduce the identical failure on the
          #     review-and-fix path.
          # The full statement of that failure, and the reason a targeted fetch
          # of the required commits was rejected in favour of full history, live
          # in devflow-implement.yml's checkout comment — one home, so the two do
          # not drift apart.
          fetch-depth: 0
          # LOAD-BEARING (issue #357): the credential actions/checkout persists
          # here is what /devflow:review-and-fix's `git push` actually
          # authenticates with — NOT the `github_token` handed to
          # claude-code-action below. checkout@v6 writes the auth header to an
          # external config file wired in via `includeIf.gitdir:`, NOT to
          # `.git/config`, so claude-code-action's `--unset-all
          # http.<server>/.extraheader` matches nothing and its
          # `git remote set-url origin https://x-access-token:<app-token>@…`
          # loses to that surviving preemptive `Authorization:` header — every
          # push then authenticates as github-actions[bot], which has no
          # `workflows` permission. Seed the App token here instead. On a
          # `/devflow:review` command the mint is skipped by design and this
          # falls back to GITHUB_TOKEN — that path is read-only and never
          # pushes, so it must NOT be given the reviewer token either.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Materialize the plugin (committed → self → fetch) so claude-code-action
      # loads it from .prflow/vendor/prflow/ and the agent's helper scripts
      # resolve at the literal workspace path the allowlist grants.
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ needs.config.outputs.prflow_version }}

      # Incomplete-vendor guard for the grounding renderer. Runs AFTER
      # vendor-materialization and BEFORE the Claude step so a broken vendor tree fails
      # here rather than launching an agent whose prompt carries no
      # engine-ground-truth block — this run's only statement of the headless-run
      # discipline and of the commands it may execute. A directory's presence is not
      # proof the helper exists, so probe the file itself.
      #
      # UNCONDITIONAL, exactly like `Compose engine grounding block` below: every
      # command the gate dispatches now composes a block, so an unconditional guard
      # fails exactly the runs that compose one and never a run that composes none.
      # It carried a `/prflow:review ` predicate while the block did — do NOT restore
      # one here without narrowing the compose step in the same edit, and note that
      # this file's OTHER occurrences of that predicate select the github_token and
      # are a security boundary, not a grounding gate. Probed vendored-then-repo-root,
      # exactly as that step resolves the renderer, so this guard fails only where the
      # compose step would itself have failed.
      - name: Validate vendored grounding renderer
        run: |
          set -euo pipefail
          if [ ! -f .prflow/vendor/prflow/scripts/render-grounding-block.sh ] \
             && [ ! -f scripts/render-grounding-block.sh ]; then
            echo "::error::incomplete vendor: render-grounding-block.sh is missing from both .prflow/vendor/prflow/scripts/ and scripts/ after materialization — this run's prompt would carry no engine-ground-truth block, its only statement of the headless-run discipline and of the commands it may execute. Repair the committed .prflow/vendor/prflow tree, or check the vendor-plugin fetch (prflow_version). Failing BEFORE Run Claude Code rather than launching an ungrounded agent." >&2
            exit 1
          fi

      # ── Trusted prompt-extension closure (issue #1075, extending #874) ────────
      # `scripts/load-prompt-extension.sh` prints an extension file byte-for-byte and
      # every skill treats that stdout as instructions appended to its OWN prompt for
      # the run. On this tier some of those reads happen against the PULL REQUEST's
      # head, so without this step a PR author writes part of the prompt of the agent
      # that reviews — and, on `/prflow:review-and-fix`, FIXES and PUSHES — their PR.
      # That is the PR-#404 ruling ("a floor the PR controls is no floor") one level
      # up, so it is closed here rather than recorded as an accepted trade.
      #
      # WHY THE WORKSPACE IS NOT A TRUSTED SOURCE FOR THESE BYTES, precisely — the
      # mechanism is NOT "this job checks out the PR head". Since issue #1163 this
      # workflow subscribes to `issue_comment` alone and every job pins
      # `ref: github.event.repository.default_branch`, so the checkout below is ALWAYS
      # the maintainer-committed default branch — trusted at workflow-step time. The
      # untrustedness is introduced entirely by the AGENT, not the checkout:
      # `/prflow:review-and-fix`'s Step 0.5 branch sync runs `gh pr checkout` and moves
      # the tree to the PR head BEFORE the review engine loads `review` and before
      # Phase 3.1 loads `requesting-code-review`, so those two reads land on PR content.
      # Standalone `/prflow:review` never moves the tree at all: it reads the PR diff and
      # metadata through `gh pr diff` / `gh pr view`, and verifies claims about diff-touched
      # paths against the reviewed head's bytes through `git show <PR_HEAD_SHA>:<path>` — the
      # tree stays on the trusted default branch throughout, so it was already reading trusted
      # bytes; the closure costs it nothing and covers the branch-synced review-and-fix path.
      #
      # UNCONDITIONAL closure + export, CONDITIONAL population — the #874 shape. The
      # closure directory and the variable are established outside every branch, so
      # each non-population arm (no PR number, an unresolvable base branch, a failed
      # fetch, a missing materialization helper, and every arm inside the helper)
      # degrades to an EMPTY closure — the run proceeds with no extension text — and
      # never back to the working tree. Putting either inside a conditional would
      # reintroduce exactly the defect this step closes.
      #
      # DELIBERATE DIVERGENCE FROM devflow-runner.yml: no workspace truncation. The
      # runner empties its workspace copies as a belt for a loader that ignores the
      # variable. Here that would be actively harmful — this tier is WRITE-capable:
      # a truncated file dirties the tree, `gh pr checkout` at Step 0.5 refuses a
      # dirty tree (the skill then stops and reports), and any truncation that did
      # survive is a change the fix loop would COMMIT to the contributor's branch.
      # The belt is replaced by the loud skew probe at the end of this step.
      #
      # DELIBERATE DIVERGENCE: no three-rank trusted-source ladder for the helper.
      # The runner needs one because its workspace is ALWAYS the PR head, so a
      # workspace helper is never trusted. Here the workspace is the trusted default
      # branch at checkout, and the untrusted state arrives only when Step 0.5's
      # `gh pr checkout` moves the tree to the PR head — at which point a PR that can
      # edit this helper can equally edit the `load-prompt-extension.sh` the agent
      # runs from the same vendored tree, which no ladder reaches because the loader
      # is what consults the closure. A ladder would therefore add complexity without
      # adding a case it defends. That residual is recorded in
      # docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md's base-ref trust boundary, not glossed.
      #
      # No `set -e`: every arm here already degrades to the safe empty closure, so an
      # unexpected non-zero must not abort the job and deny the command path
      # altogether. The two operations that must NOT fail silently — creating the
      # closure and exporting the variable — are checked explicitly and fail closed.
      - name: Establish the trusted prompt-extension closure
        id: promptext
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CMD: ${{ needs.gate.outputs.command }}
        run: |
          set -uo pipefail
          CLOSURE="$RUNNER_TEMP/devflow-trusted-prompt-ext"
          # Fail CLOSED on both: with no closure to point at, the loader would take
          # its repo-root branch and read the working tree — the very thing this step
          # exists to prevent. There is no degraded-but-safe variant of these two.
          if ! mkdir -p "$CLOSURE"; then
            echo "::error::devflow could not create the trusted prompt-extension closure at '$CLOSURE'; refusing to run the command with the loader pointed at the working tree."
            exit 1
          fi
          # $GITHUB_ENV is job-scoped, so this reaches every later step — including the
          # commands the agent runs and the ones its dispatched Tasks run. It arrives
          # through the environment rather than a command prefix precisely because the
          # cloud matcher denies a leading `VAR=value` shape.
          if ! echo "DEVFLOW_PROMPT_EXTENSION_ROOT=$CLOSURE" >> "$GITHUB_ENV"; then
            echo "::error::devflow could not export DEVFLOW_PROMPT_EXTENSION_ROOT; refusing to run the command with the loader pointed at the working tree."
            exit 1
          fi

          # Same parse the `Compose engine grounding block` step below uses on its
          # review-mode path, for the
          # same reason (this job is command-driven, and the gate's resolver fails
          # closed rather than emitting a command with no number). A missing `grep`
          # or `head` empties PR_NUM, which routes to the warn-and-empty-closure arm —
          # this selection fails CLOSED on an absent PATH tool.
          PR_NUM=$(printf '%s' "$CMD" | grep -oE '[0-9]+' | head -1 || true)
          # One message, one reason string: each arm below sets only a cause and the
          # single emit site composes the diagnosis, so no arm can be reordered into
          # misattributing it (the hazard scripts/describe-denial-count.sh exists for).
          REASON=''
          BASE_REF=''
          if [ -z "$PR_NUM" ]; then
            REASON="the triggering command carried no issue or pull-request number"
          elif ! BASE_REF=$(gh pr view "$PR_NUM" --repo "$REPO" --json baseRefName -q .baseRefName 2>/dev/null) || [ -z "$BASE_REF" ]; then
            BASE_REF=''
            REASON="the base branch of #${PR_NUM} could not be resolved (gh pr view failed, or the number names an issue rather than a pull request)"
          elif ! git fetch --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
            REASON="the trusted base ref '${BASE_REF}' could not be fetched"
            BASE_REF=''
          fi

          # INSIDE the fetch-success branch and NOWHERE ELSE. FETCH_HEAD elsewhere —
          # for example left by actions/checkout — can point at the PR head, and
          # reading the extensions from there would hand the agent's own prompt to the
          # PR author. The helper performs no fetch of its own and resolves no ref but
          # FETCH_HEAD, so this branch is the whole of its trust premise.
          if [ -n "$BASE_REF" ]; then
            HELPER=.prflow/vendor/prflow/scripts/materialize-trusted-prompt-extensions.sh
            [ -f "$HELPER" ] || HELPER=scripts/materialize-trusted-prompt-extensions.sh
            if [ -f "$HELPER" ]; then
              # The helper prints its own fully-formed ::warning:: / ::notice:: lines
              # on stdout, so this call site selects no branch and composes no message
              # for the per-name arms — that logic lives in the helper, where
              # lib/test/run.sh drives every arm. The protected set is expanded
              # UNQUOTED on purpose: each name must become its own argv entry, the one
              # place word splitting is the intended behavior. A NON-ZERO exit is the
              # helper's deliberate loud refusal of a CALLER defect (exit 2), never a
              # runtime condition, so it is annotated rather than swallowed.
              _mtpe_rc=0
              bash "$HELPER" \
                --base-ref "$BASE_REF" \
                --target "$CLOSURE" \
                $DEVFLOW_PROTECTED_PROMPT_EXTENSIONS || _mtpe_rc=$?
              if [ "$_mtpe_rc" -ne 0 ]; then
                echo "::warning::devflow trusted prompt-extension materialization helper exited ${_mtpe_rc} — a caller or usage defect, not a runtime condition; the closure stays empty and this run proceeds with no consumer prompt-extension text."
              fi
            else
              REASON="materialize-trusted-prompt-extensions.sh was not found at the vendored or the repo path (a pinned prflow_version predating issue #874, or a vendor step that did not materialize the plugin)"
            fi
          fi
          if [ -n "$REASON" ]; then
            echo "::warning::devflow trusted prompt-extension closure not populated: ${REASON}. This run proceeds with NO consumer prompt-extension text rather than reading the pull-request head; see the trusted-ref rule in docs/internal/cloud-setup.md."
          fi

          # Skew probe (the replacement for the runner's truncation belt). The loader
          # the agent actually runs is the VENDORED copy — the skill anchor resolves
          # through the loaded plugin — so a consumer whose pinned prflow_version
          # predates issue #874 ships a loader that ignores the variable, resolves the
          # repo root, and reads the working tree. Truncation cannot be used to blind
          # it here, so say so loudly instead of failing open in silence. Scoped to
          # the present-but-too-old case alone: an ABSENT vendored loader is a broken
          # vendor step that other steps already diagnose, and folding two causes into
          # one breadcrumb would leave the reader unable to tell them apart.
          #
          # The probe is BASH BUILTINS ONLY (`while IFS= read -r` + `case`), not `grep`.
          # This value decides an EMITTED result — which diagnosis the maintainer reads —
          # and CLAUDE.md's guard-class 2 bars deriving such a value through a
          # non-preflight PATH tool. With `grep` the absent-tool case inverted the
          # condition and published "predates issue #874" about a loader this step never
          # actually read: loud, but naming a cause it had not established. The builtin
          # loop cannot fail that way, so the message asserts only what was observed.
          LOADER=.prflow/vendor/prflow/scripts/load-prompt-extension.sh
          _loader_honors=no
          if [ -f "$LOADER" ]; then
            while IFS= read -r _l || [ -n "$_l" ]; do
              case "$_l" in
                *DEVFLOW_PROMPT_EXTENSION_ROOT*) _loader_honors=yes; break ;;
              esac
            done < "$LOADER"
          fi
          if [ -f "$LOADER" ] && [ "$_loader_honors" = no ]; then
            echo "::warning::devflow: the vendored load-prompt-extension.sh predates issue #874 and ignores DEVFLOW_PROMPT_EXTENSION_ROOT, so it resolves the WORKING TREE rather than this run's trusted closure — and after /prflow:review-and-fix's branch sync that tree is the pull-request head. Bump prflow_version in .prflow/config.json to close it."
          fi

      # Provision the runtime (Python / Node / pip cache / deps) from
      # `.prflow/config.json`'s `setup` block. The logic lives in the
      # setup-project-env composite action so devflow.yml and
      # devflow-implement.yml share ONE copy (checkout above gives the action
      # the repo + config to read). See docs/internal/cloud-setup.md for the rationale.
      - id: cfg
        uses: ./.github/actions/read-project-config
      - uses: ./.github/actions/setup-project-env
        with:
          config_json: ${{ steps.cfg.outputs.json }}
          # The command tier does no linting itself; lint provisioning is the
          # implement tier's concern (issue #1388).
          lint_mode: none

      # Optional, opt-in: for the `/devflow:review` command ONLY, mint a
      # DEDICATED DevFlow-Reviewer installation token DOWNSCOPED to the review
      # agent's needs (contents/issues:read, pull-requests:write, actions:read —
      # same set as devflow-runner.yml's review mint). This is the manual
      # `/devflow:review` twin of the auto-review runner: the review identity is
      # DevFlow-Reviewer, structurally distinct from the primary
      # `prflow-implementer` App that authors PRs, so Phase 4.4's
      # `gh pr review --request-changes`/`--approve` is not a forbidden
      # self-review (issue #300). Gated on the DEVFLOW_REVIEWER_APP_ID VARIABLE
      # AND on the command being exactly `/prflow:review` (the trailing space
      # in the startsWith excludes `/prflow:review-and-fix`, which pushes fixes
      # and stays on the primary app token below). Unset reviewer var → skipped,
      # github_token falls back to GITHUB_TOKEN — NEVER the primary app token.
      - name: Mint downscoped DevFlow-Reviewer token (optional)
        id: reviewer-token
        if: ${{ vars.DEVFLOW_REVIEWER_APP_ID != '' && startsWith(needs.gate.outputs.command, '/prflow:review ') }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_REVIEWER_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
          permission-actions: read

      # Resolve the allowed-tools string ONCE, as a step output. It used to be an
      # inline literal inside `claude_args`, which the grounding block below could
      # not read — and a second, hand-copied list would drift from the real one the
      # moment either changed. Hoisting it makes the block quote the exact string
      # this run resolved, by construction (issue #363).
      #
      # The command heads that skills/review/SKILL.md invokes are pinned against
      # this list by lib/test/run.sh: a head the skill runs but this list omits is
      # silently denied at runtime.
      #
      # The TOOLS='…' literal below is a GENERATED region — do NOT hand-edit it. It is
      # compiled from the `command` profile in lib/capability-profiles.json by
      # lib/generate-capability-profiles.py; change a grant there and regenerate. The
      # banner comment above the assignment carries the manifest_version + the region's
      # sha256, and lib/test/run.sh's --check turns any manifest↔literal drift RED.
      - name: Resolve allowed-tools
        id: tools
        env:
          EXTRA: ${{ needs.config.outputs.allowed_tools_extra }}
        run: |
          set -euo pipefail
          # devflow-capability-manifest: region=command manifest_version=29 sha256=0951b3264d052eccd916e510e763da68317e532778244e37ce951541a3422f2f
          TOOLS='Read, Write, Edit, Glob, Grep, LS, Skill, Agent, TodoWrite, EnterPlanMode, ExitPlanMode, WebFetch, WebSearch, Bash(git add:*), Bash(git commit:*), Bash(git push:*), Bash(git pull:*), Bash(git fetch:*), Bash(git ls-remote:*), Bash(git status:*), Bash(git diff:*), Bash(git log:*), Bash(git show:*), Bash(git checkout:*), Bash(git cat-file:*), Bash(git hash-object:*), Bash(git branch:*), Bash(git stash:*), Bash(git rm:*), Bash(git mv:*), Bash(git restore:*), Bash(git revert:*), Bash(git blame:*), Bash(git ls-files:*), Bash(git rev-parse:*), Bash(git merge-base:*), Bash(git merge:*), Bash(gh pr create:*), Bash(gh pr edit:*), Bash(gh pr comment:*), Bash(gh pr diff:*), Bash(gh pr view:*), Bash(gh pr ready:*), Bash(gh pr list:*), Bash(gh pr checks:*), Bash(gh pr status:*), Bash(gh pr reopen:*), Bash(gh pr checkout:*), Bash(gh issue view:*), Bash(gh issue comment:*), Bash(gh issue list:*), Bash(gh issue edit:*), Bash(gh issue create:*), Bash(gh issue reopen:*), Bash(gh issue status:*), Bash(gh search:*), Bash(gh label list:*), Bash(gh repo view:*), Bash(gh run view:*), Bash(gh run list:*), Bash(gh workflow view:*), Bash(gh workflow list:*), Bash(gh api:*), Bash(jq:*), Bash(.prflow/vendor/prflow/scripts/run-jq.sh:*), Bash(.prflow/vendor/prflow/scripts/config-get.sh:*), Bash(.prflow/vendor/prflow/scripts/workpad.py:*), Bash(.prflow/vendor/prflow/scripts/seed-review-progress.sh:*), Bash(.prflow/vendor/prflow/scripts/compose-run-url.sh:*), Bash(.prflow/vendor/prflow/scripts/verification-flight.py:*), Bash(.prflow/vendor/prflow/scripts/reception-record.py:*), Bash(.prflow/vendor/prflow/scripts/checkout-fingerprint.py:*), Bash(.prflow/vendor/prflow/scripts/check-completion-evidence.py:*), Bash(.prflow/vendor/prflow/scripts/parse-acs.py:*), Bash(.prflow/vendor/prflow/scripts/check-verified-premises.py:*), Bash(.prflow/vendor/prflow/scripts/preflight.py:*), Bash(.prflow/vendor/prflow/scripts/branch-for-issue.py:*), Bash(.prflow/vendor/prflow/scripts/update-branch-checkpoint.sh:*), Bash(.prflow/vendor/prflow/scripts/phase2-durability-checkpoint.sh:*), Bash(.prflow/vendor/prflow/scripts/file-deferrals.py:*), Bash(.prflow/vendor/prflow/scripts/match-deferrals.py:*), Bash(.prflow/vendor/prflow/scripts/match-lint-adjudications.py:*), Bash(.prflow/vendor/prflow/scripts/normalize-verdicts.py:*), Bash(.prflow/vendor/prflow/scripts/resolve-review-overrides.py:*), Bash(.prflow/vendor/prflow/scripts/stale-prose-lint.py:*), Bash(.prflow/vendor/prflow/scripts/dismiss-stale-rejections.sh:*), Bash(.prflow/vendor/prflow/scripts/post-review-verdict.sh:*), Bash(.prflow/vendor/prflow/scripts/loop-verdict-marker.py:*), Bash(.prflow/vendor/prflow/scripts/prompt-surface-growth.py:*), Bash(.prflow/vendor/prflow/scripts/prompt-extension-arrival.py:*), Bash(.prflow/vendor/prflow/lib/efficiency-trace.sh:*), Bash(pip install:*), Bash(pip:*), Bash(python:*), Bash(python3:*), Bash(python -m:*), Bash(python3 -m:*), Bash(ruff:*), Bash(ruff check:*), Bash(ruff format:*), Bash(pytest:*), Bash(mypy:*), Bash(grep:*), Bash(rg:*), Bash(find:*), Bash(wc:*), Bash(sort:*), Bash(uniq:*), Bash(cut:*), Bash(tr:*), Bash(xargs:*), Bash(awk:*), Bash(sed:*), Bash(diff:*), Bash(comm:*), Bash(cat:*), Bash(head:*), Bash(tail:*), Bash(less:*), Bash(ls:*), Bash(tree:*), Bash(file:*), Bash(stat:*), Bash(date:*), Bash(pwd:*), Bash(realpath:*), Bash(dirname:*), Bash(basename:*), Bash(which:*), Bash(type:*), Bash(env:*), Bash(echo:*), Bash(printf:*), Bash(test:*), Bash(touch:*), Bash(mkdir:*), Bash(rmdir:*), Bash(rm:*), Bash(mv:*), Bash(cp:*), Bash(mktemp:*), Bash(cmp:*), Bash(.prflow/vendor/prflow/scripts/load-prompt-extension.sh:*), Bash(*/load-prompt-extension.sh:*), Bash(.prflow/vendor/prflow/scripts/render-prompt-extension.sh:*), Bash(*/render-prompt-extension.sh:*), Bash(tee:*)'
          printf 'tools=%s\n' "${TOOLS}${EXTRA}" >> "$GITHUB_OUTPUT"

      # Ground EVERY command this tier dispatches in the same facts the automated
      # path gets from devflow-runner.yml's `Compose review prompt`: the commands the
      # run may execute, the shapes its harness accepts, the headless-run discipline,
      # the independent-tool-call batching disposition, and — where a reviewed commit
      # exists — the CI already observed for it.
      #
      # UNCONDITIONAL. The gate dispatches exactly three commands
      # (scripts/resolve-command-trigger.sh's allowlist: `/prflow:review`,
      # `/prflow:review-and-fix`, `/prflow:pr-description`) and this job runs only
      # when one of them resolved, so composing for every run of this job composes for
      # every command. `/prflow:review-and-fix` in particular drives the review engine
      # inline and fans out the most parallel subagents, so leaving it on the bare
      # prompt left the run with no statement of the discipline that keeps those
      # dispatches collected.
      #
      # WHICH MODE, and why only ONE command gets `review`. The renderer's `review` mode
      # adds the CI-results section, whose operative instruction is "cite these
      # conclusions as the authoritative test evidence for this commit, and do not
      # re-derive them by running builds or tests". That is right for `/prflow:review`,
      # which reviews a fixed head and pushes nothing. It is WRONG for
      # `/prflow:review-and-fix`, which edits and pushes: its own prompt extension makes
      # the in-environment whole-suite pass the run's gate and forbids the loop to cite
      # CI for its own progress (issue #405), and this job raises BASH_MAX_TIMEOUT_MS to
      # 20 minutes precisely so that suite can finish here — so injecting the CI section
      # would contradict the run's own verification contract. It is equally wrong for
      # `/prflow:pr-description`, which reviews no commit at all. Both therefore render
      # in `generic`: the tier-agnostic sections only — the permitted commands, the
      # command shapes, the headless-run discipline and the independent-tool-call
      # batching disposition — with no claim about a reviewed commit and none of the
      # implement tier's Phase 3 scope clause.
      #
      # `generic` is the ELSE operand, so the selection fails SAFE: a command the
      # resolver's allowlist gains later cannot silently inherit a CI section asserting
      # test evidence for a commit it never reviewed.
      #
      # NOTE for anyone sweeping `startsWith(needs.gate.outputs.command, '/prflow:review ')`
      # in this file: the OTHER occurrences select the run's github_token (read-only
      # reviewer vs. write-capable App) and are a security boundary. This one selects
      # prompt CONTENT for a block every command now receives; the two are not the same
      # edit, and changing them together is how the reviewer token reaches a command
      # that pushes.
      - name: Compose engine grounding block
        id: reviewcompose
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
          ALLOWED_TOOLS: ${{ steps.tools.outputs.tools }}
          CMD: ${{ needs.gate.outputs.command }}
          MODE: ${{ startsWith(needs.gate.outputs.command, '/prflow:review ') && 'review' || 'generic' }}
        run: |
          set -euo pipefail
          # The CI section exists only in `review` mode, so resolve its inputs only
          # there: on a `generic` run the two gh queries below would burn API calls for
          # a section that is never rendered, and their breadcrumbs would name a "CI
          # section" the prompt does not carry.
          CI_SUMMARY=""
          if [ "$MODE" = review ]; then
            # `github.sha`/`GITHUB_REF` reflect the TRIGGERING EVENT, not the checkout:
            # on the sole `issue_comment` trigger `github.sha` is the default branch's
            # head commit at trigger time, and pinning the checkout `ref:` (issue #1163)
            # does not change it. Either way it is NOT the reviewed PR's head, so resolve
            # the head SHA from the PR the command names rather than from `github.sha`.
            PR_NUM=$(printf '%s' "$CMD" | grep -oE '[0-9]+' | head -1 || true)
            HEAD_SHA=""
            if [ -n "$PR_NUM" ]; then
              HEAD_SHA=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefOid -q .headRefOid 2>/dev/null || true)
            fi
            export HEAD_SHA
            SCC=.prflow/vendor/prflow/scripts/summarize-ci-checks.sh
            [ -f "$SCC" ] || SCC=scripts/summarize-ci-checks.sh
            # Each no-op branch names the condition that fired. Two different causes
            # converging on one breadcrumb would leave a reader unable to tell a missing
            # helper from an unresolved head — both render the same `CI status
            # unavailable`, which is the point: an unknown CI state must never render
            # as a passing one.
            if [ ! -f "$SCC" ]; then
              echo "::warning::devflow: summarize-ci-checks.sh not found at either the vendored or repo path — the review prompt's CI section will report it unavailable" >&2
              CI_SUMMARY="CI status unavailable"
            elif [ -z "$HEAD_SHA" ]; then
              echo "::warning::devflow: could not resolve a head SHA for PR '${PR_NUM:-<none parsed from the command>}' (gh pr view failed, or the command carried no PR number) — the review prompt's CI section will report it unavailable" >&2
              CI_SUMMARY="CI status unavailable"
            else
              CI_SUMMARY=$(bash "$SCC") || CI_SUMMARY="CI status unavailable"
            fi
            [ -n "$CI_SUMMARY" ] || CI_SUMMARY="CI status unavailable"
          fi

          RGB=.prflow/vendor/prflow/scripts/render-grounding-block.sh
          [ -f "$RGB" ] || RGB=scripts/render-grounding-block.sh
          if [ ! -f "$RGB" ]; then
            echo "::error::devflow: render-grounding-block.sh not found at either the vendored or repo path — this run's prompt would carry no engine-ground-truth block, its only statement of the headless-run discipline and of the commands it may execute. Repair the vendored .prflow/vendor/prflow tree, or check the vendor-plugin fetch (prflow_version). Refusing to run." >&2
            exit 1
          fi
          # MODE is forwarded EXPLICITLY even though the step env already carries it, so
          # the tier the block renders for is readable at the call site — the same
          # cross-file contract scripts/compose-implement-prompt.sh states with
          # `MODE=implement`. It sits after ALLOWED_TOOLS because devflow-runner.yml
          # forwards HARDENED_PATHS at that same position, keeping the two files'
          # shared prefix byte-identical.
          GROUNDING=$(CI_SUMMARY="$CI_SUMMARY" ALLOWED_TOOLS="$ALLOWED_TOOLS" MODE="$MODE" bash "$RGB") || GROUNDING=""
          # Verify the OUTCOME, not the file's existence (see devflow-runner.yml). A
          # present-but-truncated renderer that exits 0 printing nothing FAILS the job
          # rather than degrading to the bare command prompt: the block is the single
          # home of the headless-run discipline, so a block-less run is not a
          # degraded run but an ungrounded one.
          if [ -z "$GROUNDING" ]; then
            echo "::error::devflow: render-grounding-block.sh produced no output — this run's prompt would carry no engine-ground-truth block, its only statement of the headless-run discipline and of the commands it may execute. The renderer resolved at '$RGB' but printed nothing or exited non-zero: repair that copy, or check the vendor-plugin fetch (prflow_version). Refusing to run." >&2
            exit 1
          fi
          PROMPT="${GROUNDING}

          ${CMD}"
          delim="PROMPT_EOF_$(date +%s%N)_$$"
          { printf 'prompt<<%s\n' "$delim"; printf '%s\n' "$PROMPT"; printf '%s\n' "$delim"; } >> "$GITHUB_OUTPUT"

      # ── Long-run credential refresh (issue #487) ──────────────────────────
      # Keep this /devflow:implement- or /devflow:review-and-fix-driven command
      # run push- and gh-capable past the App installation token's 60-minute
      # lifetime. Gated on the SAME condition as this job's app-token mint —
      # vars.DEVFLOW_APP_ID != '' AND not a /devflow:review command (the
      # read-only review path uses the downscoped reviewer token and never
      # pushes). DELIBERATELY a DETACHED process, not a `background:` step:
      # actionlint rejects the unrecognized `background:` step key, so the refresher
      # is spawned with `nohup … &` and survives into the claude step. Key piped to
      # stdin (never argv, never disk); the detached refresher is launched with
      # `env -u` (dropping the key var) so its exec-time environment — hence
      # /proc/<pid>/environ, readable by the concurrent same-uid claude step —
      # never holds the PEM (the step-level env var exists only so this short-lived
      # launcher shell can pipe it; an in-process `unset` alone would NOT scrub the
      # long-lived refresher's /proc environ, which snapshots exec time — proc(5)).
      # The loop traps TERM/exits 0; the `if: always()` pidfile-kill step retires it.
      # Kept in sync with devflow-implement.yml. See docs/internal/cloud-setup.md.
      - name: Start credential refresher (optional)
        id: refresher
        if: ${{ vars.DEVFLOW_APP_ID != '' && !startsWith(needs.gate.outputs.command, '/prflow:review ') }}
        env:
          DEVFLOW_APP_ID: ${{ vars.DEVFLOW_APP_ID }}
          DEVFLOW_APP_PRIVATE_KEY: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # No scripts/… self-repo fallback here (unlike the always() Stop step): this
          # step runs right after `vendor-plugin` on the same sequential job, so the
          # vendored path is always present — a fallback would be dead code. Do NOT add
          # one in a wrong-direction "reconcile" with the Stop step.
          # Job-scoped state (issue #1882): so a later job on this runner never reads or
          # retires another job's token file/pidfile/log, and the loop retires itself
          # once its job is no longer the runner's current one (the pointer below).
          HANDLE="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}"
          PTR="$RUNNER_TEMP/devflow-refresh.current-job"
          PID="$RUNNER_TEMP/devflow-refresh-$HANDLE.pid"
          TOK="$RUNNER_TEMP/devflow-gh-token-$HANDLE"
          LOG="$RUNNER_TEMP/devflow-refresh-$HANDLE.log"
          STMARK="$RUNNER_TEMP/devflow-refresh-$HANDLE.selftest-failed"
          printf '%s' "$HANDLE" > "$PTR"
          rm -f "$STMARK" 2>/dev/null || true
          # Publish the job-scoped paths to later steps: gh-fresh reads the token file, the teardown
          # reads the pidfile/log/job pointer. The self-test marker path is NOT published job-wide
          # (issue #1925) — the Stop step derives it from the same HANDLE, mirroring the DEVFLOW_GH decision.
          {
            echo "DEVFLOW_GH_TOKEN_FILE=$TOK"
            echo "DEVFLOW_REFRESH_PIDFILE=$PID"
            echo "DEVFLOW_REFRESH_LOG=$LOG"
            echo "DEVFLOW_REFRESH_JOB_POINTER=$PTR"
          } >> "$GITHUB_ENV"
          # Pre-launch self-test (issue #1882): sign a throwaway input with the real key
          # BEFORE the agent launches, so a host that cannot sign is loud immediately
          # rather than after the token's hour. A signer that refuses the key, or an
          # unresolved/too-old interpreter, FAILS THE JOB here (set -e on the non-zero
          # exit); an absent signer helper (older vendored slice) is warn-and-continue.
          # Told apart by the helper's presence and exit status, never by its output.
          SELFTEST=.prflow/vendor/prflow/scripts/refresher-selftest.sh
          if [ -f "$SELFTEST" ]; then
            printf '%s' "$DEVFLOW_APP_PRIVATE_KEY" \
              | DEVFLOW_REFRESH_SELFTEST_FAILED="$STMARK" bash "$SELFTEST"
          else
            echo "::warning::credential refresher self-test skipped: no signer helper in this vendored plugin slice (older pin) — launching without a pre-flight signer check"
          fi
          # Detached loop. env -u drops the PEM from the long-lived process's environ;
          # the job-scoped paths + pointer are passed DIRECTLY (GITHUB_ENV reaches only
          # LATER steps, not this backgrounded subprocess). Key on stdin, never argv/disk.
          printf '%s' "$DEVFLOW_APP_PRIVATE_KEY" \
            | env -u DEVFLOW_APP_PRIVATE_KEY \
                DEVFLOW_REFRESH_JOB_ID="$HANDLE" DEVFLOW_REFRESH_JOB_POINTER="$PTR" \
                DEVFLOW_REFRESH_PIDFILE="$PID" DEVFLOW_REFRESH_TOKEN_FILE="$TOK" \
                nohup bash .prflow/vendor/prflow/scripts/refresh-app-credentials.sh loop \
                >"$LOG" 2>&1 &
          disown || true
          echo "credential refresher started (detached); log: $LOG"

      # Body delegated to the checked-in seven-output-validated installer (issue
      # #533) — see devflow-implement.yml's install-step comment for the full
      # rationale (PATH-scoped wrapper selection; no process-global DEVFLOW_GH;
      # vendored at the pinned prflow_version — a stale pin fails this step
      # loudly before the agent; refresh workflows and the pin together).
      - name: Install fresh-gh wrapper (optional)
        if: ${{ vars.DEVFLOW_APP_ID != '' && !startsWith(needs.gate.outputs.command, '/prflow:review ') }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          bash .prflow/vendor/prflow/scripts/install-gh-wrapper.sh
      # ── Third-party model provider resolution (issue #313) ─────────────────
      # Resolve this section's (devflow) provider decision from .prflow/config.json
      # via the single-sourced inline jq RESOLVER below. The RESOLVER program is
      # byte-identical across devflow.yml, devflow-implement.yml, and
      # devflow-runner.yml (lib/test/run.sh pins that identity); only the
      # `--arg section` value differs. An empty decision (no provider) reproduces
      # today's Anthropic-OAuth wiring for a given `claude_model` (one deliberate
      # change: an empty resolved model now fails loud instead of rendering
      # `--model null`). See docs/internal/cloud-setup.md.
      - name: Resolve model provider
        id: provider
        env:
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
          SECTION: prflow
        run: |
          set -euo pipefail
          # devflow-provider-resolver BEGIN (single-sourced; keep byte-identical across the three cloud workflows — lib/test/run.sh pins it)
          RESOLVER='
          (if (. | type) == "object" then . else {} end) as $cfg
          | (if (($cfg[$section]) | type) == "object" then $cfg[$section] else {} end) as $sec
          | ($sec.provider) as $praw
          | (if (($sec.claude_model) | type) == "string" and ($sec.claude_model != "") then $sec.claude_model else ($cfg.claude_model // "") end) as $model
          | if ($praw == null or $praw == "") then
              {provider:"", base_url:"", auth:"", timeout_ms:"", effort_supported:true, model:$model, env:{}}
            elif (($praw) | type) != "string" then
              {error:"invalid_provider", section:$section, provider:"", detail:"section provider must be a string"}
            else
              (if (($cfg.providers) | type) == "object" then $cfg.providers else {} end) as $provs
              | if (($provs[$praw]) | type) != "object" then
                  {error:"undefined_provider", section:$section, provider:$praw, detail:"provider is not defined in the providers map"}
                elif (($provs[$praw].auth) as $a | ($a != "bearer" and $a != "api_key" and $a != "bedrock_api_key")) then
                  {error:"incomplete_provider", section:$section, provider:$praw, detail:"provider auth must be one of bearer, api_key, bedrock_api_key"}
                elif (($provs[$praw].auth) as $a | (($a == "bearer" or $a == "api_key") and ((($provs[$praw].base_url) | type) != "string" or ($provs[$praw].base_url == "")))) then
                  {error:"incomplete_provider", section:$section, provider:$praw, detail:"provider entry has no base_url"}
                else
                  ($provs[$praw]) as $p
                  | {provider:$praw, base_url:(if (($p.base_url) | type) == "string" then $p.base_url else "" end), auth:$p.auth, timeout_ms:($p.timeout_ms // ""), effort_supported:(($p.effort_supported // false) == true), model:$model, env:(if (($p.env) | type) == "object" then $p.env else {} end)}
                end
            end
          '
          # devflow-provider-resolver END
          DECISION=$(printf '%s' "$CONFIG_JSON" | jq -c --arg section "$SECTION" "$RESOLVER")
          # jq on EMPTY stdin emits nothing with rc 0, so an empty CONFIG_JSON would
          # otherwise sail through as a zero-output "decision" and silently select the
          # default path (or a misdirected empty-model error downstream). Both producers
          # provably never emit empty today, so this is a fail-loud tripwire, not a live path.
          if [ -z "$DECISION" ]; then
            echo "::error::provider resolver produced no decision for section '$SECTION' (empty config input?). Refusing to run."
            exit 1
          fi
          if [ "$(printf '%s' "$DECISION" | jq -r '.error // ""')" != "" ]; then
            PNAME=$(printf '%s' "$DECISION" | jq -r '.provider // ""')
            DETAIL=$(printf '%s' "$DECISION" | jq -r '.detail // "provider configuration is invalid"')
            echo "::error::.prflow/config.json section '$SECTION' provider '$PNAME': $DETAIL. Fix the providers.$PNAME entry or remove the section provider key. Refusing to run."
            exit 1
          fi
          # One jq pass emits every scalar decision field to the step output, each as a
          # newline-safe heredoc block: a config-sourced value carrying an embedded newline
          # would otherwise split a plain KEY=VALUE line and forge further step outputs. The
          # timestamped+PID delimiter mirrors the decision<< output below.
          sdelim="OUT_EOF_$(date +%s%N)_$$"
          printf '%s' "$DECISION" | jq -r --arg d "$sdelim" '
            ["provider","model","auth","base_url","timeout_ms","effort_supported"][] as $k
            | "\($k)<<\($d)", "\(.[$k])", $d' >> "$GITHUB_OUTPUT"
          # Forward the full decision (it carries the provider env map) to the
          # inject step via a heredoc output so embedded values survive verbatim.
          delim="DEC_EOF_$(date +%s%N)_$$"
          {
            printf 'decision<<%s\n' "$delim"
            printf '%s\n' "$DECISION"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # Inject the provider endpoint into the JOB env — ONLY when a provider is
      # active. A `run:` step writing $GITHUB_ENV (never a static step `env:`
      # block of always-present expressions) is the only mechanism that can carry
      # config-driven dynamic keys, and gating on `provider != ''` keeps the
      # default path free of even empty-valued ANTHROPIC_* vars (AC 1/4). This
      # step also carries the fail-loud empty-secret guard (AC 6), before the
      # action step runs.
      - name: Inject provider endpoint (provider-routed sections only)
        if: ${{ steps.provider.outputs.provider != '' }}
        env:
          DECISION: ${{ steps.provider.outputs.decision }}
          AUTH: ${{ steps.provider.outputs.auth }}
          BASE_URL: ${{ steps.provider.outputs.base_url }}
          TIMEOUT_MS: ${{ steps.provider.outputs.timeout_ms }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          PROVIDER_API_KEY: ${{ secrets.DEVFLOW_PROVIDER_API_KEY }}
          SECTION: prflow
        run: |
          set -euo pipefail
          if [ -z "$PROVIDER_API_KEY" ]; then
            echo "::error::.prflow/config.json section '$SECTION' selects provider '$PROVIDER' but the DEVFLOW_PROVIDER_API_KEY repository secret is empty. Set that secret (the provider API key) before running a provider-routed job. Refusing to run."
            exit 1
          fi
          # SECURITY: the env-map KEY is interpolated RAW into the `KEY<<DELIM` heredoc
          # header — the newline-safe heredoc protects VALUES, not keys, so a key
          # carrying a newline or `<<` could forge a further job env var name or break
          # the heredoc terminator (leaving an opaque "matching delimiter not found"
          # abort). Keys come from maintainer-controlled config, but validate them
          # POSITIVELY against a real env-var-name charset and fail loud on any stray
          # key rather than emit a malformed/forged $GITHUB_ENV block.
          if printf '%s' "$DECISION" | jq -e '.env | keys[] | select(test("^[A-Za-z_][A-Za-z0-9_]*$") | not)' >/dev/null 2>&1; then
            echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' has an env-map key that is not a valid environment variable name ([A-Za-z_][A-Za-z0-9_]*). Fix the providers.$PROVIDER.env keys. Refusing to run."
            exit 1
          fi
          # SECURITY (issue #1773): the shape guard above accepts any valid env-var NAME — do not
          # drop this guard, and keep the assignment bare: a local/declare prefix or an if/&&/||
          # context makes set -e swallow a jq failure, and a denied key is then exported job-wide.
          denied_env_keys="$(printf '%s' "$DECISION" | jq -r '[.env // {} | keys[] | select(ascii_upcase | IN("PATH","GITHUB_TOKEN","GH_TOKEN","GITHUB_ENV","GITHUB_OUTPUT","GITHUB_PATH","ANTHROPIC_API_KEY","ANTHROPIC_AUTH_TOKEN","CLAUDE_CODE_OAUTH_TOKEN","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","AWS_SESSION_TOKEN","AWS_BEARER_TOKEN_BEDROCK","BASH_ENV","ENV","LD_PRELOAD","LD_LIBRARY_PATH","DYLD_INSERT_LIBRARIES","NODE_OPTIONS","PYTHONPATH","CLAUDE_CODE_SUBAGENT_MODEL"))] | join(" ")')"
          if [ -n "$denied_env_keys" ]; then
            echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' env map contains forbidden key(s): $denied_env_keys — a credential name, a variable that would shadow the job environment or its Actions plumbing, an interpreter/loader hook that can make every later step load code you did not intend, or the subagent-model override that flattens the review roster. Set credentials via the DEVFLOW_PROVIDER_API_KEY repository secret, and remove these keys from providers.$PROVIDER.env. Refusing to run."
            exit 1
          fi
          # Keep the assignment bare, exactly as denied_env_keys above (issue #1911): a local/declare
          # or an if/&&/|| context lets set -e swallow a jq failure and the warning silently never fires.
          warned_env_keys="$(printf '%s' "$DECISION" | jq -r '[.env // {} | keys[] | select(ascii_upcase | IN("ANTHROPIC_BASE_URL","API_TIMEOUT_MS","HOME","RUNNER_TEMP"))] | join(" ")')"
          if [ -n "$warned_env_keys" ]; then
            echo "::warning::.prflow/config.json section '$SECTION' provider '$PROVIDER' env map sets key(s): $warned_env_keys — the env map is written last, so its value overrides the dedicated provider field (base_url/timeout_ms) or the job's own HOME/RUNNER_TEMP for every later step. The env map's value takes effect; remove these keys from providers.$PROVIDER.env if that override was not intended."
          fi
          # Every $GITHUB_ENV write below uses GitHub's newline-safe multiline (heredoc) form —
          # the scalar endpoint values via genv(), the provider env map via the inline jq heredoc
          # emit at the end — so a config-sourced value carrying an embedded newline cannot split
          # a plain KEY=VALUE line and inject/forge a further job env var. Mirrors the resolver's
          # decision<< output; the timestamped+PID delimiter makes value collision negligible.
          genv() { local d; d="ENV_EOF_$(date +%s%N)_$$"; { printf '%s<<%s\n' "$1" "$d"; printf '%s\n' "$2"; printf '%s\n' "$d"; } >> "$GITHUB_ENV"; }
          # base_url is guaranteed non-empty by the resolver for bearer/api_key; the
          # bedrock_api_key arm needs none and reaches Bedrock via AWS_REGION instead.
          if [ "$AUTH" = "bedrock_api_key" ]; then
            # AWS region is required and travels in the env map (passthrough below); fail
            # loud when absent/empty so the run does not authenticate then die on every
            # model call. A non-string region reads as absent (strings|select) — fail closed.
            if ! printf '%s' "$DECISION" | jq -e '.env.AWS_REGION | strings | select(. != "")' >/dev/null 2>&1; then
              echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' uses bedrock_api_key auth but its env map sets no AWS_REGION. Add AWS_REGION to providers.$PROVIDER.env (the Bedrock client requires a region). Refusing to run."
              exit 1
            fi
            # base_url is unused here; warn (never fail) if one was set, and export NO
            # ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN on this arm.
            if [ -n "$BASE_URL" ]; then
              echo "::warning::.prflow/config.json section '$SECTION' provider '$PROVIDER' uses bedrock_api_key auth; its base_url is ignored (Bedrock is reached via AWS_REGION, not base_url). Remove base_url from providers.$PROVIDER."
            fi
            genv AWS_BEARER_TOKEN_BEDROCK "$PROVIDER_API_KEY"
          else
            genv ANTHROPIC_BASE_URL "$BASE_URL"
            # Bearer-token gateways read Authorization from ANTHROPIC_AUTH_TOKEN; the
            # same key also rides as the anthropic_api_key action input below (the
            # documented two-slot recipe). auth: api_key passes it via the input only.
            if [ "$AUTH" = "bearer" ]; then genv ANTHROPIC_AUTH_TOKEN "$PROVIDER_API_KEY"; fi
          fi
          # API_TIMEOUT_MS applies to either arm, so write it once after the branch.
          if [ -n "$TIMEOUT_MS" ]; then genv API_TIMEOUT_MS "$TIMEOUT_MS"; fi
          # Do not describe these as filtered: a denied key aborts the whole run above, so nothing
          # is ever dropped and exported alongside. Only the API key above is a masked secret.
          edelim="ENV_EOF_$(date +%s%N)_$$"
          printf '%s' "$DECISION" | jq -r --arg d "$edelim" '.env | to_entries[] | "\(.key)<<\($d)", "\(.value)", $d' >> "$GITHUB_ENV"

      # Export the routed provider's effort capability to the JOB env for the
      # in-session resolve-review-overrides.py. Keep it ungated: a `provider != ''`
      # gate leaves the default path relying on the resolver's fail-open (#1772).
      - name: Export provider effort capability to job env
        env:
          EFFORT_SUPPORTED: ${{ steps.provider.outputs.effort_supported }}
        run: |
          set -euo pipefail
          printf 'PRFLOW_EFFORT_SUPPORTED=%s\n' "$EFFORT_SUPPORTED" >> "$GITHUB_ENV"

      # Compute the claude_args head so --model is always present and --effort is
      # dropped only for a provider whose effort_supported is false (AC 7). The
      # Anthropic default path resolves effort_supported=true, so effort is
      # preserved there (for a non-empty effort value — the run body's
      # flag-injection guard enum-validates effort and allowlist-validates the
      # model id, rejecting flag-shaped or out-of-charset values).
      - name: Build claude_args head (model + conditional effort)
        id: cargs
        env:
          MODEL: ${{ steps.provider.outputs.model }}
          EFFORT: ${{ needs.config.outputs.effort }}
          EFFORT_SUPPORTED: ${{ steps.provider.outputs.effort_supported }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL" ]; then
            echo "::error::claude_model is missing from .prflow/config.json (set a top-level claude_model, or a per-section claude_model). Refusing to run."
            exit 1
          fi
          # SECURITY: MODEL and EFFORT are spliced UNQUOTED into claude_args (a folded
          # CLI string), and the runner can read either from PR-head config (EFFORT
          # always via steps.extract when the caller passes no effort input; MODEL in
          # the bootstrap fallback) — so refuse any value that could smuggle an extra
          # CLI flag. A blacklist is NOT enough here: the action tokenises claude_args
          # shell-style, so a flag-shaped single token (`--model --evil`) records
          # --model as valueless and passes --evil through as its own flag, and a
          # bytewise [[:space:]] check misses Unicode whitespace (NBSP/U+2028/U+3000)
          # under a non-UTF-8 runner locale while the JS tokeniser still splits on it.
          # So MODEL is validated POSITIVELY: reject a leading dash, then reject any
          # character outside the conservative model-id allowlist
          # A-Za-z0-9 . _ / : @ [ ] -  (covers claude-*, provider/model,
          # bracket-suffix context-window ids like name-1.2[1m], and Bedrock-style
          # colon ids) — a
          # multibyte character is rejected in every locale because none of its bytes
          # (C locale) nor its codepoint (UTF-8 locale) is in the allowlist. EFFORT is
          # pinned to its schema enum (or empty, which drops the flag below). In the
          # negated bracket expression, `]` sits first after `!` and `-` last, making
          # both literal members of the set.
          case "$MODEL" in
            -*)
              echo "::error::claude_model value is flag-shaped (leading dash) — refusing to compose claude_args (flag-injection guard; the model must be a single non-dash-leading token)."
              exit 1 ;;
            *[!]A-Za-z0-9._/:@[-]*)
              echo "::error::claude_model value contains a character outside the model-id allowlist (A-Za-z0-9 . _ / : @ [ ] -) — refusing to compose claude_args (flag-injection guard)."
              exit 1 ;;
          esac
          case "$EFFORT" in
            '' | low | medium | high | xhigh | max) : ;;
            *)
              echo "::error::effort value is not one of low/medium/high/xhigh/max — refusing to compose claude_args (flag-injection guard)."
              exit 1 ;;
          esac
          ARGS="--model $MODEL"
          # --effort only when the provider supports it AND a value actually resolved. The
          # config effort defaults to "high", so the default path always has one; the -n
          # co-guard just avoids ever handing the CLI a valueless --effort on a pathological
          # empty effort.
          if [ "$EFFORT_SUPPORTED" = "true" ] && [ -n "$EFFORT" ]; then
            ARGS="$ARGS --effort $EFFORT"
          fi
          # Newline-safe heredoc output (mirrors the resolver's decision<< / scalar-output form).
          adelim="OUT_EOF_$(date +%s%N)_$$"
          { printf 'args<<%s\n' "$adelim"; printf '%s\n' "$ARGS"; printf '%s\n' "$adelim"; } >> "$GITHUB_OUTPUT"

      # Compose the plugins/plugin_marketplaces inputs (issue #505): the baked
      # baseline (byte-identical across the three call sites — run.sh pins it)
      # PLUS the entries this repo's trusted default-branch .claude/settings.json
      # declares (enabledPlugins=true; github-kind extraKnownMarketplaces), so a
      # consumer repo's cloud plugin surface matches what its local team sees —
      # "commit the settings file once, every tier honors it." This write tier's
      # checkout IS the default branch (issue_comment checks out the default), so
      # .claude/settings.json is maintainer-committed, trusted. The single-line
      # `printf '%s\n' <args>` baseline form avoids the YAML-indent-corrupts-
      # multiline-literals gotcha and is grep-pinnable for the sync invariant.
      - name: Compose plugin inputs (baseline + settings-declared)
        id: plugins
        run: |
          set -euo pipefail
          BAKED_PLUGINS="$(printf '%s\n' code-review@claude-plugins-official claude-md-management@claude-plugins-official prflow@devflow-marketplace)"
          BAKED_MARKETPLACES="$(printf '%s\n' https://github.com/anthropics/claude-plugins-official.git ./)"
          SETTINGS=.claude/settings.json
          HELPER=.prflow/vendor/prflow/scripts/resolve-extra-plugins.sh
          COMPOSE=.prflow/vendor/prflow/scripts/describe-plugin-compose.sh
          EX_P="$(mktemp)"; EX_M="$(mktemp)"; ERR_P="$(mktemp)"; ERR_M="$(mktemp)"; ENTRIES="$(mktemp)"
          trap 'rm -f "$EX_P" "$EX_M" "$ERR_P" "$ERR_M" "$ENTRIES"' EXIT
          if [ ! -f "$HELPER" ]; then
            # Skew arm (issue #455 two-halves; inline + grep-pinned by run.sh): the
            # helper is absent at the vendored path — a consumer whose pinned
            # prflow_version predates issue #505 running an upgraded workflow.
            # Proceed with the baked baseline; one ::warning:: names prflow_version
            # as the remedy. This arm fires precisely when describe-plugin-compose.sh
            # (absent alongside it) cannot be invoked, so the warning stays inline
            # rather than routed through the helper.
            echo "::warning::devflow resolve-extra-plugins.sh not found at $HELPER — a pinned prflow_version predating issue #505 running an upgraded workflow; proceeding with the baked plugin baseline. Bump prflow_version in .prflow/config.json to compose settings-declared plugins."
            : > "$EX_P"; : > "$EX_M"; : > "$ERR_P"; : > "$ERR_M"
          else
            bash "$HELPER" plugins "$SETTINGS" > "$EX_P" 2>"$ERR_P" || true
            bash "$HELPER" marketplaces "$SETTINGS" > "$EX_M" 2>"$ERR_M" || true
          fi
          # Join breadcrumbs into one defect string (bash builtins; guard-class 2 —
          # the joined value that decides the degraded-arm message is not derived
          # through cat/tr/sed, non-preflight PATH tools).
          DEFECT=""
          for f in "$ERR_P" "$ERR_M"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              if [ -z "$DEFECT" ]; then DEFECT="$line"; else DEFECT="$DEFECT; $line"; fi
            done < "$f"
          done
          # Spliced entries (extras beyond baseline) for the splice ::notice::.
          : > "$ENTRIES"
          for f in "$EX_P" "$EX_M"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              printf '%s\n' "$line" >> "$ENTRIES"
            done < "$f"
          done
          # Dedupe baseline + extras, keeping the first occurrence (bash builtins;
          # guard-class 2 — no tr/sed/wc/cut/head for the emitted list). The `|`
          # separator never occurs in a plugin@marketplace entry or a marketplace URL.
          dedupe() {
            local baseline="$1" extras="$2" seen="" line out=""
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$seen" in *"|$line|"*) ;; *) seen="$seen|$line|"; out="${out:+$out$'\n'}$line" ;; esac
            done <<< "$baseline"
            if [ -f "$extras" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [ -z "$line" ] && continue
                case "$seen" in *"|$line|"*) ;; *) seen="$seen|$line|"; out="${out:+$out$'\n'}$line" ;; esac
              done < "$extras"
            fi
            printf '%s\n' "$out"
          }
          COMBINED_PLUGINS="$(dedupe "$BAKED_PLUGINS" "$EX_P")"
          COMBINED_MK="$(dedupe "$BAKED_MARKETPLACES" "$EX_M")"
          pdelim="PLG_EOF_$(date +%s%N)_$$"
          { printf 'plugins<<%s\n' "$pdelim"; printf '%s\n' "$COMBINED_PLUGINS"; printf '%s\n' "$pdelim"; } >> "$GITHUB_OUTPUT"
          mdelim="MKT_EOF_$(date +%s%N)_$$"
          { printf 'plugin_marketplaces<<%s\n' "$mdelim"; printf '%s\n' "$COMBINED_MK"; printf '%s\n' "$mdelim"; } >> "$GITHUB_OUTPUT"
          # Annotation — arm classification lives in describe-plugin-compose.sh (the
          # describe-denial-count.sh extraction convention; run.sh drives every arm).
          # Inline fallback for the partial-vendor skew (HELPER present, COMPOSE
          # absent): the helper ran and may have set DEFECT (a degraded settings
          # entry) AND/OR emitted valid extras into ENTRIES (which were already
          # spliced into the credentialed runner's plugin surface unconditionally
          # above). DEFECT and a splice can COEXIST (PR #513) — a degraded entry
          # must NOT suppress the splice ::notice:: for the valid extras. Without
          # COMPOSE to render the annotation, mirror the helper's arms inline and
          # emit each independently, so a spliced entry is never added without an
          # audit line (docs/internal/cloud-setup.md: every spliced entry logged, never silent).
          if [ -f "$COMPOSE" ]; then
            # Capture the renderer's status rather than `|| true`-swallowing it: the
            # extras were already spliced above, so a non-zero renderer must still
            # leave an audit line (PR #513 "never silent"). The run is never
            # broken — the failure is caught, not propagated.
            if ! bash "$COMPOSE" ok "$ENTRIES" "$DEFECT"; then
              echo "::warning::describe-plugin-compose.sh failed (rc≠0); extras (if any) were composed but the audit annotation could not be rendered."
            fi
          else
            # Join the spliced entries via a bash-builtin loop (guard-class 2 — no
            # cat/tr/sed for the emitted list), mirroring describe-plugin-compose.sh's
            # splice ::notice::.
            _splice=""
            if [ -s "$ENTRIES" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [ -z "$line" ] && continue
                if [ -z "$_splice" ]; then _splice="$line"; else _splice="$_splice, $line"; fi
              done < "$ENTRIES"
            fi
            if [ -n "$DEFECT" ] && [ -n "$_splice" ]; then
              echo "::warning::.claude/settings.json has degraded entries ($DEFECT); those are skipped, the valid extras below are composed."
              echo "::notice::Composed plugin/marketplace entries beyond the baked baseline (describe-plugin-compose.sh unavailable): $_splice"
            elif [ -n "$DEFECT" ]; then
              echo "::warning::.claude/settings.json is degraded ($DEFECT); proceeding with the baked plugin baseline."
            elif [ -n "$_splice" ]; then
              echo "::notice::Composed plugin/marketplace entries beyond the baked baseline (describe-plugin-compose.sh unavailable): $_splice"
            fi
          fi

      # Resolve the two DEFAULT-OFF git-env pin flags and export the enabled ones
      # (issue #645). Both keys default to false, so on a stock consumer this step
      # emits NOTHING and neither GIT_DIR nor GIT_WORK_TREE is present in the
      # action's environment — the pre-#643 behavior, which is the configuration
      # that works everywhere. #643 set both unconditionally so configureGitAuth
      # would resolve the repo on a self-hosted Windows runner (issue #602), but
      # GIT_WORK_TREE also reaches the Claude Code CLI subprocess that installs
      # plugins, where it makes `git clone` refuse an existing working tree — so
      # every run died at plugin install with `fatal: working tree '<path>'
      # already exists.`, before the agent did any work, producing no verdict at
      # all. The helper is now the SINGLE producer of both variables; the action
      # step below deliberately carries neither in its own `env:` block.
      #
      # JOB-SCOPED, not step-scoped: `$GITHUB_ENV` appends assignments and offers
      # no removal verb, and the empty-value form that would approximate one is
      # measured fatal (`GIT_DIR=` → `fatal: not a git repository: ''`), which is
      # precisely why the mechanism is an append rather than an `env:` expression
      # (GitHub's workflow syntax accepts no expression evaluating to a whole
      # `env:` mapping, so a variable's KEY cannot be made conditionally absent
      # there). So an enabled variable is in force for `Run Claude Code` AND every
      # step after it, including the agent's own git operations.
      #
      # Fails OPEN to the working default. An absent helper emits nothing and
      # exits 0 rather than failing the job: this workflow reaches consumers via
      # install.sh's file-copy while the helper reaches them via the
      # prflow_version vendor fetch, so a consumer can carry this step before it
      # carries the helper, and that skew must not reproduce the outage above.
      - name: Resolve git-env pins
        env:
          # The trigger-time `config` job's default-branch checkout — a trusted
          # tree, never the PR head. That is what makes these keys post-merge-only.
          GITENV_CFGJSON: ${{ needs.config.outputs.config_json }}
          GITENV_WS: ${{ github.workspace }}
        run: |
          set -uo pipefail
          HELPER='.prflow/vendor/prflow/scripts/emit-git-env.sh'
          if [ ! -f "$HELPER" ]; then
            echo "::notice::devflow git-env pins: bundled helper '$HELPER' is absent (this workflow ships via install.sh's file-copy, the helper via the prflow_version vendor fetch, so a consumer can carry the step first). Failing open to the working default: neither GIT_DIR nor GIT_WORK_TREE is exported."
            exit 0
          fi
          CFG="${RUNNER_TEMP}/devflow-gitenv-config.json"
          if ! printf '%s' "$GITENV_CFGJSON" > "$CFG" 2>/dev/null; then
            echo "::warning::devflow git-env pins: could not materialize the trigger-time config into RUNNER_TEMP; failing open to the working default (neither variable exported)."
            exit 0
          fi
          bash "$HELPER" --workspace "$GITENV_WS" --config-file "$CFG" --tier command >> "$GITHUB_ENV"

      # Resolve the DEFAULT-OFF prflow.attribute_commits_to_triggerer flag and,
      # when enabled, export the four GIT_AUTHOR_*/GIT_COMMITTER_* variables so the
      # agent's commits are authored by the human who triggered the run (issue #682).
      # Off by default, so on a stock consumer this step emits NOTHING and commits are
      # authored exactly as before. Read at TRIGGER time from the trusted `config`
      # job's default-branch checkout (never the PR head), which makes the flag
      # post-merge-only. Unlike the git-env-pins step above, this step DOES make a
      # `gh api users/<login>` call, so it wires GH_TOKEN into its own env: — without
      # it the call runs unauthenticated against the 60/hr anonymous limit and degrades
      # every run to the login-only fallback. Fails OPEN: an absent helper (install.sh
      # ships the workflow, the prflow_version vendor fetch ships the helper, so a
      # consumer can carry this step first) or an unmaterializable config emits nothing
      # and exits 0. Attribution is advisory and NEVER gates the run. This scopes to the
      # writer commands (/devflow:review-and-fix, /devflow:pr-description); a
      # /devflow:review command performs no commits, so the export is simply inert there.
      - name: Resolve committer identity
        env:
          ATTR_CFGJSON: ${{ needs.config.outputs.config_json }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          # The step makes a gh api call, so it must carry a token of its own — the
          # minted App token when DEVFLOW_APP_ID is set, else the built-in github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -uo pipefail
          HELPER='.prflow/vendor/prflow/scripts/resolve-committer-identity.sh'
          if [ ! -f "$HELPER" ]; then
            echo "::notice::devflow commit attribution: bundled helper '$HELPER' is absent (this workflow ships via install.sh's file-copy, the helper via the prflow_version vendor fetch, so a consumer can carry the step first). Falling back to current authorship: no GIT_* identity exported."
            exit 0
          fi
          CFG="${RUNNER_TEMP}/devflow-committer-config.json"
          if ! printf '%s' "$ATTR_CFGJSON" > "$CFG" 2>/dev/null; then
            echo "::warning::devflow commit attribution: could not materialize the trigger-time config into RUNNER_TEMP; falling back to current authorship (no GIT_* identity exported)."
            exit 0
          fi
          # The helper's own contract is always-exit-0 (advisory attribution never
          # gates the run); the `|| echo` makes that guarantee real at the step
          # boundary rather than contract-dependent — a helper that ever exits
          # non-zero degrades to current authorship with a breadcrumb, never a
          # failed writer job over an advisory read.
          bash "$HELPER" --login "$SENDER_LOGIN" --config-file "$CFG" >> "$GITHUB_ENV" \
            || echo "::warning::devflow commit attribution: the identity helper exited non-zero; continuing with current authorship (attribution never gates the run)."

      # Classify prompt-extension arrival (issue #1971). Read the extension root from the
      # trusted base-ref closure (DEVFLOW_PROMPT_EXTENSION_ROOT), never the PR-head checkout —
      # the closure exists so the reviewing agent's prompt is not read from attacker content.
      - name: Classify prompt-extension arrival
        id: extarrival
        env:
          CMD: ${{ needs.gate.outputs.command }}
        run: |
          set -euo pipefail
          # Select the workpad-less skill this command runs, so classify reads the right
          # <skill>.md from the closure. review-and-fix outranks review (substring), same
          # most-specific-first ordering the rest of this file uses.
          case "$CMD" in
            *"/prflow:review-and-fix"*|*"/devflow:review-and-fix"*) SKILL=review-and-fix ;;
            *"/prflow:pr-description"*|*"/devflow:pr-description"*) SKILL=pr-description ;;
            *"/prflow:review"*|*"/devflow:review"*) SKILL=review ;;
            *) SKILL="" ;;
          esac
          if [ -z "$SKILL" ]; then
            # Never reuse detector-absent here: its reconcile arm diagnoses an older
            # prflow_version, so a command added to resolve-command-trigger.sh's allowlist
            # without an arm above would fail closed pointing at the wrong remedy.
            echo "::warning::prompt-extension-arrival: no skill arm above matches command '$CMD' (add one); recording skill-unresolved"
            echo "state=skill-unresolved" >> "$GITHUB_OUTPUT"
            echo "skill=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H=.prflow/vendor/prflow/scripts/prompt-extension-arrival.py
          [ -f "$H" ] || H=scripts/prompt-extension-arrival.py
          if [ ! -f "$H" ]; then
            # Record detector-absent rather than exiting clean: an exit-clean here would
            # silently drop this arrival check on an older vendored prflow_version.
            echo "::warning::prompt-extension-arrival.py absent from both .prflow/vendor/prflow/scripts/ and scripts/ (older prflow_version); recording detector-absent"
            echo "state=detector-absent" >> "$GITHUB_OUTPUT"
            echo "skill=$SKILL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # classify resolves DEVFLOW_PROMPT_EXTENSION_ROOT itself. `|| true` is required:
          # classify exits 3 on a present-but-undeliverable fault and -e would abort before
          # the state is published.
          classify_one() {
            local out state
            out="$(python3 "$H" classify --skill "$1")" || true
            echo "$out" >&2
            state=""
            case "$out" in state=*) state="${out#state=}"; state="${state%% *}" ;; esac
            # classify-unreadable, never detector-absent: the detector file IS present
            # (statted above), so empty/unparsable classify output is a run fault whose
            # remedy is a re-run — not the bump-prflow_version remedy detector-absent names.
            echo "${state:-classify-unreadable}"
          }
          STATE="$(classify_one "$SKILL")"
          # The two review commands deliver a SECOND extension on this tier; a fault on it
          # must not hide behind a deliverable primary, so a faulted second state wins.
          # Promote FAULTS only: promoting a deliverable second state would overwrite a
          # faulted primary with a clean terminal.
          SKILL2=""
          case "$SKILL" in
            review-and-fix) SKILL2=receiving-code-review ;;
            review) SKILL2=requesting-code-review ;;
          esac
          if [ -n "$SKILL2" ]; then
            STATE2="$(classify_one "$SKILL2")"
            case "$STATE2" in
              undeliverable-*|classify-unreadable) STATE="$STATE2"; SKILL="$SKILL2" ;;
            esac
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"
          echo "prompt-extension-arrival: classified state=$STATE (skill=$SKILL)"

      # Pre-engine review-evidence inventory (issue #2075). Snapshot the run-root tree
      # under .prflow/tmp/review/ and the reviewed head's review IDs immediately BEFORE
      # the engine step, so the post-engine gate can attribute the run root and the
      # verdict that appear DURING the engine step by set-difference — no run key from
      # the engine, no clock comparison. Scoped to the review commands the gate evaluates
      # (/prflow:review and /prflow:review-and-fix, and the /devflow: aliases); a
      # /prflow:pr-description run seeds no inventory and the gate no-ops on its absence.
      - name: Snapshot pre-engine review-evidence inventory
        id: pre-evidence
        if: ${{ startsWith(needs.gate.outputs.command, '/prflow:review') || startsWith(needs.gate.outputs.command, '/devflow:review') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMAND: ${{ needs.gate.outputs.command }}
        run: |
          set -uo pipefail
          PR_NUMBER="${COMMAND##* }"
          case "$PR_NUMBER" in ''|*[!0-9]*) PR_NUMBER="$CONTEXT_NUMBER" ;; esac
          mkdir -p .prflow/tmp
          # Run roots present BEFORE the engine step, as <slug>/<run-id> pairs. Never a
          # newest-directory glob (a self-hosted runner can persist the workspace between
          # runs) — the whole set is recorded so the gate attributes by delta.
          ROOTS_JSON='[]'
          if [ -d .prflow/tmp/review ]; then
            ROOTS_JSON="$( (cd .prflow/tmp/review && find . -mindepth 2 -maxdepth 2 -type d) \
              | sed 's#^\./##' | jq -R . | jq -s . )"
          fi
          IDS_JSON='[]'
          if [ -n "${PR_NUMBER:-}" ]; then
            IDS_JSON="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
              --jq '.[].id' 2>/dev/null | jq -R . | jq -s 'map(select(length>0) | tonumber)')" \
              || IDS_JSON='[]'
          fi
          jq -n --argjson r "$ROOTS_JSON" --argjson i "$IDS_JSON" \
            '{run_roots: $r, review_ids: $i}' > .prflow/tmp/pre-inventory.json
          echo "review-evidence pre-inventory: $(cat .prflow/tmp/pre-inventory.json)"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Harness floor for the dispatch barrier (issue #801) — full rationale in
          # devflow-runner.yml's copy of this entry; the runner-agnostic half is the
          # barrier statement in each engine root's headless-wait block.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # Anthropic-default path only: pass the OAuth token when no provider is
          # active. A provider-routed section passes '' here (the action treats
          # empty as absent) and authenticates via anthropic_api_key below.
          claude_code_oauth_token: ${{ steps.provider.outputs.provider == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Provider path only: the fixed DEVFLOW_PROVIDER_API_KEY secret satisfies
          # the action's launch check (and, for bearer auth, is ALSO exported as
          # ANTHROPIC_AUTH_TOKEN by the inject step). Empty on the default path.
          # use_bedrock selects Amazon Bedrock at the action layer; it must travel as this
          # input (not a job-env export) because the action's step-level env overrides the
          # job env, blanking a job-env CLAUDE_CODE_USE_BEDROCK. Empty off the Bedrock arm.
          use_bedrock: ${{ steps.provider.outputs.auth == 'bedrock_api_key' && 'true' || '' }}
          # anthropic_api_key rides on the bearer/api_key arms; the bedrock_api_key arm
          # passes '' here and authenticates via AWS_BEARER_TOKEN_BEDROCK.
          anthropic_api_key: ${{ steps.provider.outputs.provider != '' && steps.provider.outputs.auth != 'bedrock_api_key' && secrets.DEVFLOW_PROVIDER_API_KEY || '' }}
          # Identity by command: `/devflow:review` runs under the downscoped
          # DevFlow-Reviewer token (or GITHUB_TOKEN when the reviewer App is
          # unset) — NEVER the primary app token, so the review is not a
          # self-review of a PR the primary app authored (issue #300). Every
          # other command (`/devflow:pr-description`, `/devflow:review-and-fix`)
          # uses the full-scope primary App token when configured, else
          # GITHUB_TOKEN — identical to pre-change behavior.
          github_token: ${{ startsWith(needs.gate.outputs.command, '/prflow:review ') && (steps.reviewer-token.outputs.token || secrets.GITHUB_TOKEN) || (steps.app-token.outputs.token || secrets.GITHUB_TOKEN) }}
          allowed_bots: ${{ needs.config.outputs.allowed_bots }}

          # AGENT mode: the gate resolved which /devflow:* command + number to
          # run and synthesised a clean prompt (no @claude needed; extra
          # free-text in the comment is intentionally dropped, matching the
          # implement path). The skills read PR/issue context themselves.
          # The engine-ground-truth block is prepended for EVERY command this tier
          # dispatches. The bare-command fallback is now a last line of defense
          # rather than the expected path for the non-review commands: the compose
          # step fails the job instead of publishing an empty prompt output.
          prompt: ${{ steps.reviewcompose.outputs.prompt || needs.gate.outputs.command }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Raise the Bash tool's per-command ceiling on THIS tier — the manual
          # `/prflow:review` / `/prflow:review-and-fix` command path. With no `settings:`
          # input this step ran under Claude Code's BASH_MAX_TIMEOUT_MS default of
          # 600000 ms (10 min), while the prompt extension this tier loads
          # (.prflow/prompt-extensions/review-and-fix.md) names the parallel verification
          # coordinator `lib/test/run-parallel.sh` (#1086) as the run's final whole-suite
          # gate — measured at ~10.5 min in a cloud run (issue #1253's AC1 measurement,
          # 2026-08-04); the coordinator has since drifted to ~15m40s, measured 2026-08-19
          # in Actions run 32289799442.
          # The mandated command was therefore structurally unable to reach a verdict
          # here: it was killed at the wall with no output, and the run was pushed onto
          # the slower #1132 shard-decomposition fallback to redo the same work.
          #
          # The value MIRRORS devflow-implement.yml's 1200000 ms (20 min) deliberately
          # rather than being sized again here: both tiers run the same engine over the
          # same verification partition, and a divergent per-tier ceiling would be a new
          # inconsistency to reason about at every future change. That block is where the
          # 20-minute figure is justified against #1180's coordinator measurement — read
          # it there. Like it, this is a BOUND and not a removal: a genuinely hung command
          # still terminates well inside the job budget instead of stalling for the job
          # timeout with no diagnostic.
          #
          # CONSUMER NOTE: install.sh ships this workflow into third-party repos whose
          # suites are neither this one nor of a duration knowable from here. The ceiling
          # is a permissive UPPER BOUND on any single Bash command — never a prediction
          # about how long a consumer's suite takes — so it encodes no assumption about
          # their toolchain; a consumer needing more raises it in their own copy.
          #
          # MECHANISM — where this input lands, and why it cannot drop the base-restored
          # project `.claude/settings.json` hooks — lives in ONE place: beside the
          # `settings:` input in devflow-implement.yml, which devflow-runner.yml also
          # points at. This is a pointer; keep the three in step by editing THAT block,
          # never by re-deriving the mechanism here. The #1132 shard-decomposition
          # fallback stays the in-run route if a command is ever terminated at this
          # raised ceiling.
          #
          # BASH_DEFAULT_TIMEOUT_MS is the separate variable governing a Bash call that
          # requests no timeout of its own (Claude Code's default: 120000 ms). #1179 raised
          # only the ceiling, so unparameterized commands still died at two minutes — measured
          # on the implement tier as 480 s of pure re-issue waste in one 87-minute run. The
          # 600000 ms value and the deliberate gap below the ceiling are justified beside the
          # `settings:` input in devflow-implement.yml; the two tiers are mirrored, so edit
          # that block. CONSUMER NOTE: install.sh ships THIS workflow, so this raises the free
          # allowance for every unparameterized Bash call in a consumer run too — a permissive
          # upper bound, never a prediction about their commands, and a consumer wanting the
          # two-minute default back removes the key in their own copy.
          settings: |
            {
              "env": {
                "BASH_DEFAULT_TIMEOUT_MS": "600000",
                "BASH_MAX_TIMEOUT_MS": "1200000"
              }
            }

          # Composed by the `Compose plugin inputs` step above (issue #505): the
          # baked baseline (the official marketplace `./` checkout-root registration
          # plus the three baseline plugins — byte-identical across the three call
          # sites, run.sh-pinned) PLUS the entries .claude/settings.json declares.
          # `./` resolves to the workflow's checkout root (where
          # .claude-plugin/marketplace.json lives). Since issue #1163 this workflow
          # runs only on `issue_comment` with every checkout pinned to the default
          # branch, so `./` always resolves to the DEFAULT-BRANCH marketplace and
          # vendored tree — a PR-branch change to either is NOT exercised by this
          # workflow on the PR that introduces it (the self-exercising property held
          # only on the removed review-event triggers, whose workspace was the PR
          # head; its loss is an intended consequence of closing the accident class,
          # not an incidental change). A git-URL entry would likewise resolve to the
          # default branch. Local-path marketplaces are supported by claude-code-action
          # since v1.0.28 (we pin @v1, the floating major).
          plugin_marketplaces: ${{ steps.plugins.outputs.plugin_marketplaces }}

          # Install plugins so the ambient /code-review and /revise-claude-md commands
          # (and /devflow:*) are available in the runner. NOTE: code-review@ and
          # claude-md-management@ are ambient-command conveniences, NOT engine dependencies
          # — DevFlow's review/implement engine dispatches neither (the "zero companion-plugin
          # dependencies" claim is scoped to the consumer install + what the engine dispatches;
          # see docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md §6). devflow@ is DevFlow itself. The baked
          # baseline three are composed by the step above; settings-declared extras are
          # appended beyond them.
          plugins: ${{ steps.plugins.outputs.plugins }}

          base_branch: ${{ needs.config.outputs.base_branch }}
          # Optional pre-installed Claude Code executable (issue #601). Empty (the
          # default) is the empty-as-absent idiom of claude_code_oauth_token above:
          # the action auto-installs, unchanged for Linux. Full rationale + the
          # self-hosted-Windows use case are on the config-job extraction above.
          path_to_claude_code_executable: ${{ needs.config.outputs.claude_code_executable }}
          # claude_args head is a COMPUTED string (steps.cargs): --model always,
          # --effort conditional on effort_supported (issue #313). The
          # --allowed-tools tail is the steps.tools computed string (issue #363).
          claude_args: >-
            ${{ steps.cargs.outputs.args }}
            --allowed-tools "${{ steps.tools.outputs.tools }}"

      # Retire the detached credential refresher (issue #487). Best-effort,
      # always() so it runs on every exit path. Gated with the SAME /devflow:review
      # exclusion as the start step: on the review path the refresher was never
      # started, so there is nothing to retire and the step would be a pointless
      # no-op. (A false defeat warning is prevented by the DEVFLOW_REFRESH_STARTED
      # guard below — steps.refresher.outcome is `skipped` there — not by this
      # exclusion.) The kill/log/::warning:: logic lives in scripts/stop-refresher.sh
      # so the branch/message selection is suite-drivable (CLAUDE.md
      # inline-shell-extraction convention).
      - name: Stop credential refresher (optional)
        if: ${{ always() && vars.DEVFLOW_APP_ID != '' && !startsWith(needs.gate.outputs.command, '/prflow:review ') }}
        env:
          # The Start step's outcome. stop-refresher.sh treats the launcher as having
          # RAN when this is `success` OR `failure` (a ran-and-failed launcher is still
          # a genuine never-started defeat — arm18), and as NOT run when `skipped` OR
          # `cancelled` (an upstream early-abort), where a missing pidfile is expected
          # rather than a defeat. (In practice the Start step's run: ends on a bare echo
          # and never waits on its backgrounded nohup, so it realistically only yields
          # success or skipped/cancelled — but the contract handed to the helper is the
          # broader four-way one above.)
          DEVFLOW_REFRESH_STARTED: ${{ steps.refresher.outcome }}
        run: |
          # Derive the self-test marker path in this step's own body (issue #1925),
          # from the same HANDLE the Start step used — it is no longer published job-wide.
          # GITHUB_RUN_ID/GITHUB_RUN_ATTEMPT/GITHUB_JOB are available in every step.
          HANDLE="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}-${GITHUB_JOB:-job}"
          export DEVFLOW_REFRESH_SELFTEST_FAILED="$RUNNER_TEMP/devflow-refresh-$HANDLE.selftest-failed"
          H=.prflow/vendor/prflow/scripts/stop-refresher.sh
          [ -f "$H" ] || H=scripts/stop-refresher.sh
          bash "$H"

      # Surface the claude-code-action run's execution diagnostics (run summary +
      # permission-denial detail) to the job log and $GITHUB_STEP_SUMMARY so a
      # maintainer debugging a stalled / incomplete / unexpectedly-denied cloud
      # run sees the denial detail and run shape directly — the exact information
      # that was irrecoverable for PR #325 (issue #331; helper + config key
      # shipped in #329). Read-only: the helper always exits 0, this step adds no
      # permissions grant / minted-token scope and uploads no artifact, so it
      # never changes the job's pass/fail. always() so it runs even when the
      # claude step errored — which is exactly when the diagnostics matter. Gated
      # on .prflow.execution_diagnostics_enabled (default true) via the vendored
      # config-get.sh (repo-path fallback for a self-repo checkout); only the
      # exact string "false" disables it, and an empty read (config-get soft/hard
      # failure) falls safe to enabled.
      # STAYS IN-JOB (issue #1174): reads steps.claude.outputs.execution_file, a
      # path on this runner's filesystem that does not survive the runner — no
      # downstream job can read it, so this handler is unrecoverable on a
      # runner-death path and cannot move to review_finalize.
      - name: Surface execution diagnostics
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$CG" ] || CG=scripts/config-get.sh
          # `|| true` so config-get's hard-fail exit (malformed config.json / missing
          # python3) can't abort this step under GitHub's default `-e` run shell — which
          # would fail the job and break the "never changes the job's pass/fail" contract
          # above. The empty read then falls safe to enabled on the next line. (Mirrors the
          # `|| echo false` assignment guard in devflow-runner.yml's engine-error step.)
          ENABLED="$("$CG" .prflow.execution_diagnostics_enabled true || true)"
          [ -n "$ENABLED" ] || ENABLED=true
          if [ "$ENABLED" = "false" ]; then
            echo "execution diagnostics: disabled via .prflow.execution_diagnostics_enabled=false; skipping."
            exit 0
          fi
          SED=.prflow/vendor/prflow/scripts/surface-execution-diagnostics.sh
          [ -f "$SED" ] || SED=scripts/surface-execution-diagnostics.sh
          if [ -f "$SED" ]; then
            # `|| echo ::notice::` for the same reason as the config-get guard above:
            # the helper's always-exit-0 contract holds for the committed file, but a
            # partial-copy / truncated vendored helper (a documented deployment hazard)
            # could exit non-zero, which under GitHub's default `-e` run shell would
            # abort this always() step and fail the job. Guard it so the read-only
            # "never changes the job's pass/fail" contract holds even then.
            bash "$SED" "${EXECUTION_FILE:-}" || echo "::notice::surface-execution-diagnostics.sh exited non-zero; execution diagnostics unavailable (best-effort)."
          else
            echo "::notice::surface-execution-diagnostics.sh absent; execution diagnostics not surfaced (best-effort)."
          fi

      # Parse the engine's is_error out of claude-code-action's execution log,
      # mirroring devflow-runner.yml's "Surface review-engine execution result"
      # step and reusing the same unit-tested helper. This is what lets the flip
      # below cover the third non-success arm finalize_check already covers: the
      # claude STEP can exit success while the engine's final message carries
      # is_error (the parse runs after the step, so the two are independent).
      # Fail-safe: an absent/unparseable log yields false (no flip), matching the
      # helper's own contract.
      # STAYS IN-JOB (issue #1174): reads steps.claude.outputs.execution_file to
      # parse the engine's is_error — a dead runner's filesystem path — so it is
      # unrecoverable off the runner. Its result IS promoted (engine_is_error
      # output) for the alive-failure path, but the parse itself must run here.
      - name: Surface review-engine execution result
        id: engine
        if: ${{ always() }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          PEE=.prflow/vendor/prflow/scripts/parse-engine-error.sh
          [ -f "$PEE" ] || PEE=scripts/parse-engine-error.sh
          if [ -f "$PEE" ]; then
            # Never 2>/dev/null the helper — a broken jq would otherwise report
            # is_error=false forever with zero trace.
            IS_ERROR=$(bash "$PEE" "${EXECUTION_FILE:-}" || echo false)
            [ "$IS_ERROR" = "true" ] || IS_ERROR=false
          else
            echo "::notice::parse-engine-error.sh absent; treating engine is_error as false (fail-safe)."
            IS_ERROR=false
          fi
          echo "is_error=$IS_ERROR" >> "$GITHUB_OUTPUT"

      # Dead-run review-progress upsert (issues #356 and #1154). A
      # comment-triggered /devflow:review or /devflow:review-and-fix seeds a
      # run-keyed prflow:review-progress comment; if the run ends without a
      # verdict the agent never moves it out of the interim 🚀 Reviewing state —
      # and a run that dies before the engine's Phase 0.3.5 seed leaves no
      # comment at all. This always() step does the workflow-level write.
      #
      # It is deliberately NOT gated on the run's outcome any more (issue
      # #1154). The pre-#1154 `if:` fired only on job failure, cancellation, or
      # an engine that ended is_error — so Actions run 29854795625, which took
      # six Phase 0 permission denials, produced no verdict and exited CLEANLY,
      # matched none of them and left a green check beside nothing at all. The
      # two observables (`steps.claude.outcome`, the RAW outcome before
      # continue-on-error; and the parsed engine is_error) are now inputs to the
      # CAUSE the step reports, never to whether it runs. Which mode they select
      # is decided by scripts/describe-dead-run-cause.sh so the suite can drive
      # every arm and its order — inline shell in YAML cannot be unit-tested,
      # and a mis-selected arm misattributes the diagnosis while the workflow
      # still "works" (the same extraction as scripts/describe-denial-count.sh).
      #
      # Best-effort: both helpers always exit 0, so this never changes the job's
      # pass/fail. This job also serves the /prflow:pr-description command, which
      # seeds no progress comment — see the command screen below, which keeps the
      # upsert to the review commands that actually own one. The run-keyed marker
      # matches ONLY this run's comment, so an earlier run's comment is never
      # read or written, and a second attempt of this step resolves the comment
      # the first one created and takes the already-terminal arm.
      - name: Flip review-progress comment on dead run
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          ENGINE_ERROR: ${{ steps.engine.outputs.is_error }}
          COMMAND: ${{ needs.gate.outputs.command }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # dead-run review-progress upsert BEGIN
          FLIP_MARKER="<!-- prflow:review-progress run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -->"
          FLIP_HELPER=.prflow/vendor/prflow/scripts/flip-review-progress-failed.sh
          [ -f "$FLIP_HELPER" ] || FLIP_HELPER=scripts/flip-review-progress-failed.sh
          if [ -z "${CONTEXT_NUMBER:-}" ]; then
            echo "::notice::flip review-progress: no issue/PR number on this event; nothing to flip"
            exit 0
          fi
          # Only the review commands seed (and therefore own) a review-progress
          # comment. Without this screen the ungated step would CREATE one on a
          # pr-description run that never had one — the upsert's create arm
          # turning a benign no-op into a spurious "Review failed" comment on an
          # unrelated command. Matched with bash builtins only: a value that
          # decides a selection must not flow through a non-preflight-guaranteed
          # PATH tool.
          case "${COMMAND:-}" in
            /prflow:review*|/devflow:review*) : ;;
            *)
              echo "::notice::flip review-progress: command '${COMMAND:-}' seeds no review-progress comment; nothing to write"
              exit 0
              ;;
          esac
          # TARGET_NUMBER is the command's own number; since issue #1863 that equals the
          # thread the comment sits on (the fallback covers a numberless command). Bash
          # builtins only — this value decides where a write lands (no non-preflight PATH tool).
          TARGET_NUMBER="${COMMAND##* }"
          case "$TARGET_NUMBER" in
            ''|*[!0-9]*) TARGET_NUMBER="$CONTEXT_NUMBER" ;;
          esac
          # Name the specific mode that fired, so the comment's cause line and
          # the job log agree on why the run was treated as dead. The four-mode
          # partition and its arm ORDER live in the helper, not here.
          CAUSE_HELPER=.prflow/vendor/prflow/scripts/describe-dead-run-cause.sh
          [ -f "$CAUSE_HELPER" ] || CAUSE_HELPER=scripts/describe-dead-run-cause.sh
          if [ -f "$CAUSE_HELPER" ]; then
            CAUSE="$(bash "$CAUSE_HELPER" "${CLAUDE_OUTCOME:-}" "${ENGINE_ERROR:-false}")"
          else
            # A consumer's installed devflow.yml and their vendored scripts/
            # upgrade on independent schedules, so a pin that predates this
            # helper must degrade rather than fail: warn, and fall back to a
            # cause that still names both observables.
            echo "::warning::flip review-progress: describe-dead-run-cause.sh absent at $CAUSE_HELPER; falling back to an undifferentiated cause (upgrade the vendored plugin pin)"
            CAUSE="claude step ${CLAUDE_OUTCOME:-unavailable} (engine is_error=${ENGINE_ERROR:-false})"
          fi
          # Verdict-presence gate (issue #1172). The flip/create must never fabricate
          # a "no verdict" banner beside a verdict THIS SAME run already posted for the
          # reviewed HEAD. Before writing, ask the HEAD-scoped, fail-closed verdict
          # deriver — via scripts/dead-run-verdict-present.sh, which reuses
          # derive-review-verdict.sh and so reads BOTH channels post-review-verdict.sh
          # writes (the formal review AND this run's run-keyed progress comment) —
          # whether a verdict EXISTS. Only a positively-determined verdict suppresses
          # the write; everything else (no HEAD sha, deriver absent, query failure,
          # genuinely no verdict, or an engine error) reports `absent` and the banner
          # still writes, so a genuinely verdict-less run keeps getting it (the fix must
          # not be "stop emitting it"). The selection lives in the helper, not here, so
          # the suite drives it per arm — the both-channels case and the truly-absent
          # case among them — rather than an untestable inline query.
          VERDICT_HELPER=.prflow/vendor/prflow/scripts/dead-run-verdict-present.sh
          [ -f "$VERDICT_HELPER" ] || VERDICT_HELPER=scripts/dead-run-verdict-present.sh
          SUPPRESS_FLIP=no
          if [ -f "$VERDICT_HELPER" ]; then
            if [ "$(bash "$VERDICT_HELPER" "$REPO" "$TARGET_NUMBER" "${ENGINE_ERROR:-false}")" = present ]; then
              SUPPRESS_FLIP=yes
            fi
          else
            # A consumer's installed devflow.yml and their vendored scripts/ upgrade on
            # independent schedules, so a pin predating this helper must DEGRADE rather
            # than silently drop the banner: warn, and fall through to writing it (the
            # fail-toward-the-banner direction — never suppress on an unestablished
            # verdict).
            echo "::warning::flip review-progress: dead-run-verdict-present.sh absent at $VERDICT_HELPER; cannot check for a posted verdict, so the dead-run banner is NOT suppressed (upgrade the vendored plugin pin)"
          fi
          if [ "$SUPPRESS_FLIP" = yes ]; then
            echo "::notice::flip review-progress: a verdict for the reviewed HEAD was posted by this run; suppressing the dead-run '❌ Review failed' write (issue #1172)"
          elif [ -f "$FLIP_HELPER" ]; then
            bash "$FLIP_HELPER" "$TARGET_NUMBER" "$FLIP_MARKER" "$CAUSE" || true
          else
            echo "::warning::flip review-progress: flip-review-progress-failed.sh absent at $FLIP_HELPER; review-progress comment not flipped to '❌ Review failed'"
          fi
          # dead-run review-progress upsert END
          # review-progress marker diagnosis BEGIN
          # The authoritative flip runs first. Diagnosis still recognizes its
          # exact marker after terminalization, while only active Reviewing
          # comments under another identity can produce a mismatch warning.
          DIAG_RUNNER=.prflow/vendor/prflow/scripts/run-review-progress-diagnosis.sh
          [ -f "$DIAG_RUNNER" ] || DIAG_RUNNER=scripts/run-review-progress-diagnosis.sh
          if [ -f "$DIAG_RUNNER" ]; then
            bash "$DIAG_RUNNER" "$COMMAND" "$REPO" "$TARGET_NUMBER" "$FLIP_MARKER" || true
          else
            echo "::notice::flip review-progress: could not establish marker diagnosis because the dispatcher is absent at $DIAG_RUNNER"
          fi
          # review-progress marker diagnosis END

      # ── Review evidence gate (issue #2075). ──────────────────────────────────
      # After the engine step, fail the job when a run that posted a merge-gating
      # verdict for the reviewed head lacks phase-execution evidence — the run root
      # attributed to this run (by the pre-engine inventory delta) holds no phase log
      # recording that the checklist phases ran. The whole decision lives in the
      # vendored scripts/review-evidence-gate.py (the suite drives it per arm); this
      # step is a thin invoker that owns the helper-absent warning, and routes the fail
      # arm to a durable comment, the progress-comment flip (the flip helper's new
      # --evidence-gate-fail arm, for a terminal Status), and the REST review dismissal.
      # Same command screen and PR-ness terms as the reach-record step, but WITHOUT the
      # trailing-space form, so /prflow:review-and-fix is evaluated too (its verdict is
      # identified by ID-set delta on the head, like /prflow:review's).
      - name: Review evidence gate
        if: ${{ always() && (startsWith(needs.gate.outputs.command, '/prflow:review') || startsWith(needs.gate.outputs.command, '/devflow:review')) && (github.event.issue.pull_request || github.event.pull_request.number) && (github.event.issue.number || github.event.pull_request.number) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMAND: ${{ needs.gate.outputs.command }}
          # The login of THIS run's reviewer identity (issue #1250 idiom): a human's
          # review is never mistaken for the run's own.
          REVIEWER_LOGIN: ${{ steps.reviewer-token.outputs.app-slug != '' && format('{0}[bot]', steps.reviewer-token.outputs.app-slug) || 'github-actions[bot]' }}
        run: |
          set -uo pipefail
          # The pre-engine inventory step is what makes attribution possible; without it
          # (a non-review command, or a race) there is nothing this run can be attributed
          # against, so the gate no-ops rather than guessing.
          if [ ! -f .prflow/tmp/pre-inventory.json ]; then
            echo "::warning::review evidence gate: no pre-engine inventory was recorded for this run; the gate cannot attribute the run root, so the check is unestablished"
            exit 0
          fi
          PR_NUMBER="${COMMAND##* }"
          case "$PR_NUMBER" in ''|*[!0-9]*) PR_NUMBER="$CONTEXT_NUMBER" ;; esac
          GATE=.prflow/vendor/prflow/scripts/review-evidence-gate.py
          [ -f "$GATE" ] || GATE=scripts/review-evidence-gate.py
          if [ ! -f "$GATE" ]; then
            # The workflow step owns this arm because an absent script cannot report itself.
            echo "::warning::review evidence gate: review-evidence-gate.py is absent at both the vendored and repo-root paths; the gate did not run (upgrade the vendored plugin pin)"
            exit 0
          fi
          VENDOR_ROOT=.prflow/vendor/prflow/skills/review
          [ -d "$VENDOR_ROOT" ] || VENDOR_ROOT=skills/review
          # The reviewed head is read from the verdict marker itself inside the gate; only
          # the base ref is supplied here, for the diff-classification recompute.
          BASE_REF_RAW="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref 2>/dev/null || true)"
          BASE_REF=""
          if [ -n "$BASE_REF_RAW" ]; then
            git fetch --quiet origin "$BASE_REF_RAW:refs/remotes/origin/$BASE_REF_RAW" 2>/dev/null || true
            BASE_REF="origin/$BASE_REF_RAW"
          fi
          REVIEWS_FILE="$RUNNER_TEMP/evidence-gate-reviews.json"
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" > "$REVIEWS_FILE" 2>/dev/null \
            || echo '[]' > "$REVIEWS_FILE"
          RESULT="$(python3 "$GATE" --pre-inventory .prflow/tmp/pre-inventory.json \
            --post-tree-root . --reviews-payload "$REVIEWS_FILE" \
            --base-ref "$BASE_REF" --repo-root . --reviewer-login "$REVIEWER_LOGIN" \
            --vendored-engine-root "$VENDOR_ROOT")"
          TOKEN="$(printf '%s\n' "$RESULT" | head -1)"
          echo "review-evidence-gate: $TOKEN"
          case "$TOKEN" in
            pass\ *|no-verdict)
              echo "::notice::review evidence gate: $TOKEN"
              ;;
            unestablished\ *)
              echo "::warning::review evidence gate: $TOKEN (the evidence state could not be established; reported neither as a pass nor a failure)"
              ;;
            fail\ *)
              echo "::error::review evidence gate: $TOKEN — this run posted a merge-gating verdict without the phase-execution evidence its diff requires"
              # (a) durable pull-request comment naming the missing evidence.
              printf '%s\n' "$RESULT" > "$RUNNER_TEMP/evidence-gate-body.md"
              if jq -n --rawfile b "$RUNNER_TEMP/evidence-gate-body.md" '{body: $b}' \
                   | gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - >/dev/null; then
                echo "::notice::review evidence gate: posted the missing-evidence comment on #$PR_NUMBER"
              else
                echo "::warning::review evidence gate: the missing-evidence comment could not be posted on #$PR_NUMBER"
              fi
              # (b) flip this run's progress comment to its failed state — the flip
              # helper's evidence-gate arm, taken even when the run wrote a terminal Status.
              FLIP=.prflow/vendor/prflow/scripts/flip-review-progress-failed.sh
              [ -f "$FLIP" ] || FLIP=scripts/flip-review-progress-failed.sh
              FLIP_MARKER="<!-- prflow:review-progress run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -->"
              if [ -f "$FLIP" ]; then
                bash "$FLIP" "$PR_NUMBER" "$FLIP_MARKER" "review evidence gate failed: $TOKEN" --evidence-gate-fail || true
              else
                echo "::warning::review evidence gate: flip-review-progress-failed.sh absent; progress comment not flipped"
              fi
              # (c) dismiss the unbacked review — only a merge-gating state (APPROVED or
              # CHANGES_REQUESTED); a COMMENTED-state verdict is left to the durable comment.
              RID="$(printf '%s' "$TOKEN" | sed -n 's/.*review_id=\([0-9][0-9]*\).*/\1/p')"
              RSTATE="$(printf '%s' "$TOKEN" | sed -n 's/.*review_state=\([A-Z_]*\).*/\1/p')"
              if [ -n "$RID" ] && { [ "$RSTATE" = APPROVED ] || [ "$RSTATE" = CHANGES_REQUESTED ]; }; then
                if gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/reviews/$RID/dismissals" \
                     -f message="Dismissed by the PRFlow review-evidence gate: this verdict lacks phase-execution evidence ($TOKEN). See the durable comment on this pull request." >/dev/null 2>&1; then
                  echo "::notice::review evidence gate: dismissed the unbacked review $RID"
                else
                  echo "::warning::review evidence gate: dismissal of review $RID failed; the durable comment stands as the recorded residual"
                fi
              else
                echo "::notice::review evidence gate: review ${RID:-<none>} state ${RSTATE:-<none>} is not merge-gating; left to the durable comment (not dismissed)"
              fi
              exit 1
              ;;
            *)
              echo "::warning::review evidence gate: unrecognized gate output '$TOKEN'; treated as unestablished"
              ;;
          esac
          exit 0

      # ── No-verdict auto-resume backstop for the manual /prflow:review path
      # (issue #408). The review-side sibling of the devflow-review.yml
      # finalize_check backstop: when a manual `/prflow:review` run died with no
      # verdict (engine is_error, or the claude step failed — a cancelled run is
      # superseded, not a benign stall, so it is excluded), fire a bounded
      # `/devflow:review` re-trigger authored by a freshly minted App token. The
      # app-token step above is SKIPPED on a /devflow:review command (that path
      # uses the downscoped reviewer token), so mint a fresh backstop token here.
      # Skipped when DEVFLOW_APP_ID is unset → the helper reports no-fire and the
      # run degrades to the pre-existing dead-end flip.
      # STAYS IN-JOB (issue #1174): paired with the deferred Review stall backstop
      # below — it mints the token that step spends, so it moves only if that step
      # moves.
      - name: Mint review-backstop token (optional)
        id: backstop-token
        if: ${{ always() && startsWith(needs.gate.outputs.command, '/prflow:review ') && (steps.engine.outputs.is_error == 'true' || steps.claude.outcome == 'failure') && vars.DEVFLOW_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}
      # STAYS IN-JOB (issue #1174, DEFERRED): reproducible from a separate job in
      # principle, but unlike the two moved handlers it WRITES and can RE-DISPATCH
      # (a /devflow:review re-trigger, or 💥 Failed). Whether an out-of-job copy
      # can coexist with an in-job one without racing to re-dispatch is the open
      # coexistence question #1027 owns; #1174 does not answer it, so this stays.
      - name: Review stall backstop
        if: ${{ always() && startsWith(needs.gate.outputs.command, '/prflow:review ') && (steps.engine.outputs.is_error == 'true' || steps.claude.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.backstop-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMAND: ${{ needs.gate.outputs.command }}
          # A dead manual review posted no verdict for HEAD, so the derived
          # verdict is incomplete by construction.
          VERDICT: incomplete
          APP_TOKEN_PRESENT: ${{ steps.backstop-token.outputs.token != '' }}
        run: |
          set -euo pipefail
          # Since issue #1863 the light-command resolver makes the command's trailing
          # number the reviewed thread's own, so this derivation (and its event-number
          # fallback) lands on the guarded thread. Bash builtins only (issue #1858).
          PR_NUMBER="${COMMAND##* }"
          case "$PR_NUMBER" in
            ''|*[!0-9]*) PR_NUMBER="$CONTEXT_NUMBER" ;;
          esac
          # The stall-backstop helper reads PR_NUMBER from the env (issue #1858).
          export PR_NUMBER
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice::review stall backstop: no PR number on this event; nothing to resume."
            exit 0
          fi
          # The comment marker is head-scoped; resolve the PR head SHA (this manual path
          # carries no precheck head_sha output). A failed lookup leaves HEAD_SHA empty and
          # the helper's decision takes its unscoped no-fire arm — never an unbounded resume.
          # The `|| true` is LOAD-BEARING under this step's errexit shell: without it, an
          # expected lookup failure (issue-comment event, transient API error) is an
          # assignment-position non-zero that kills the whole backstop before the helper
          # runs — the exact shape that took down the harden_hooks step (PR #461).
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha 2>/dev/null || true)
          # The post-and-annotate glue — resolve+call request-review-backstop.sh (its
          # decision contract UNCHANGED), parse the decision, compose the /devflow:review
          # re-trigger body, POST it via post-issue-comment.sh, and select the
          # ::notice::/::warning:: annotation on the POST success breadcrumb — is the shared
          # post-review-backstop-comment.sh helper (issue #414), unit-tested in lib/test/run.sh.
          # Pass the runtime-derived HEAD_SHA; the helper reads PR_NUMBER/REPO/VERDICT/
          # APP_TOKEN_PRESENT/GH_TOKEN from this step's env.
          HELPER=.prflow/vendor/prflow/scripts/post-review-backstop-comment.sh
          [ -f "$HELPER" ] || HELPER=scripts/post-review-backstop-comment.sh
          if [ ! -f "$HELPER" ]; then
            echo "::warning::review stall backstop: post-review-backstop-comment.sh absent at $HELPER; no auto-resume (degrades to the pre-existing dead-end flip)."
            exit 0
          fi
          HEAD_SHA="$HEAD_SHA" bash "$HELPER"

      # ── Phase 4.4 verdict-emitter reach record (issue #1156). ────────────────
      # The failure this step records is a run that ends CLEANLY: a standalone
      # review reaches a verdict, publishes it as an ordinary pull-request
      # comment it composed itself, exits `success`, and never reaches Phase 4.4
      # at all. The reviews API stays empty for the reviewed head,
      # `reviewDecision` keeps whatever a superseded round left there, and both
      # post-run handlers above stay silent because they are gated on the run
      # having gone WRONG (`steps.claude.outcome` non-success, or engine
      # is_error). Neither gate matches, so nothing durable records the
      # deviation and a maintainer is handed a pull request whose API surface
      # contradicts the only verdict it can see.
      #
      # Gated on the SAME `startsWith(needs.gate.outputs.command, '/prflow:review ')`
      # test the stall backstop above uses — the trailing space is load-bearing,
      # excluding `/prflow:review-and-fix`, which skips Phase 4.4 by design —
      # plus a resolvable number on the event that is KNOWN TO BE A PULL REQUEST.
      #
      # The PR-ness term is load-bearing, not belt-and-braces. `gate` does not
      # require a pull request: resolve-command-trigger.sh accepts any numeric
      # target, so `/prflow:review` commented on a plain ISSUE by an authorized
      # actor resolves should_run=true with that issue's number. Phase 4.4 is
      # PR-mode-only by design, so its emitter never runs there and the reader
      # would answer NOT-REACHED — posting a verdict-record comment on an issue
      # that never had a verdict to record. `github.event.issue.pull_request` is
      # GitHub's own discriminator (present only when the commented issue IS a
      # pull request); the `|| github.event.pull_request.number` disjunct is a
      # degenerate defensive form since issue #1163 left `issue_comment` the sole
      # trigger. No API call, so there is no unknown state to fall back from.
      #
      # THE STEP SELECTS NOTHING ABOUT THE RECORD. check-verdict-post-reached.sh
      # reduces the run-scoped receipt to one line; describe-verdict-post-gap.sh
      # picks the arm and writes every byte that arm emits into two files. This
      # step then warns iff the warning file is non-empty and comments iff the
      # body file is non-empty — mechanical consequences, so an arm reordering or
      # a message change is caught by the focused module that drives the helper,
      # not by a grep-pin on YAML.
      #
      # THE JOB-STATUS DECISION IS ALSO DELEGATED (issue #1271). Since issue #1271
      # this step no longer exits 0 unconditionally: decide-verdict-gap-job-status.sh
      # owns the arm-to-job-status decision (a FAIL/PASS token) and the step exits 1
      # on the single conjunctive FAIL shape — the emitter not reached AND the
      # head-scoped oracle positively established that no verdict exists AND the run
      # is not cancelled — so a verdict-less review no longer launders itself as
      # `success`. `exit 0` stays the terminal line on every other path, the
      # cancellation carve-out is an argument (not a step condition, so the record
      # above still emits on a cancelled run), and the helper's absence on an older
      # vendored tree leaves the job status unchanged. The step never rescues a job
      # that was already failing.
      - name: Record whether the verdict emitter was reached
        if: ${{ always() && startsWith(needs.gate.outputs.command, '/prflow:review ') && (github.event.issue.pull_request || github.event.pull_request.number) && (github.event.issue.number || github.event.pull_request.number) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMAND: ${{ needs.gate.outputs.command }}
          # The login of THIS run's reviewer identity (issue #1250). On the
          # /prflow:review path the agent runs under the downscoped DevFlow-Reviewer
          # token, so any review it POSTs — including one written directly through the
          # granted `gh api`, the #1250 bypass — is authored by that App's bot user.
          # When the reviewer App is unconfigured the review runs under GITHUB_TOKEN,
          # i.e. github-actions[bot]. The classifier scopes strictly to reviews by this
          # login, so a human's review is never mistaken for the run's own.
          REVIEWER_LOGIN: ${{ steps.reviewer-token.outputs.app-slug != '' && format('{0}[bot]', steps.reviewer-token.outputs.app-slug) || 'github-actions[bot]' }}
          # The job's cancellation state, passed to the job-status helper as an ARGUMENT
          # (issue #1271) — NOT expressed as a step-level `if: !cancelled()`, which would
          # stop the whole step running on a cancelled run and remove its ::notice::,
          # ::warning:: and cause-naming comment. A cancelled run legitimately never
          # reaches Phase 4.4, so the helper short-circuits to PASS on `true`.
          JOB_CANCELLED: ${{ job.status == 'cancelled' }}
        run: |
          set -uo pipefail
          # Since issue #1863 the light-command resolver makes the command's trailing
          # number the reviewed thread's own, so this derivation (and its event-number
          # fallback) lands on the guarded thread. Bash builtins only (issue #1858).
          PR_NUMBER="${COMMAND##* }"
          case "$PR_NUMBER" in
            ''|*[!0-9]*) PR_NUMBER="$CONTEXT_NUMBER" ;;
          esac
          CHECK=.prflow/vendor/prflow/scripts/check-verdict-post-reached.sh
          [ -f "$CHECK" ] || CHECK=scripts/check-verdict-post-reached.sh
          GAP=.prflow/vendor/prflow/scripts/describe-verdict-post-gap.sh
          [ -f "$GAP" ] || GAP=scripts/describe-verdict-post-gap.sh
          CLS=.prflow/vendor/prflow/scripts/classify-head-reviews.sh
          [ -f "$CLS" ] || CLS=scripts/classify-head-reviews.sh
          # issue #1271: the job-status decision helper. Resolved with the same
          # vendored-literal + repo-root fallback as its siblings. Its absence from an
          # older vendored tree is handled at the decision point below (warn, status
          # unchanged) rather than here, so the ::notice::/::warning::/comment record
          # still emits on a deployment that predates it.
          DECIDE=.prflow/vendor/prflow/scripts/decide-verdict-gap-job-status.sh
          [ -f "$DECIDE" ] || DECIDE=scripts/decide-verdict-gap-job-status.sh
          if [ ! -f "$CHECK" ] || [ ! -f "$GAP" ]; then
            echo "::warning::verdict-post reach record: the check helpers are absent from this deployment (an older vendored tree); this run leaves no record of whether Phase 4.4's verdict emitter was reached."
            exit 0
          fi
          # The head SHA is a REPORTED field, never a gate: a failed lookup must
          # not suppress the record. This step runs without errexit and ends in an
          # explicit `exit 0`, so the `|| true` changes no exit status — it is
          # here so the shape stays correct if either of those ever changes, and
          # so a reader is not left wondering whether the failure was handled.
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha 2>/dev/null || true)
          LINE=$(bash "$CHECK" || true)
          # Classify the reviews recorded on the head so the renderer can stop
          # asserting the reviews API was untouched when it was NOT (issue #1250).
          # The query and classification are best-effort: a failed query leaves an
          # empty payload the classifier reads as `unestablished`, and an absent
          # classifier (older vendored tree) leaves REVIEW_CLASS empty — either way
          # the renderer degrades to asserting nothing about the API, never to a
          # false claim. This step selects NOTHING on REVIEW_CLASS; it passes the
          # opaque token straight to the arm-dispatch helper.
          REVIEW_CLASS=""
          if [ -f "$CLS" ]; then
            REVIEWS_FILE="$RUNNER_TEMP/head-reviews.json"
            # --paginate so a heavily-reviewed PR whose own head review sits past the
            # first 100 reviews is still seen: gh merges the paged JSON arrays into one
            # array, which the classifier reads whole. Missing it would let the classifier
            # answer `none` and the renderer assert the reviews API was untouched — the
            # exact false claim #1250 exists to remove. A query failure still truncates the
            # file to empty, which the classifier reads as `unestablished` (never `none`).
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews?per_page=100" > "$REVIEWS_FILE" 2>/dev/null || : > "$REVIEWS_FILE"
            REVIEW_CLASS=$(bash "$CLS" "$REVIEWS_FILE" "$HEAD_SHA" "$REVIEWER_LOGIN" || true)
          fi
          WARNING_FILE="$RUNNER_TEMP/verdict-post-gap-warning.txt"
          BODY_FILE="$RUNNER_TEMP/verdict-post-gap-body.md"
          ARM=$(bash "$GAP" "$LINE" "${GITHUB_RUN_ID:-}" "$PR_NUMBER" "$HEAD_SHA" "$WARNING_FILE" "$BODY_FILE" "$REVIEW_CLASS" || true)
          echo "::notice::verdict-post reach record: ${ARM:-ARM unreported} (check said: ${LINE:-<no output>})"
          if [ -s "$WARNING_FILE" ]; then
            while IFS= read -r WARNING_LINE; do
              [ -z "$WARNING_LINE" ] || echo "::warning::$WARNING_LINE"
            done < "$WARNING_FILE"
          fi
          if [ -s "$BODY_FILE" ]; then
            # Environment addressing is the correct form here under the
            # .github/workflows/ exemption lint-gh-api-repo-path.py records:
            # this job resolves $GITHUB_REPOSITORY from the runner, and the
            # helpers that can also run outside Actions carry no gh call at all.
            if jq -n --rawfile b "$BODY_FILE" '{body: $b}' \
                 | gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" --input - >/dev/null; then
              echo "::notice::verdict-post reach record: posted the cause-naming comment on #$PR_NUMBER."
            else
              echo "::warning::verdict-post reach record: the cause-naming comment could not be posted on #$PR_NUMBER; the ::warning:: above is the only surviving record."
            fi
          fi
          # ── Job-status gate (issue #1271). Stop laundering a verdict-less review as
          # `success`. The DECISION is owned entirely by the helper: it fires only when
          # the emitter was not reached AND the head-scoped oracle POSITIVELY established
          # that no verdict exists, and it passes on every could-not-tell arm and on a
          # cancelled run (carve-out passed as the JOB_CANCELLED argument, not a step
          # condition). The step selects nothing — it reads the helper's FAIL/PASS token
          # and exits accordingly. The arm token drops the "ARM " prefix the renderer
          # printed. When the helper is absent (an older vendored tree) the job status is
          # left unchanged, mirroring every sibling helper-absence path in this step.
          if [ ! -f "$DECIDE" ]; then
            echo "::warning::verdict-post reach record: the job-status helper (decide-verdict-gap-job-status.sh) is absent from this deployment (an older vendored tree); the job status is left unchanged."
            exit 0
          fi
          ARM_TOKEN="${ARM#ARM }"
          DECISION=$(bash "$DECIDE" "$ARM_TOKEN" "$REVIEW_CLASS" "${JOB_CANCELLED:-false}" || true)
          echo "::notice::verdict-post job-status decision: ${DECISION:-<none>}"
          if [ "${DECISION%% *}" = "FAIL" ]; then
            echo "::error::PRFlow review: this run reached no verdict any merge-gate consumer reads (reach record not-reached; the head-scoped review oracle established no verdict for the reviewed head). Failing the job so the gap is visible and retryable through the ordinary re-run affordance."
            exit 1
          fi
          exit 0

      # ── Stale-REJECT dismissal net (issue #1175). ────────────────────────────
      # Stale-REJECT dismissal is normally the reviewing agent's Phase 4.4 step
      # (skills/review/phases/phase-4-4-github-post.md → dismiss-stale-rejections.sh).
      # When the agent never reaches Phase 4.4 — the clean-exit failure mode issue
      # #1156 records — a subsequent APPROVE leaves the pull request wedged behind a
      # superseded CHANGES_REQUESTED, with nothing else able to clear it. This
      # workflow-side step is the net for exactly that gap.
      #
      # THE GATE IS LOAD-BEARING (issue #1175). Dismissal fires ONLY when the verdict
      # for the reviewed HEAD was POSITIVELY DETERMINED as APPROVE. The whole decision
      # — read the HEAD-scoped, fail-closed verdict via derive-review-verdict.sh, gate
      # on its `verdict_determined`, and dispatch dismiss-stale-rejections.sh only on a
      # determined APPROVE — lives in scripts/dismiss-stale-rejections-net.sh, which the
      # suite drives per arm (determined-APPROVE → dismiss, determined-REJECT → refuse,
      # defaulted/undetermined → refuse, engine-error → refuse, missing-sibling →
      # unavailable). Gating on `verdict_determined` is what makes a correlated GitHub
      # API degradation that DEFAULTS the verdict unable to silently dismiss a live
      # REJECT — the failure mode that makes an unconditional workflow-side dismissal
      # WORSE than none at all. This step only runs the helper and annotates its token.
      #
      # It is a NET, not a replacement: dismiss-stale-rejections.sh is idempotent and
      # HEAD-scoped, so the agent's Phase 4.4 run and this run never double-dismiss or
      # fight (AC3). Same `/prflow:review ` PR-mode gate as the reach-record step above
      # (the trailing space excludes /prflow:review-and-fix, which skips Phase 4.4 by
      # design); the command job already holds pull-requests: write, so no new
      # permission is required. always() so a clean-exit run that skipped Phase 4.4 is
      # still covered; the helper always exits 0 and never changes the job result.
      - name: Dismiss superseded REJECT on a determined APPROVE
        if: ${{ always() && startsWith(needs.gate.outputs.command, '/prflow:review ') && (github.event.issue.pull_request || github.event.pull_request.number) && (github.event.issue.number || github.event.pull_request.number) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMAND: ${{ needs.gate.outputs.command }}
          ENGINE_ERROR: ${{ steps.engine.outputs.is_error }}
        run: |
          set -uo pipefail
          # Since issue #1863 the light-command resolver makes the command's trailing
          # number the reviewed thread's own, so this derivation (and its event-number
          # fallback) lands on the guarded thread. Bash builtins only (issue #1858).
          PR_NUMBER="${COMMAND##* }"
          case "$PR_NUMBER" in
            ''|*[!0-9]*) PR_NUMBER="$CONTEXT_NUMBER" ;;
          esac
          # stale-REJECT dismissal net BEGIN
          NET=.prflow/vendor/prflow/scripts/dismiss-stale-rejections-net.sh
          [ -f "$NET" ] || NET=scripts/dismiss-stale-rejections-net.sh
          if [ ! -f "$NET" ]; then
            echo "::warning::stale-REJECT net: dismiss-stale-rejections-net.sh absent at $NET; a superseded REJECT (if any) is NOT dismissed by the workflow — Phase 4.4 remains the only path (upgrade the vendored plugin pin)"
            exit 0
          fi
          # The helper reports one token on stdout and its diagnostics on stderr; it
          # always exits 0. The token is the observable outcome — echo it as a notice,
          # and warn on the UNEXPECTED arms where a REJECT may still block the pull
          # request (a genuine dismiss failure, a refused dismissal, or a missing helper)
          # so a maintainer sees it without reading the step log. The legitimate-refusal
          # tokens are deliberately NOT warned: no-dismiss-reject is a live change-request
          # that must stand, and no-dismiss-undetermined is the expected verdict-less run —
          # warning on either would spam every ordinary review.
          OUTCOME=$(bash "$NET" "$REPO" "$PR_NUMBER" "${ENGINE_ERROR:-false}" || true)
          echo "::notice::stale-REJECT net: ${OUTCOME:-<no output>} (PR #$PR_NUMBER)"
          case "$OUTCOME" in
            dismiss-failed|dismiss-refused|unavailable)
              echo "::warning::stale-REJECT net: outcome '$OUTCOME' for PR #$PR_NUMBER — a superseded REJECT may still block it; dismiss it manually if appropriate"
              ;;
          esac
          # stale-REJECT dismissal net END
          exit 0

      # ── Execution-transcript artifact channel (issue #1064 D3) ──────────────
      # INCLUDE on this file: devflow.yml runs the same shared review engine on the
      # surviving manual /prflow:* path, so a silent denial here produces the same
      # no-verdict failure mode as on devflow-implement.yml — symmetry is the point. The
      # full six-workflow D3 inclusion rationale (AC13) is recorded in the matching block
      # in devflow-implement.yml. Opt-in and DEFAULT-OFF via
      # execution_transcript_artifact_enabled (a transcript can carry a dumped
      # environment); the OPPOSITE default from the D5 denial-command key, deliberately
      # not harmonized. Scrub/gate/caveat/fail-closed lives in scripts/scrub-transcript.sh.
      # STAYS IN-JOB (issue #1174): reads steps.claude.outputs.execution_file — a
      # dead runner's filesystem path — so the transcript does not survive the
      # runner and this handler cannot move to review_finalize.
      - name: Scrub execution transcript for upload
        id: scrub_transcript
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -uo pipefail
          CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$CG" ] || CG=scripts/config-get.sh
          TRANSCRIPT="$("$CG" .prflow.execution_transcript_artifact_enabled false || true)"
          if [ "$TRANSCRIPT" != "true" ]; then
            echo "::notice::execution transcript artifact disabled (execution_transcript_artifact_enabled != true); nothing uploaded."
            exit 0
          fi
          OUT="$RUNNER_TEMP/claude-execution-scrubbed.json"
          ST=.prflow/vendor/prflow/scripts/scrub-transcript.sh
          [ -f "$ST" ] || ST=scripts/scrub-transcript.sh
          if [ -f "$ST" ]; then
            bash "$ST" "$EXECUTION_FILE" "$OUT" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::warning::transcript scrub inert: $ST missing (an older vendored tree); NOT uploading (fail-closed)."
          fi

      # STAYS IN-JOB (issue #1174): uploads steps.scrub_transcript.outputs.path,
      # a file scrubbed from the dead runner's execution_file — it does not exist
      # off the runner, so this handler is unrecoverable on a runner-death path.
      - name: Upload execution transcript artifact
        if: always() && steps.scrub_transcript.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scrub_transcript.outputs.path }}
          retention-days: 7
          if-no-files-found: ignore

      # STAYS IN-JOB (issue #1174): reads steps.claude.outputs.execution_file — a
      # dead runner's filesystem path — so its observability artifacts do not
      # survive the runner and this handler cannot move to review_finalize.
      - name: Persist review-and-fix observability artifacts (backstop)
        if: ${{ always() }}
        env:
          # Harness-side cost floor inputs (issue #475). DEVFLOW_COMMAND is the gate's
          # RESOLVED command (`/devflow:<class> <n>` — resolve-command-trigger.sh always
          # appends the number); prepare-harness-floor.sh parses the class and the explicit
          # trailing PR number from it and PREFERS that number. DEVFLOW_CANDIDATE_NUMBER is
          # only the fallback context number used when the command carries none — written
          # with the workflow-wide `issue.number || pull_request.number` idiom so it
          # resolves on the sole issue_comment trigger (where github.event.pull_request is
          # absent, so issue.number is the operand that resolves; the disjunct is degenerate
          # since issue #1163).
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          DEVFLOW_COMMAND: ${{ needs.gate.outputs.command }}
          DEVFLOW_CANDIDATE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          # Job-lifetime-valid token for the floor's gh PR verification: the job-start
          # App token can already be past its ~60-minute lifetime by backstop time (#287).
          # Run-profile floor (issue #2006). The engine step's own outcome, which the run
          # cannot read for itself mid-run — an always() step can read any prior step's
          # context, so the workflow supplies it here.
          DEVFLOW_ENGINE_OUTCOME: ${{ steps.claude.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          HELPER=.prflow/vendor/prflow/lib/efficiency-trace.sh
          [ -f "$HELPER" ] || { echo "::warning::observability backstop: $HELPER missing; skipped"; exit 0; }
          # Harness-side cost floor (issue #475): the glue helper runs the execution-file
          # reader, verifies the PR, and emits the floor env values consumed by --persist.
          # Guard its existence exactly like $HELPER: a vendored tree pinned to an OLDER
          # prflow_version lacks it, and that must draw a NAMED ::warning:: (floor inert),
          # never a raw `No such file` under `set +e`.
          FLOOR=.prflow/vendor/prflow/scripts/prepare-harness-floor.sh
          DEVFLOW_EXECUTION_COST=""
          DEVFLOW_EXECUTION_PR=""
          DEVFLOW_COMMAND_CLASS=""
          # Emitted by prepare-harness-floor.sh alongside the two above (issue #2006).
          # DEVFLOW_ISSUE_NUMBER is non-empty only on the implement class; it keys the
          # PR-less record and the prior-record count. DEVFLOW_NO_PR_REASON names which
          # PR-resolution branch fired.
          DEVFLOW_ISSUE_NUMBER=""
          DEVFLOW_NO_PR_REASON=""
          DEVFLOW_RUN_PROFILE=""
          if [ -f "$FLOOR" ]; then
            COST_FILE="${RUNNER_TEMP:-/tmp}/devflow-harness-cost-$$.json"
            # The glue prints four eval-able env assignments (PR, class, issue number,
            # no-PR reason) to stdout and
            # writes the cost JSON to $COST_FILE; its breadcrumbs go to the step log.
            eval "$(bash "$FLOOR" "${EXECUTION_FILE:-}" "${DEVFLOW_COMMAND:-}" "${DEVFLOW_CANDIDATE_NUMBER:-}" "$COST_FILE")"
            [ -s "$COST_FILE" ] && DEVFLOW_EXECUTION_COST="$(cat "$COST_FILE")"
            rm -f "$COST_FILE"
          else
            echo "::warning::harness cost floor inert: $FLOOR missing (a vendored tree pinned to an older prflow_version); the cost floor is skipped this run"
          fi
          # Permission-denial forensics floor (issue #1064 D2/D5) — identical wiring to
          # devflow-implement.yml (the shared review engine runs here too, so a denial
          # produces the same no-verdict failure mode; symmetry is the point). Read the
          # default-ON command-text gate through config-get.sh (the RUNTIME channel) and
          # decide with a bash-builtin `case` (AC9). Defaults to TRUE — the OPPOSITE
          # default from execution_transcript_artifact_enabled (that key gates the whole
          # transcript; this one only a bounded, scrubbed, command-only field) — do NOT
          # harmonize them. Documented residual (AC6): `0`/`""` read as ENABLED (the safe
          # direction for a default-on key); a real JSON `false` DOES disable. The builder
          # scrubs command text and fails closed; count + tool_name are always persisted.
          DENIAL_CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$DENIAL_CG" ] || DENIAL_CG=scripts/config-get.sh
          DENIAL_ENABLED_RAW="$("$DENIAL_CG" .prflow.execution_denial_commands_enabled true || true)"
          case "$DENIAL_ENABLED_RAW" in
            false) DENIAL_CMDS_ENABLED=false ;;
            *)     DENIAL_CMDS_ENABLED=true ;;
          esac
          DENIAL_BUILDER=.prflow/vendor/prflow/scripts/build-denial-record.sh
          [ -f "$DENIAL_BUILDER" ] || DENIAL_BUILDER=scripts/build-denial-record.sh
          DEVFLOW_DENIAL_RECORD=""
          if [ -f "$DENIAL_BUILDER" ]; then
            DEVFLOW_DENIAL_RECORD="$(bash "$DENIAL_BUILDER" "${EXECUTION_FILE:-}" "$DENIAL_CMDS_ENABLED")"
          else
            echo "::warning::denial forensics inert: $DENIAL_BUILDER missing (a vendored tree pinned to an older prflow_version); the denial record is skipped this run"
          fi
          # --persist derives each run's record + durable workpad copy and writes them to
          # the dedicated telemetry branch via git plumbing, then pushes with a fetch/
          # re-parent retry loop — all inside the helper. With the floor env set it ALSO
          # merge-fills harness_cost into this run's record (or writes a minimal cost
          # skeleton) AND the permission_denials record (issue #1064); unset, it is
          # byte-identical to before (issue #441/#475). It never touches HEAD or the
          # TRACKED working tree. Best-effort/exit-0.
          # Run-profile floor glue (issue #2006): resolve this run's workpad and derive its
          # per-phase durations and final status. Guarded exactly like $FLOOR — a vendored
          # tree pinned to an older prflow_version lacks it, and that must draw a NAMED
          # ::warning:: (profile inert) rather than a bare interpreter error under `set +e`.
          PROFILE_GLUE=.prflow/vendor/prflow/scripts/prepare-run-profile.sh
          if [ ! -f "$PROFILE_GLUE" ]; then
            echo "::warning::run-profile floor inert: $PROFILE_GLUE missing (a vendored tree pinned to an older prflow_version); the run profile is skipped this run"
          elif [ -z "$DEVFLOW_ISSUE_NUMBER" ]; then
            echo "::notice::run-profile floor inert: no issue number for this command class; the run profile is derived for implement runs only"
          else
            PROFILE_FILE="${RUNNER_TEMP:-/tmp}/devflow-run-profile-$$.json"
            # Do NOT drop the rc: the glue exits 0 by design, so a non-zero exit means a
            # corrupt or partial vendored copy, which must draw a NAMED ::warning:: rather
            # than leaving DEVFLOW_RUN_PROFILE silently empty with no diagnosis.
            if ! bash "$PROFILE_GLUE" "$DEVFLOW_ISSUE_NUMBER" "$PROFILE_FILE"; then
              echo "::warning::run-profile floor inert: $PROFILE_GLUE exited non-zero (a corrupt or partial vendored copy); the run profile is skipped this run"
            fi
            [ -s "$PROFILE_FILE" ] && DEVFLOW_RUN_PROFILE="$(cat "$PROFILE_FILE")"
            rm -f "$PROFILE_FILE"
          fi
          DEVFLOW_EXECUTION_COST="$DEVFLOW_EXECUTION_COST" \
          DEVFLOW_EXECUTION_PR="$DEVFLOW_EXECUTION_PR" \
          DEVFLOW_COMMAND_CLASS="$DEVFLOW_COMMAND_CLASS" \
          DEVFLOW_DENIAL_RECORD="$DEVFLOW_DENIAL_RECORD" \
          DEVFLOW_ISSUE_NUMBER="$DEVFLOW_ISSUE_NUMBER" \
          DEVFLOW_NO_PR_REASON="$DEVFLOW_NO_PR_REASON" \
          DEVFLOW_RUN_PROFILE="$DEVFLOW_RUN_PROFILE" \
          DEVFLOW_ENGINE_OUTCOME="${DEVFLOW_ENGINE_OUTCOME:-}" \
            bash "$HELPER" --persist
          exit 0

      # Reconcile prompt-extension arrival (issue #1971). The read-only review/command tier
      # has no positive-tick arrival row, so this backstop enforces only what it can establish
      # at job level: fail closed on an unestablished expectation on a successful agent run.
      - name: Reconcile prompt-extension arrival
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CMD: ${{ needs.gate.outputs.command }}
          EXPECTED: ${{ steps.extarrival.outputs.state }}
          SKILL: ${{ steps.extarrival.outputs.skill }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          # Every ::error:: restates that permission_denials_count is blind to a lost
          # skill-body load, or a reader treats a low count as evidence it loaded.
          fail_closed() {
            echo "::error::prompt-extension-arrival: $1 — cannot establish that the '${SKILL:-unknown}' skill body / consumer extension arrived on this review/command-tier run, so a clean terminal is unverified. NOTE: permission_denials_count does NOT cover a lost skill-body load (the refused Skill-tool load surfaces as a Skill tool result, not a permission_denied event), so a low denial count is not evidence the body loaded."
          }
          # Pure-bash PR number from the resolved '/prflow:<class> <n>' command (the gate
          # appends the number as the trailing token); grep/head are not preflight-guaranteed
          # and must not decide which PR this step reads or writes.
          PR_NUM="${CMD##* }"
          case "$PR_NUM" in ''|*[!0-9]*) PR_NUM="" ;; esac
          # Fixed AC3 durable-surface order for this tier: no issue workpad exists, so the
          # PR is the durable surface; when even that is unresolvable the ::error:: and the
          # non-zero job conclusion are the only record (record unrecordable).
          record_non_arrival() {
            if [ -n "$PR_NUM" ]; then
              # REST (a PR is an issue), never `gh pr comment` porcelain, which resolves the
              # repo via org-scoped GraphQL and fails under a repo-scoped token.
              gh api --method POST "repos/$REPO/issues/$PR_NUM/comments" -f body="⛔ ${1:-prompt-extension arrival unestablished — the skill body / consumer extension did not reach the agent on this run.}" >/dev/null \
                || echo "::warning::prompt-extension-arrival: could not write the durable non-arrival record to PR #$PR_NUM (record unrecordable)"
            else
              echo "::warning::prompt-extension-arrival: no PR number resolvable from command '$CMD' to record non-arrival (record unrecordable); the ::error:: and non-zero job conclusion are the only record"
            fi
          }
          if [ -z "${EXPECTED:-}" ]; then
            # Fail closed on a successful agent run: a missing expectation disabled the
            # whole check, and exiting clean would report an unverified run as verified.
            if [ "$AGENT_OUTCOME" = "success" ]; then
              fail_closed "the pre-agent classify step recorded no expectation, so the post-agent arrival check could not run on a run the agent reported successful"
              record_non_arrival "prompt-extension arrival unestablished — the pre-agent classify step recorded no expectation, so arrival could not be checked"
              exit 1
            fi
            echo "prompt-extension-arrival: no pre-agent expectation and claude outcome '${AGENT_OUTCOME:-unknown}' (already non-green); nothing to reconcile"
            exit 0
          fi
          if [ "$EXPECTED" = "absent" ]; then
            echo "prompt-extension-arrival: $SKILL extension absent (a clean consumer state); terminal permitted"
            exit 0
          fi
          # Enforce only on a successful agent step from here on: a failed/cancelled job is
          # already non-green, so re-failing it here would add no signal.
          if [ "$AGENT_OUTCOME" != "success" ]; then
            echo "prompt-extension-arrival: expectation '$EXPECTED' and claude outcome '${AGENT_OUTCOME:-unknown}' (already non-green); no enforcement needed"
            exit 0
          fi
          if [ "$EXPECTED" = "detector-absent" ]; then
            fail_closed "the arrival detector is absent (older prflow_version)"
            record_non_arrival "prompt-extension arrival unestablished — the arrival detector is absent (older prflow_version)"
            exit 1
          fi
          # Enforcing, not a pass-through: an unclassified command has no arrival evidence
          # at all, and exiting clean here would be the declare-arrival-by-absence the
          # positive-signal rule exists to forbid.
          if [ "$EXPECTED" = "skill-unresolved" ]; then
            fail_closed "the pre-agent classify step matched no skill arm for command '$CMD', so no extension could be classified"
            record_non_arrival "prompt-extension arrival unestablished — the pre-agent classify step matched no skill arm for this command; add one to that step's case"
            exit 1
          fi
          if [ "$EXPECTED" = "classify-unreadable" ]; then
            fail_closed "the pre-agent classify step could not read a classification from the present arrival detector (empty or unparsable output — a run fault, not a version skew; re-run the command)"
            record_non_arrival "prompt-extension arrival unestablished — the pre-agent classify step could not read a classification from the arrival detector; re-run the command"
            exit 1
          fi
          case "$EXPECTED" in
            undeliverable-*)
              fail_closed "the extension file was present but undeliverable ($EXPECTED)"
              record_non_arrival "prompt-extension arrival unestablished — present-but-undeliverable extension file: $EXPECTED"
              exit 1
              ;;
            arrived-expected)
              # arrived-expected + success: deliverable at the trusted closure, but this
              # read-only tier has no positive-tick artifact, so consumption is confirmed
              # only by the agent-side forced record — not at job level (documented residual).
              echo "prompt-extension-arrival: $SKILL extension deliverable at the trusted closure; job-level cannot independently confirm consumption on this read-only tier — the agent-side forced record is the catch (documented residual)"
              exit 0
              ;;
            *)
              # Fail closed on a token this step does not recognize: passing it through
              # would be the declare-arrival-by-absence the positive-signal rule forbids.
              fail_closed "the pre-agent classify step published an unrecognized expectation token '$EXPECTED'"
              record_non_arrival "prompt-extension arrival unestablished — unrecognized expectation token '$EXPECTED' from the pre-agent classify step"
              exit 1
              ;;
          esac

  # ── Out-of-job review finalizer (issue #1174). ──────────────────────────────
  # Every review post-run handler used to be an `always()` step INSIDE the
  # `command` job, so a `command`-runner death (OOM, eviction, infrastructure
  # loss) took them all down with the job — the one failure mode they exist to
  # cover. This job does NOT share a runner with the `claude` step, so it
  # survives that loss: it reads `needs.command.result` (a job output that
  # survives a dead runner) plus the GitHub API, and leaves a truthful,
  # PR-visible record that the run ended without reporting, with a link to the
  # run — strictly more than the frozen `🚀 Reviewing` comment that exists today.
  #
  # It moves the two in-scope handlers named in #1174: the dead-run review-progress
  # FLIP (idempotent and run-keyed, so it never stacks a second banner and never
  # fights the in-job copy on an alive-failure — AC2/AC3), and the verdict-emitter
  # REACH record (fully API-driven — the HEAD-scoped verdict-presence check — which
  # both gates the flip per #1172 and is emitted as a surviving log record). The
  # other nine handlers stay in-job for the reasons annotated at each: five read
  # steps.claude.outputs.execution_file (a dead runner's filesystem path — nothing
  # off the runner can read it), the stall backstop is deferred (#1174 / #1027),
  # and the rest are dead-path no-ops or in-job process teardown.
  #
  # HONEST LIMIT (AC4): a dead job emits no job outputs, so on a runner-DEATH path
  # the promoted `claude_outcome` / `engine_is_error` operands read EMPTY and the
  # full cause selection cannot be reproduced. This job states that plainly and
  # falls back to the generic arm message ("the review job did not report"). On an
  # alive-failure the outputs DO survive, so it names the richer cause via the
  # reused describe-dead-run-cause.sh.
  #
  # Covers BOTH /prflow:review AND /prflow:review-and-fix (AC7): the review-family
  # prefix below is deliberately wider than the in-job handlers' trailing-space
  # `/prflow:review ` gate, so the frozen-comment coverage is not withheld from
  # review-and-fix by copy-paste.
  review_finalize:
    needs: [config, review_dedupe, gate, command]
    # Same enable + should_run + dedupe gate the `command` job carries (a
    # dedupe-SUPPRESSED run leaves `command` skipped for a benign reason, NOT a
    # dead run, so it must not draw a banner), plus the review-family screen and
    # always() so it runs on every command-job exit path including a dead one.
    # The `needs.*.result == 'success'` terms on the upstream chain are load-bearing:
    # if config/gate/review_dedupe FAILED (not merely emitted a benign output), the
    # `command` job is `skipped` for an upstream reason and the arm helper would map
    # `skipped` → did-not-report, drawing a spurious "did not report" banner on a run
    # whose review never started. Requiring the chain succeeded confines the
    # did-not-report arm to a genuine command-level death.
    if: ${{ always() && needs.config.result == 'success' && needs.gate.result == 'success' && needs.review_dedupe.result == 'success' && needs.config.outputs.enabled == 'true' && needs.gate.outputs.should_run == 'true' && needs.review_dedupe.outputs.suppress != 'true' && (startsWith(needs.gate.outputs.command, '/prflow:review') || startsWith(needs.gate.outputs.command, '/devflow:review')) }}
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    # Documented least-privilege subset (AC8): STRICTLY smaller than the command
    # job's (no id-token, no actions, no checks, no contents:write). The finalizer
    # only reads vendored helpers from the checkout (contents:read), PATCHes /
    # creates the review-progress issue comment on the PR thread (issues:write),
    # and reads the PR head sha + its reviews for the verdict-presence check
    # (pull-requests:read). It never pushes, mints an OIDC token, or edits code.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Best-effort App token so the flip is authored under the primary App when
      # configured; continue-on-error so a broken/rotated App NEVER fails this
      # best-effort finalizer (unlike the command job, which fails closed). With
      # DEVFLOW_APP_ID unset the step is SKIPPED, its output is empty, and the run
      # step below falls back to the built-in GITHUB_TOKEN — the AC8 fallback path.
      - name: Mint finalizer token (optional)
        id: finalize-token
        if: ${{ vars.DEVFLOW_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_APP_PRIVATE_KEY }}

      - name: Checkout repository (finalizer)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      # Materialize the plugin so the finalizer's helpers exist at
      # .prflow/vendor/prflow/scripts/ in a thin-install consumer (committed →
      # self → fetch). Without this a consumer's bare checkout carries no vendored
      # tree AND no repo-root scripts/, so every helper below would hit its
      # absent-arm no-op and the backstop would silently produce nothing — the
      # exact failure #1174 exists to fix. Mirrors the command/gate jobs; the
      # default-branch checkout above is the correct trusted source.
      - uses: ./.github/actions/vendor-plugin
        with:
          ref: ${{ needs.config.outputs.prflow_version }}

      - name: Finalize a review run whose command job did not report
        env:
          GH_TOKEN: ${{ steps.finalize-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
          COMMAND: ${{ needs.gate.outputs.command }}
          COMMAND_RESULT: ${{ needs.command.result }}
          CONTEXT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          # Promoted command-job outputs. On a runner-DEATH path a dead job emits
          # no outputs, so both read EMPTY here and the run step falls back to the
          # generic arm message (AC4). On an alive failure they survive and name a
          # richer cause via describe-dead-run-cause.sh.
          CLAUDE_OUTCOME: ${{ needs.command.outputs.claude_outcome }}
          ENGINE_ERROR: ${{ needs.command.outputs.engine_is_error }}
        run: |
          set -uo pipefail
          # review-finalizer BEGIN
          # (Everything between these markers is extracted verbatim and executed
          # against recording helper stubs by the #1174 wiring block in
          # lib/test/modules/review-trigger-helpers.sh, so every branch below —
          # the CAUSE ladder, the TARGET_NUMBER derivation, the suppress-vs-write
          # gate, the verdict-helper arg order and each degraded-helper arm — is
          # driven as a real branch rather than grepped. Keep the markers.)
          # The JOB-level arm — did the command job report at all — decided by a
          # helper the suite drives arm-by-arm (issue #1174 AC6). This is a
          # DISTINCT decision from describe-dead-run-cause.sh (the cause clause),
          # which it must not duplicate.
          ARM_HELPER=.prflow/vendor/prflow/scripts/describe-command-job-arm.sh
          [ -f "$ARM_HELPER" ] || ARM_HELPER=scripts/describe-command-job-arm.sh
          if [ ! -f "$ARM_HELPER" ]; then
            echo "::warning::review finalizer: describe-command-job-arm.sh absent at $ARM_HELPER (an older vendored tree); cannot decide the command-job arm, so this run leaves no out-of-job dead-run record (upgrade the vendored plugin pin)"
            exit 0
          fi
          ARM="$(bash "$ARM_HELPER" "${COMMAND_RESULT:-}")"
          echo "::notice::review finalizer: command job result='${COMMAND_RESULT:-<none>}' -> arm='$ARM'"
          # completed-normally: the command job ran to completion and its own
          # in-job always() handlers already did their work. Produce NOTHING — no
          # second comment, no duplicate reach record (AC3/T3).
          if [ "$ARM" = "completed-normally" ]; then
            echo "::notice::review finalizer: the command job completed normally; nothing for the out-of-job backstop to do."
            exit 0
          fi

          if [ -z "${CONTEXT_NUMBER:-}" ]; then
            echo "::notice::review finalizer: no issue/PR number on this event; nothing to finalize."
            exit 0
          fi
          # The resolved command carries its own target number
          # (resolve-command-trigger.sh emits `/prflow:<cmd> <n>`); prefer it and
          # fall back to the event number. Bash builtins only — a value that
          # decides where a write lands must not flow through a non-preflight
          # PATH tool (CLAUDE.md guard-class 2).
          TARGET_NUMBER="${COMMAND##* }"
          case "$TARGET_NUMBER" in
            ''|*[!0-9]*) TARGET_NUMBER="$CONTEXT_NUMBER" ;;
          esac

          # Cause clause. When the promoted outputs SURVIVED (an alive failure),
          # reuse describe-dead-run-cause.sh for the richer diagnosis; when they
          # are EMPTY (a runner-death path — the AC4 unavailable-operand case) or
          # the arm is `cancelled`, state the generic message plainly.
          if [ "$ARM" = "cancelled" ]; then
            CAUSE="the review run was cancelled (needs.command.result=cancelled); no verdict was recorded"
          elif [ -n "${CLAUDE_OUTCOME:-}" ]; then
            CAUSE_HELPER=.prflow/vendor/prflow/scripts/describe-dead-run-cause.sh
            [ -f "$CAUSE_HELPER" ] || CAUSE_HELPER=scripts/describe-dead-run-cause.sh
            if [ -f "$CAUSE_HELPER" ]; then
              CAUSE="$(bash "$CAUSE_HELPER" "${CLAUDE_OUTCOME:-}" "${ENGINE_ERROR:-false}")"
            else
              CAUSE="the review command job failed (claude step ${CLAUDE_OUTCOME:-unavailable}, engine is_error=${ENGINE_ERROR:-false})"
            fi
          else
            # The runner-death path: the promoted operands are unavailable, so the
            # message says exactly that rather than guessing.
            CAUSE="the review command job did not report (needs.command.result=${COMMAND_RESULT:-unavailable}); the job or its runner was lost before it could record a verdict"
          fi

          # ── Verdict-emitter REACH record (issue #1156/#1250, the second moved
          # handler). Fully API-driven, so it survives the command runner's death:
          # ask the HEAD-scoped, fail-closed verdict oracle whether a verdict for
          # the reviewed HEAD EXISTS. It does double duty — it is the reach record
          # (emitted as a surviving ::notice::), and it gates the flip exactly as
          # the in-job #1172 handler does: a verdict that was actually posted must
          # never draw a "no verdict" banner beside it. Only a POSITIVELY-present
          # verdict suppresses the flip; everything else (no HEAD sha, deriver
          # absent, query failure, genuinely absent) reports `absent` and the
          # banner still writes, so a genuinely verdict-less dead run keeps it.
          # CAVEAT: the oracle is HEAD-sha-scoped, not run-scoped — so a verdict an
          # EARLIER round posted for the same unchanged HEAD also reads `present`
          # and suppresses this dead run's banner. Deliberate, and identical to the
          # in-job #1172 gate: at an unchanged HEAD the posted verdict still
          # describes the reviewed tree, so "no verdict" would be the false claim.
          VERDICT_HELPER=.prflow/vendor/prflow/scripts/dead-run-verdict-present.sh
          [ -f "$VERDICT_HELPER" ] || VERDICT_HELPER=scripts/dead-run-verdict-present.sh
          SUPPRESS_FLIP=no
          if [ -f "$VERDICT_HELPER" ]; then
            if [ "$(bash "$VERDICT_HELPER" "$REPO" "$TARGET_NUMBER" "${ENGINE_ERROR:-false}")" = present ]; then
              SUPPRESS_FLIP=yes
              echo "::notice::review finalizer reach record: a verdict for the reviewed HEAD of #$TARGET_NUMBER WAS posted; the emitter was reached, so no dead-run banner is written."
            else
              echo "::notice::review finalizer reach record: no verdict for the reviewed HEAD of #$TARGET_NUMBER was found; recording the dead-run state."
            fi
          else
            echo "::warning::review finalizer: dead-run-verdict-present.sh absent at $VERDICT_HELPER; cannot check for a posted verdict, so the dead-run banner is NOT suppressed (upgrade the vendored plugin pin)"
          fi

          if [ "$SUPPRESS_FLIP" = yes ]; then
            exit 0
          fi

          # ── Dead-run FLIP (the first moved handler). Idempotent and run-keyed:
          # the marker matches ONLY this run's comment (this job shares the run's
          # GITHUB_RUN_ID/ATTEMPT with the dead command job), and the helper flips
          # only an interim 🚀 Status — so if the command job's own always() flip
          # already ran on an alive failure, this call resolves the same comment,
          # reads its terminal Status, and writes nothing (no second banner —
          # AC2/AC3). On a runner-death path the in-job flip never ran, so this is
          # the only write; and if the run died before the engine seeded any
          # comment, the helper's upsert creates the terminal comment naming the
          # run URL.
          # Distinct variable name (RP_RUN_MARKER) from the in-job flip's FLIP_MARKER,
          # so the #356/#1054 uniqueness pins stay anchored to that in-job literal; the
          # string built here is byte-identical and pinned so in lib/test/run.sh.
          RP_RUN_MARKER="<!-- prflow:review-progress run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -->"
          FLIP_HELPER=.prflow/vendor/prflow/scripts/flip-review-progress-failed.sh
          [ -f "$FLIP_HELPER" ] || FLIP_HELPER=scripts/flip-review-progress-failed.sh
          if [ -f "$FLIP_HELPER" ]; then
            bash "$FLIP_HELPER" "$TARGET_NUMBER" "$RP_RUN_MARKER" "$CAUSE" || true
          else
            echo "::warning::review finalizer: flip-review-progress-failed.sh absent at $FLIP_HELPER; the review-progress comment for #$TARGET_NUMBER is NOT flipped to a terminal state (upgrade the vendored plugin pin)"
          fi
          exit 0
          # review-finalizer END
