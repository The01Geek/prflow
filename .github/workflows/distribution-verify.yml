# PRFlow distribution-repository release verification.
#
# This workflow is the required status check on `main`. It runs the projected
# verifier against the candidate tree and, on a pull request, enforces the rule
# that makes a self-contained judge trustworthy: a release candidate must carry
# verifier and workflow bytes IDENTICAL to the protected base branch, so a PR
# cannot edit the judge that evaluates it. An intentional verifier change lands
# as a separate two-path policy-update/* PR judged by the previous base verifier.
name: distribution-verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: distribution-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: distribution-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The judge must be the BASE branch's judge. Without this a release PR
      # could weaken or disable its own verification in the same commit.
      - name: Prove the candidate does not modify its own judge
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          judge=".github/verify-release.py .github/workflows/distribution-verify.yml"

          # Bootstrap: the pull request that INTRODUCES the judge cannot satisfy a
          # rule requiring the judge to already exist on base. Absent-on-base is
          # therefore only acceptable when NOTHING of the judge is on base yet, and
          # only from a policy-update/* branch. A release branch never qualifies.
          present=0; absent=0
          for f in $judge; do
            if git cat-file -e "${BASE_SHA}:${f}" 2>/dev/null; then present=$((present+1)); else absent=$((absent+1)); fi
          done
          if [ "$present" -eq 0 ]; then
            case "$HEAD_REF" in
              policy-update/*)
                echo "::notice::bootstrap: the judge is absent from the protected base and this is a policy-update branch introducing it. Comparison skipped for this pull request only."
                exit 0 ;;
              *)
                echo "::error::the judge is absent from the protected base and this is not a policy-update/* branch — refusing to let an arbitrary branch introduce its own judge"
                exit 1 ;;
            esac
          fi
          if [ "$absent" -ne 0 ]; then
            echo "::error::the judge is only PARTIALLY present on the protected base — refusing a half-installed judge"
            exit 1
          fi

          # A policy-update/* branch exists to CHANGE the judge, so a diff is its
          # purpose, not a violation. Without this arm the judge becomes permanently
          # unchangeable the moment it is required: every pull request that touches
          # it fails, including the ceremony documented for changing it. The control
          # here is that such a branch is judged by the PREVIOUS base verifier and
          # reviewed by a human - not that the diff is forbidden.
          case "$HEAD_REF" in
            policy-update/*)
              echo "::notice::policy-update branch: a judge change is this branch's purpose. It is evaluated by the base verifier and requires human review."
              exit 0 ;;
          esac

          status=0
          for f in $judge; do
            if ! git diff --quiet "${BASE_SHA}" HEAD -- "${f}"; then
              echo "::error file=${f}::differs from the protected base branch. An intentional change to the verifier must land as a separate policy-update/* pull request."
              status=1
            fi
          done
          exit "$status"

      - name: Verify the release artifact
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # A tree carrying no .release/ metadata is not a release candidate. That
          # is the normal state before the first generated release lands, and it
          # must not be reported as a failure. It is NEVER acceptable from a
          # release branch, though: that is exactly the missing-provenance release
          # this check exists to stop, so the two cases are separated by branch.
          if [ ! -f .release/source.json ]; then
            case "$HEAD_REF" in
              release/*)
                echo "::error::a release/* candidate carries no .release/source.json — refusing to publish a release without provenance"
                exit 1 ;;
              *)
                echo "::notice::no .release/ metadata: this tree is not a generated release candidate, so there is no artifact to verify."
                exit 0 ;;
            esac
          fi
          # Once a release has landed, main carries .release/files.sha256 and EVERY
          # edited file is a digest mismatch. Full artifact verification therefore
          # belongs to what is actually being published - a release branch, or main
          # itself - and not to an ordinary pull request, which would otherwise be
          # unmergeable for changing so much as a typo.
          case "${GITHUB_EVENT_NAME}:${HEAD_REF}" in
            pull_request:release/*|push:*) : ;;
            pull_request:*)
              echo "::notice::not a release branch: the digest manifest describes the published release, so an ordinary pull request is not verified against it."
              exit 0 ;;
          esac
          # The candidate is DATA. Copy the tree without its .git directory and
          # verify that copy, so no candidate code is imported or executed.
          candidate="$(mktemp -d)/candidate"
          mkdir -p "$candidate"
          tar --exclude='./.git' -cf - . | tar -xf - -C "$candidate"
          python3 .github/verify-release.py --candidate "$candidate"
