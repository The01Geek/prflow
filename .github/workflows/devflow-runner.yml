name: DevFlow Runner (reusable)

# Pure `workflow_call` runner: one job that runs a Claude skill from an explicit
# prompt under a named tool profile, with no comment mediation. Extracted from
# devflow.yml so its permissions are a clean SUBSET of any caller's grant.
#
# Why a separate file: devflow.yml co-locates high-privilege event-listener jobs
# (the `command` job needs contents:write to push and issues:write to react)
# with this low-privilege runner. GitHub validates a called reusable workflow's
# permission ceiling against the caller's grant at graph-build time — across the
# WHOLE called graph, before any `if:` is evaluated — so a least-privilege,
# read-only caller like devflow-review.yml could not call the consolidated
# devflow.yml without a `startup_failure` (the listener jobs' scopes exceeded
# the caller's grant). Keeping the runner here, alone, restores the invariant
# that the callee's scopes ⊆ the caller's. See docs/internal/cloud-setup.md.
#
# Keep plugin_marketplaces / plugins / claude_args in sync with devflow.yml's
# `command` job and devflow-implement.yml so every path resolves identical
# skill/plugin versions.

on:
  workflow_call:
    inputs:
      prompt:
        description: 'Prompt passed through to anthropics/claude-code-action@v1. Callers (devflow-review.yml) always pass a real prompt.'
        type: string
        required: true
      effort:
        description: |
          Reasoning effort (low|medium|high|xhigh|max). Defaults to the
          `prflow_runner.effort` value from .prflow/config.json when
          empty (which itself falls back to "high"). On the Anthropic default
          path the resolved value is passed explicitly via `--effort` —
          including "high" — so the effort is pinned rather than relying on
          the model's default; a provider-routed section drops `--effort`
          unless its provider sets `effort_supported: true` (issue #313).
        type: string
        required: false
        default: ''
      fetch_depth:
        description: 'Passed to actions/checkout. 50 covers any realistic PR commit range.'
        type: number
        required: false
        default: 50
      allowed_tools_profile:
        description: |
          Internal mapping to the actual --allowed-tools string. Only the
          "review" profile is defined today; add more when a real caller
          requires one. Do not speculate.
        type: string
        required: false
        default: 'review'
      ref:
        description: |
          Git ref/SHA to check out. Empty (default) uses the event's default
          ref. PR-review callers MUST pass the PR head SHA so the run sees the
          PR's own content — including any plugin/config/scripts the PR adds —
          not the base branch. A repo bootstrapping the devflow plugin via PR
          has no .prflow/vendor/prflow on the base branch, so a base checkout
          fails the plugin install; checking out the PR head fixes that.
        type: string
        required: false
        default: ''
    outputs:
      engine_is_error:
        description: |
          "true" when the Claude execution ended with is_error (the review
          engine hit a fatal/permission cut-off before finishing), else
          "false". The review JOB result stays `success` even in that case
          (the action step wraps the errored execution), so callers that must
          distinguish "review reached a verdict" from "engine stopped short"
          read THIS output, not `needs.<job>.result`. Defaults "false" on any
          absent/unparseable execution log (fail-safe; the consumer's HEAD-SHA
          verdict scoping remains the primary staleness guard).
        value: ${{ jobs.run.outputs.engine_is_error }}
      permission_denials_count:
        description: |
          Number of Bash permission denials recorded in this run's execution log
          (issue #363), or the literal `unavailable` when the count could not be
          established — diagnostics disabled, the step skipped, or an absent or
          unparseable execution file. A consumer MUST treat `unavailable` as
          unknown and never render it as `0`: the whole point of the no-verdict
          ::error:: is to name the cause, and "refused 0 commands" on a run whose
          diagnostics never parsed is a false statement that steers the reader
          away from permission denials.
        value: ${{ jobs.run.outputs.permission_denials_count }}
      pretooluse_guard_fired:
        description: |
          "true" | "false" | "unavailable" — whether scripts/pretooluse-shape-guard.py's
          heartbeat breadcrumb (.prflow/tmp/pretooluse-guard-fired) is present after this
          run (issue #908). "unavailable" is never collapsed onto "false": the two are
          distinct claims ("checked, guard never ran" vs "could not check").
        value: ${{ jobs.run.outputs.pretooluse_guard_fired }}
      pretooluse_guard_counts:
        description: |
          The guard's per-arm denial-count object (e.g. {"R1":2,"R4":1}), read from its
          run-keyed .prflow/tmp/pretooluse-guard-counts-<run>-<attempt>.json store, or the
          literal `unavailable` when no store file could be resolved.
        value: ${{ jobs.run.outputs.pretooluse_guard_counts }}
      permission_denials_commands:
        description: |
          scripts/extract-execution-shape.sh's `permission_denials_commands` value
          verbatim — a single-line JSON string {"commands":[...],"total":N,"truncated":
          bool} — or the literal `unavailable`. UN-NEUTRALIZED, attacker-influenced
          command text: any consumer rendering this MUST neutralize it first
          (scripts/render-guard-visibility.sh is the sanctioned renderer).
        value: ${{ jobs.run.outputs.permission_denials_commands }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: |
          Anthropic Claude Code OAuth token. Pass via `secrets: inherit` from
          callers. No longer `required: true` (issue #313): a repo that routes the
          prflow_runner section through a third-party provider need not set it.
          The runner still fails loud when it is absent AND no provider is
          configured (the Anthropic default path), so the default path is never
          silently degraded.
        required: false
      DEVFLOW_PROVIDER_API_KEY:
        description: |
          API credential for the optional third-party model provider (issue #313).
          Consumed only when the prflow_runner section names a `provider`; unused
          on the Anthropic default path. Resolves via `secrets: inherit` from the
          caller (devflow-review.yml); declared here (optional) because a reusable
          workflow's `secrets` context is typed by this block (actionlint rejects an
          undeclared reference), even though an inherited secret need not be declared
          to be readable.
        required: false
      DEVFLOW_REVIEWER_PRIVATE_KEY:
        description: |
          PEM private key of the optional dedicated **DevFlow-Reviewer** GitHub
          App (see docs/internal/cloud-setup.md). Consumed by the downscoped
          DevFlow-Reviewer review-token mint step, which is gated on
          `vars.DEVFLOW_REVIEWER_APP_ID != ''` — so this secret is only read
          when the reviewer App is configured. The review path deliberately
          runs under this SEPARATE identity (never the primary
          `prflow-implementer` App that authors PRs) so Phase 4.4's
          `gh pr review --request-changes`/`--approve` is not a forbidden
          self-review (issue #300). Resolves via `secrets: inherit` from the
          caller (devflow-review.yml); declared here because a reusable
          workflow's `secrets` context is typed by this block (actionlint
          rejects an undeclared reference).
        required: false

# Job permissions are a clean subset of any caller's grant — this is the
# invariant whose violation caused the startup_failure. A caller's `review`
# job MUST grant a superset (contents:read, pull-requests:write, id-token:write,
# actions:read, issues:read); see devflow-review.yml.
permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read # Required for Claude to read CI results (paired with additional_permissions below)
  issues: read # Required to read the linked issue when reviewing against its acceptance criteria
  # Required by scripts/summarize-ci-checks.sh's commits/{sha}/check-runs query.
  # COUPLED with the `review` caller job's grant in devflow-review.yml: a reusable
  # workflow requesting a permission its caller did not grant aborts the run at
  # graph-build time (startup_failure), so these two land together or not at all.
  checks: read

defaults:
  run:
    shell: bash

# The accepted-plugin-name discriminator the FETCH_HEAD-gated trusted-source arms
# below match a base-ref .claude-plugin/plugin.json with, compiled from
# lib/plugin-identity.json + .claude-plugin/plugin.json. BAKED into this workflow
# file (not read from the checkout) on purpose: those arms decide whether the BASE
# REF is the DevFlow plugin repo before materializing trusted helper code, so an
# accepted set read out of the examined tree would let that tree nominate itself.
# A workflow-level `env:` entry is part of this file and carries exactly the trust
# the inline literal it replaces carried — it is not overridable by PR content.
#
# Each arm below opens with a non-empty precondition on this value: `grep -Eq ""`
# matches ANY input, so an emptied discriminator would fail OPEN and let the
# examined tree self-certify. That precondition reads the value with an
# empty-string fallback — a READ default, not the banned assignment default that
# would let an inherited environment value supply an accepted name; it only keeps
# an unset variable from aborting the step under `set -u` before the guard can
# decline. Unset and empty both fail closed.
env:
  # devflow-plugin-identity:begin identity_version=2 sha256=da5eefd2419589d8b78c1cef355ab69bee59c7509877759826bb2bf4a4df1cca (generated by lib/generate-plugin-identity.py -- do not hand-edit; source: lib/plugin-identity.json + .claude-plugin/plugin.json)
  DEVFLOW_PLUGIN_NAME_ERE: '"name"[[:space:]]*:[[:space:]]*"(prflow|devflow)"'
  # devflow-plugin-identity:end

jobs:
  run:
    runs-on: ${{ vars.DEVFLOW_RUNNER && (startsWith(vars.DEVFLOW_RUNNER, '[') && fromJSON(vars.DEVFLOW_RUNNER) || vars.DEVFLOW_RUNNER) || 'ubuntu-latest' }}
    env:
      # The protected prompt-extension set (issue #874) — the skill names whose
      # extension bytes reach a reviewing agent's own prompt inside this job. This
      # is the SINGLE declaration site: the truncation step, the base-ref
      # materialization call, and the drift guard in lib/test/run.sh all read this
      # one value, so no two literals can silently disagree about what is protected.
      # A job-level `env:` is what makes that possible — a per-step literal would be
      # a copy, and the drift guard would then only prove one of them matches the
      # skill tree. lib/test/run.sh derives the names actually reachable as
      # `load-prompt-extension.sh <name>` from skills/review/ and fails when they
      # differ from this list.
      DEVFLOW_PROTECTED_PROMPT_EXTENSIONS: "review requesting-code-review"
    outputs:
      engine_is_error: ${{ steps.engine.outputs.is_error }}
      # String-equality default (issue #2064): resolve `unavailable` ONLY when the
      # diagnostics step published nothing (empty string), and otherwise pass the
      # published value through verbatim. The older `|| 'unavailable'` form risked
      # swallowing a measured `0`, because GitHub Actions `||` short-circuits on any
      # falsy operand and the coercion of the string "0" is undocumented; comparing
      # against '' with `==` is documented string equality, so a real 0 survives. The
      # sentinel is deliberately NOT `0` — a consumer must tell "the engine recorded
      # no denials" from "the count could not be established", and collapsing both onto
      # `0` makes the no-verdict ::error:: assert a denial count it never observed (#363).
      permission_denials_count: ${{ steps.diagnostics.outputs.permission_denials_count == '' && 'unavailable' || steps.diagnostics.outputs.permission_denials_count }}
      # Same `|| 'unavailable'` load-bearing default as permission_denials_count above,
      # for the same reason: the `||` expression is what makes an empty
      # steps.guard/steps.denied-commands output resolve to "unavailable" rather than a
      # false "0"/"false" — enforced by this expression, not by the steps themselves.
      pretooluse_guard_fired: ${{ steps.guard.outputs.fired || 'unavailable' }}
      pretooluse_guard_counts: ${{ steps.guard.outputs.counts || 'unavailable' }}
      permission_denials_commands: ${{ steps.denied-commands.outputs.commands || 'unavailable' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.fetch_depth }}

      - id: cfg
        uses: ./.github/actions/read-project-config

      - id: extract
        env:
          CONFIG_JSON: ${{ steps.cfg.outputs.json }}
        run: |
          set -euo pipefail
          # `// empty` collapses missing/null to a real empty string so the
          # explicit checks below fail loudly with an actionable message,
          # instead of silently propagating literal `null` into
          # `--model null` / `allowed_bots: null` downstream.
          CLAUDE_MODEL=$(echo "$CONFIG_JSON" | jq -r '.claude_model // empty')
          ALLOWED_BOTS=$(echo "$CONFIG_JSON" | jq -r '.prflow.allowed_bots // empty')
          EFFORT=$(echo "$CONFIG_JSON" | jq -r '.prflow_runner.effort // "high"')
          if [ -z "$CLAUDE_MODEL" ]; then
            echo "::error::claude_model is missing from .prflow/config.json"
            exit 1
          fi
          if [ -z "$ALLOWED_BOTS" ]; then
            echo "::error::prflow.allowed_bots is missing from .prflow/config.json"
            exit 1
          fi
          {
            echo "claude_model=$CLAUDE_MODEL"
            echo "allowed_bots=$ALLOWED_BOTS"
            echo "effort=$EFFORT"
            # prflow_version is deliberately NOT read here. It is resolved from the
            # trusted base ref by the `baseversion` step below (issue #874), because
            # this step reads the PULL REQUEST's checkout — which would let a PR
            # select the plugin commit, and therefore the loader, that reviews it.
          } >> "$GITHUB_OUTPUT"

      # Resolve the pinned plugin ref from the TRUSTED base ref (issue #874), so a
      # pull request no longer selects which plugin commit — and therefore which
      # load-prompt-extension.sh — reviews it. This joins provision_env, the
      # allowed_tools list, and the setup block on the base-ref trust boundary, and
      # carries the same consequence the repository already documents for every
      # trigger-time-resolved key: a PR that bumps prflow_version does NOT change
      # its own review, only later ones.
      #
      # WHY ITS OWN STEP, DECLARED HERE. The value must be readable by `vendor`
      # below, and `baseprovision` — which performs the job's other base-ref reads —
      # is declared AFTER `vendor`. A `steps.baseprovision.outputs.*` reference
      # inside `vendor` resolves to the empty string, and vendor-slice.sh then
      # refuses an empty DEVFLOW_REF ("refusing to track mutable main"), killing the
      # review job on a fetch-branch consumer while this repository's own `self`
      # branch — which ignores DEVFLOW_REF — stays green. Step order is therefore
      # the mechanism, not cosmetics; lib/test/run.sh pins it.
      #
      # This is a SECOND, independent fetch of the same base ref. baseprovision
      # re-fetches inside its own success branch rather than relying on this one's
      # FETCH_HEAD surviving: FETCH_HEAD is a repository file that does persist
      # across steps, but reading it outside the branch that established it is
      # exactly the misattribution the trust-rule comment below exists to prevent.
      - name: Read trusted base-ref plugin version
        id: baseversion
        env:
          # Same trusted derivation as baseprovision's BASE_REF — the PR's target
          # branch, or the repo default for a trigger carrying no pull_request.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fail-closed default: an unresolvable base ref, an unfetchable branch, a
          # malformed base config, or an absent key all leave this EMPTY, which is
          # the pre-existing degraded path — vendor-slice.sh refuses an empty ref on
          # the fetch branch rather than silently tracking a mutable default.
          DEVFLOW_VERSION=''
          if [ -n "$BASE_REF" ] && git fetch --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
            if RAW=$(git show "FETCH_HEAD:.prflow/config.json" 2>/dev/null); then
              # Same object guard baseprovision uses: `jq -c '.'` succeeds on ANY
              # valid JSON including a bare scalar, and indexing `.prflow_version`
              # on one errors (jq exit 5) and would abort this step under set -e.
              if BASE_JSON=$(printf '%s' "$RAW" | jq -ce 'if type=="object" then . else empty end' 2>/dev/null); then
                # `strings` clamps the value to a scalar string: `jq -r` pretty-prints an
                # object/array across MULTIPLE LINES, and a multi-line value appended to
                # $GITHUB_OUTPUT without a heredoc delimiter corrupts the whole file
                # (every later line is parsed as another output). A non-string leaf is
                # dropped to empty, which is the same fail-closed value as an absent key.
                DEVFLOW_VERSION=$(printf '%s' "$BASE_JSON" | jq -r 'try (.prflow_version | strings | select(. != "")) catch empty')
              else
                echo "::warning::Base ref '$BASE_REF' has a malformed or non-object .prflow/config.json; the pinned plugin version could not be read from the trusted base ref."
              fi
            else
              # DISTINCT from the malformed arm above and from the legitimately-silent
              # present-config-absent-key shape: the base ref carries no config at all.
              # The most reachable instance is a repo adopting DevFlow through this very
              # pull request, whose base ref predates it.
              echo "::warning::Base ref '$BASE_REF' carries no .prflow/config.json, so no pinned plugin version could be read from it. See the fetch-branch consequence below."
            fi
          else
            echo "::warning::Could not read the pinned plugin version from the trusted base ref '$BASE_REF' (fetch failed or the base ref is empty); the vendor step receives no pinned ref."
          fi
          # STATE THE CONSEQUENCE, not just the condition. An empty value is inert on the
          # `committed`/`self` vendor branches (they ignore the ref), but on the `fetch`
          # branch — install.sh's DEFAULT thin install — vendor-slice.sh refuses an empty
          # DEVFLOW_REF and FAILS this job with "refusing to track mutable main", which
          # names nothing about the base ref. Moving this read onto the base ref made two
          # previously-degraded paths newly reachable (a transient base-ref fetch failure,
          # and a repo adopting DevFlow through this PR), so the operator gets the
          # diagnosis here rather than only vendor-slice's message.
          if [ -z "$DEVFLOW_VERSION" ]; then
            echo "::warning::prflow_version resolved EMPTY from the trusted base ref. On a thin (fetch-branch) install the vendor step will refuse an empty ref and fail this review job; on a committed/self vendor tree the ref is ignored and the review proceeds. Commit prflow_version to .prflow/config.json on '$BASE_REF' to resolve it."
          fi
          echo "prflow_version=$DEVFLOW_VERSION" >> "$GITHUB_OUTPUT"

      # Establish the trusted prompt-extension closure and SUPPRESS the PR-head
      # copies — unconditionally (issue #874). Everything in this step must hold on
      # the arms where the base-ref materialization below never runs (a failed base-ref
      # fetch, an empty base ref, no trusted source for the materialization helper),
      # so it is its own step with no `if:` and no dependency on any earlier step
      # resolving. Placing the truncation or the variable export inside a conditional
      # reintroduces exactly the defect this change closes: on a fetch failure the
      # PR-head workspace copy would survive and the loader would read it.
      #
      # The arms on which the closure is not populated — a failed base-ref fetch, an
      # empty base ref, no trusted source for the materialization helper, a per-name read
      # failure or unwritable target inside the helper, a helper usage defect (non-zero
      # exit), a traversal-shaped protected name, and a non-blob object at a protected
      # path — therefore each degrade to an EMPTY closure, rather than sending the loader
      # back to the PR-head file. The truncation is the belt for the remaining case where
      # the cooperating half is absent: a consumer whose base ref pins a prflow_version
      # predating this change gets a loader that ignores the variable, resolves the
      # repo-root path, finds the truncated file, and loads nothing.
      - name: Establish the trusted prompt-extension closure
        id: promptext
        run: |
          set -euo pipefail
          CLOSURE="$RUNNER_TEMP/devflow-trusted-prompt-ext"
          mkdir -p "$CLOSURE"
          # A consumer checkout may not carry .prflow/prompt-extensions/ at all — git
          # does not track an empty directory, so even a repo whose install.sh created
          # it ships no such path until an extension is committed — and a redirect into
          # a missing directory fails, which under the default `bash -e` step shell
          # would kill the review job outright.
          #
          # UNLINK, NEVER TRUNCATE IN PLACE. This step runs against the PULL REQUEST's
          # checkout and is the first thing to touch that tree, so every path here is
          # PR-author-controlled. `: > path` FOLLOWS a symlink: a PR committing
          # .prflow/prompt-extensions/review.md as a link to any other file would make
          # this job empty that file instead — silently, exit 0 — before ci_summary and
          # harden_hooks read the tree. `rm -f` unlinks the link itself and never its
          # target, so the create that follows always makes a fresh regular file.
          #
          # The guard covers ANY non-directory at the directory path, not just a
          # symlink: `mkdir -p` fails with "File exists" on a regular file, and under
          # this step's `set -e` that aborts the job before `vendor`, `baseprovision`,
          # `harden_hooks`, `compose` and the reviewer itself ever run — a PR-author-
          # triggerable denial of the merge gate, since committing a plain file at
          # `.prflow/prompt-extensions` is all it takes. Removing the offending entry
          # keeps the step's own premise ("every path here is PR-author-controlled")
          # true for the directory path as well as the leaves.
          if [ -e .prflow/prompt-extensions ] && [ ! -d .prflow/prompt-extensions ]; then
            echo "::warning::PR-head '.prflow/prompt-extensions' exists but is not a directory (symlink or regular file); removing it rather than writing through it."
            rm -f .prflow/prompt-extensions
          fi
          mkdir -p .prflow/prompt-extensions
          TRUNCATED=''
          for _n in $DEVFLOW_PROTECTED_PROMPT_EXTENSIONS; do
            # Same three-pattern name guard the materialization helper applies to its
            # own NAME arguments. The workflow passes literals, so a hit means a caller
            # defect in the job-level declaration — and here the operation that would
            # follow is `rm -rf`, so an unguarded escape is a recursive delete OUTSIDE
            # the extensions directory rather than the helper's warn-and-skip.
            case "$_n" in
              */* | *..* | '')
                echo "::warning::devflow protected prompt-extension name '$_n' contains a path separator or '..', or is empty; skipping it rather than removing a path outside .prflow/prompt-extensions/."
                continue
                ;;
            esac
            _p=".prflow/prompt-extensions/${_n}.md"
            if [ -L "$_p" ] || { [ -e "$_p" ] && [ ! -f "$_p" ]; }; then
              echo "::warning::PR-head '$_p' is a symlink or a non-regular file; removing it rather than writing through it."
            fi
            rm -rf "$_p"
            : > "$_p"
            TRUNCATED="${TRUNCATED}${_p}"$'\n'
          done
          # The paths join harden_hooks' displaced_paths into the engine-ground-truth
          # block, so Phase 0.1 attributes their working-tree delta (a CONTENT delta
          # on a committed extension, an UNTRACKED delta on a name the checkout never
          # carried) to the trusted-source floor rather than warning about them.
          _d="EOF_$(date +%s%N)_$$"
          {
            printf 'truncated_paths<<%s\n' "$_d"
            printf '%s' "$TRUNCATED"
            printf '%s\n' "$_d"
          } >> "$GITHUB_OUTPUT"
          # $GITHUB_ENV is job-scoped, so this reaches every later step — including
          # the commands the reviewing agent runs and the ones its dispatched Task
          # runs. It arrives through the environment rather than a command prefix
          # precisely because the cloud matcher denies a leading `VAR=value` shape.
          echo "DEVFLOW_PROMPT_EXTENSION_ROOT=$CLOSURE" >> "$GITHUB_ENV"

      # Materialize the plugin (committed → self → fetch) so claude-code-action
      # loads it from .prflow/vendor/prflow/ and the reviewer's helper scripts
      # resolve at the literal workspace path. The `ref` is now resolved from the
      # trusted base ref by the `baseversion` step above, so a PR can no longer
      # select the plugin commit that reviews it (issue #874). The composite action
      # itself is still resolved from the PR-head workspace — a residual this change
      # records rather than closes.
      - uses: ./.github/actions/vendor-plugin
        id: vendor
        with:
          ref: ${{ steps.baseversion.outputs.prflow_version }}

      # Incomplete-vendor guard for the grounding renderer. Runs AFTER
      # vendor-materialization and BEFORE Run Claude Code so a broken vendor tree fails
      # here rather than launching a reviewing agent whose prompt carries no
      # engine-ground-truth block — this run's only statement of the headless-run
      # discipline and of the commands it may execute. A directory's presence is not
      # proof the helper exists, so probe the file itself. Unconditional: this job
      # composes a review prompt on every path it runs.
      #
      # Probed vendored-then-repo-root, exactly as `Compose review prompt` resolves the
      # renderer, so this guard fails only where that step would itself have failed. No
      # trusted-source ranking here, deliberately: this is an AVAILABILITY check, and the
      # trust decision about which copy executes stays with the compose step (whose
      # resolution this mirrors) and with the deny-list floor's own ladder.
      - name: Validate vendored grounding renderer
        run: |
          set -euo pipefail
          if [ ! -f .prflow/vendor/prflow/scripts/render-grounding-block.sh ] \
             && [ ! -f scripts/render-grounding-block.sh ]; then
            echo "::error::incomplete vendor: render-grounding-block.sh is missing from both .prflow/vendor/prflow/scripts/ and scripts/ after materialization — the review prompt would carry no engine-ground-truth block, this run's only statement of the headless-run discipline and of the commands it may execute. Repair the committed .prflow/vendor/prflow tree, or check the vendor-plugin fetch (prflow_version). Failing BEFORE Run Claude Code rather than launching an ungrounded reviewer." >&2
            exit 1
          fi

      - name: Read trusted base-ref provisioning config
        id: baseprovision
        env:
          # Source the base branch from the TRUSTED event payload — the PR's
          # target branch, or the repo default for non-PR triggers (a check_run
          # Re-run carries no pull_request) — never from a PR-controlled input.
          # Both the provision_env flag AND the setup block below are read from
          # this base ref's committed config, so a PR cannot enable provisioning
          # for its own review, nor inject `setup.install` commands into this
          # pull_request_target write-token job. (The build commands themselves
          # still run PR-author code once provisioning is on — that is the
          # maintainer's documented opt-in; see docs/internal/cloud-setup.md.)
          #
          # Deliberate: on any trigger that carries no `pull_request` (the caller
          # devflow-review.yml currently wires only check_run Re-runs — see its
          # `on:` block), the fallback reads provision_env from the default
          # branch — so for a PR whose base is a NON-default branch, a
          # re-run reads the default branch's flag, not that PR's actual base. We
          # accept this: the default branch is the most-protected trust anchor
          # for a security-sensitive opt-in, and provision_env is normally a
          # uniform repo-wide policy. The common pull_request /
          # pull_request_target paths always read the PR's true base ref.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          # Which vendor-slice branch materialized .prflow/vendor/prflow this run.
          # `vendor` is declared BEFORE this step, so its output is available here.
          # Only `fetch` (a fresh clone of the official repo at the pinned
          # prflow_version) qualifies as a trusted source — `committed`/`self` are
          # PR-head content.
          VENDOR_SOURCE: ${{ steps.vendor.outputs.vendor_source }}
        run: |
          set -euo pipefail
          # Default to read-only/no-provisioning: a missing base ref, an
          # un-fetchable branch, or a base with no committed config (the
          # devflow-bootstrap-via-PR case) all collapse to provision_env=false.
          PROVISION=false
          BASE_JSON='{}'
          # config_source distinguishes (issue #313 shadow S2): 'ok' a valid object
          # config was read; 'absent' no config on the base ref (the documented
          # bootstrap case); 'degraded' the read FAILED (fetch error / malformed).
          # The provider decision now also flows from this read, so a consumer must
          # tell "no provider configured" apart from "trusted config unreadable".
          CONFIG_SOURCE='absent'
          # Trusted deny-floor helper (PR-#404 REJECT fix): materialized from the
          # base ref below, ONLY inside the successful base-ref fetch branch —
          # FETCH_HEAD elsewhere (e.g. left by actions/checkout) can point at the
          # PR HEAD, and reading the floor from there would hand the security
          # filter to the PR author. Empty means "no trusted base-ref copy"; the
          # tools step then falls back to a runtime-FETCHED vendored copy or
          # fails closed — never to the PR-head checkout.
          FLOOR_HELPER=''
          FLOOR_SOURCE='absent'
          # Git-env pin helper (issue #645) trusted-materialization state. Empty is
          # the fail-closed default, so the fetch-failed / empty-base-ref branches
          # (which skip the materialization inside the fetch-success branch) leave
          # this SET rather than unset under `set -u`; the consuming step then emits
          # no assignment, which is also the working default.
          GITENV_HELPER_DIR=''
          SCRUB_HELPER_DIR=''
          # Plugin-parity compose (issue #505) trusted-materialization state.
          # Initialized to fail-closed defaults so the fetch-failed / empty-base-ref
          # branches below (which skip the materialization in the fetch-success
          # branch) leave these SET rather than unset under `set -u`. A fetch failure
          # or empty base ref means the trusted settings read FAILED →
          # COMPOSE_SETTINGS_SOURCE='degraded' (trusted-read-failed → ::warning::);
          # only a successful fetch whose tree genuinely lacks .claude/settings.json
          # is the 'absent' silent baseline (set in the fetch-success branch).
          COMPOSE_HELPER_DIR=''
          COMPOSE_HELPER_SOURCE='absent'
          COMPOSE_SETTINGS=''
          COMPOSE_SETTINGS_SOURCE='degraded'
          if [ -n "$BASE_REF" ]; then
            # origin is the upstream repo (fork-PR commits live under upstream
            # refs), so the base tip is the maintainer-controlled config, not the
            # PR head. --depth=1: only the tip is needed to read one file.
            if git fetch --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
              if RAW=$(git show "FETCH_HEAD:.prflow/config.json" 2>/dev/null); then
                # Parse in its own guard so a MALFORMED or non-object base config
                # collapses to read-only (the documented safe default), NOT
                # aborts the whole review job under set -e — otherwise every open
                # PR targeting that branch fails its review with an opaque jq
                # error. `if type=="object" then . else empty end` + `-e` is
                # load-bearing: jq -c '.' succeeds on ANY valid JSON including a
                # bare scalar/array/null, and the `.prflow_runner` index on the
                # next line would then error (jq exit 5) and abort under set -e.
                # Requiring an object routes scalars/arrays to the else branch
                # too. (2>/dev/null so we emit our own actionable warning, not the
                # raw parse error.)
                if BASE_JSON=$(printf '%s' "$RAW" | jq -ce 'if type=="object" then . else empty end' 2>/dev/null); then
                  CONFIG_SOURCE='ok'
                  # `try … catch false` + `== true` clamps to a literal
                  # true/false: only a real boolean `true` enables provisioning.
                  # The top-level guard above only proves BASE_JSON is an object;
                  # `.prflow_runner` could still be a non-object (e.g.
                  # {"prflow_runner":"medium"}), and `.provision_env` on a
                  # string/number/array errors (jq exit 5) — which would abort
                  # this step under set -e. `try … catch false` makes any such
                  # shape (and any non-boolean / absent value) yield a clean
                  # `false`, so the step output is always a valid token and a
                  # typo can never accidentally provision.
                  PROVISION=$(printf '%s' "$BASE_JSON" | jq -r 'try (.prflow_runner.provision_env == true) catch false')
                else
                  BASE_JSON='{}'
                  CONFIG_SOURCE='degraded'
                  echo "::warning::Base ref '$BASE_REF' has a malformed or non-object .prflow/config.json; defaulting to provision_env=false (read-only review) AND ignoring any prflow_runner.provider routing (review falls back to the Anthropic default this run). Fix the base-branch config to restore build-aware review and provider routing."
                fi
              else
                # No committed config on the base ref (e.g. a repo bootstrapping
                # devflow via this very PR) → read-only, as documented. Emit a
                # notice so a silently-downgraded opt-in is at least observable.
                CONFIG_SOURCE='absent'
                echo "::notice::No .prflow/config.json on base ref '$BASE_REF'; provision_env=false (read-only review). (No provider can be configured without a base config, so provider routing is simply the Anthropic default.)"
              fi
              # Materialize the deny-floor helper from the SAME trusted base-ref
              # tip (FETCH_HEAD is still the base ref here — this block must stay
              # inside this fetch-success branch). Candidate paths, in order: the
              # committed vendor copy (self-hosting consumers), then the repo's
              # own scripts/ copy — the latter ONLY when the base ref IS the
              # DevFlow plugin repo (same plugin.json-name discriminator as
              # vendor-slice.sh's self branch), so a consumer's unrelated
              # like-named script is never executed as the floor. Written to
              # RUNNER_TEMP: outside the PR-writable workspace, so PR content can
              # neither pre-place nor overwrite it. Best-effort: any failure
              # leaves FLOOR_HELPER empty and the tools step fails closed.
              _floor_raw=''
              if _floor_raw=$(git show "FETCH_HEAD:.prflow/vendor/prflow/scripts/filter-runner-tools.sh" 2>/dev/null); then
                FLOOR_SOURCE='base-ref-vendored'
              elif [ -n "${DEVFLOW_PLUGIN_NAME_ERE:-}" ] \
                && git show "FETCH_HEAD:.claude-plugin/plugin.json" 2>/dev/null | grep -Eq "$DEVFLOW_PLUGIN_NAME_ERE" \
                && _floor_raw=$(git show "FETCH_HEAD:scripts/filter-runner-tools.sh" 2>/dev/null); then
                FLOOR_SOURCE='base-ref-repo'
              fi
              if [ "$FLOOR_SOURCE" != 'absent' ]; then
                if mkdir -p "$RUNNER_TEMP/devflow-trusted-floor" 2>/dev/null \
                  && printf '%s\n' "$_floor_raw" > "$RUNNER_TEMP/devflow-trusted-floor/filter-runner-tools.sh" 2>/dev/null; then
                  FLOOR_HELPER="$RUNNER_TEMP/devflow-trusted-floor/filter-runner-tools.sh"
                else
                  echo "::warning::could not write the base-ref deny-floor helper into RUNNER_TEMP; the tools step will fall back to a runtime-fetched vendored copy or fail closed."
                  FLOOR_SOURCE='absent'
                fi
              fi
              # Git-env pin helper (issue #645): materialize emit-git-env.sh AND its
              # sibling resolver config-get.sh from the SAME trusted base-ref tip
              # (FETCH_HEAD is still the base ref inside this fetch-success branch).
              # This is a SECURITY BOUNDARY: the helper's stdout is appended to
              # `$GITHUB_ENV` in a token-bearing job, so it is executed only from a
              # trusted source — the same rank-1 base-ref / rank-2
              # `vendor_source == fetch` / else fail-closed ladder filter-runner-tools.sh
              # uses — NEVER the PR-head checkout, which this job checks out. Both
              # files must land: emit-git-env.sh locates its resolver as a sibling, so
              # a half-materialized pair would silently resolve every key to disabled.
              # Candidate paths mirror the floor helper's: the committed vendor copy,
              # then the repo's own scripts/ copy gated on the base ref actually being
              # the DevFlow plugin repo. Best-effort: any failure leaves
              # GITENV_HELPER_DIR empty and the consuming step fails closed (emits
              # nothing, warns) — which is also the working default, so failing closed
              # here and failing open there converge on the same safe state.
              if mkdir -p "$RUNNER_TEMP/devflow-trusted-gitenv" 2>/dev/null; then
                _gitenv_ok=1
                for _g in emit-git-env.sh config-get.sh; do
                  _g_raw=''
                  if _g_raw=$(git show "FETCH_HEAD:.prflow/vendor/prflow/scripts/$_g" 2>/dev/null); then
                    :
                  elif [ -n "${DEVFLOW_PLUGIN_NAME_ERE:-}" ] \
                    && git show "FETCH_HEAD:.claude-plugin/plugin.json" 2>/dev/null | grep -Eq "$DEVFLOW_PLUGIN_NAME_ERE" \
                    && _g_raw=$(git show "FETCH_HEAD:scripts/$_g" 2>/dev/null); then
                    :
                  else
                    _g_raw=''
                  fi
                  if [ -n "$_g_raw" ]; then
                    if printf '%s\n' "$_g_raw" > "$RUNNER_TEMP/devflow-trusted-gitenv/$_g" 2>/dev/null; then
                      chmod +x "$RUNNER_TEMP/devflow-trusted-gitenv/$_g" 2>/dev/null || true
                    else
                      rm -f "$RUNNER_TEMP/devflow-trusted-gitenv/$_g" 2>/dev/null || true
                      _gitenv_ok=0
                    fi
                  else
                    _gitenv_ok=0
                  fi
                done
                if [ "$_gitenv_ok" -eq 1 ] \
                  && [ -f "$RUNNER_TEMP/devflow-trusted-gitenv/emit-git-env.sh" ] \
                  && [ -f "$RUNNER_TEMP/devflow-trusted-gitenv/config-get.sh" ]; then
                  GITENV_HELPER_DIR="$RUNNER_TEMP/devflow-trusted-gitenv"
                fi
              fi
              # Transcript scrub (issue #1064 W3): materialize the trusted base-ref
              # scrub pair into RUNNER_TEMP, exactly like the gitenv pair above. The
              # scrub is a CREDENTIAL-REDACTION control on a job that checks out the PR
              # HEAD, so it must never be read from the workspace: a PR-authored no-op
              # scrub-credentials.sh would upload the UNSCRUBBED execution file, which
              # carries the `AUTHORIZATION: basic <base64>` header actions/checkout
              # persists. Before #1064 this logic was inline in this workflow (base-ref
              # controlled, therefore trusted); extracting it into a shared helper moved
              # it into the checked-out tree, so it now needs the same trusted-source
              # ladder filter-runner-tools.sh / resolve-extra-plugins.sh / emit-git-env.sh
              # already follow. BOTH files must land: scrub-transcript.sh locates the
              # blocklist as a SIBLING (`$_ST_DIR/scrub-credentials.sh`), so a
              # half-materialized pair would make the helper take its own missing-scrubber
              # fail-closed arm. Any failure leaves SCRUB_HELPER_DIR empty and the
              # consuming step fails closed (uploads nothing, warns).
              if mkdir -p "$RUNNER_TEMP/devflow-trusted-scrub" 2>/dev/null; then
                _scrub_ok=1
                for _s in scrub-transcript.sh scrub-credentials.sh; do
                  _s_raw=''
                  if _s_raw=$(git show "FETCH_HEAD:.prflow/vendor/prflow/scripts/$_s" 2>/dev/null); then
                    :
                  elif [ -n "${DEVFLOW_PLUGIN_NAME_ERE:-}" ] \
                    && git show "FETCH_HEAD:.claude-plugin/plugin.json" 2>/dev/null | grep -Eq "$DEVFLOW_PLUGIN_NAME_ERE" \
                    && _s_raw=$(git show "FETCH_HEAD:scripts/$_s" 2>/dev/null); then
                    :
                  else
                    _s_raw=''
                  fi
                  if [ -n "$_s_raw" ]; then
                    if printf '%s\n' "$_s_raw" > "$RUNNER_TEMP/devflow-trusted-scrub/$_s" 2>/dev/null; then
                      chmod +x "$RUNNER_TEMP/devflow-trusted-scrub/$_s" 2>/dev/null || true
                    else
                      rm -f "$RUNNER_TEMP/devflow-trusted-scrub/$_s" 2>/dev/null || true
                      _scrub_ok=0
                    fi
                  else
                    _scrub_ok=0
                  fi
                done
                if [ "$_scrub_ok" -eq 1 ] \
                  && [ -f "$RUNNER_TEMP/devflow-trusted-scrub/scrub-transcript.sh" ] \
                  && [ -f "$RUNNER_TEMP/devflow-trusted-scrub/scrub-credentials.sh" ]; then
                  SCRUB_HELPER_DIR="$RUNNER_TEMP/devflow-trusted-scrub"
                fi
              fi
              # Plugin-parity compose (issue #505): materialize the trusted base-ref
              # .claude/settings.json AND the compose helpers (resolve-extra-plugins.sh,
              # describe-plugin-compose.sh) from the SAME FETCH_HEAD tip (still the base
              # ref inside this fetch-success branch) into RUNNER_TEMP, outside the
              # PR-writable workspace. Same rank-1 candidate logic as the deny-floor
              # above: committed vendor copy first, then the repo's own scripts/ copy
              # ONLY when the base ref IS the DevFlow plugin repo (plugin.json name
              # discriminator), so a consumer's unrelated like-named script is never
              # executed as the compose helper. Best-effort: any failure leaves
              # COMPOSE_HELPER_DIR empty and the compose step falls to rank 2 (vendored
              # on vendor_source==fetch) or fails closed (baseline + trusted-source-rule
              # warning). The settings-read classification keys on git show's EXIT
              # STATUS, not on whether the read was empty: only when `git show` FAILS is
              # `git cat-file -e` consulted to tell a present-but-git-show-unreadable
              # object ('degraded') from a genuinely absent one ('absent') — the
              # harden-stop-hooks discipline, so an unreadable file is not silently
              # treated as "absent".
              if mkdir -p "$RUNNER_TEMP/devflow-trusted-compose" 2>/dev/null; then
                _compose_ok=1
                for _h in resolve-extra-plugins.sh describe-plugin-compose.sh; do
                  _h_raw=''
                  if _h_raw=$(git show "FETCH_HEAD:.prflow/vendor/prflow/scripts/$_h" 2>/dev/null); then
                    :
                  elif [ -n "${DEVFLOW_PLUGIN_NAME_ERE:-}" ] \
                    && git show "FETCH_HEAD:.claude-plugin/plugin.json" 2>/dev/null | grep -Eq "$DEVFLOW_PLUGIN_NAME_ERE" \
                    && _h_raw=$(git show "FETCH_HEAD:scripts/$_h" 2>/dev/null); then
                    :
                  else
                    _h_raw=''
                  fi
                  if [ -n "$_h_raw" ]; then
                    if ! printf '%s\n' "$_h_raw" > "$RUNNER_TEMP/devflow-trusted-compose/$_h" 2>/dev/null; then
                      rm -f "$RUNNER_TEMP/devflow-trusted-compose/$_h" 2>/dev/null || true
                      _compose_ok=0
                    fi
                  else
                    _compose_ok=0
                  fi
                done
                if [ "$_compose_ok" -eq 1 ] \
                  && [ -f "$RUNNER_TEMP/devflow-trusted-compose/resolve-extra-plugins.sh" ] \
                  && [ -f "$RUNNER_TEMP/devflow-trusted-compose/describe-plugin-compose.sh" ]; then
                  COMPOSE_HELPER_DIR="$RUNNER_TEMP/devflow-trusted-compose"
                  COMPOSE_HELPER_SOURCE='base-ref'
                fi
                # Materialize the trusted base-ref .claude/settings.json. The compose
                # step consumes ONLY this path — never a workspace-relative
                # .claude/settings.json (run.sh negatively pins that). Classification
                # keys on git show's EXIT STATUS: git-show succeeds (any present blob,
                # INCLUDING a 0-byte one) → 'ok' (a 0-byte/whitespace-only file is then
                # caught downstream as invalid JSON by resolve-extra-plugins.sh's own
                # breadcrumb, which describe-plugin-compose.sh renders as arm 3
                # (degraded-only) — not reclassified here); git-show fails but the object exists
                # (git cat-file -e) → 'degraded' (trusted-read-failed); neither → 'absent'
                # (the silent baseline).
                if _s_raw=$(git show "FETCH_HEAD:.claude/settings.json" 2>/dev/null); then
                  if printf '%s\n' "$_s_raw" > "$RUNNER_TEMP/devflow-trusted-compose/settings.json" 2>/dev/null; then
                    COMPOSE_SETTINGS="$RUNNER_TEMP/devflow-trusted-compose/settings.json"
                    COMPOSE_SETTINGS_SOURCE='ok'
                  else
                    COMPOSE_SETTINGS_SOURCE='degraded'
                    echo "::warning::devflow plugin-parity: could not write the base-ref .claude/settings.json into RUNNER_TEMP; the compose step will proceed with the baked baseline (trusted-read-failed)."
                  fi
                else
                  if git cat-file -e "FETCH_HEAD:.claude/settings.json" 2>/dev/null; then
                    COMPOSE_SETTINGS_SOURCE='degraded'
                    echo "::warning::devflow plugin-parity: a base-ref .claude/settings.json exists but read back empty after a successful fetch; the compose step will proceed with the baked baseline (trusted-read-failed)."
                  else
                    COMPOSE_SETTINGS_SOURCE='absent'
                  fi
                fi
              fi
              # Populate the trusted prompt-extension closure (issue #874). This is
              # the ONLY place it is populated, and it sits inside this fetch-success
              # branch for the reason the trust-rule comment above states: FETCH_HEAD
              # elsewhere can point at the PR HEAD, and materializing from there would
              # hand the reviewer's own appended prompt to the PR author.
              #
              # The helper is resolved through the same THREE-rank trusted-source
              # ladder every sibling closure uses (filter-runner-tools.sh, the git-env
              # helper, the plugin-compose helpers): the base ref's committed vendor
              # copy, then this repository's own scripts/ copy gated on the
              # plugin.json-name discriminator, then — the rank a two-rank ladder would
              # omit — the RUNTIME-FETCHED vendored copy, accepted only when
              # `vendor-plugin` reports it cloned the official repo fresh this run at
              # the pinned prflow_version (`vendor_source == fetch`). That third rank
              # is what serves a THIN install, which is install.sh's default: there the
              # vendored tree is gitignored so it is not on the base ref, and the
              # consumer's base ref is not the DevFlow plugin repo, so ranks 1 and 2
              # both miss. Without it every thin-install review run would take the
              # no-trusted-source arm — an empty closure and a ::warning:: on every run,
              # in every consumer, including one that never committed an extension.
              # A `committed` or `self` vendor tree is PR-head content and never
              # qualifies. It is executed only from a trusted source because it decides
              # what reaches a merge-gating prompt; a PR-head copy would be the
              # issue-#404 rejection applied one level up.
              #
              # Because the closure already exists and DEVFLOW_PROMPT_EXTENSION_ROOT
              # already points at it (the unconditional step above), an unresolvable
              # helper degrades to an EMPTY closure rather than to PR-head bytes —
              # which is why this arm warns and continues instead of failing the job.
              _mtpe_raw=''
              _mtpe_source='absent'
              _mtpe_helper=''
              _mtpe_repo_root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
              if _mtpe_raw=$(git show "FETCH_HEAD:.prflow/vendor/prflow/scripts/materialize-trusted-prompt-extensions.sh" 2>/dev/null); then
                _mtpe_source='base-ref-vendored'
              elif [ -n "${DEVFLOW_PLUGIN_NAME_ERE:-}" ] \
                && git show "FETCH_HEAD:.claude-plugin/plugin.json" 2>/dev/null | grep -Eq "$DEVFLOW_PLUGIN_NAME_ERE" \
                && _mtpe_raw=$(git show "FETCH_HEAD:scripts/materialize-trusted-prompt-extensions.sh" 2>/dev/null); then
                _mtpe_source='base-ref-repo'
              fi
              # An EMPTY trusted read is not a trusted helper: `git show` succeeds on a
              # zero-byte or truncated blob, and writing that out would produce a script
              # that runs, does nothing, and exits 0 — a silently unprotected run.
              [ -n "$_mtpe_raw" ] || _mtpe_source='absent'
              if [ "$_mtpe_source" != 'absent' ] \
                && mkdir -p "$RUNNER_TEMP/devflow-trusted-prompt-ext-helper" 2>/dev/null \
                && printf '%s\n' "$_mtpe_raw" > "$RUNNER_TEMP/devflow-trusted-prompt-ext-helper/materialize-trusted-prompt-extensions.sh" 2>/dev/null; then
                _mtpe_helper="$RUNNER_TEMP/devflow-trusted-prompt-ext-helper/materialize-trusted-prompt-extensions.sh"
              elif [ "${VENDOR_SOURCE:-}" = "fetch" ] \
                && [ -s "$_mtpe_repo_root/.prflow/vendor/prflow/scripts/materialize-trusted-prompt-extensions.sh" ]; then
                _mtpe_source='vendored-fetch'
                _mtpe_helper="$_mtpe_repo_root/.prflow/vendor/prflow/scripts/materialize-trusted-prompt-extensions.sh"
              fi
              if [ -n "$_mtpe_helper" ]; then
                # The helper prints its own fully-formed ::warning:: / ::notice::
                # lines on stdout, so this call site selects no branch and composes
                # no message — that logic lives in the helper, where lib/test/run.sh
                # drives the four per-name arms of its branch table plus the
                # not-attempted arm. The protected set is expanded UNQUOTED on purpose:
                # it is a space-separated list and each name must become its own argv
                # entry, which is the one place word splitting is the intended behavior.
                # The helper's runtime arms all exit 0 and annotate themselves; a
                # NON-ZERO exit is its deliberate loud refusal of a CALLER defect
                # (exit 2: no --target, no names, an unrecognized flag). Swallowing
                # that with `|| true` would leave an unpopulated closure whose only
                # trace is a raw stderr line, while every other non-population arm
                # carries an annotation — so capture the status and annotate it too.
                _mtpe_rc=0
                bash "$_mtpe_helper" \
                  --base-ref "$BASE_REF" \
                  --target "$RUNNER_TEMP/devflow-trusted-prompt-ext" \
                  $DEVFLOW_PROTECTED_PROMPT_EXTENSIONS || _mtpe_rc=$?
                if [ "$_mtpe_rc" -ne 0 ]; then
                  echo "::warning::devflow trusted prompt-extension materialization helper (source='$_mtpe_source') exited $_mtpe_rc — a caller/usage defect, not a runtime condition; the closure stays empty and the reviewing agent runs with no extension text."
                fi
              else
                echo "::notice::devflow trusted prompt-extension materialization was not attempted (no TRUSTED source resolved for materialize-trusted-prompt-extensions.sh, or its trusted copy could not be written); the closure stays empty and the reviewing agent runs with no extension text."
              fi
            else
              CONFIG_SOURCE='degraded'
              echo "::warning::Could not fetch base ref '$BASE_REF'; defaulting to provision_env=false (read-only review) AND ignoring any prflow_runner.provider routing (review falls back to the Anthropic default this run)."
              # The base ref's content was never established, so this run cannot say
              # whether an extension exists on it — a distinct NOTICE, never a
              # reason-naming warning that would assert a fact never observed. All
              # three never-established arms use ::notice:: for that reason, matching
              # the helper's own empty-base-ref arm.
              echo "::notice::devflow trusted prompt-extension materialization was not attempted (the base ref could not be fetched, so its content was never established); the reviewing agent runs with no extension text."
            fi
          else
            # An empty base ref means the trusted base ref could not even be
            # determined, so a base-configured provider would be silently un-read —
            # the same effect as a fetch failure or a malformed config, NOT the "no
            # committed config on the base ref" bootstrap case. Classify it 'degraded'
            # (not the initial 'absent') so the OAuth-default guard below names the
            # unreadable-config cause rather than falsely reporting "no provider
            # configured" (the shadow-S2 misdirection contract this signal exists for).
            CONFIG_SOURCE='degraded'
            echo "::warning::Base ref could not be determined (empty base ref); defaulting to provision_env=false (read-only review) AND ignoring any prflow_runner.provider routing (review falls back to the Anthropic default this run)."
            # Same not-attempted classification as the fetch-failure arm above
            # (issue #874): with no base ref there is nothing to read, so the run
            # cannot report whether an extension exists on it.
            echo "::notice::devflow trusted prompt-extension materialization was not attempted (the base ref could not be determined, so its content was never established); the reviewing agent runs with no extension text."
          fi
          {
            echo "provision_env=$PROVISION"
            echo "config_source=$CONFIG_SOURCE"
            echo "floor_helper=$FLOOR_HELPER"
            echo "floor_source=$FLOOR_SOURCE"
            # Plugin-parity compose (issue #505) — materialized by the fetch-success
            # branch above; empty/degraded on a fetch failure or empty base ref.
            echo "compose_settings=$COMPOSE_SETTINGS"
            echo "compose_settings_source=$COMPOSE_SETTINGS_SOURCE"
            echo "compose_helper_dir=$COMPOSE_HELPER_DIR"
            echo "compose_helper_source=$COMPOSE_HELPER_SOURCE"
            # Git-env pins (issue #645) — the TRUSTED helper directory materialized
            # by the fetch-success branch above; empty on a fetch failure or empty
            # base ref, which makes the consuming step fail closed.
            echo "gitenv_helper_dir=$GITENV_HELPER_DIR"
            # Transcript scrub (issue #1064 W3) — the TRUSTED scrub helper directory
            # materialized by the fetch-success branch above; empty on a fetch failure
            # or empty base ref, which makes the consuming step fail closed (no upload).
            echo "scrub_helper_dir=$SCRUB_HELPER_DIR"
          } >> "$GITHUB_OUTPUT"
          # Freeform reviewer build allowlist, read from the SAME trusted base ref
          # as provision_env above (so a PR cannot grant itself tools). Emitted as
          # a comma-joined string. `map(strings)` keeps only string elements so a
          # single hand-edited non-string entry degrades to "drop that element",
          # not "join errors → catch "" → silently lose ALL tools"; `try … catch ""`
          # still guards a non-object/array `prflow_runner`/`allowed_tools`,
          # collapsing it to empty (no build tools). The deny-list floor is applied
          # at CONSUME time in the next step, so the authoritative filter sees
          # exactly the string forwarded here.
          RUNNER_TOOLS=$(printf '%s' "$BASE_JSON" | jq -r 'try (.prflow_runner.allowed_tools // [] | map(strings) | join(",")) catch ""')
          # Heredoc forms forward both values verbatim regardless of content — a
          # newline in either (a hand-edited allowed_tools entry, a multi-line base
          # config) must not corrupt step outputs the way a plain key=value echo
          # would (only its first line is parsed; the rest inject further outputs).
          delim="EOF_$(date +%s%N)_$$"
          {
            printf 'runner_tools<<%s\n' "$delim"
            printf '%s\n' "$RUNNER_TOOLS"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
          delim="EOF_$(date +%s%N)_$$"
          {
            printf 'config_json<<%s\n' "$delim"
            printf '%s\n' "$BASE_JSON"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"
          # Optional pre-installed Claude Code executable path (issue #601), read
          # from setup.claude_code_executable in the SAME trusted base-ref config
          # ($BASE_JSON) as provision_env / runner_tools above — never the PR-head
          # checkout. This job runs under a write token and the action executes the
          # resolved path, so a PR-author-controllable value would be an
          # arbitrary-code-execution vector; the trusted-source read is the security
          # boundary. `// empty` emits an empty *stream* when the key is absent (the
          # substitution then yields the empty string and the action's auto-install path
          # is unchanged); `try … catch` guards a non-object
          # base-config `setup` so this read never aborts the review job; `| strings`
          # drops a non-string leaf value to empty; `select(test("[\n\r]") | not)` drops
          # even a valid string carrying an embedded newline/CR — so the value is always
          # single-line and the plain key=value echo below is safe;
          # `select(test("^[[:space:]]*$") | not)` drops a whitespace-only string, which
          # is never a usable executable path and whose intended meaning is "unset"
          # (any rejected shape falls back to empty → auto-install). Because "rejected"
          # and "unset" both resolve to empty, a *non-empty* raw value that resolves to
          # empty emits a `::warning::` — otherwise a mistyped path on the one platform
          # where this key is load-bearing silently reverts to the broken auto-install
          # path and the operator debugs the installer's misleading "Windows is not
          # supported" error instead of their own typo (the repo's breadcrumb-on-fallback
          # convention; an explicit `""` is a deliberate unset and warns nothing). The raw
          # probe emits the SENTINEL "set" rather than the value itself: command
          # substitution strips trailing newlines, so a value composed entirely of
          # newlines would collapse to the empty string and be misread as "unset",
          # silently skipping the warning for a rejected shape. The probe filters on
          # `!= null` rather than `// empty` because `//` is FALSY-triggered: `// empty`
          # would swallow a valid-falsy `false` leaf, rejecting it to auto-install with
          # no breadcrumb (the documented-off-switch class). JSON `null` stays an unset,
          # like an absent key. `catch "set"` (not `catch empty`) makes a NON-OBJECT
          # `setup` — which raises a jq index error in BOTH filters, so the guarded one
          # cannot resolve a value — warn rather than fail open silently. The
          # raw probe reads the SAME trusted $BASE_JSON — it never widens the trust
          # boundary, and it is used only for this emptiness test, never emitted.
          CLAUDE_CODE_EXECUTABLE_RAW=$(printf '%s' "$BASE_JSON" | jq -r 'try (.setup.claude_code_executable | select(. != null) | tostring | select(. != "") | "set") catch "set"')
          CLAUDE_CODE_EXECUTABLE=$(printf '%s' "$BASE_JSON" | jq -r 'try (.setup.claude_code_executable // empty | strings | select(test("[\n\r]") | not) | select(test("^[[:space:]]*$") | not)) catch empty')
          if [ -n "$CLAUDE_CODE_EXECUTABLE_RAW" ] && [ -z "$CLAUDE_CODE_EXECUTABLE" ]; then
            echo "::warning::setup.claude_code_executable is set in the trusted base-ref config but was rejected (non-string leaf, embedded newline/CR, or whitespace-only); falling back to the action's automatic Claude Code install."
          fi
          echo "claude_code_executable=$CLAUDE_CODE_EXECUTABLE" >> "$GITHUB_OUTPUT"

      - name: Resolve allowed-tools profile
        id: tools
        env:
          PROFILE: ${{ inputs.allowed_tools_profile }}
          # Trusted base-ref opt-in (see the baseprovision step). Only when this
          # is 'true' does the review profile gain build/verify commands.
          PROVISION_ENV: ${{ steps.baseprovision.outputs.provision_env }}
          # Freeform build/verify allowlist from the trusted base ref's
          # prflow_runner.allowed_tools (see the baseprovision step). Appended to
          # the review profile only when PROVISION_ENV is 'true', and only after
          # the deny-list floor below strips the catastrophic tier.
          RUNNER_TOOLS: ${{ steps.baseprovision.outputs.runner_tools }}
          # Trusted deny-floor helper, materialized by baseprovision from the base
          # ref into RUNNER_TEMP (empty when the base ref carries none). The floor
          # must never execute a PR-head copy — see the trust rule in the review
          # profile below.
          FLOOR_HELPER: ${{ steps.baseprovision.outputs.floor_helper }}
          FLOOR_SOURCE: ${{ steps.baseprovision.outputs.floor_source }}
          # Which vendor-slice branch materialized .prflow/vendor/prflow this
          # run: committed | self | fetch. Only 'fetch' (a fresh clone of the
          # official repo at the pinned prflow_version) is a trusted source for
          # the floor helper; committed/self copies come from the PR-head tree.
          VENDOR_SOURCE: ${{ steps.vendor.outputs.vendor_source }}
        run: |
          set -euo pipefail
          # Profiles intentionally kept inline (single-string per profile) to
          # avoid premature factoring into a composite action. Add new
          # profiles here as real callers require them; do not speculate.
          case "$PROFILE" in
            review)
              # Slim profile for /devflow:review — read-only tree, comment/post-review
              # only. No PHP/npm/composer (the review skill never shells out
              # to them). No Edit and no tree-writable Write: the ONLY Write rule is
              # the path-scoped Write(.prflow/tmp/**) at the tail — the reviewer may
              # author scratch files into the gitignored .prflow/tmp scratch dir
              # (its workpad/scratch recipe uses the Write tool there, never a shell
              # `>` redirect — matcher-probe run 29111394360 recorded `>` redirects
              # AND Write(/tmp/**) DENIED, while Write(.prflow/tmp/**) is PERMITTED,
              # issue #401), but the repo tree stays read-only. The reviewer's
              # `contents: read` token still makes a push impossible, so nothing the
              # reviewer writes to .prflow/tmp can ever reach the repo.
              # The workpad.py / config-get.sh / load-prompt-extension.sh /
              # efficiency-trace.sh entries below are read-only-safe: workpad.py
              # authors the live progress comment via `gh api` (a comment edit, not a
              # tree write), config-get.sh reads config, load-prompt-extension.sh only
              # `cat`s one <skill>.md from the extension directory this job selected
              # and prints it (the standardized preflight every skill — review and
              # review-and-fix included — now runs; without this entry the read-only
              # profile would SILENTLY DENY it, so the convention would be a no-op in
              # the cloud review tier), and efficiency-trace.sh --mode trace only reads
              # the run's workpads and prints Markdown. The `--persist` step (run by the
              # base-branch .claude/settings.json Stop hook, which claude-code-action
              # restores in this job) STAGES the run's observability artifacts under the
              # gitignored .prflow/tmp/ and, on this read-only tier, runs in STAGING-ONLY
              # mode: it writes NO new telemetry-branch records and does NO push (the push
              # operand DEVFLOW_TELEMETRY_PUSH is deliberately unset here, so #469 AC5 fails
              # closed to staging). A best-effort fetch-before-exclusion step may fast-forward
              # the LOCAL prflow-telemetry ref to mirror already-published remote records (a
              # read — no record append, no push), leaving the tracked tree read-only and the
              # REMOTE prflow-telemetry ref untouched by this job. Landing the staged artifacts
              # on the branch is the job of the trusted telemetry-push relay (telemetry-push.yml,
              # issue #489): this job uploads them as a workflow artifact (the "Upload staged
              # telemetry artifacts" step below) and the workflow_run-triggered relay downloads,
              # validates, and pushes them — never this PR-head, secrets-bearing job. So the
              # grant stays read-only-safe.
              # TREE NON-MUTATION IS NOT PROVENANCE (issue #874). "It only reads and
              # prints" says nothing about WHOSE bytes it prints, and this job checks
              # out the PULL REQUEST's head — so the printed text, which the calling
              # skill appends to its own prompt, was PR-author-editable. The grant is
              # safe on this tier because of what this job does BEFORE the agent
              # starts, not because the helper is read-only: the `promptext` step
              # unconditionally truncates the workspace copy of every protected
              # extension and exports DEVFLOW_PROMPT_EXTENSION_ROOT pointing at a
              # $RUNNER_TEMP closure, and `baseprovision` populates that closure from
              # the TRUSTED base ref inside its fetch-success branch and nowhere else.
              # The arms on which population does not happen — a failed base-ref
              # fetch, an empty base ref, no trusted helper source, a per-name read
              # failure or unwritable target, a helper usage defect, a traversal-shaped
              # protected name, and a non-blob object at a protected path — each leave the
              # closure empty rather than
              # sending the loader back to the PR-head path. The residuals this does NOT close —
              # the PR-selectable marketplace manifest and the PR-head composite
              # actions under .github/actions/ — are filed separately.
              # Command heads the review skill actually invokes are pinned against this
              # string by lib/test/run.sh (issue #363): a head the skill runs but this
              # profile omits is silently DENIED at runtime, burning the run's budget and
              # stalling it without a verdict. `mkdir`/`tee` back Phase 0.2's cached diff;
              # `git cat-file` backs Phase 0.3.6's blocker-recheck precondition;
              # `git checkout`/`mktemp`/`cmp`/`rm -f` back Phase 3.1's dirty-tree backstop.
              # `git checkout` mutates the worktree, which is exactly what that backstop
              # restores; the reviewer's `contents: read` token still makes a push impossible.
              # The TOOLS='…' literal below is a GENERATED region (compiled from the
              # `review` profile in lib/capability-profiles.json by
              # lib/generate-capability-profiles.py) and is locked as the reviewer security
              # boundary by lib/review-profile.tokens — do NOT hand-edit it; change the
              # manifest and regenerate, and widening the reviewer requires a visible diff
              # to that lock. lib/test/run.sh's --check turns any drift RED.
              # devflow-capability-manifest: region=runner-review manifest_version=29 sha256=d8f213885c5d574150e8521dc7a92f73fecfd476bc3123c7e81c752a537af75e
              TOOLS='Read,Glob,Grep,LS,Skill,Agent,TodoWrite,WebFetch,WebSearch,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git rev-parse:*),Bash(git merge-base:*),Bash(git blame:*),Bash(git branch:*),Bash(git cat-file:*),Bash(git hash-object:*),Bash(git checkout:*),Bash(mkdir:*),Bash(tee:*),Bash(mktemp:*),Bash(cmp:*),Bash(rm -f:*),Bash(*/load-prompt-extension.sh:*),Bash(*/render-prompt-extension.sh:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh repo view:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh api:*),Bash(jq:*),Bash(.prflow/vendor/prflow/scripts/run-jq.sh:*),Bash(grep:*),Bash(rg:*),Bash(find:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(xargs:*),Bash(awk:*),Bash(sed:*),Bash(diff:*),Bash(comm:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(tree:*),Bash(file:*),Bash(stat:*),Bash(date:*),Bash(pwd:*),Bash(realpath:*),Bash(dirname:*),Bash(basename:*),Bash(which:*),Bash(type:*),Bash(env:*),Bash(echo:*),Bash(printf:*),Bash(test:*),Bash(.prflow/vendor/prflow/scripts/match-deferrals.py:*),Bash(.prflow/vendor/prflow/scripts/match-lint-adjudications.py:*),Bash(.prflow/vendor/prflow/scripts/normalize-verdicts.py:*),Bash(.prflow/vendor/prflow/scripts/dismiss-stale-rejections.sh:*),Bash(.prflow/vendor/prflow/scripts/post-review-verdict.sh:*),Bash(.prflow/vendor/prflow/scripts/workpad.py:*),Bash(.prflow/vendor/prflow/scripts/seed-review-progress.sh:*),Bash(.prflow/vendor/prflow/scripts/compose-run-url.sh:*),Bash(.prflow/vendor/prflow/scripts/config-get.sh:*),Bash(.prflow/vendor/prflow/scripts/load-prompt-extension.sh:*),Bash(.prflow/vendor/prflow/scripts/render-prompt-extension.sh:*),Bash(.prflow/vendor/prflow/scripts/resolve-review-overrides.py:*),Bash(.prflow/vendor/prflow/scripts/stale-prose-lint.py:*),Bash(.prflow/vendor/prflow/lib/efficiency-trace.sh:*),Write(.prflow/tmp/**)'
              # When the trusted base config opted into provisioning, the runner
              # has a built env (setup-project-env ran below), so grant the
              # freeform build/verify commands the maintainer listed in
              # prflow_runner.allowed_tools (read from the trusted base ref —
              # RUNNER_TOOLS) so the reviewer can actually compile/test the PR in
              # ANY language instead of punting build-dependent claims. Appended
              # ONLY here: when provisioning is off, TOOLS above is byte-for-byte
              # the read-only profile, regardless of RUNNER_TOOLS content.
              #
              # SECURITY — deny-list floor. Before appending, strip the
              # categorically-unrecoverable tier no matter what /devflow:init's
              # LLM enrichment or a later hand-edit wrote into the base config:
              # tree-mutation tools (Edit/Write/MultiEdit/NotebookEdit — stripped by
              # tool NAME, so bare AND parameterized forms like Write(**) /
              # Edit(src/**) alike, issue #402) and any Bash entry that can reach a
              # raw shell / eval / privilege binary (bash/sh/zsh/eval/exec/source/
              # sudo). This is the AUTHORITATIVE boundary — it runs here, at
              # consume-time, on the trusted base-ref list, because a fast-feedback
              # guard in detect-project-tools.sh can be bypassed by a hand-edit but
              # this filter cannot. A denied entry is dropped + warned, never fatal
              # (a typo must not abort every review). The list is mirrored in
              # scripts/detect-project-tools.sh (fast feedback only); keep both in
              # sync — this path enforces.
              #
              # The filter logic itself lives in scripts/filter-runner-tools.sh
              # (extracted so lib/test/run.sh can drive the full adversarial input
              # matrix — inline YAML cannot be unit-tested; issue #402). The helper
              # inspects the Bash COMMAND-POSITION binary by basename and the
              # file-tool NAME before the first '(' case-insensitively; its header
              # documents every rule. This step only resolves + calls it, fails
              # closed when it is absent, and re-emits its strip warnings.
              if [ "$PROVISION_ENV" = "true" ]; then
                # The deny-list floor is applied by scripts/filter-runner-tools.sh
                # (issue #402) — the AUTHORITATIVE, suite-driven boundary. TRUST
                # RULE (the PR-#404 REJECT finding): this job checks out the PR
                # HEAD, so any copy of the helper in the checked-out tree — the
                # committed vendor dir or the repo's own scripts/ — is
                # PR-author-editable, and a floor whose code the PR controls is no
                # floor at all. The helper is therefore executed ONLY from a
                # trusted source, in rank order:
                #   1. FLOOR_HELPER — materialized by the baseprovision step from
                #      the TRUSTED base ref (git show FETCH_HEAD:…) into
                #      RUNNER_TEMP, outside the PR-writable workspace;
                #   2. the vendored copy, ONLY when the vendor-plugin step reports
                #      vendor_source=fetch — i.e. the copy was cloned THIS RUN from
                #      the official repo at the pinned prflow_version, never taken
                #      from the PR-head tree (a PR can at most select an
                #      official-repo commit — the same accepted posture as the
                #      vendor step itself).
                # A committed/self vendor copy is deliberately NEVER consulted
                # here, and FAIL CLOSED when no trusted source resolves: a security
                # filter that cannot run must append NOTHING, not the unfiltered
                # list. Version skew: the floor is as current as the BASE REF's
                # helper (or the pinned fetch) — a consumer must land a re-vendor
                # on the base branch for a later tightening (e.g. #402's
                # parameterized file-tool strip) to take effect; until then a
                # base ref with no helper fails closed (no build tools, warning,
                # read-only review still works). Both are stated in
                # docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md's deny-floor paragraph.
                # Anchor the relative vendored-copy candidate to the git repo ROOT
                # (issue #409 item 8, #295 convention: `git rev-parse --show-toplevel`,
                # falling back to `pwd`). A bare relative `.prflow/vendor/…` path
                # resolves against the step's cwd, so a future `working-directory:` (or a
                # step that `cd`s) would silently miss the vendored helper and flip every
                # review that RELIES ON the fetch-vendored fallback to the helper-absent
                # fail-closed arm. (Reviews that resolve the rank-1 trusted base-ref
                # FLOOR_HELPER, an absolute RUNNER_TEMP path, never reach this branch.)
                # Anchoring makes the candidate cwd-independent. FLOOR_HELPER is already
                # absolute, so only the fetch-gated vendored path needs it.
                _REPO_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
                FILTER_HELPER=''
                if [ -n "${FLOOR_HELPER:-}" ] && [ -f "$FLOOR_HELPER" ]; then
                  FILTER_HELPER="$FLOOR_HELPER"
                  echo "deny-list floor source: trusted base ref (${FLOOR_SOURCE:-base-ref})"
                elif [ "${VENDOR_SOURCE:-}" = "fetch" ] && [ -f "$_REPO_ROOT/.prflow/vendor/prflow/scripts/filter-runner-tools.sh" ]; then
                  FILTER_HELPER="$_REPO_ROOT/.prflow/vendor/prflow/scripts/filter-runner-tools.sh"
                  echo "deny-list floor source: runtime-fetched vendored copy (pinned prflow_version)"
                fi
                if [ -z "$FILTER_HELPER" ]; then
                  echo "::warning::devflow deny-list floor helper (filter-runner-tools.sh) not found at any TRUSTED source — neither materialized from the base ref (baseprovision) nor runtime-fetched at the pinned prflow_version (vendor_source='${VENDOR_SOURCE:-unknown}'); the PR-head checkout's own copy is deliberately not consulted, because the floor must not be PR-editable. Failing closed: NO build/verify tools appended to the review profile (the reviewer keeps the read-only profile). Land the DevFlow re-vendor on the BASE branch (or use a thin install with a pinned prflow_version) so a trusted helper is available."
                else
                  # The helper reads the raw RUNNER_TOOLS from the environment,
                  # prints the KEPT entries as one comma-joined line on stdout, and
                  # one strip-warning line per stripped entry on stderr. Capture the
                  # helper's exit status in the SAME statement (`|| HELPER_RC=$?`):
                  # the helper's contract is `exit 0` always, so a non-zero rc is a
                  # genuine MALFUNCTION whose interpreter invocation itself failed to
                  # open/parse/run the helper — an unreadable, corrupt, or
                  # partially-vendored helper, or resource exhaustion — NOT an empty
                  # result. (A non-fatal in-script hiccup such as a too-old bash
                  # rejecting `shopt -s nocasematch` does NOT reach this arm: the
                  # helper has `set -u` but no `set -e` and ends with `exit 0`, so it
                  # still exits 0 — the file-tool tier merely degrades to
                  # case-sensitive, which only affects inert lowercase spellings.)
                  # Distinguishing malfunction from empty below keeps a helper crash
                  # from being misdiagnosed as "your config is empty" (the "unknown is
                  # not a real value" breadcrumb-honesty rule); either way it fails
                  # CLOSED (nothing appended).
                  # Guard mktemp (issue #409 item 7): a temp-dir that is unwritable or
                  # exhausted makes `mktemp` fail, leaving STRIP_LOG empty. The old
                  # unguarded `STRIP_LOG="$(mktemp)"` then let the `2>"$STRIP_LOG"`
                  # redirect target an empty path and, under GitHub's default `-e` run
                  # shell, abort the whole `tools` step — a security filter must never
                  # HARD-ABORT the step (that is a different failure than the intended
                  # fail-closed). So capture mktemp best-effort and, if it did not yield
                  # a real file, fail CLOSED (append nothing) with an actionable warning.
                  STRIP_LOG="$(mktemp 2>/dev/null || true)"
                  if [ -z "$STRIP_LOG" ] || [ ! -e "$STRIP_LOG" ]; then
                    echo "::warning::devflow deny-list floor: could not create a temp file (mktemp failed — the runner's temp dir is unwritable or exhausted) to capture the helper's per-entry strip warnings — failing closed: NO build/verify tools appended to the review profile (the reviewer keeps the read-only profile). This is a runner ENVIRONMENT issue, NOT an empty prflow_runner.allowed_tools."
                  else
                    HELPER_RC=0
                    FILTERED="$(RUNNER_TOOLS="$RUNNER_TOOLS" bash "$FILTER_HELPER" 2>"$STRIP_LOG")" || HELPER_RC=$?
                    # Re-emit each per-entry strip line as a workflow `::warning::`.
                    while IFS= read -r _line; do
                      if [ -n "$_line" ]; then echo "::warning::$_line"; fi
                    done < "$STRIP_LOG"
                    rm -f "$STRIP_LOG"
                    if [ "$HELPER_RC" -ne 0 ]; then
                      echo "::warning::devflow deny-list floor helper ($FILTER_HELPER) exited $HELPER_RC (it is contracted to always exit 0) — failing closed: NO build/verify tools appended to the review profile. This is a helper MALFUNCTION (the helper is unreadable, corrupt, or partially vendored so 'bash' could not run it), NOT an empty prflow_runner.allowed_tools — check the helper, do not re-check your config."
                    elif [ -n "$FILTERED" ]; then
                      TOOLS="$TOOLS,$FILTERED"
                    else
                      echo "::warning::prflow_runner.provision_env is true but prflow_runner.allowed_tools is empty (or empty after deny-list stripping): build-aware review is enabled with NO build tools, so the reviewer has only the read-only profile. Populate prflow_runner.allowed_tools with your build/test/lint tools (e.g. Bash(go:*), Bash(cargo:*)) to enable build-aware review."
                    fi
                  fi
                fi
              fi
              ;;
            *)
              echo "::error::Unknown allowed_tools_profile: $PROFILE"
              exit 1
              ;;
          esac
          # Heredoc form forwards the value verbatim regardless of length or
          # embedded special characters; safe to extend with more profiles
          # without revisiting quoting.
          delim="EOF_$(date +%s%N)_$$"
          {
            printf 'tools<<%s\n' "$delim"
            printf '%s\n' "$TOOLS"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve effort
        id: effort
        env:
          # Resolve input-vs-config once so the claude_args expression below
          # mirrors the shape used by the other workflows (single output ref,
          # no double-evaluated ternary).
          RESOLVED: ${{ inputs.effort != '' && inputs.effort || steps.extract.outputs.effort }}
        run: |
          set -euo pipefail
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"

      # ── Third-party model provider resolution (issue #313) ─────────────────
      # Resolve the prflow_runner section's provider decision from
      # .prflow/config.json via the single-sourced inline jq RESOLVER below. The
      # RESOLVER program is byte-identical across devflow.yml, devflow-implement.yml,
      # and devflow-runner.yml (lib/test/run.sh pins that identity); only the
      # `--arg section` value differs. An empty decision (no provider) reproduces
      # today's Anthropic-OAuth review wiring, so review stays on Claude unless
      # prflow_runner.provider is set. (One deliberate #313 change on this default
      # path: the runner's `--model` now resolves from the TRUSTED BASE-ref config,
      # head only as a bootstrap fallback — see the cargs step's MODEL-fallback
      # comment — so
      # for a given `claude_model` the rendered invocation is unchanged, while a PR
      # can no longer swap the privileged reviewer's model via head config.)
      # See docs/internal/cloud-setup.md.
      - name: Resolve model provider
        id: provider
        env:
          # SECURITY (issue #313 review C1): resolve the runner's provider decision from
          # the TRUSTED BASE ref config (steps.baseprovision — the same source provision_env
          # / setup / allowed_tools already read), NEVER the PR-head steps.cfg. This review
          # runs on the PR head under a write token, so a PR-head-sourced provider could add
          # providers.evil + prflow_runner.provider and redirect the privileged review to an
          # attacker endpoint, exfiltrating DEVFLOW_PROVIDER_API_KEY as a bearer token. Base-ref
          # config is maintainer-controlled; a PR cannot grant itself a provider. ({} on a base
          # with no committed config → default Anthropic path, fail-safe.)
          CONFIG_JSON: ${{ steps.baseprovision.outputs.config_json }}
          SECTION: prflow_runner
        run: |
          set -euo pipefail
          # devflow-provider-resolver BEGIN (single-sourced; keep byte-identical across the three cloud workflows — lib/test/run.sh pins it)
          RESOLVER='
          (if (. | type) == "object" then . else {} end) as $cfg
          | (if (($cfg[$section]) | type) == "object" then $cfg[$section] else {} end) as $sec
          | ($sec.provider) as $praw
          | (if (($sec.claude_model) | type) == "string" and ($sec.claude_model != "") then $sec.claude_model else ($cfg.claude_model // "") end) as $model
          | if ($praw == null or $praw == "") then
              {provider:"", base_url:"", auth:"", timeout_ms:"", effort_supported:true, model:$model, env:{}}
            elif (($praw) | type) != "string" then
              {error:"invalid_provider", section:$section, provider:"", detail:"section provider must be a string"}
            else
              (if (($cfg.providers) | type) == "object" then $cfg.providers else {} end) as $provs
              | if (($provs[$praw]) | type) != "object" then
                  {error:"undefined_provider", section:$section, provider:$praw, detail:"provider is not defined in the providers map"}
                elif (($provs[$praw].auth) as $a | ($a != "bearer" and $a != "api_key" and $a != "bedrock_api_key")) then
                  {error:"incomplete_provider", section:$section, provider:$praw, detail:"provider auth must be one of bearer, api_key, bedrock_api_key"}
                elif (($provs[$praw].auth) as $a | (($a == "bearer" or $a == "api_key") and ((($provs[$praw].base_url) | type) != "string" or ($provs[$praw].base_url == "")))) then
                  {error:"incomplete_provider", section:$section, provider:$praw, detail:"provider entry has no base_url"}
                else
                  ($provs[$praw]) as $p
                  | {provider:$praw, base_url:(if (($p.base_url) | type) == "string" then $p.base_url else "" end), auth:$p.auth, timeout_ms:($p.timeout_ms // ""), effort_supported:(($p.effort_supported // false) == true), model:$model, env:(if (($p.env) | type) == "object" then $p.env else {} end)}
                end
            end
          '
          # devflow-provider-resolver END
          DECISION=$(printf '%s' "$CONFIG_JSON" | jq -c --arg section "$SECTION" "$RESOLVER")
          # jq on EMPTY stdin emits nothing with rc 0, so an empty CONFIG_JSON would
          # otherwise sail through as a zero-output "decision" and silently select the
          # default path (or a misdirected empty-model error downstream). Both producers
          # provably never emit empty today, so this is a fail-loud tripwire, not a live path.
          if [ -z "$DECISION" ]; then
            echo "::error::provider resolver produced no decision for section '$SECTION' (empty config input?). Refusing to run."
            exit 1
          fi
          if [ "$(printf '%s' "$DECISION" | jq -r '.error // ""')" != "" ]; then
            PNAME=$(printf '%s' "$DECISION" | jq -r '.provider // ""')
            DETAIL=$(printf '%s' "$DECISION" | jq -r '.detail // "provider configuration is invalid"')
            echo "::error::.prflow/config.json section '$SECTION' provider '$PNAME': $DETAIL. Fix the providers.$PNAME entry or remove the section provider key. Refusing to run."
            exit 1
          fi
          # One jq pass emits every scalar decision field to the step output, each as a
          # newline-safe heredoc block: a config-sourced value carrying an embedded newline
          # would otherwise split a plain KEY=VALUE line and forge further step outputs. The
          # timestamped+PID delimiter mirrors the decision<< output below.
          sdelim="OUT_EOF_$(date +%s%N)_$$"
          printf '%s' "$DECISION" | jq -r --arg d "$sdelim" '
            ["provider","model","auth","base_url","timeout_ms","effort_supported"][] as $k
            | "\($k)<<\($d)", "\(.[$k])", $d' >> "$GITHUB_OUTPUT"
          # Forward the full decision (it carries the provider env map) to the
          # inject step via a heredoc output so embedded values survive verbatim.
          delim="DEC_EOF_$(date +%s%N)_$$"
          {
            printf 'decision<<%s\n' "$delim"
            printf '%s\n' "$DECISION"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # Anthropic default path (no provider): the review must fail loud if the
      # OAuth token is absent, so relaxing the workflow_call secret to optional
      # (issue #313) never silently degrades the default path (AC 8).
      - name: Require OAuth token on the Anthropic default path
        if: ${{ steps.provider.outputs.provider == '' }}
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # issue #313 shadow S2: the empty provider decision can mean either "no
          # provider configured" OR "the trusted base-ref config could not be read,
          # so a configured provider was ignored". config_source tells them apart so
          # this guard's remedy is not misdirecting.
          CONFIG_SOURCE: ${{ steps.baseprovision.outputs.config_source }}
        run: |
          set -euo pipefail
          if [ -z "$OAUTH" ]; then
            if [ "${CONFIG_SOURCE:-}" = "degraded" ]; then
              # The provider decision reverted to the Anthropic default only because the
              # trusted base config was unreadable this run — do NOT tell the operator
              # "no provider is configured" (it may well be); name the real cause.
              echo "::error::The trusted base-ref .prflow/config.json could not be read this run, so any prflow_runner.provider routing was ignored and the review fell back to the Anthropic default path — but the CLAUDE_CODE_OAUTH_TOKEN secret is empty. Fix the base-branch config (a configured provider would then be honored) or set CLAUDE_CODE_OAUTH_TOKEN. Refusing to run."
            else
              echo "::error::No model provider is configured for the prflow_runner section, so the review runs on the Anthropic default path — but the CLAUDE_CODE_OAUTH_TOKEN secret is empty. Set it (or configure prflow_runner.provider + DEVFLOW_PROVIDER_API_KEY). Refusing to run."
            fi
            exit 1
          fi

      # Export the routed provider's effort capability to the JOB env for the
      # in-session resolve-review-overrides.py. Keep it ungated: a `provider != ''`
      # gate leaves the default path relying on the resolver's fail-open (#1772).
      - name: Export provider effort capability to job env
        env:
          EFFORT_SUPPORTED: ${{ steps.provider.outputs.effort_supported }}
        run: |
          set -euo pipefail
          printf 'PRFLOW_EFFORT_SUPPORTED=%s\n' "$EFFORT_SUPPORTED" >> "$GITHUB_ENV"

      # Compute the claude_args head so --model is always present and --effort is
      # dropped only for a provider whose effort_supported is false (AC 7). The
      # Anthropic default path resolves effort_supported=true, so effort is
      # preserved there (for a non-empty effort value — the run body's
      # flag-injection guard enum-validates effort and allowlist-validates the
      # model id, rejecting flag-shaped or out-of-charset values).
      - name: Build claude_args head (model + conditional effort)
        id: cargs
        env:
          # The runner's provider decision (incl. model) is resolved from the TRUSTED BASE
          # config (see the Resolve step's SECURITY note). The fallback below fires whenever
          # the base-resolved model is empty — from ANY cause, the motivating one being a repo
          # bootstrapping devflow via this very PR whose base ref carries no committed config —
          # by reading the head-config claude_model (steps.extract, whose own empty-claude_model
          # guard still fail-closes). A head-sourced model string cannot redirect the endpoint
          # or leak the secret (both come from the base decision), and the run body below
          # rejects flag-shaped (leading-dash) tokens and any character outside a
          # conservative model-id allowlist — and enum-validates EFFORT — so it cannot
          # smuggle extra CLI flags either;
          # --model is never empty while the trust boundary holds.
          MODEL: ${{ steps.provider.outputs.model != '' && steps.provider.outputs.model || steps.extract.outputs.claude_model }}
          EFFORT: ${{ steps.effort.outputs.value }}
          EFFORT_SUPPORTED: ${{ steps.provider.outputs.effort_supported }}
        run: |
          set -euo pipefail
          if [ -z "$MODEL" ]; then
            echo "::error::claude_model is missing from .prflow/config.json (set a top-level claude_model, or a per-section claude_model). Refusing to run."
            exit 1
          fi
          # SECURITY: MODEL and EFFORT are spliced UNQUOTED into claude_args (a folded
          # CLI string), and the runner can read either from PR-head config (EFFORT
          # always via steps.extract when the caller passes no effort input; MODEL in
          # the bootstrap fallback) — so refuse any value that could smuggle an extra
          # CLI flag. A blacklist is NOT enough here: the action tokenises claude_args
          # shell-style, so a flag-shaped single token (`--model --evil`) records
          # --model as valueless and passes --evil through as its own flag, and a
          # bytewise [[:space:]] check misses Unicode whitespace (NBSP/U+2028/U+3000)
          # under a non-UTF-8 runner locale while the JS tokeniser still splits on it.
          # So MODEL is validated POSITIVELY: reject a leading dash, then reject any
          # character outside the conservative model-id allowlist
          # A-Za-z0-9 . _ / : @ [ ] -  (covers claude-*, provider/model,
          # bracket-suffix context-window ids like name-1.2[1m], and Bedrock-style
          # colon ids) — a
          # multibyte character is rejected in every locale because none of its bytes
          # (C locale) nor its codepoint (UTF-8 locale) is in the allowlist. EFFORT is
          # pinned to its schema enum (or empty, which drops the flag below). In the
          # negated bracket expression, `]` sits first after `!` and `-` last, making
          # both literal members of the set.
          case "$MODEL" in
            -*)
              echo "::error::claude_model value is flag-shaped (leading dash) — refusing to compose claude_args (flag-injection guard; the model must be a single non-dash-leading token)."
              exit 1 ;;
            *[!]A-Za-z0-9._/:@[-]*)
              echo "::error::claude_model value contains a character outside the model-id allowlist (A-Za-z0-9 . _ / : @ [ ] -) — refusing to compose claude_args (flag-injection guard)."
              exit 1 ;;
          esac
          case "$EFFORT" in
            '' | low | medium | high | xhigh | max) : ;;
            *)
              echo "::error::effort value is not one of low/medium/high/xhigh/max — refusing to compose claude_args (flag-injection guard)."
              exit 1 ;;
          esac
          ARGS="--model $MODEL"
          # --effort only when the provider supports it AND a value actually resolved. The
          # config effort defaults to "high", so the default path always has one; the -n
          # co-guard just avoids ever handing the CLI a valueless --effort on a pathological
          # empty effort.
          if [ "$EFFORT_SUPPORTED" = "true" ] && [ -n "$EFFORT" ]; then
            ARGS="$ARGS --effort $EFFORT"
          fi
          # Newline-safe heredoc output (mirrors the resolver's decision<< / scalar-output form).
          adelim="OUT_EOF_$(date +%s%N)_$$"
          { printf 'args<<%s\n' "$adelim"; printf '%s\n' "$ARGS"; printf '%s\n' "$adelim"; } >> "$GITHUB_OUTPUT"

      # A local `uses: ./…` action runs the WORKSPACE copy, and this job checks out
      # the PR head — so never let the trusted bytes fall back to the PR-head copy,
      # or a PR editing this action runs its own edit in the review job (issue #1388).
      - name: Harden setup-project-env onto trusted base-ref bytes
        id: hardensetup
        if: steps.baseprovision.outputs.provision_env == 'true'
        shell: bash
        env:
          # Same trusted derivation as baseprovision's BASE_REF — the PR's target
          # branch, never a PR-controlled value.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [ -n "$BASE_REF" ] || { echo "::error::no BASE_REF to harden setup-project-env against"; exit 1; }
          # Keep the fetch's own diagnostic: this is a fail-closed security arm, and
          # discarding stderr leaves an operator with no way to tell a missing ref from
          # a transport failure on the step that aborts every review run.
          if ! _fetch_err=$(git fetch --depth=1 origin "$BASE_REF" 2>&1 >/dev/null); then
            echo "::error::could not fetch base ref '$BASE_REF' to harden setup-project-env: ${_fetch_err:-no diagnostic}"
            exit 1
          fi
          dir=".github/actions/setup-project-env"
          # Enumerate the action's files as they exist on the TRUSTED base ref and
          # materialize EVERY one over the PR-head copy, so a file the action gains
          # later is covered with no edit to this step (a hardcoded file list would
          # silently leave a new PR-head helper executable in the review job). Then
          # prune any PR-head file NOT present on the base ref, so no PR-authored
          # addition survives. action.yml must exist on the base ref or the action
          # cannot run.
          # while-read, not mapfile: a bash-3.2 self-hosted macOS consumer runner has
          # no mapfile, and this security step failing there would abort every review.
          base_files=()
          while IFS= read -r bf; do base_files+=("$bf"); done < <(git ls-tree -r --name-only FETCH_HEAD -- "$dir")
          [ "${#base_files[@]}" -gt 0 ] || { echo "::error::base ref '$BASE_REF' carries no $dir; refusing to run a PR-head action body"; exit 1; }
          for f in "${base_files[@]}"; do
            mkdir -p "$(dirname "$f")"
            if git show "FETCH_HEAD:$f" > "$f.trusted" 2>/dev/null; then
              mv "$f.trusted" "$f"
            else
              rm -f "$f.trusted"
              echo "::error::could not materialize trusted $f from base ref '$BASE_REF'"; exit 1
            fi
          done
          # Membership by bash builtin, never `grep`: preflight guarantees no grep, and
          # a missing one fails every test on the left of `||`, where set -e cannot
          # fire, and prunes every trusted file this step just materialized.
          _is_base_file() {
            local cand=$1 bf
            for bf in "${base_files[@]}"; do
              [ "$bf" = "$cand" ] && return 0
            done
            return 1
          }
          # A newline-accumulated string, not an array: under `set -u` bash 3.2 treats
          # ${#arr[@]} on a never-assigned-to array as unbound and aborts this
          # security step on the ordinary nothing-to-prune run.
          pruned=""
          while IFS= read -r head_f; do
            if ! _is_base_file "$head_f"; then
              rm -f "$head_f"
              pruned="${pruned}${head_f}"$'\n'
            fi
          done < <(git ls-files -- "$dir")
          [ -f "$dir/action.yml" ] || { echo "::error::base ref '$BASE_REF' carries no $dir/action.yml; refusing to run a PR-head action body"; exit 1; }
          chmod +x "$dir"/*.sh 2>/dev/null || true
          # Disclose what this step displaced. Without it the reviewing agent reads
          # these base-ref bytes as untouched PR-head content — on exactly the file a
          # PR editing this action is under review for.
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            _hs_d="HARDENSETUP_EOF_$(date +%s%N)_$$"
            {
              printf 'displaced_setup_paths<<%s\n' "$_hs_d"
              printf '%s\n' "${base_files[@]}"
              [ -n "$pruned" ] && printf '%s' "$pruned"
              printf '%s\n' "$_hs_d"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "hardened setup-project-env from trusted base ref '$BASE_REF'"

      # Provision the runtime BEFORE Claude runs, but ONLY when the trusted base
      # config opted in via prflow_runner.provision_env. config_json is the
      # BASE ref's config (steps.baseprovision), never the PR head, so PR edits
      # to `setup.install` cannot inject commands here — the same trust boundary
      # setup-project-env already documents for `services`. The action BODY is now
      # the trusted base-ref copy too (hardensetup above), closing the residual
      # PR-head-action-body vector for the review job. lint_mode is `none`: no
      # manifest-derived bytes may enter the read-only review job (issue #1388).
      # When the flag is absent/false this step is skipped and the runner behaves
      # exactly as before: read-only, no build tools.
      - name: Provision project environment (opt-in)
        id: provision
        if: steps.baseprovision.outputs.provision_env == 'true'
        uses: ./.github/actions/setup-project-env
        with:
          config_json: ${{ steps.baseprovision.outputs.config_json }}
          lint_mode: none

      # Provisioning is best-effort: a service container that never becomes
      # healthy emits a `::warning::` and the job continues (see
      # setup-project-env), so a build/verify command that then fails for lack of
      # that dependency would otherwise look like a PR defect to the reviewer.
      # When the action reports degraded services via its `health_summary` output,
      # prepend a fenced infra-status note to the reviewer prompt instructing it to
      # blame infrastructure, not the PR. This step is deliberately NOT gated on
      # provision_env: when the provision step is skipped (or every service is
      # healthy) the output resolves to empty and the prompt is forwarded
      # byte-for-byte unchanged, so the read-only happy path is unaffected.
      #
      # The engine is also given GROUND TRUTH about two things it otherwise burns
      # turns rediscovering (issue #363): the exact set of commands it may run, and
      # the CI results that already exist for the head it is reviewing. Without this
      # the engine probes its own boundary by attempting denied commands — on PR #340
      # seven of fourteen denials were it trying, seven ways, to run the test suite —
      # and can consume an entire run without producing a verdict. This block is
      # prepended on EVERY review run, independently of health_summary.
      - name: Compose CI summary (pre-displacement)
        id: ci_summary
        env:
          # The job's own GITHUB_TOKEN, whose `permissions:` block declares the
          # `checks: read` + `actions: read` the CI check-runs query needs. The
          # downscoped DevFlow-Reviewer token is minted LATER (it posts the
          # review), so it is deliberately not used here.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # summarize-ci-checks.sh excludes DevFlow's own workflow run from the CI
          # signal set by this name; without it the summarizer falls back to a
          # hard-coded literal and stops excluding the reviewer's own run.
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          # AC5 (#504): this step computes HEAD_SHA + CI_SUMMARY BEFORE
          # harden_hooks, because summarize-ci-checks.sh sources lib/resolve-jq.sh
          # — a HOOK_TARGETS closure member — so on a stub arm post-displacement
          # the exit-0 stub would terminate the summarizer and the block would
          # read "CI status unavailable" on a head whose API conclusions are
          # green. The Compose review prompt step (after harden) consumes these
          # outputs and runs only the renderer (which sources nothing).
          # The reviewed head is the commit `actions/checkout` put in the worktree.
          HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || echo "")
          # summarize-ci-checks.sh always exits 0, printing `CI status unavailable`
          # when it cannot determine the CI state — so the block is present even when
          # the query fails, and an absent result never renders as a passing one.
          SCC=.prflow/vendor/prflow/scripts/summarize-ci-checks.sh
          [ -f "$SCC" ] || SCC=scripts/summarize-ci-checks.sh
          if [ -f "$SCC" ]; then
            # HEAD_SHA is a run:-local variable (computed above), NOT a step env:
            # entry, so it is passed to the summarizer subprocess inline — the
            # summarizer reads HEAD_SHA from its environment and fail-closes to
            # `CI status unavailable` if it is empty, so without this the CI
            # ground-truth section (issue #363) would regress on every run.
            CI_SUMMARY=$(HEAD_SHA="$HEAD_SHA" bash "$SCC") || CI_SUMMARY="CI status unavailable"
          else
            echo "::warning::devflow: summarize-ci-checks.sh not found at either the vendored or repo path — the review prompt's CI section will report it unavailable" >&2
            CI_SUMMARY="CI status unavailable"
          fi
          [ -n "$CI_SUMMARY" ] || CI_SUMMARY="CI status unavailable"
          # Publish HEAD_SHA (single-line) and CI_SUMMARY (multi-line, heredoc
          # with a timestamped delimiter — the summary carries check names that can
          # hold backticks/markdown) as step outputs the compose step consumes.
          printf 'HEAD_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          _cs_d="CI_SUMMARY_EOF_$(date +%s%N)_$$"
          {
            printf 'CI_SUMMARY<<%s\n' "$_cs_d"
            printf '%s\n' "$CI_SUMMARY"
            printf '%s\n' "$_cs_d"
          } >> "$GITHUB_OUTPUT"

      # Optional, opt-in: mint a DEDICATED DevFlow-Reviewer GitHub App
      # installation token DOWNSCOPED to what the review agent actually does —
      # read the repo/issue/CI and post comments, reviews, approvals, and
      # rejections. `contents: read` (never write) is what makes a branch push
      # impossible for the review path, and the permission-* inputs are the SOLE
      # enforcement of least privilege (an App installation token ignores the
      # job's `permissions:` block). Gated on the DEVFLOW_REVIEWER_APP_ID
      # repository VARIABLE (the dedicated reviewer app, NOT the primary app that
      # authors PRs — this review-only runner carries no reference to that app):
      # unset/empty → the step is skipped and github_token below falls back to
      # GITHUB_TOKEN (`github-actions[bot]`), NEVER the primary app token — so
      # the review identity is structurally distinct from the PR author on every
      # configured setup, and Phase 4.4's self-review is never forbidden (issue
      # #300). NO continue-on-error: a configured-but-broken reviewer App
      # (invalid/rotated key, or an installation not granted these permissions)
      # fails the job here rather than silently degrading to GITHUB_TOKEN.
      - name: Mint downscoped DevFlow-Reviewer token (optional)
        id: reviewer-token
        if: ${{ vars.DEVFLOW_REVIEWER_APP_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVFLOW_REVIEWER_APP_ID }}
          private-key: ${{ secrets.DEVFLOW_REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
          permission-actions: read

      # SECURITY — harden the base-branch `.claude/settings.json` Stop-hook script
      # sources (issue #458). claude-code-action restores `.claude/` (the hook
      # CONFIG) from the base branch, but the three Stop-hook COMMANDS exec script
      # files under lib/ and scripts/ — NOT under .claude/ — so this job's PR-HEAD
      # checkout (ref: inputs.ref) supplies them. A PR that edits any of
      # lib/efficiency-trace.sh, lib/implement-stop-guard.sh, or
      # scripts/stop-hook-probe.sh would otherwise obtain unmediated shell at
      # session end inside this secrets-bearing job, bypassing the #402 deny-floor
      # entirely (the #404 REJECT class: a floor the PR controls is no floor).
      #
      # Same trusted-source pattern as the deny-floor: BEFORE claude-code-action
      # runs, overwrite each hook target in the PR-head workspace with the TRUSTED
      # base-ref copy (materialized here via `git show FETCH_HEAD:…`), and where no
      # base copy exists overwrite it with a fail-closed no-op stub — NEVER left as
      # the PR-head copy.
      #
      # issue #908 review (Critical/security): the PreToolUse guard is registered
      # UNCONDITIONALLY by the `settings:` input on the "Run Claude Code" step below —
      # independent of whether the trusted base .claude/settings.json wires ANY Stop
      # hook, which is the relevance gate the NEXT step (harden_hooks) applies to the
      # Stop-hook TARGETS. That gate correctly skips Stop-hook hardening when a consumer
      # repo never wires Stop hooks (there is genuinely nothing to harden there), but the
      # guard is a DIFFERENT, always-live entry point this issue adds — its hardening
      # must never ride on that gate, or a PR-head copy of scripts/pretooluse-shape-guard.py
      # (and the lib/test/extract-command-shapes.py it dynamically imports) executes in
      # THIS secrets-bearing job on every Bash call the run makes (the #402/#404 "a floor
      # the PR controls is no floor" class, reopened through this second registration
      # channel). So this step is deliberately separate from, and unconditioned by,
      # harden_hooks' relevance gate: it ALWAYS materializes a trusted base copy of the
      # guard closure, or — on any failure to do so — ALWAYS stubs it inline (fail-closed).
      - name: Harden PreToolUse guard closure (unconditional)
        id: harden_guard
        env:
          # Same TRUSTED base ref the harden_hooks step below reads — never a
          # PR-controlled input.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          # issue #908 review (Important/security, resolved): the registered PreToolUse
          # hook tries the VENDORED guard path FIRST (`.prflow/vendor/prflow/scripts/
          # pretooluse-shape-guard.py`) and only falls back to the repo-root path when
          # the vendored one is absent. Hardening only the repo-root GUARD_TARGETS left
          # a consumer repo that COMMITS its vendored plugin (vendor_source=committed,
          # which #402/#404 treats as PR-author-editable/untrusted) with NOTHING
          # hardened: none of the three repo-root paths exist there, so the absent-both-
          # sides skip fired — yet the hook still executed that vendored, PR-head-
          # controlled copy in this secrets-bearing job on every Bash call. VENDOR_SOURCE
          # (this job's own `vendor` step output, declared before this step) is the same
          # trust signal scripts/filter-runner-tools.sh's own floor resolution keys on:
          # a `fetch` value means the vendored tree was cloned from the OFFICIAL repo
          # this run, at the pinned prflow_version, into a gitignored directory the PR
          # can never edit — trusted, no hardening needed. Any other value
          # (`committed`/`self`) means the vendored tree is PR-head content, so it gets
          # the identical trusted-base-copy-or-stub treatment as the repo-root targets.
          VENDOR_SOURCE: ${{ steps.vendor.outputs.vendor_source }}
        run: |
          set +e
          set -uo pipefail
          # Fix-delta gate finding (issue #908 review, iteration 1): lib/test/extract-command-shapes.py
          # itself, at its OWN module top level (unconditional on import, not merely referenced
          # in a comment), dynamically loads lib/test/extract-command-heads.py via the same
          # importlib pattern — so the guard's real trust closure is THREE files deep, not two.
          # Dropping this third member would leave it PR-head/attacker-controlled even with
          # the other two hardened, reopening the exact hole this step exists to close.
          GUARD_TARGETS="scripts/pretooluse-shape-guard.py lib/test/extract-command-shapes.py lib/test/extract-command-heads.py"
          ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          # PREFIX_TOKENS holds one token per closure copy the running hook command can
          # reach: ROOT (the repo-root copy, empty path prefix) always, plus VENDOR (the
          # `.prflow/vendor/prflow/`-prefixed copy) whenever it is NOT freshly fetched
          # from the official repo this run (VENDOR_SOURCE != fetch) — see the
          # VENDOR_SOURCE env comment above for why `fetch` is the one trusted value.
          # Tokens (not a raw empty-string-capable list) sidestep plain-shell
          # word-splitting dropping an empty "root" entry.
          PREFIX_TOKENS="ROOT"
          if [ "${VENDOR_SOURCE:-}" != "fetch" ]; then
            PREFIX_TOKENS="$PREFIX_TOKENS VENDOR"
          fi
          prefix_for_token() {
            case "$1" in
              ROOT) printf '%s' "" ;;
              VENDOR) printf '%s' ".prflow/vendor/prflow/" ;;
            esac
          }
          # Shadow-review finding (issue #908 review, early shadow trigger): the stub
          # write itself must be VERIFIED, not merely attempted — an unverified write
          # is a silent fail-open in exactly the "wholly unwritable path" case this
          # step's whole reason for existing is to close. Mirrors
          # scripts/harden-stop-hooks.sh's own write_stub(): return non-zero on ANY
          # target write failure, and the caller below turns that into a job-failing
          # exit 1 rather than a mere warning — the last-resort arm must genuinely be
          # fail-closed, not fail-open-with-a-warning.
          # ACTED accumulates only the targets this step actually displaced or stubbed,
          # so `guard_paths` discloses what was really rewritten rather than the static
          # GUARD_TARGETS list (issue #908 confirmatory review).
          ACTED=""
          stub_guard() {
            stub_failed=0
            for _tok in $PREFIX_TOKENS; do
              _prefix="$(prefix_for_token "$_tok")"
              for t in $GUARD_TARGETS; do
                vt="${_prefix}${t}"
                d="$ROOT/$vt"
                # Nothing at this path in the working tree means there is no copy — PR-head
                # or otherwise — that could execute, so there is nothing to stub. Skipping
                # is what keeps a CONSUMER repo (where none of these DevFlow-internal paths
                # exist) from having phantom scripts/ and lib/test/ files created in its
                # checkout, plus a spurious ::warning:: on every auto-review — the issue-#502
                # class. Fail-closed is preserved: the hazard this arm exists to close is a
                # PR-controlled file that EXISTS, and that case still takes the stub below.
                # `-e` FOLLOWS symlinks, so it reads a DANGLING symlink as "nothing here"
                # (issue #908 confirmatory review, Critical/security): a PR-added broken
                # symlink at a guard path would be neither displaced nor stubbed, and
                # materializing its target later in the job would reopen PR-controlled
                # execution in this secrets-bearing job. Pair it with `-L`, which sees the
                # link itself, so only a genuinely-absent path is skipped.
                if [ ! -e "$d" ] && [ ! -L "$d" ]; then
                  continue
                fi
                mkdir -p "${d%/*}" 2>/dev/null || true
                # Unlink a symlink dest first: a `>` write through a PR-controlled symlink
                # would land the stub bytes at the link's resolved target, leaving the
                # symlink itself at the hook path (and, for an absolute link, writing
                # outside the workspace) — mirrors harden_hooks' own symlink handling.
                [ -L "$d" ] && rm -f "$d" 2>/dev/null
                if [ "${t##*.}" = "py" ]; then
                  _stub_ok=0; printf '#!/usr/bin/env python3\nimport sys\nsys.exit(0)\n' > "$d" 2>/dev/null && _stub_ok=1
                else
                  _stub_ok=0; printf '#!/usr/bin/env bash\nexit 0\n' > "$d" 2>/dev/null && _stub_ok=1
                fi
                if [ "$_stub_ok" -eq 1 ]; then
                  chmod +x "$d" 2>/dev/null || true
                  ACTED="$ACTED $vt"
                else
                  stub_failed=1
                  echo "::warning::harden-guard: could not stub '$vt' (wholly unwritable); the PR-head copy MAY REMAIN." >&2
                fi
              done
            done
            return "$stub_failed"
          }
          ok=0
          if [ -n "${BASE_REF:-}" ] && git fetch --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
            ok=1
            for _tok in $PREFIX_TOKENS; do
              _prefix="$(prefix_for_token "$_tok")"
              for t in $GUARD_TARGETS; do
                vt="${_prefix}${t}"
                d="$ROOT/$vt"
                if raw=$(git show "FETCH_HEAD:$vt" 2>/dev/null); then
                  [ -L "$d" ] && rm -f "$d" 2>/dev/null
                  mkdir -p "${d%/*}" 2>/dev/null || true
                  if ! printf '%s\n' "$raw" > "$d" 2>/dev/null; then
                    ok=0
                  else
                    ACTED="$ACTED $vt"
                  fi
                elif [ ! -e "$d" ] && [ ! -L "$d" ]; then
                  # `-L` pairs with `-e` for the dangling-symlink shape — see stub_guard().
                  # Absent on the trusted base ref AND absent from the PR-head working
                  # tree: there is no copy of this target anywhere, so no PR-controlled
                  # bytes can execute and there is nothing to displace. This is the
                  # CONSUMER-repo shape (these three paths are DevFlow-repo-internal;
                  # a consumer vendors the plugin under .prflow/vendor/prflow/), and
                  # without this arm every consumer auto-review took the stub path,
                  # emitting a spurious deployment-fault ::warning:: and creating phantom
                  # scripts/ and lib/test/ files in the consumer's checkout — the
                  # issue-#502 class. The working-tree half of the predicate is what keeps
                  # this security-preserving: a target the PR ADDS is present at "$d", so
                  # it fails this test and still routes to the fail-closed stub arm.
                  :
                else
                  ok=0
                fi
              done
            done
          fi
          if [ "$ok" -ne 1 ]; then
            echo "::warning::harden-guard: could not materialize a trusted base copy of the PreToolUse guard closure (base-ref fetch or git-show failure); stubbing it inline (fail-closed) so no PR-head copy of it can execute in this secrets-bearing job." >&2
            if stub_guard; then
              # "guard-" prefixed, distinct from harden_hooks' own disposition= values
              # (issue #908 review) — the two steps' outputs are otherwise unrelated, and
              # an unprefixed literal here would collide with the #504 AC1 uniqueness pin
              # on harden_hooks' own displaced-disposition output below.
              printf 'disposition=guard-stubbed\n' >> "$GITHUB_OUTPUT"
            else
              # LAST-RESORT arm: the stub write itself failed for one or more targets, so
              # the PR-head copy MAY REMAIN executable. Merely warning and exiting 0 would
              # let "Run Claude Code" proceed with that PR-controlled guard closure
              # INTACT in this secrets-bearing job — the exact fail-OPEN this step exists
              # to prevent (mirrors harden_hooks' own stub_failed -> exit 1 arm). FAIL the
              # job so no PR-controlled guard fires.
              echo "::error::harden-guard: one or more PreToolUse guard closure targets could NOT be stubbed (wholly unwritable path); the PR-head copy MAY REMAIN. Failing the job BEFORE Run Claude Code so no PR-controlled guard hook fires in this secrets-bearing review — inspect the runner." >&2
              exit 1
            fi
          elif [ -n "$ACTED" ]; then
            printf 'disposition=guard-displaced\n' >> "$GITHUB_OUTPUT"
          else
            # Every target was skipped as absent from BOTH the base ref and the working
            # tree — the consumer-repo shape. Reporting `guard-displaced` here would claim
            # an action that did not occur (issue #908 confirmatory review); this run
            # displaced nothing because there was nothing anywhere to displace.
            printf 'disposition=guard-absent\n' >> "$GITHUB_OUTPUT"
          fi
          # Shadow-review finding (issue #908 review, early shadow trigger): publish the
          # displaced/stubbed GUARD_TARGETS as this step's own `guard_paths` output
          # (the key written below and consumed as steps.harden_guard.outputs.guard_paths;
          # `displaced_paths` is harden_hooks' own key, not this step's),
          # mirroring harden_hooks' AC1 (#504) contract — every displacement publishes its
          # displaced-path set. Without this, the #504 grounding-block renderer never
          # learns these three files were displaced/stubbed (harden_hooks' own
          # displaced_paths only covers ITS relevance-gated TARGETS, which the harden_hooks
          # skip arm — the exact consumer-repo case harden_guard exists to still cover —
          # leaves empty), so a reviewing agent could read this step's rewritten working-
          # tree bytes as though they were untouched PR-head content. Reached on both the
          # displaced and stubbed arms (the exit-1 last-resort arm above never reaches
          # here, by design — the job has already failed).
          # Publish only what was actually rewritten (ACTED), not the static GUARD_TARGETS
          # list: in a consumer repo none of the three exist, so nothing is displaced and
          # this is legitimately EMPTY — publishing all three there would be a false
          # displacement disclosure, telling a reviewing agent to route reads through
          # `git show` for paths this step never touched.
          # De-duplicate: a target that displaced successfully before a LATER target
          # forced ok=0 is appended again by stub_guard()'s own pass, so the raw list can
          # carry the same path twice and the joined hardened_paths the grounding block
          # renders would repeat it (issue #908 confirmatory review).
          ACTED_UNIQ=""
          for _a in $ACTED; do
            case " $ACTED_UNIQ " in
              *" $_a "*) : ;;
              *) ACTED_UNIQ="$ACTED_UNIQ $_a" ;;
            esac
          done
          _908_gd="GUARDDISP_EOF_$(date +%s%N)_$$"
          {
            printf 'guard_paths<<%s\n' "$_908_gd"
            # Unquoted on purpose: word-splitting turns the accumulated space-separated
            # list into one path per line. Empty ACTED_UNIQ yields no lines at all.
            # shellcheck disable=SC2086
            [ -n "$ACTED_UNIQ" ] && printf '%s\n' $ACTED_UNIQ
            printf '%s\n' "$_908_gd"
          } >> "$GITHUB_OUTPUT"

      # The installer logic is the suite-driven, unit-tested helper
      # scripts/harden-stop-hooks.sh, executed ONLY from a TRUSTED source
      # (rank 1: base-ref materialized copy; rank 2: the vendored copy gated on
      # vendor_source=fetch — never the PR-head checkout, which the PR can edit).
      # When no trusted helper resolves the step fails closed INLINE (trusted
      # workflow shell), stubbing every target. The implement job needs no such
      # step: it checks out the DEFAULT branch (never a PR head), so its hook
      # scripts are already trusted. See docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md.
      - name: Harden Stop-hook script sources (trusted base copy or fail-closed stub)
        id: harden_hooks
        env:
          # Same TRUSTED base ref the baseprovision step reads (the PR's target
          # branch, or the repo default) — never a PR-controlled input.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          # Only 'fetch' (a fresh official-repo clone at the pinned prflow_version)
          # is a trusted source for the helper; committed/self copies are PR-head.
          VENDOR_SOURCE: ${{ steps.vendor.outputs.vendor_source }}
        run: |
          # errexit OFF, EXPLICITLY (PR #461; live failure: Actions run 29285485078).
          # GitHub's default `run:` shell is `bash -e {0}`, so errexit arrives ON even
          # though this step declares only `set -uo pipefail`. The step is authored for
          # explicit rc handling — every failure path is an rc-checked arm ending in a
          # fail-closed stub, a warning, or `exit 1` — and expected-non-zero commands
          # run OUTSIDE condition position (e.g. the compound `git show` read below of a
          # .claude/settings.local.json that is absent at the base ref, git rc 128).
          # Under inherited errexit the first such command aborts the whole step BEFORE
          # any fail-closed arm can run. `set +e` makes the declared option set the real
          # one; the #460-errexit suite block executes this step under `bash -e` and
          # goes RED if this line is dropped.
          set +e
          set -uo pipefail
          # COUPLED mirror of scripts/harden-stop-hooks.sh's HOOK_TARGETS — the FULL
          # transitive source/exec closure of the .claude/settings.json Stop-hook scripts
          # plus the #805 PreToolUse guard, not just the entry points (issue #458 REJECT). Byte-identical to the
          # helper's HOOK_TARGETS and pinned equal in lib/test/run.sh. Used both to
          # materialize the trusted base copies AND, on the fail-closed arm, to stub
          # every target inline. A file dropped here silently leaves that PR-head script
          # executable (or un-materialized, so the helper stubs it).
          TARGETS="lib/efficiency-trace.sh lib/implement-stop-guard.sh scripts/stop-hook-probe.sh scripts/pretooluse-shape-guard.py lib/resolve-jq.sh lib/config-source.sh lib/resolve-bin.sh lib/telemetry-branch.sh lib/resolve-state-dir.sh scripts/config-get.sh scripts/config_fingerprint.py scripts/workpad.py scripts/check-completion-evidence.py scripts/reception_identity.py lib/test/extract-command-shapes.py lib/test/extract-command-heads.py"
          ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          TRUSTED_DIR=""
          HELPER=""
          SKIP_HARDEN=0
          # The ENTRY hooks whose presence in the TRUSTED base .claude/settings.json is
          # what makes this hardening relevant at all (issue #460 review, FP1). COUPLED
          # mirror of harden-stop-hooks.sh's HOOK_ENTRY_TARGETS (pinned in lib/test/run.sh)
          # — this is the INLINE FALLBACK the gate uses when no trusted helper resolved, so
          # a member the helper's --wired-check scans and this list omits makes the two
          # selectors disagree on the same settings file. Since #805 the list carries the
          # PreToolUse guard alongside the three Stop-hook entries.
          ENTRY_TARGETS="lib/efficiency-trace.sh lib/implement-stop-guard.sh scripts/stop-hook-probe.sh scripts/pretooluse-shape-guard.py"
          # Rank 1: materialize the trusted hook copies AND the trusted helper from
          # the base ref. `origin` is the upstream repo, so the base tip is the
          # maintainer-controlled tree, not the PR head. Only inside this fetch-
          # success branch is FETCH_HEAD the base ref (checkout may leave it at the
          # PR head elsewhere) — mirrors baseprovision's FLOOR_HELPER discipline.
          if [ -n "${BASE_REF:-}" ] && git fetch --depth=1 origin "$BASE_REF" >/dev/null 2>&1; then
            # Read the TRUSTED base .claude/settings.json (for the relevance gate below),
            # then resolve the trusted helper: committed vendor copy first, then the
            # repo's own scripts/ copy ONLY when the base ref IS the DevFlow plugin repo
            # (same plugin.json-name discriminator baseprovision uses), so a consumer's
            # unrelated like-named script is never executed. Resolved BEFORE the gate so
            # the gate can decide via the helper's tested --wired-check mode.
            # Read BOTH .claude/settings.json AND .claude/settings.local.json (issue #460
            # SHADOW): claude-code-action restores ALL of .claude/ from base, so a Stop hook
            # wired via a base-tracked settings.local.json is just as live as one in
            # settings.json — reading only settings.json would be a fail-OPEN (gate reads
            # 'not wired' → skips while the action restores+fires the local-file hook). Both
            # blobs are concatenated so the wiring scan below sees either; a gitignored
            # (untracked) settings.local.json is not in the base tree, so `git show` yields
            # nothing for it and it is correctly ignored.
            SETTINGS_JSON="$(git show "FETCH_HEAD:.claude/settings.json" 2>/dev/null; git show "FETCH_HEAD:.claude/settings.local.json" 2>/dev/null)"
            if raw=$(git show "FETCH_HEAD:.prflow/vendor/prflow/scripts/harden-stop-hooks.sh" 2>/dev/null); then
              printf '%s\n' "$raw" > "$RUNNER_TEMP/harden-stop-hooks.sh" 2>/dev/null && HELPER="$RUNNER_TEMP/harden-stop-hooks.sh"
            elif [ -n "${DEVFLOW_PLUGIN_NAME_ERE:-}" ] \
              && git show "FETCH_HEAD:.claude-plugin/plugin.json" 2>/dev/null | grep -Eq "$DEVFLOW_PLUGIN_NAME_ERE" \
              && raw=$(git show "FETCH_HEAD:scripts/harden-stop-hooks.sh" 2>/dev/null); then
              printf '%s\n' "$raw" > "$RUNNER_TEMP/harden-stop-hooks.sh" 2>/dev/null && HELPER="$RUNNER_TEMP/harden-stop-hooks.sh"
            fi
            # RELEVANCE GATE (issue #460 review, FP1 + PT2): install.sh ships
            # devflow-runner.yml to consumer repos, but DevFlow's own .claude/settings.json
            # Stop hooks do NOT ship. In a consumer whose TRUSTED base settings.json does
            # not wire these hooks there is nothing to harden — and stubbing/creating the
            # hardened closure over same-named consumer files would be a wrong verdict (the
            # emitted skip notice below states that rationale for the consumer to read, and
            # lib/test/run.sh pins it there rather than in this explanatory comment). So
            # harden ONLY when the trusted base settings.json wires an entry
            # hook. DECIDE VIA THE TRUSTED HELPER'S --wired-check MODE — the single,
            # lib/test/run.sh-driven source of truth for this selection — falling back to
            # an inline substring scan only when no trusted helper resolved. Keyed on the
            # BASE ref, never the PR head: a PR cannot strip its own settings wiring to
            # dodge the floor while claude-code-action still restores the base hooks. The
            # read now covers BOTH settings.json and settings.local.json (above), the two
            # base-tracked .claude/ files that can wire a Stop hook, so a wiring split
            # across them cannot silently un-gate the floor.
            HOOKS_WIRED=0
            # FAIL-CLOSED READ (issue #460 SHADOW, SF-fail-open): an EMPTY SETTINGS_JSON is
            # ambiguous — it means EITHER the base ref has no .claude/settings.json (a
            # consumer without these hooks → correctly skip) OR the file EXISTS at base but
            # `git show` read back empty despite a successful fetch (a transient/corrupt
            # read). --wired-check / the inline scan would read BOTH as "not wired" and skip
            # — dropping DevFlow's OWN floor on the second case (a PR editing a closure
            # script would then run unmediated shell in this secrets-bearing job). So when
            # SETTINGS_JSON is empty, distinguish the two with `git cat-file -e`: EITHER blob
            # EXISTS → inconclusive read → harden anyway (fail closed); BOTH blobs ABSENT →
            # genuinely no hooks → skip. Only a READABLE, non-empty settings read is decided
            # by wiring.
            if [ -z "$SETTINGS_JSON" ]; then
              _settings_present=0
              git cat-file -e "FETCH_HEAD:.claude/settings.json" 2>/dev/null && _settings_present=1
              git cat-file -e "FETCH_HEAD:.claude/settings.local.json" 2>/dev/null && _settings_present=1
              if [ "$_settings_present" -eq 1 ]; then
                HOOKS_WIRED=1
                echo "::warning::harden-stop-hooks: a base .claude/settings*.json exists at the base ref but read back empty after a successful fetch — hardening anyway (fail-closed) rather than inferring 'not wired' and dropping the floor."
              fi
            elif [ -n "$HELPER" ]; then
              # Distinguish the helper's THREE outcomes (issue #460 SHADOW, Obs A): rc 0 =
              # wired (harden); rc 1 = a CLEAN "not wired" verdict (trust it); rc >= 2 = the
              # helper ERRORED (a corrupt/unparseable trusted-materialized copy, etc.) — NOT
              # a verdict. Treating an error as "not wired" would skip and drop DevFlow's own
              # floor (fail OPEN), so on any non-1 error request the inline substring scan
              # (below) rather than skipping. Read the rc in the `else` of the `if <pipeline>`
              # (the sanctioned else-RC idiom), never a later $?.
              if printf '%s' "$SETTINGS_JSON" | bash "$HELPER" --wired-check; then
                HOOKS_WIRED=1
              else
                _wc_rc=$?
                if [ "$_wc_rc" -ne 1 ]; then
                  echo "::warning::harden-stop-hooks: --wired-check helper errored (rc=$_wc_rc, not a clean 0/1 verdict) — falling back to the inline settings scan (fail-closed) rather than inferring 'not wired'."
                  _need_inline_scan=1
                fi
              fi
            else
              _need_inline_scan=1
            fi
            # SINGLE inline substring scan (issue #460 SHADOW), reached when no trusted
            # helper resolved OR the helper errored (rc>=2) — kept in ONE place so the
            # selection has exactly one pinned copy. It only reads a NON-EMPTY SETTINGS_JSON
            # (the empty-read arm set HOOKS_WIRED / SKIP directly above and never sets the
            # flag), so it cannot mis-fire on an empty blob.
            if [ "${_need_inline_scan:-0}" -eq 1 ]; then
              for e in $ENTRY_TARGETS; do
                case "$SETTINGS_JSON" in *"$e"*) HOOKS_WIRED=1 ;; esac
              done
            fi
            if [ "$HOOKS_WIRED" -eq 0 ]; then
              SKIP_HARDEN=1
              echo "::notice::harden-stop-hooks: the trusted base .claude/settings.json does not wire the DevFlow Stop hooks — nothing to harden; skipping (this repo does not use the base-hook channel this floor protects, and stubbing/creating the DevFlow-layout closure paths would clobber a same-named consumer file)."
            else
              TRUSTED_DIR="$RUNNER_TEMP/devflow-trusted-hooks"
              for t in $TARGETS; do
                if raw=$(git show "FETCH_HEAD:$t" 2>/dev/null); then
                  if mkdir -p "$TRUSTED_DIR/${t%/*}" 2>/dev/null; then
                    # Checked write (issue #460 review, SF4): a partial/empty file left by a
                    # failed write must NOT later be installed as a "trusted base copy" — remove
                    # the residue so the helper stubs (fail-closed) instead of copying a corrupt
                    # hook with a success breadcrumb.
                    if ! printf '%s\n' "$raw" > "$TRUSTED_DIR/$t" 2>/dev/null; then
                      rm -f "$TRUSTED_DIR/$t" 2>/dev/null || true
                      echo "::warning::harden-stop-hooks: failed to materialize the trusted base copy of '$t'; it will be stubbed (fail-closed) rather than installed corrupt."
                    fi
                  fi
                fi
              done
            fi
          else
            echo "::warning::harden-stop-hooks: could not fetch base ref '${BASE_REF:-}' to materialize trusted Stop-hook copies; failing closed (no-op stubs for every hook target). NOTE (issue #460 review, FP-S1): in a CONSUMER repo a base-ref fetch failure means the relevance gate cannot run, so the DevFlow-layout closure paths are stubbed/created over any same-named consumer files during this (read-only) review — a deliberate fail-closed-over-consumer-fidelity trade, disclosed in docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md."
          fi
          # RELEVANCE GATE early-out (issue #460 review, FP1): the trusted base ref
          # demonstrably does not wire these Stop hooks, so there is nothing to harden
          # and stubbing would clobber consumer files — exit cleanly before the helper
          # / inline-stub arms run. (A fetch FAILURE does NOT set this — it stays on the
          # fail-closed path so DevFlow's own protection is never dropped on a transient
          # base-ref fetch error.)
          if [ "$SKIP_HARDEN" -eq 1 ]; then
            # AC1 (#504): the relevance gate skipped hardening — publish empty
            # displaced_paths + "skipped" so the compose step forwards an empty
            # HARDENED_PATHS (the renderer renders no displaced-paths section).
            printf 'disposition=skipped\n' >> "$GITHUB_OUTPUT"
            printf 'displaced_paths=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Rank 2: the vendored helper, ONLY on a fresh fetch this run (never the
          # PR-head committed/self copy — anchored to the repo ROOT like the floor).
          if [ -z "$HELPER" ] && [ "${VENDOR_SOURCE:-}" = "fetch" ] \
            && [ -f "$ROOT/.prflow/vendor/prflow/scripts/harden-stop-hooks.sh" ]; then
            HELPER="$ROOT/.prflow/vendor/prflow/scripts/harden-stop-hooks.sh"
          fi
          # Fail CLOSED to inline stubs whenever a trusted helper did NOT run to
          # completion — either it never resolved (HELPER empty), OR it resolved but
          # `bash "$HELPER"` returned non-zero. The helper's contract is exit 0 ONLY
          # when every target was displaced (trusted copy or stub); any non-zero rc —
          # a wholly-unwritable target, or a truncated/unreadable copy that failed
          # mid-run — means hardening may be partial or absent, so proceeding would risk
          # leaving a PR-head Stop-hook script executable in this secrets-bearing job,
          # the exact fail-OPEN this floor exists to prevent. So a non-zero rc takes the
          # SAME inline-stub fallback as an unresolved helper (mirroring the #402 deny-
          # floor, which fails closed on its helper's non-zero rc). Capture the rc in the
          # SAME statement (`if bash …`), never a later `$?` read.
          HARDENED=0
          if [ -n "$HELPER" ]; then
            if WORKSPACE_ROOT="$ROOT" TRUSTED_DIR="$TRUSTED_DIR" bash "$HELPER"; then
              HARDENED=1
            else
              echo "::warning::harden-stop-hooks helper exited non-zero / could not execute (it is contracted to exit 0) — hardening did not complete; failing closed by stubbing every Stop-hook target inline (never the PR-head copy)."
            fi
          else
            echo "::warning::harden-stop-hooks: no TRUSTED helper resolved (base-ref / vendored-fetch); failing closed by stubbing every Stop-hook target inline (never the PR-head copy)."
          fi
          if [ "$HARDENED" -eq 0 ]; then
            # FAIL CLOSED (no trusted helper ran): stub every target inline (this is
            # trusted workflow shell, read from the base/default branch under
            # pull_request_target), so a PR-head hook script is never executed even
            # when the helper cannot be resolved OR cannot execute.
            #
            # This is the LAST-RESORT arm of a security floor: if the stub WRITE itself
            # fails (a wholly-unwritable dest — the case the helper's non-zero exit
            # escalates here), the PR-head hook script REMAINS. Merely warning and
            # exiting 0 would let `Run Claude Code` proceed with that PR-controlled hook
            # INTACT in this secrets-bearing job — the exact fail-OPEN this floor exists
            # to prevent. So on ANY target we could not stub, FAIL THE STEP after the
            # loop: a failed job never reaches `Run Claude Code`, so no hook fires.
            stub_failed=0
            for t in $TARGETS; do
              d="$ROOT/$t"
              mkdir -p "${d%/*}" 2>/dev/null || true
              # Unlink a symlink dest first (issue #460 SHADOW), mirroring the helper's
              # write_stub: without this the `> "$d"` would write the stub THROUGH the link
              # into its resolved target, leaving the PR-controlled symlink at the hook path
              # (and, for an absolute link, writing bytes outside the workspace).
              [ -L "$d" ] && rm -f "$d" 2>/dev/null
              if printf '#!/usr/bin/env bash\nexit 0\n' > "$d" 2>/dev/null; then
                chmod +x "$d" 2>/dev/null || true
              else
                stub_failed=1
                echo "::warning::harden-stop-hooks: could not stub '$t' (wholly unwritable); the PR-head copy MAY REMAIN — the step will fail closed below."
              fi
            done
            if [ "$stub_failed" -eq 1 ]; then
              echo "::error::harden-stop-hooks: one or more Stop-hook targets could NOT be stubbed (wholly unwritable path); the PR-head copy MAY REMAIN. Failing the job BEFORE Run Claude Code so no PR-controlled Stop hook fires in this secrets-bearing review — inspect the runner."
              exit 1
            fi
          fi

          # AC1 (#504): publish the displaced-path set + disposition. Reached only
          # on a displacement arm (trusted base-copy success OR inline-stub success)
          # — the stub_failed arm exited 1 above, so the job never reaches here when
          # a target was wholly unwritable. The paths value is this step's own
          # TARGETS literal, newline-separated via printf word-splitting on the
          # space-separated literal (no tr/sed — guard-class 2: a value deciding an
          # emitted result must not be derived through a non-preflight PATH tool).
          # Exact because displacement is all-or-nothing: the helper displaces every
          # target on exit 0, else the inline arm stubs every target, else the job
          # failed before this point. The compose step (after this one) forwards this as
          # HARDENED_PATHS to the renderer, which routes listed-path HEAD verification
          # through `git show`.
          printf 'disposition=displaced\n' >> "$GITHUB_OUTPUT"
          _df_d="DISPLACED_EOF_$(date +%s%N)_$$"
          {
            printf 'displaced_paths<<%s\n' "$_df_d"
            printf '%s\n' $TARGETS
            printf '%s\n' "$_df_d"
          } >> "$GITHUB_OUTPUT"

      # Join every displaced-path producer (issue #874). HARDENED_PATHS used to
      # bind a SINGLE step's output, and harden_hooks publishes that output EMPTY on
      # its relevance-gate skip arm — so the truncated prompt-extension paths would
      # vanish from the grounding block on exactly the consumer runs where the
      # extensions are the only displacement. A join, not an assumed append: each
      # producer's value stands alone and either may legitimately be empty.
      #
      # Pure concatenation with no branch selection and no user-facing message, so
      # it stays inline rather than becoming a helper — the extraction rule governs
      # branch-selecting and message-composing shell, and this is neither. It still
      # gets its own step so it is name-addressable and lib/test/run.sh can drive it.
      - name: Join displaced-path producers
        id: displaced_join
        env:
          HOOK_PATHS: ${{ steps.harden_hooks.outputs.displaced_paths }}
          EXT_PATHS: ${{ steps.promptext.outputs.truncated_paths }}
          # Third producer (issue #908 review, shadow finding): harden_guard's own
          # displaced/stubbed GUARD_TARGETS. Unlike harden_hooks it carries no relevance
          # gate, so it runs on every run — but it publishes only the paths it ACTUALLY
          # rewrote, so this is legitimately EMPTY in two distinct cases, and a comment
          # claiming otherwise would be false against HEAD: (1) a CONSUMER repo, where
          # none of the three DevFlow-internal targets exist on either the base ref or in
          # the working tree, so nothing is displaced and nothing needs disclosing; and
          # (2) any run where the step's implicit `if: success()` or its fail-closed
          # last-resort `exit 1` arm prevents it writing `guard_paths` at all. Where the
          # step DOES displace or stub, the disclosure is what stops a reviewing agent
          # reading this step's rewritten bytes as untouched PR-head content — that is
          # the case this producer exists for, and it is a DevFlow-repo case, not the
          # consumer arm. The consumer below already handles empty (`[ -n "$GUARD_PATHS" ]`).
          GUARD_PATHS: ${{ steps.harden_guard.outputs.guard_paths }}
          # Fourth producer (issue #1388), legitimately empty when hardensetup's
          # `provision_env` gate skipped it. Omitting it let the reviewing agent read
          # base-ref bytes as untouched PR-head content.
          SETUP_PATHS: ${{ steps.hardensetup.outputs.displaced_setup_paths }}
        run: |
          set -euo pipefail
          _j_d="JOINED_EOF_$(date +%s%N)_$$"
          {
            printf 'hardened_paths<<%s\n' "$_j_d"
            # Each producer is emitted only when non-empty, so an empty one
            # contributes no blank line the renderer would have to filter.
            [ -n "$HOOK_PATHS" ] && printf '%s\n' "$HOOK_PATHS"
            [ -n "$EXT_PATHS" ] && printf '%s\n' "$EXT_PATHS"
            [ -n "$GUARD_PATHS" ] && printf '%s\n' "$GUARD_PATHS"
            [ -n "$SETUP_PATHS" ] && printf '%s\n' "$SETUP_PATHS"
            printf '%s\n' "$_j_d"
          } >> "$GITHUB_OUTPUT"

      - name: Compose review prompt
        id: compose
        env:
          BASE_PROMPT: ${{ inputs.prompt }}
          HEALTH_SUMMARY: ${{ steps.provision.outputs.health_summary }}
          ALLOWED_TOOLS: ${{ steps.tools.outputs.tools }}
          # AC5 (#504): CI_SUMMARY + HEAD_SHA are computed in the pre-displacement
          # ci_summary step (summarize-ci-checks.sh sources a HOOK_TARGETS closure
          # member, so it must run before harden_hooks stubs it). HARDENED_PATHS is
          # the JOINED displaced-path set from both producers — harden_hooks' Stop-hook
          # displacement (empty when its relevance gate skipped hardening) and the
          # truncated prompt-extension paths (issue #874); the renderer renders a
          # displaced-paths ground-truth section only when it is non-empty.
          CI_SUMMARY: ${{ steps.ci_summary.outputs.CI_SUMMARY }}
          HEAD_SHA: ${{ steps.ci_summary.outputs.HEAD_SHA }}
          HARDENED_PATHS: ${{ steps.displaced_join.outputs.hardened_paths }}
          # The job's own GITHUB_TOKEN, whose `permissions:` block declares the
          # `checks: read` + `actions: read` the CI queries need. The downscoped
          # DevFlow-Reviewer token is minted LATER (it posts the review), so it is
          # deliberately not used here.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          # The renderer runs post-displacement (this step is after harden_hooks)
          # and sources nothing, so the stubbed closure members do not affect it.
          RGB=.prflow/vendor/prflow/scripts/render-grounding-block.sh
          [ -f "$RGB" ] || RGB=scripts/render-grounding-block.sh
          if [ -f "$RGB" ]; then
            GROUNDING=$(CI_SUMMARY="$CI_SUMMARY" ALLOWED_TOOLS="$ALLOWED_TOOLS" HARDENED_PATHS="$HARDENED_PATHS" bash "$RGB") || GROUNDING=""
          else
            echo "::error::devflow: render-grounding-block.sh not found at either the vendored or repo path — the review prompt would carry no engine-ground-truth block, this run's only statement of the headless-run discipline and of the commands it may execute. Repair the vendored .prflow/vendor/prflow tree, or check the vendor-plugin fetch (prflow_version). Failing the job BEFORE Run Claude Code." >&2
            exit 1
          fi
          # Verify the OUTCOME, not the file's existence: a present-but-truncated
          # renderer that exits 0 printing nothing would silently strip the block's
          # prompt-injection defense from the prompt. That is a job failure, not a
          # breadcrumb — the block is also the single home of the headless-run
          # discipline, so a block-less review is ungrounded rather than degraded.
          if [ -z "$GROUNDING" ]; then
            echo "::error::devflow: render-grounding-block.sh produced no output — the review prompt would carry no engine-ground-truth block, this run's only statement of the headless-run discipline and of the commands it may execute. The renderer resolved at '$RGB' but printed nothing or exited non-zero: repair that copy, or check the vendor-plugin fetch (prflow_version). Failing the job BEFORE Run Claude Code." >&2
            exit 1
          fi
          # The grounding block is ALWAYS present. When the infra-health block is also
          # present, both are prepended — grounding first, then health, then the base
          # prompt — so neither displaces the other.
          if [ -n "$HEALTH_SUMMARY" ]; then
            PROMPT="${GROUNDING}
          > [!IMPORTANT]
          > **Infrastructure status: one or more service containers did not come up.**
          > This reviewer environment was provisioned (\`provision_env\` is on), but
          > the following services are degraded:
          >
          ${HEALTH_SUMMARY}
          >
          > If any build, test, or verify command below fails because it could not
          > reach one of these services, attribute that failure to the degraded
          > infrastructure above — NOT to a defect in this pull request. Review the
          > rest of the change normally.

          ---

          ${BASE_PROMPT}"
          else
            PROMPT="${GROUNDING}
          ${BASE_PROMPT}"
          fi
          # Heredoc transport with a unique, timestamped delimiter: the prompt is
          # full of markdown/backticks, so a fixed sentinel could collide with its
          # content and prematurely terminate the output. The same pattern guards
          # the other multiline outputs in this workflow.
          delim="PROMPT_EOF_$(date +%s%N)_$$"
          {
            printf 'prompt<<%s\n' "$delim"
            printf '%s\n' "$PROMPT"
            printf '%s\n' "$delim"
          } >> "$GITHUB_OUTPUT"

      # SECURITY (issue #313 shadow S1): this step writes the provider endpoint —
      # including, for bearer auth, the DEVFLOW_PROVIDER_API_KEY secret as
      # ANTHROPIC_AUTH_TOKEN — into the JOB env, which is visible to every LATER
      # step. It is therefore placed AFTER the opt-in `Provision project environment`
      # step (which runs PR-author-controlled build code), so a provider+provision_env
      # combo never hands the bearer key to PR code. It must still precede `Run Claude
      # Code` (the next step), which consumes ANTHROPIC_BASE_URL / ANTHROPIC_AUTH_TOKEN.
      # Inject the provider endpoint into the JOB env — ONLY when a provider is
      # active. A `run:` step writing $GITHUB_ENV (never a static step `env:`
      # block of always-present expressions) is the only mechanism that can carry
      # config-driven dynamic keys, and gating on `provider != ''` keeps the
      # default path free of even empty-valued ANTHROPIC_* vars (AC 1/4). This
      # step also carries the fail-loud empty-secret guard (AC 6), before the
      # action step runs.
      - name: Inject provider endpoint (provider-routed sections only)
        if: ${{ steps.provider.outputs.provider != '' }}
        env:
          DECISION: ${{ steps.provider.outputs.decision }}
          AUTH: ${{ steps.provider.outputs.auth }}
          BASE_URL: ${{ steps.provider.outputs.base_url }}
          TIMEOUT_MS: ${{ steps.provider.outputs.timeout_ms }}
          PROVIDER: ${{ steps.provider.outputs.provider }}
          PROVIDER_API_KEY: ${{ secrets.DEVFLOW_PROVIDER_API_KEY }}
          SECTION: prflow_runner
        run: |
          set -euo pipefail
          if [ -z "$PROVIDER_API_KEY" ]; then
            echo "::error::.prflow/config.json section '$SECTION' selects provider '$PROVIDER' but the DEVFLOW_PROVIDER_API_KEY repository secret is empty. Set that secret (the provider API key) before running a provider-routed job. Refusing to run."
            exit 1
          fi
          # SECURITY: the env-map KEY is interpolated RAW into the `KEY<<DELIM` heredoc
          # header — the newline-safe heredoc protects VALUES, not keys, so a key
          # carrying a newline or `<<` could forge a further job env var name or break
          # the heredoc terminator (leaving an opaque "matching delimiter not found"
          # abort). Keys come from maintainer-controlled config, but validate them
          # POSITIVELY against a real env-var-name charset and fail loud on any stray
          # key rather than emit a malformed/forged $GITHUB_ENV block.
          if printf '%s' "$DECISION" | jq -e '.env | keys[] | select(test("^[A-Za-z_][A-Za-z0-9_]*$") | not)' >/dev/null 2>&1; then
            echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' has an env-map key that is not a valid environment variable name ([A-Za-z_][A-Za-z0-9_]*). Fix the providers.$PROVIDER.env keys. Refusing to run."
            exit 1
          fi
          # SECURITY (issue #1773): the shape guard above accepts any valid env-var NAME — do not
          # drop this guard, and keep the assignment bare: a local/declare prefix or an if/&&/||
          # context makes set -e swallow a jq failure, and a denied key is then exported job-wide.
          denied_env_keys="$(printf '%s' "$DECISION" | jq -r '[.env // {} | keys[] | select(ascii_upcase | IN("PATH","GITHUB_TOKEN","GH_TOKEN","GITHUB_ENV","GITHUB_OUTPUT","GITHUB_PATH","ANTHROPIC_API_KEY","ANTHROPIC_AUTH_TOKEN","CLAUDE_CODE_OAUTH_TOKEN","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY","AWS_SESSION_TOKEN","AWS_BEARER_TOKEN_BEDROCK","BASH_ENV","ENV","LD_PRELOAD","LD_LIBRARY_PATH","DYLD_INSERT_LIBRARIES","NODE_OPTIONS","PYTHONPATH","CLAUDE_CODE_SUBAGENT_MODEL"))] | join(" ")')"
          if [ -n "$denied_env_keys" ]; then
            echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' env map contains forbidden key(s): $denied_env_keys — a credential name, a variable that would shadow the job environment or its Actions plumbing, an interpreter/loader hook that can make every later step load code you did not intend, or the subagent-model override that flattens the review roster. Set credentials via the DEVFLOW_PROVIDER_API_KEY repository secret, and remove these keys from providers.$PROVIDER.env. Refusing to run."
            exit 1
          fi
          # Keep the assignment bare, exactly as denied_env_keys above (issue #1911): a local/declare
          # or an if/&&/|| context lets set -e swallow a jq failure and the warning silently never fires.
          warned_env_keys="$(printf '%s' "$DECISION" | jq -r '[.env // {} | keys[] | select(ascii_upcase | IN("ANTHROPIC_BASE_URL","API_TIMEOUT_MS","HOME","RUNNER_TEMP"))] | join(" ")')"
          if [ -n "$warned_env_keys" ]; then
            echo "::warning::.prflow/config.json section '$SECTION' provider '$PROVIDER' env map sets key(s): $warned_env_keys — the env map is written last, so its value overrides the dedicated provider field (base_url/timeout_ms) or the job's own HOME/RUNNER_TEMP for every later step. The env map's value takes effect; remove these keys from providers.$PROVIDER.env if that override was not intended."
          fi
          # Every $GITHUB_ENV write below uses GitHub's newline-safe multiline (heredoc) form —
          # the scalar endpoint values via genv(), the provider env map via the inline jq heredoc
          # emit at the end — so a config-sourced value carrying an embedded newline cannot split
          # a plain KEY=VALUE line and inject/forge a further job env var. Mirrors the resolver's
          # decision<< output; the timestamped+PID delimiter makes value collision negligible.
          genv() { local d; d="ENV_EOF_$(date +%s%N)_$$"; { printf '%s<<%s\n' "$1" "$d"; printf '%s\n' "$2"; printf '%s\n' "$d"; } >> "$GITHUB_ENV"; }
          # base_url is guaranteed non-empty by the resolver for bearer/api_key; the
          # bedrock_api_key arm needs none and reaches Bedrock via AWS_REGION instead.
          if [ "$AUTH" = "bedrock_api_key" ]; then
            # AWS region is required and travels in the env map (passthrough below); fail
            # loud when absent/empty so the run does not authenticate then die on every
            # model call. A non-string region reads as absent (strings|select) — fail closed.
            if ! printf '%s' "$DECISION" | jq -e '.env.AWS_REGION | strings | select(. != "")' >/dev/null 2>&1; then
              echo "::error::.prflow/config.json section '$SECTION' provider '$PROVIDER' uses bedrock_api_key auth but its env map sets no AWS_REGION. Add AWS_REGION to providers.$PROVIDER.env (the Bedrock client requires a region). Refusing to run."
              exit 1
            fi
            # base_url is unused here; warn (never fail) if one was set, and export NO
            # ANTHROPIC_BASE_URL/ANTHROPIC_AUTH_TOKEN on this arm.
            if [ -n "$BASE_URL" ]; then
              echo "::warning::.prflow/config.json section '$SECTION' provider '$PROVIDER' uses bedrock_api_key auth; its base_url is ignored (Bedrock is reached via AWS_REGION, not base_url). Remove base_url from providers.$PROVIDER."
            fi
            genv AWS_BEARER_TOKEN_BEDROCK "$PROVIDER_API_KEY"
          else
            genv ANTHROPIC_BASE_URL "$BASE_URL"
            # Bearer-token gateways read Authorization from ANTHROPIC_AUTH_TOKEN; the
            # same key also rides as the anthropic_api_key action input below (the
            # documented two-slot recipe). auth: api_key passes it via the input only.
            if [ "$AUTH" = "bearer" ]; then genv ANTHROPIC_AUTH_TOKEN "$PROVIDER_API_KEY"; fi
          fi
          # API_TIMEOUT_MS applies to either arm, so write it once after the branch.
          if [ -n "$TIMEOUT_MS" ]; then genv API_TIMEOUT_MS "$TIMEOUT_MS"; fi
          # Do not describe these as filtered: a denied key aborts the whole run above, so nothing
          # is ever dropped and exported alongside. Only the API key above is a masked secret.
          edelim="ENV_EOF_$(date +%s%N)_$$"
          printf '%s' "$DECISION" | jq -r --arg d "$edelim" '.env | to_entries[] | "\(.key)<<\($d)", "\(.value)", $d' >> "$GITHUB_ENV"

      # Compose the plugins/plugin_marketplaces inputs (issue #505): the baked
      # baseline (byte-identical across the three call sites — run.sh pins it)
      # PLUS the entries the TRUSTED base-ref .claude/settings.json declares. This
      # review tier checks out the PR HEAD, so the settings file is materialized
      # from the trusted base ref by the baseprovision step into RUNNER_TEMP
      # (compose_settings) — the helper NEVER reads a workspace-relative
      # .claude/settings.json (run.sh negatively pins that). The helper itself
      # runs only from a trusted source (rank 1: base-ref materialized by
      # baseprovision; rank 2: the vendored copy ONLY when vendor_source==fetch,
      # never a committed/self PR-head copy; else fail-closed — baseline +
      # ::warning:: naming the trusted-source rule), per the same rank rules
      # filter-runner-tools.sh follows today.
      - name: Compose plugin inputs (baseline + trusted-base-ref settings-declared)
        id: plugins
        env:
          COMPOSE_SETTINGS: ${{ steps.baseprovision.outputs.compose_settings }}
          COMPOSE_SETTINGS_SOURCE: ${{ steps.baseprovision.outputs.compose_settings_source }}
          COMPOSE_HELPER_DIR: ${{ steps.baseprovision.outputs.compose_helper_dir }}
          COMPOSE_HELPER_SOURCE: ${{ steps.baseprovision.outputs.compose_helper_source }}
          VENDOR_SOURCE: ${{ steps.vendor.outputs.vendor_source }}
        run: |
          set -euo pipefail
          BAKED_PLUGINS="$(printf '%s\n' code-review@claude-plugins-official claude-md-management@claude-plugins-official prflow@devflow-marketplace)"
          BAKED_MARKETPLACES="$(printf '%s\n' https://github.com/anthropics/claude-plugins-official.git ./)"
          _REPO_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          # Resolve the trusted compose-helper copy, in rank order (mirroring the
          # deny-floor's filter-runner-tools.sh ranks):
          #   1. COMPOSE_HELPER_DIR — base-ref materialized by baseprovision into
          #      RUNNER_TEMP (outside the PR-writable workspace);
          #   2. the vendored copy, ONLY when vendor_source==fetch (a fresh clone at
          #      the pinned prflow_version — never a committed/self PR-head copy);
          #   3. else fail-closed (no trusted helper → baseline + trusted-source-rule
          #      ::warning::, no compose). The PR-head checkout's own copy is
          #      deliberately never consulted.
          HELPER=''
          COMPOSE=''
          if [ -n "${COMPOSE_HELPER_DIR:-}" ] && [ -f "$COMPOSE_HELPER_DIR/resolve-extra-plugins.sh" ] && [ -f "$COMPOSE_HELPER_DIR/describe-plugin-compose.sh" ]; then
            HELPER="$COMPOSE_HELPER_DIR/resolve-extra-plugins.sh"
            COMPOSE="$COMPOSE_HELPER_DIR/describe-plugin-compose.sh"
            echo "plugin-parity compose helper source: trusted base ref (${COMPOSE_HELPER_SOURCE:-base-ref})"
          elif [ "${VENDOR_SOURCE:-}" = "fetch" ] && [ -f "$_REPO_ROOT/.prflow/vendor/prflow/scripts/resolve-extra-plugins.sh" ] && [ -f "$_REPO_ROOT/.prflow/vendor/prflow/scripts/describe-plugin-compose.sh" ]; then
            HELPER="$_REPO_ROOT/.prflow/vendor/prflow/scripts/resolve-extra-plugins.sh"
            COMPOSE="$_REPO_ROOT/.prflow/vendor/prflow/scripts/describe-plugin-compose.sh"
            echo "plugin-parity compose helper source: runtime-fetched vendored copy (pinned prflow_version)"
          fi
          EX_P="$(mktemp)"; EX_M="$(mktemp)"; ERR_P="$(mktemp)"; ERR_M="$(mktemp)"; ENTRIES="$(mktemp)"
          trap 'rm -f "$EX_P" "$EX_M" "$ERR_P" "$ERR_M" "$ENTRIES"' EXIT
          : > "$EX_P"; : > "$EX_M"; : > "$ERR_P"; : > "$ERR_M"
          READ_OUTCOME=ok
          DEFECT=""
          if [ -z "$HELPER" ]; then
            # Fail-closed (no TRUSTED compose helper): emit the baseline only + one
            # ::warning:: naming the trusted-source rule. describe-plugin-compose.sh
            # is absent with the helper, so the warning stays inline.
            echo "::warning::devflow resolve-extra-plugins.sh not found at any TRUSTED source — neither materialized from the base ref (baseprovision) nor runtime-fetched at the pinned prflow_version (vendor_source='${VENDOR_SOURCE:-unknown}'); the PR-head checkout's own copy is deliberately not consulted, because the compose helper must not be PR-editable. Proceeding with the baked plugin baseline. Land the DevFlow re-vendor on the BASE branch (or use a thin install with a pinned prflow_version) so a trusted helper is available (the trusted-source rule, mirroring filter-runner-tools.sh)."
          elif [ "${COMPOSE_SETTINGS_SOURCE:-degraded}" = "degraded" ]; then
            # The trusted base-ref settings read FAILED (fetch failure / git-show
            # error / unreadable file) — distinct from a DEGRADED FILE the helper
            # DID read (describe-plugin-compose.sh arm 3, degraded-only): here the
            # trusted read never produced a file to classify. Route to the
            # trusted-read-failed arm.
            READ_OUTCOME=failed
            DEFECT="trusted base-ref .claude/settings.json read failed (fetch or git-show error)"
          elif [ -n "${COMPOSE_SETTINGS:-}" ] && [ -f "$COMPOSE_SETTINGS" ]; then
            # Trusted settings read succeeded. Run the helper in BOTH modes against
            # the materialized path ONLY (never a workspace .claude/settings.json).
            bash "$HELPER" plugins "$COMPOSE_SETTINGS" > "$EX_P" 2>"$ERR_P" || true
            bash "$HELPER" marketplaces "$COMPOSE_SETTINGS" > "$EX_M" 2>"$ERR_M" || true
          elif [ "${COMPOSE_SETTINGS_SOURCE:-}" = "ok" ]; then
            # baseprovision classified the read 'ok' (the file WAS materialized) but
            # it is not present now (RUNNER_TEMP cleanup, an interleaving step, a
            # race). Do NOT collapse this onto the silent 'absent' baseline below —
            # that would discard the fail-closed intent baseprovision was careful to
            # draw via git cat-file -e (unknown is not zero). Fail closed to the
            # trusted-read-failed arm so the ::warning:: fires instead of silence.
            READ_OUTCOME=failed
            DEFECT="materialized base-ref .claude/settings.json vanished before compose (classified 'ok' but not present)"
          fi
          # 'absent' on base ref (COMPOSE_SETTINGS empty, source 'absent') falls
          # through every branch above: EX_* stay empty, READ_OUTCOME=ok, DEFECT=""
          # → the silent baseline (composed inputs equal the baked baseline, no
          # ::warning::) — the normal consumer case.
          # Join breadcrumbs (bash builtins; guard-class 2 — no cat/tr/sed).
          for f in "$ERR_P" "$ERR_M"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              if [ -z "$DEFECT" ]; then DEFECT="$line"; else DEFECT="$DEFECT; $line"; fi
            done < "$f"
          done
          : > "$ENTRIES"
          for f in "$EX_P" "$EX_M"; do
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              printf '%s\n' "$line" >> "$ENTRIES"
            done < "$f"
          done
          dedupe() {
            local baseline="$1" extras="$2" seen="" line out=""
            while IFS= read -r line || [ -n "$line" ]; do
              [ -z "$line" ] && continue
              case "$seen" in *"|$line|"*) ;; *) seen="$seen|$line|"; out="${out:+$out$'\n'}$line" ;; esac
            done <<< "$baseline"
            if [ -f "$extras" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [ -z "$line" ] && continue
                case "$seen" in *"|$line|"*) ;; *) seen="$seen|$line|"; out="${out:+$out$'\n'}$line" ;; esac
              done < "$extras"
            fi
            printf '%s\n' "$out"
          }
          COMBINED_PLUGINS="$(dedupe "$BAKED_PLUGINS" "$EX_P")"
          COMBINED_MK="$(dedupe "$BAKED_MARKETPLACES" "$EX_M")"
          pdelim="PLG_EOF_$(date +%s%N)_$$"
          { printf 'plugins<<%s\n' "$pdelim"; printf '%s\n' "$COMBINED_PLUGINS"; printf '%s\n' "$pdelim"; } >> "$GITHUB_OUTPUT"
          mdelim="MKT_EOF_$(date +%s%N)_$$"
          { printf 'plugin_marketplaces<<%s\n' "$mdelim"; printf '%s\n' "$COMBINED_MK"; printf '%s\n' "$mdelim"; } >> "$GITHUB_OUTPUT"
          # Annotation — arm classification lives in describe-plugin-compose.sh.
          # The extras were already spliced into $GITHUB_OUTPUT above, so if the
          # renderer exits non-zero (a corrupt/partial COMPOSE copy, a future
          # set -u regression inside it) do NOT swallow it with `|| true`: capture
          # the status and emit an inline fallback ::warning:: so a composed entry
          # is never shipped without SOME audit line (PR #513 "never silent";
          # the run is still never broken — the failure is caught, not propagated).
          if [ -n "$COMPOSE" ] && [ -f "$COMPOSE" ]; then
            if ! bash "$COMPOSE" "$READ_OUTCOME" "$ENTRIES" "$DEFECT"; then
              echo "::warning::describe-plugin-compose.sh failed (rc≠0); extras (if any) were composed into the runner's plugin surface but the audit annotation could not be rendered."
            fi
          elif [ "$READ_OUTCOME" = "failed" ]; then
            # describe-plugin-compose.sh unavailable (no trusted helper) AND the
            # trusted read failed — emit the trusted-read-failed warning inline so
            # the observable-output arm is not silently dropped.
            echo "::warning::Could not read the trusted base-ref .claude/settings.json; base-declared plugins were not composed this run — proceeding with the baked baseline."
          fi

      # Resolve the two DEFAULT-OFF git-env pin flags and export the enabled ones
      # (issue #645). Both keys default to false, so on a stock consumer this step
      # emits NOTHING and neither GIT_DIR nor GIT_WORK_TREE is present in the
      # action's environment — the pre-#643 behavior, which is the configuration
      # that works everywhere. #643 set both unconditionally so configureGitAuth
      # would resolve the repo on a self-hosted Windows runner (issue #602), but
      # GIT_WORK_TREE also reaches the Claude Code CLI subprocess that installs
      # plugins, where it makes `git clone` refuse an existing working tree — so
      # every run died at plugin install with `fatal: working tree '<path>'
      # already exists.`, before the agent did any work, producing no verdict at
      # all. The helper is now the SINGLE producer of both variables; the action
      # step below deliberately carries neither in its own `env:` block.
      #
      # TRUSTED SOURCE ONLY — this is a security boundary. This job checks out the
      # PR HEAD, and the helper's stdout is appended to `$GITHUB_ENV` in a
      # token-bearing job, so the helper is executed only from the copy
      # `baseprovision` materialized out of the base ref into RUNNER_TEMP (rank 1),
      # or from the vendored copy when the vendor step reports
      # `vendor_source == fetch` — a fresh clone of the official repo at the pinned
      # prflow_version (rank 2). Otherwise this step FAILS CLOSED: it emits
      # nothing and warns. The PR-head checkout's own copy is never consulted, and
      # the keys themselves are read from the trusted base-ref config, so a pull
      # request author can neither make the helper write assignments into the
      # reviewer's job environment nor enable a key that would suppress its own
      # review.
      #
      # JOB-SCOPED, not step-scoped: `$GITHUB_ENV` appends assignments and offers
      # no removal verb, and the empty-value form that would approximate one is
      # measured fatal (`GIT_DIR=` → `fatal: not a git repository: ''`), which is
      # precisely why the mechanism is an append rather than an `env:` expression
      # (GitHub's workflow syntax accepts no expression evaluating to a whole
      # `env:` mapping, so a variable's KEY cannot be made conditionally absent
      # there). So an enabled variable is in force for `Run Claude Code` AND every
      # step after it.
      - name: Resolve git-env pins
        env:
          # The TRUSTED base-ref config baseprovision materialized — never the
          # PR-head checkout. That is what makes these keys post-merge-only and
          # makes a key set only in a PR head inert on this tier.
          GITENV_CFGJSON: ${{ steps.baseprovision.outputs.config_json }}
          GITENV_HELPERDIR: ${{ steps.baseprovision.outputs.gitenv_helper_dir }}
          GITENV_VENDORSRC: ${{ steps.vendor.outputs.vendor_source }}
          GITENV_WS: ${{ github.workspace }}
        run: |
          set -uo pipefail
          HELPER=''
          if [ -n "$GITENV_HELPERDIR" ] && [ -f "$GITENV_HELPERDIR/emit-git-env.sh" ]; then
            HELPER="$GITENV_HELPERDIR/emit-git-env.sh"
          elif [ "$GITENV_VENDORSRC" = 'fetch' ] && [ -f '.prflow/vendor/prflow/scripts/emit-git-env.sh' ]; then
            HELPER='.prflow/vendor/prflow/scripts/emit-git-env.sh'
          fi
          if [ -z "$HELPER" ]; then
            echo "::warning::devflow git-env pins: no TRUSTED copy of emit-git-env.sh is available — neither materialized from the base ref (baseprovision) nor runtime-fetched at the pinned prflow_version (vendor_source='${GITENV_VENDORSRC:-unknown}'). The PR-head checkout's own copy is deliberately not consulted, because a PR author must not be able to write assignments into the reviewer's job environment. Failing closed: neither GIT_DIR nor GIT_WORK_TREE is exported (which is also the working default)."
            exit 0
          fi
          CFG="${RUNNER_TEMP}/devflow-gitenv-config.json"
          if ! printf '%s' "$GITENV_CFGJSON" > "$CFG" 2>/dev/null; then
            echo "::warning::devflow git-env pins: could not materialize the trusted base-ref config into RUNNER_TEMP; failing open to the working default (neither variable exported)."
            exit 0
          fi
          bash "$HELPER" --workspace "$GITENV_WS" --config-file "$CFG" --tier review >> "$GITHUB_ENV"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Harness floor for the dispatch barrier (issue #801). The vendor documents
          # subagents as background-by-default as of v2.1.198 (read from the vendor docs on
          # 2026-07-24; a past-time snapshot, not re-derived here), with a background
          # dispatch's results arriving as a completion notification IN A LATER TURN —
          # and this is a headless `claude -p` session, which ends at the first
          # tool-call-free turn, so that later turn never happens and the dispatched
          # work is discarded (run 30138268273 burned a full eight-agent fleet and
          # produced no verdict). The vendor documents this variable as keeping
          # subagents in the FOREGROUND, so results are in hand before the model's turn
          # continues; that it takes effect inside claude-code-action is OBSERVED, not
          # assumed — matcher-probe.yml's background-tasks-probe job measured FOREGROUND
          # on runs 30210679122 and 30211584731 (issue #812). That verdict is
          # version-dependent: re-probe
          # via that job after a claude-code-action upgrade. Note the
          # documented scope is wider than subagents: it disables ALL background task
          # functionality, including the Bash tool's run_in_background. No engine
          # surface requests a backgrounded Bash today, so that is inert here — but a
          # future step wanting one would find it blocked. It ships
          # unconditionally rather than probe-gated because it is INERT when ignored: a
          # runner that does not honor it leaves today's behavior exactly as it is.
          # The runner-agnostic half of the fix is the barrier statement in
          # skills/review/SKILL.md, which states the requirement behaviorally for
          # runtimes that expose no equivalent switch.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # Anthropic-default path only: pass the OAuth token when no provider is
          # active. A provider-routed prflow_runner section passes '' here (the
          # action treats empty as absent) and authenticates via anthropic_api_key
          # below (issue #313).
          claude_code_oauth_token: ${{ steps.provider.outputs.provider == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # Provider path only: the fixed DEVFLOW_PROVIDER_API_KEY secret (inherited
          # from devflow-review.yml via `secrets: inherit`) satisfies the action's
          # launch check and, for bearer auth, is ALSO exported as ANTHROPIC_AUTH_TOKEN
          # by the inject step. Empty on the default path.
          # use_bedrock selects Amazon Bedrock at the action layer; it must travel as this
          # input (not a job-env export) because the action's step-level env overrides the
          # job env, blanking a job-env CLAUDE_CODE_USE_BEDROCK. Empty off the Bedrock arm.
          use_bedrock: ${{ steps.provider.outputs.auth == 'bedrock_api_key' && 'true' || '' }}
          # anthropic_api_key rides on the bearer/api_key arms; the bedrock_api_key arm
          # passes '' here and authenticates via AWS_BEARER_TOKEN_BEDROCK.
          anthropic_api_key: ${{ steps.provider.outputs.provider != '' && steps.provider.outputs.auth != 'bedrock_api_key' && secrets.DEVFLOW_PROVIDER_API_KEY || '' }}
          # Pass an explicit token so the action skips its OIDC → app-token
          # exchange, which 401s for jobs running inside a reusable
          # workflow_call from pull_request_target (anthropics/
          # claude-code-action#443, #721). With the opt-in DevFlow-Reviewer App
          # configured the token is the minted, downscoped DevFlow-Reviewer token
          # above (review posts are attributed to `DevFlow-Reviewer[bot]`, a
          # non-author identity); otherwise it is the workflow's own GITHUB_TOKEN
          # and posts show `github-actions[bot]`. Never the primary
          # `prflow-implementer` App token — the review path must not share the
          # PR-authoring identity (issue #300).
          github_token: ${{ steps.reviewer-token.outputs.token || secrets.GITHUB_TOKEN }}
          allowed_bots: ${{ steps.extract.outputs.allowed_bots }}

          additional_permissions: |
            actions: read

          # Registers the PreToolUse shape guard (issue #908, follow-up to #805/#906).
          # This file's `on: workflow_call` is the review tier's reusable workflow
          # (devflow-implement.yml carries its own separate claude-code-action
          # invocation, which since issue #1179 passes an ENV-ONLY `settings:` input —
          # BASH_MAX_TIMEOUT_MS, no hooks — so this PreToolUse registration remains
          # review-tier-only), so no tier conditional is needed here.
          #
          # CONSUMER-TIER RESOLUTION AND FAIL-OPEN-ON-ABSENCE (issue #908 confirmatory
          # review, Critical/security). install.sh ships THIS workflow verbatim into
          # consumer repos, where there is no repo-root `scripts/` — the plugin is
          # vendored under `.prflow/vendor/prflow/` (the #502 rule every other bundled
          # helper call site in this file already follows). A bare
          # `python3 <repo-root>/scripts/pretooluse-shape-guard.py` therefore names a
          # file that does not exist there, and `python3` on a missing script exits 2 —
          # which is Claude Code's PreToolUse *blocking* status, so EVERY Bash tool call
          # in every consumer auto-review would be denied (the #363/#401 silent-denial,
          # burned-budget, no-verdict class, introduced on the consumer tier by default).
          # So the command resolves the VENDORED path first with a repo-root fallback,
          # and — critically — exits 0 (ALLOW) when neither exists. Absence must be an
          # allow, never a deny: this guard is a shape *observer*, and a missing observer
          # is a lost measurement, not grounds to refuse the tool call.
          #
          # The hook command points at a path INSIDE THE CHECKED-OUT TREE (an absolute
          # path resolved at run time from the repo root via
          # `git rev-parse --show-toplevel`, not a literal repo-relative string),
          # so it is INERT only when that path holds trusted (not PR-head) bytes at
          # the time this step runs — gating that is NOT the harden_hooks Stop-hook
          # relevance gate below (that gate correctly skips when the trusted base
          # .claude/settings.json wires no Stop hook, which says nothing about this
          # UNCONDITIONALLY-registered guard). The "Harden PreToolUse guard closure"
          # step above this one is the actual gate: it ALWAYS materializes a trusted base
          # copy of scripts/pretooluse-shape-guard.py (and the
          # lib/test/extract-command-shapes.py it dynamically imports) before this step
          # runs, or fail-closed stubs both on any failure to do so — never leaving a
          # PR-head copy of either in place (issue #908 review; the earlier wording here
          # incorrectly named HOOK_TARGETS closure membership alone as sufficient, which
          # the harden_guard step's own review finding shows it is not, since harden_hooks
          # can skip entirely).
          # SETTINGS-INPUT SCOPE (was an open "merges or overwrites?" caveat here; answered
          # while fixing PR #1205). A read of claude-code-action's source reports that this
          # input lands at USER scope and is loaded ALONGSIDE — not instead of — the
          # base-restored PROJECT `.claude/settings.json`, so that file's `Stop` hooks and
          # its `enabledPlugins` block keep applying on this review tier. The mechanism, the
          # source files it was read from, the residuals it carries, and the register that
          # read is stated in — a source read over a floating action ref, not a measurement
          # — live in ONE place: beside the `settings:` input in devflow-implement.yml. This
          # is a pointer; keep the two in step by editing THAT block, never by re-deriving
          # the mechanism here. Consequence for THIS block: the PreToolUse hook below
          # registers ADDITIVELY at user scope — it does not displace a project hook, and a
          # project-scope PreToolUse hook would run alongside it. The matcher-probe.yml
          # `pretooluse-probe` job (AC7) still measures a separate question — whether a
          # settings-input hook actually FIRES and delivers its permissionDecisionReason
          # (tracked in #919); that measurement is unaffected by the scope answer above.
          # Do NOT drop the `command -v python3` probe from the hook command below: this
          # hook runs on a CONSUMER's runner, a self-hosted Windows one may carry no
          # `python3`, and a failed `exec` exits non-zero — which BLOCKS the tool call.
          settings: |
            {
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "Bash",
                    "hooks": [
                      {
                        "type": "command",
                        "command": "_r=\"$(git rev-parse --show-toplevel 2>/dev/null || printf '%s' \"${CLAUDE_PROJECT_DIR:-.}\")\"; _g=\"$_r/.prflow/vendor/prflow/scripts/pretooluse-shape-guard.py\"; [ -f \"$_g\" ] || _g=\"$_r/scripts/pretooluse-shape-guard.py\"; [ -f \"$_g\" ] || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; exec python3 \"$_g\"",
                        "timeout": 10
                      }
                    ]
                  }
                ]
              }
            }

          prompt: ${{ steps.compose.outputs.prompt }}

          # Composed by the `Compose plugin inputs` step above (issue #505): the
          # baked baseline (byte-identical across the three call sites — run.sh
          # pins it; kept in sync with devflow.yml's `command` job and
          # devflow-implement.yml so the bare-command and automated-runner paths
          # resolve identical skill/plugin versions) PLUS the entries the trusted
          # base-ref .claude/settings.json declares.
          plugin_marketplaces: ${{ steps.plugins.outputs.plugin_marketplaces }}

          # code-review@ and claude-md-management@ are ambient-command conveniences (the
          # /code-review and /revise-claude-md slash commands), NOT engine dependencies —
          # DevFlow's engine dispatches neither. The "zero companion-plugin dependencies"
          # claim is scoped to the consumer install + what the engine dispatches; see
          # docs/internal/DEVFLOW_SYSTEM_OVERVIEW.md §6. devflow@ is DevFlow itself. The baked
          # baseline three are composed by the step above; settings-declared extras are
          # appended beyond them.
          plugins: ${{ steps.plugins.outputs.plugins }}

          # --permission-mode acceptEdits does NOT widen an explicit --allowed-tools
          # list: the allowlist is a separate, stricter gate, and a command absent
          # from it is denied no matter what the permission mode auto-approves. So a
          # command the "review" profile needs must be granted in TOOLS above —
          # acceptEdits is never a substitute (issue #363; the observed `Write` denial
          # under this very flag is the proof). Kept for precedent-matching with
          # prompt-mode invocations and for future profiles.
          # claude_args head is a COMPUTED string (steps.cargs): --model always,
          # --effort conditional on effort_supported (issue #313). --model now comes
          # from the provider resolver (the dead `model` input was removed). The
          # --permission-mode / --allowed-tools tail is preserved verbatim.
          # Optional pre-installed Claude Code executable (issue #601): sourced ONLY
          # from the trusted base-ref config (steps.baseprovision), never a PR-head
          # config — this write-token job executes the resolved path (see the
          # extraction step for the full ACE-boundary rationale). Empty (the default)
          # is the empty-as-absent idiom of claude_code_oauth_token above: auto-install.
          path_to_claude_code_executable: ${{ steps.baseprovision.outputs.claude_code_executable }}
          claude_args: >-
            ${{ steps.cargs.outputs.args }}
            --permission-mode acceptEdits
            --allowed-tools "${{ steps.tools.outputs.tools }}"

      # Surface whether the Claude execution ended in error so a caller's
      # finalize step can distinguish "review completed to a verdict" from
      # "engine stopped short" — the review JOB result is `success` in BOTH
      # cases (claude-code-action wraps the errored execution), so the job
      # result alone hides an incomplete review (issue #249). always() so this
      # runs even when the review step reports failure; the value is only
      # consumed on the success path, where a `true` here means the job
      # succeeded yet the engine ended in error — which the consumer treats
      # as no verdict for HEAD.
      - name: Surface review-engine execution result
        id: engine
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          # Parse is_error from claude-code-action's execution log via the
          # extracted, unit-tested helper (lib/test/run.sh) rather than an inline
          # jq, so the array/object/fail-safe branches are actually verified.
          # Prefer the vendored copy (present in this job after vendor-plugin ran);
          # fall back to the repo path for a self-repo checkout. If neither
          # resolves, default false (fail-safe — finalize_check's HEAD-SHA scoping
          # is the primary staleness guard).
          PEE=.prflow/vendor/prflow/scripts/parse-engine-error.sh
          [ -f "$PEE" ] || PEE=scripts/parse-engine-error.sh
          if [ -f "$PEE" ]; then
            # Let the helper's stderr breadcrumbs (e.g. a resolve-jq.sh sourcing
            # failure) flow to the Actions job log — never 2>/dev/null them, or a
            # broken jq silently reports is_error=false forever with zero trace.
            # The helper always exits 0, so `|| echo false` is belt-and-suspenders.
            IS_ERROR=$(bash "$PEE" "${EXECUTION_FILE:-}" || echo false)
            # Normalize to a single validated token: the helper's contract is one
            # true/false line, but if it ever emitted partial stdout AND failed,
            # the `|| echo false` above would append a second line and write a
            # stray non-key=value line into GITHUB_OUTPUT. Anything not exactly
            # "true" reads as false (the fail-safe direction).
            [ "$IS_ERROR" = "true" ] || IS_ERROR=false
          else
            echo "::notice::parse-engine-error.sh absent; treating engine is_error as false (fail-safe)."
            IS_ERROR=false
          fi
          echo "is_error=$IS_ERROR" >> "$GITHUB_OUTPUT"

      # Surface the claude-code-action run's execution diagnostics (run summary +
      # permission-denial detail) to the job log and $GITHUB_STEP_SUMMARY so a
      # maintainer debugging a stalled / incomplete / unexpectedly-denied cloud
      # run sees the denial detail and run shape directly — the exact information
      # that was irrecoverable for PR #325 (issue #331; helper + config key
      # shipped in #329). Read-only: the helper always exits 0, this step adds no
      # permissions grant / minted-token scope and uploads no artifact, so it
      # never changes the job's pass/fail. always() (alongside the engine-error
      # step above, same steps.claude.outputs.execution_file) so it runs even
      # when the claude step errored — which is exactly when the diagnostics
      # matter. Gated on .prflow.execution_diagnostics_enabled (default true)
      # via the vendored config-get.sh (repo-path fallback for a self-repo
      # checkout); only the exact string "false" disables it, and an empty read
      # (config-get soft/hard failure) falls safe to enabled.
      - name: Surface execution diagnostics
        id: diagnostics
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          CG=.prflow/vendor/prflow/scripts/config-get.sh
          [ -f "$CG" ] || CG=scripts/config-get.sh
          # `|| true` so config-get's hard-fail exit (malformed config.json / missing
          # python3) can't abort this step under GitHub's default `-e` run shell — which
          # would fail the job and break the "never changes the job's pass/fail" contract
          # above. The empty read then falls safe to enabled on the next line. (Mirrors the
          # engine-error step's `|| echo false` assignment guard.)
          ENABLED="$("$CG" .prflow.execution_diagnostics_enabled true || true)"
          [ -n "$ENABLED" ] || ENABLED=true
          # Exported so the transcript steps below can gate without re-reading config
          # from a `uses:` step that cannot run shell. The transcript artifact has its
          # OWN key with the OPPOSITE polarity: default FALSE and fail-CLOSED on any
          # config-read failure — a transcript can carry an env dump (Bash(env:*) is
          # granted), and a consumer must opt in to publishing that as an artifact;
          # only the exact string "true" enables it.
          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          TRANSCRIPT="$("$CG" .prflow.execution_transcript_artifact_enabled false || true)"
          [ "$TRANSCRIPT" = "true" ] || TRANSCRIPT=false
          echo "transcript=$TRANSCRIPT" >> "$GITHUB_OUTPUT"
          if [ "$ENABLED" = "false" ]; then
            echo "execution diagnostics: disabled via .prflow.execution_diagnostics_enabled=false; skipping."
            exit 0
          fi
          SED=.prflow/vendor/prflow/scripts/surface-execution-diagnostics.sh
          [ -f "$SED" ] || SED=scripts/surface-execution-diagnostics.sh
          if [ -f "$SED" ]; then
            # `|| echo ::notice::` for the same reason as the config-get guard above:
            # the helper's always-exit-0 contract holds for the committed file, but a
            # partial-copy / truncated vendored helper (a documented deployment hazard)
            # could exit non-zero, which under GitHub's default `-e` run shell would
            # abort this always() step and fail the job. Guard it so the read-only
            # "never changes the job's pass/fail" contract holds even then.
            bash "$SED" "${EXECUTION_FILE:-}" || echo "::notice::surface-execution-diagnostics.sh exited non-zero; execution diagnostics unavailable (best-effort)."
          else
            echo "::notice::surface-execution-diagnostics.sh absent; execution diagnostics not surfaced (best-effort)."
          fi

      # Surface the PreToolUse shape-guard's own heartbeat + per-arm denial counts
      # (issue #908, follow-up to #805/#906). Presence check for the heartbeat is a
      # plain `[ -f ]` bash builtin (no external tool invoked for this test), and the
      # counts-file SELECTION is delegated to resolve-guard-counts-file.sh (a
      # suite-drivable extraction, per CLAUDE.md's inline-shell-extraction convention)
      # rather than reimplemented inline. Read-only against the tree; does not affect
      # this job's pass/fail result.
      #
      # UNKNOWN IS NOT ZERO, AND ZERO IS NOT UNKNOWN (operand-trace sweep finding).
      # scripts/pretooluse-shape-guard.py writes the counts store from exactly one
      # call site, `_bump_counts` (invoked only on a deny decision) — a run where the
      # guard fires but denies nothing does not create that file, so its absence is
      # ambiguous between "guard did not fire" and "guard fired, zero denials" unless
      # disambiguated against the heartbeat, written from `_write_heartbeat` on every
      # invocation including the no-decision fall-through (exit 0 with no stdout, the
      # guard's only non-`deny` outcome). This step distinguishes FOUR outcomes
      # (issue #908 review — an earlier revision of this comment named only the first
      # two, which is what let the third go untested; the fourth arrived with the
      # confirmatory review's zero-byte finding):
      #   FIRED=false + no counts file        -> counts genuinely unavailable
      #     (no evidence the guard ran — either it never fired, or its telemetry
      #     directory was unwritable: `_run()` wraps `_write_heartbeat` in a try and
      #     continues with tmp=None, so the guard CAN run and classify with no heartbeat)
      #   FIRED=true  + resolver reports none -> counts is the positively-known empty object {}
      #     (the resolver SCRIPT ran and positively determined no counts-store FILE, under
      #     any run-keyed/bare/glob name, exists — that is real information, not a guess)
      #   resolver reports a store that exists but is ZERO-BYTE (its exit 2)
      #                                       -> counts stays unavailable REGARDLESS of FIRED
      #     (the guard writes that file only from `_bump_counts`, i.e. only on a deny, so a
      #     zero-length store is a partial/interrupted write of a real deny record — a
      #     known-BROKEN measurement, never a zero. Rendering {} here would launder it into
      #     a confident zero, the inverse of the collapse this block exists to prevent.)
      #   resolver script itself absent, OR a found counts file fails to parse
      #                                       -> counts stays unavailable REGARDLESS of FIRED
      #     (our own tooling for reading the guard's signal is unavailable/broken here, which
      #     is a genuinely different kind of unknown than the guard's own signal being
      #     ambiguous — reporting {} in this case would assert a fact we cannot establish,
      #     not resolve one, so "unavailable" is the correct, fail-safe answer)
      - name: Surface PreToolUse guard firing + denial counts
        id: guard
        if: always()
        run: |
          set -euo pipefail
          FIRED=false
          [ -f .prflow/tmp/pretooluse-guard-fired ] && FIRED=true
          echo "fired=$FIRED" >> "$GITHUB_OUTPUT"

          RGC=.prflow/vendor/prflow/scripts/resolve-guard-counts-file.sh
          [ -f "$RGC" ] || RGC=scripts/resolve-guard-counts-file.sh
          RAW=unavailable
          if [ -f "$RGC" ]; then
            # Capture the resolver's rc rather than testing it inline: exit 1 (no store
            # exists) and exit 2 (a store exists but is zero-byte — unestablished) route
            # to DIFFERENT arms, and an `if cmd` compound collapses both onto "false".
            RGC_RC=0
            COUNTS_FILE=$(bash "$RGC" .prflow/tmp "${GITHUB_RUN_ID:-}" "${GITHUB_RUN_ATTEMPT:-}") || RGC_RC=$?
            # issue #908 review, Important finding #2: the RGC_RC -> outcome ROUTING is
            # delegated to route-guard-counts-outcome.sh (a suite-drivable extraction,
            # per CLAUDE.md's inline-shell-extraction convention) rather than reimplemented
            # as an inline `if`/`elif` chain, so a regressed arm order or comparison fails
            # the suite instead of only structural grep pins.
            ROUTE=.prflow/vendor/prflow/scripts/route-guard-counts-outcome.sh
            [ -f "$ROUTE" ] || ROUTE=scripts/route-guard-counts-outcome.sh
            if [ -f "$ROUTE" ]; then
              OUTCOME_OUT=$(bash "$ROUTE" "$RGC_RC" "$FIRED")
              # Split the helper's two-line contract with bash BUILTINS, never `sed`
              # (CLAUDE.md guard-class 2: `sed` is not preflight-guaranteed, so a host
              # without it would empty $OUTCOME and silently launder the positively-known
              # `known-zero` arm into `unavailable` — an unestablished measurement
              # standing in for a real value). A here-string, not a pipe: a pipe would
              # run `read` in a subshell and leave both variables unset.
              { IFS= read -r OUTCOME || OUTCOME=""; IFS= read -r OUTCOME_MSG || OUTCOME_MSG=""; } <<<"$OUTCOME_OUT"
              case "$OUTCOME" in
                parse)
                  JQ=.prflow/vendor/prflow/lib/resolve-jq.sh
                  [ -f "$JQ" ] || JQ=lib/resolve-jq.sh
                  # shellcheck source=../../lib/resolve-jq.sh
                  . "$JQ" 2>/dev/null || echo "::notice::resolve-jq.sh could not be sourced; using bare 'jq' for guard-counts parsing (best-effort)."
                  : "${DEVFLOW_JQ:=jq}"
                  # Confirmatory-review finding (issue #908 review, iteration 3): `.arms // {}`
                  # treats jq's ONLY falsy values (null/false) as "absent, use {}" — so a
                  # malformed producer shape {"arms": false} would silently render as a
                  # genuine zero rather than degrading to unavailable, the exact "unknown is
                  # not zero" collapse this file's own convention forbids elsewhere. Type-check
                  # instead: only a genuine object is accepted; anything else (including a
                  # stray `false`) falls through to empty, same as a missing key.
                  PARSED=$("$DEVFLOW_JQ" -c 'if (.arms? | type) == "object" then .arms else empty end' "$COUNTS_FILE" 2>/dev/null) || PARSED=""
                  [ -n "$PARSED" ] && RAW="$PARSED"
                  ;;
                zero-byte)
                  # A store exists but is zero-byte: a partial/interrupted write of a real
                  # deny record. RAW stays `unavailable` — never the known-zero arm below.
                  [ -n "$OUTCOME_MSG" ] && echo "::warning::$OUTCOME_MSG"
                  ;;
                known-zero)
                  # Helper ran, POSITIVELY reported no store file (its contracted exit 1),
                  # AND the heartbeat proves the guard did fire this run — a positively-known
                  # zero, not an unestablished measurement.
                  RAW='{}'
                  ;;
                *)
                  [ -n "$OUTCOME_MSG" ] && echo "::notice::$OUTCOME_MSG"
                  ;;
              esac
            else
              echo "::notice::route-guard-counts-outcome.sh absent; per-arm denial counts unavailable (best-effort)."
            fi
          else
            echo "::notice::resolve-guard-counts-file.sh absent; per-arm denial counts unavailable (best-effort)."
          fi
          echo "counts=$RAW" >> "$GITHUB_OUTPUT"

      # Surface the guard's denied-command detail (issue #908 AC5), extracted via
      # extract-execution-shape.sh (already lands `permission_denials_commands`,
      # issue #805 Part 3) using ONLY bash builtins for the line-extraction SELECTION
      # (mirrors surface-execution-diagnostics.sh's `_publish_denials()` here-string
      # `case` pattern — CLAUDE.md guard-class 2: a value that decides a SELECTION
      # must not be derived through a non-preflight PATH tool like `sed`/`grep`). This
      # value is UN-NEUTRALIZED, attacker-influenced command text — devflow-review.yml
      # neutralizes it via render-guard-visibility.sh before rendering; this step only
      # publishes the raw value.
      - name: Surface denied command detail
        id: denied-commands
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          EES=.prflow/vendor/prflow/scripts/extract-execution-shape.sh
          [ -f "$EES" ] || EES=scripts/extract-execution-shape.sh
          VALUE=unavailable
          if [ -f "$EES" ]; then
            # Capture the helper's rc instead of discarding it with `|| true`: a missing
            # or unparseable execution file, a jq failure, or a crash would otherwise be
            # indistinguishable in the summary from "no execution file this run" — the
            # same swallowed-failure defect the sibling devflow-review.yml block already
            # fixed, applied here too (issue #908 confirmatory review).
            EES_RC=0
            BLOCK=$(bash "$EES" "${EXECUTION_FILE:-}") || EES_RC=$?
            # issue #908 review, Important finding #3 (resolved): the
            # `permission_denials_commands:` line SELECTION moved out of this inline
            # `case`/here-string loop into extract-denied-command-line.sh, a
            # suite-drivable helper (CLAUDE.md's inline-shell-extraction convention).
            EDC=.prflow/vendor/prflow/scripts/extract-denied-command-line.sh
            [ -f "$EDC" ] || EDC=scripts/extract-denied-command-line.sh
            if [ -f "$EDC" ]; then
              EDC_OUT=$(printf '%s\n' "$BLOCK" | bash "$EDC" "$EES_RC")
              # Builtin split, not `sed` — same guard-class-2 reasoning as the guard
              # step above, and here the second line is the EMITTED `commands=` value.
              # `IFS=` + `-r` keep the attacker-influenced command text byte-exact.
              { IFS= read -r EDC_STATUS || EDC_STATUS=""; IFS= read -r EDC_VALUE || EDC_VALUE=""; } <<<"$EDC_OUT"
              case "$EDC_STATUS" in
                found)
                  VALUE="$EDC_VALUE"
                  ;;
                rc-nonzero)
                  # Do NOT parse $BLOCK on a failed run: a truncated or partial
                  # `permission_denials_commands` line would otherwise be published as
                  # authoritative while the notice says the detail is unavailable — the
                  # notice and the value contradicting each other (issue #908
                  # confirmatory review). VALUE stays `unavailable`.
                  echo "::notice::extract-execution-shape.sh exited non-zero (rc=$EES_RC); denied-command detail unavailable (best-effort)."
                  ;;
                *)
                  echo "::notice::extract-execution-shape.sh ran cleanly but emitted no permission_denials_commands line; denied-command detail unavailable (best-effort)."
                  ;;
              esac
            else
              echo "::notice::extract-denied-command-line.sh absent; denied-command detail unavailable (best-effort)."
            fi
          else
            echo "::notice::extract-execution-shape.sh absent; denied-command detail unavailable (best-effort)."
          fi
          # $GITHUB_OUTPUT is single-line; the producer's tojson encoding already
          # escapes every newline, so a direct echo is safe.
          echo "commands=$VALUE" >> "$GITHUB_OUTPUT"

      # Preserve the engine's full execution transcript as a run artifact (issue #401
      # follow-up). Three no-verdict review runs ended on a VOLUNTARY final message
      # (subtype success, mid-phase) that nobody could ever read — the execution file
      # dies with the runner, so every stall diagnosis so far has been inference from
      # denial counts. Recording it turns the next stall from a guess into a read.
      # Gated by its OWN opt-in key `prflow.execution_transcript_artifact_enabled`
      # (default FALSE, fail-closed — resolved in the diagnostics step above), NOT the
      # default-on diagnostics gate: a consumer repo must never start publishing
      # transcripts merely by upgrading. The scrub pass redacts token-shaped strings
      # (the review profile grants Bash(env:*), so a transcript can contain a dumped
      # environment) before anything becomes an artifact; the scrub is a blocklist and
      # inherently incomplete for third-party credential shapes — another reason the
      # key is opt-in. Fail-closed — a scrub failure uploads nothing.
      - name: Scrub execution transcript for upload
        id: scrub_transcript
        if: always() && steps.diagnostics.outputs.transcript == 'true' && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          SCRUB_HELPER_DIR: ${{ steps.baseprovision.outputs.scrub_helper_dir }}
          VENDOR_SOURCE: ${{ steps.vendor.outputs.vendor_source }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/claude-execution-scrubbed.json"
          # The scrub / non-empty gate / caveat-prepend / fail-closed selection lives in
          # the shared scripts/scrub-transcript.sh helper (issue #1064 D4), so it is not
          # triplicated inline across the three engine-invoking workflows. The helper
          # scrubs via the shared blocklist scripts/scrub-credentials.sh, gates on a
          # non-empty result, prepends the incomplete-blocklist caveat, and prints
          # `path=<OUT>` to STDOUT only when the artifact is safe to upload (nothing
          # otherwise — fail-closed). Route that one line to $GITHUB_OUTPUT.
          #
          # TRUSTED SOURCE ONLY (issue #1064 W3). This job checks out the PR HEAD, so the
          # scrub — a credential-redaction control — is resolved in rank order, mirroring
          # filter-runner-tools.sh / resolve-extra-plugins.sh / emit-git-env.sh:
          #   1. SCRUB_HELPER_DIR — the pair materialized from the base ref by
          #      baseprovision into RUNNER_TEMP (outside the PR-writable workspace);
          #   2. the vendored copy, ONLY when vendor_source==fetch (a fresh clone of the
          #      official repo at the pinned prflow_version — never committed/self);
          #   3. else fail closed — upload nothing, warn naming the trusted-source rule.
          # The PR-head checkout's own copy (committed vendor dir or scripts/) is
          # deliberately NEVER a candidate: a PR-authored no-op scrub would upload the
          # UNSCRUBBED execution file, which carries the `AUTHORIZATION: basic <base64>`
          # header actions/checkout persists. A scrub the PR controls is no scrub.
          _REPO_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
          ST=''
          if [ -n "${SCRUB_HELPER_DIR:-}" ] && [ -f "$SCRUB_HELPER_DIR/scrub-transcript.sh" ] \
            && [ -f "$SCRUB_HELPER_DIR/scrub-credentials.sh" ]; then
            ST="$SCRUB_HELPER_DIR/scrub-transcript.sh"
            echo "transcript scrub helper source: trusted base ref (baseprovision)"
          elif [ "${VENDOR_SOURCE:-}" = "fetch" ] \
            && [ -f "$_REPO_ROOT/.prflow/vendor/prflow/scripts/scrub-transcript.sh" ] \
            && [ -f "$_REPO_ROOT/.prflow/vendor/prflow/scripts/scrub-credentials.sh" ]; then
            ST="$_REPO_ROOT/.prflow/vendor/prflow/scripts/scrub-transcript.sh"
            echo "transcript scrub helper source: runtime-fetched vendored copy (pinned prflow_version)"
          fi
          if [ -n "$ST" ]; then
            bash "$ST" "$EXECUTION_FILE" "$OUT" | tee -a "$GITHUB_OUTPUT"
          else
            echo "::warning::devflow transcript scrub helper (scrub-transcript.sh + scrub-credentials.sh) not found at any TRUSTED source — neither materialized from the base ref (baseprovision) nor runtime-fetched at the pinned prflow_version (vendor_source='${VENDOR_SOURCE:-unknown}'); the PR-head checkout's own copy is deliberately not consulted, because the credential scrub must not be PR-editable. Failing closed: NOT uploading the execution transcript. Land the DevFlow re-vendor on the BASE branch (or use a thin install with a pinned prflow_version) so a trusted helper is available."
          fi

      - name: Upload execution transcript artifact
        if: always() && steps.scrub_transcript.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-transcript-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scrub_transcript.outputs.path }}
          retention-days: 7
          if-no-files-found: ignore

      # Issue #489 (AC2): hand the read-only review tier's STAGED telemetry to the trusted
      # pusher. On this `contents: read` PR-head job, `--persist` runs staging-only (it left
      # its records under gitignored `.prflow/tmp/telemetry-stage-*/.prflow/logs/…` and
      # pushed nothing — see the TOOLS comment above). This job cannot push them (no write
      # credential, and it must not gain one — it checks out the PR head). So it CONSOLIDATES
      # every staged `.prflow/logs` subtree into one deterministic dir and uploads it as a
      # workflow artifact; the trusted `telemetry-push.yml` job (triggered via `workflow_run`)
      # downloads it, validates it as untrusted input, and pushes it. The step is naturally
      # scoped to the staging-only tier: a writable tier's `--persist` returns clean (rc 0)
      # and DELETES its staging root, so there is nothing to collect there.
      - name: Collect staged telemetry artifacts
        id: collect_telemetry
        if: always()
        run: |
          set -uo pipefail
          dest="${RUNNER_TEMP:-/tmp}/prflow-telemetry-artifact"
          # The collection logic lives in a suite-tested helper (best-effort; the trusted pusher
          # re-validates every entry all-or-nothing, so a collection miss cannot reach the branch).
          # Capture the helper's stdout AND its exit status in the SAME statement (the `_collect_rc`
          # capture below): the helper is contracted to ALWAYS exit 0, so a non-zero rc is a genuine EXEC FAULT —
          # rc 126 (present but not executable) / 127 (not found), i.e. a partial or path-skewed
          # deployment where the helper itself could not run — NOT an empty result. That fault must
          # be named distinctly (mirroring the sibling telemetry-push-artifact.sh's rc-126/127
          # discipline), never laundered into the benign no-op notice: gating on stdout alone would
          # make a real telemetry drop indistinguishable from a clean no-op (the notice even claims
          # to cover "the helper reported a collection failure above," which an exec fault — the
          # helper never running — can never reach). This rc dispatch must stay INLINE here (not in
          # a further helper): it is precisely the collect helper's OWN non-existence it detects, so
          # it cannot itself be delegated to a script that could be equally absent.
          _collect_rc=0
          # Prefer the vendored collect helper (materialized by the vendor-plugin step
          # above at .prflow/vendor/prflow/); fall back to the repo-root path for a
          # self-repo checkout — mirrors parse-engine-error.sh's vendored-or-repo
          # resolution. A consumer repo has no repo-root scripts/, so the bare
          # repo-relative path was absent there and this step hit rc 127 on every
          # consumer auto-review — the spurious "deployment fault" ::warning:: below
          # (issue #502). Preferring the vendored path fixes that; the rc-126/127 guard
          # now fires only on a genuine double-absence (a real vendor fault). Direct
          # exec (not `bash`) keeps rc 126 reachable, matching the S1 rc-capture contract.
          _collect_helper=.prflow/vendor/prflow/scripts/collect-staged-telemetry.sh
          [ -f "$_collect_helper" ] || _collect_helper=scripts/collect-staged-telemetry.sh
          _collect_out="$("$_collect_helper" "$GITHUB_WORKSPACE" "$dest")" || _collect_rc=$?
          if [ "$_collect_rc" = 126 ] || [ "$_collect_rc" = 127 ]; then
            echo "::warning::collect staged telemetry: the collect helper ($_collect_helper) could not be executed (rc $_collect_rc — not found or not executable, a partial or path-skewed deployment); NO telemetry uploaded this run. This is a deployment fault, not an empty run — do NOT read it as 'nothing was staged'."
          elif [ -n "$_collect_out" ]; then
            echo "path=$dest" >> "$GITHUB_OUTPUT"
          else
            # No upload tree. The helper emits its OWN distinct ::warning:: when records
            # existed but every copy failed, so this generic notice must NOT assert
            # "nothing was staged" as fact — it covers only the true no-op cases.
            echo "::notice::no telemetry artifact to upload this run (writable tier pushed directly, nothing was staged, or the helper reported a collection failure above)."
          fi

      - name: Upload staged telemetry artifacts
        if: always() && steps.collect_telemetry.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          # A stable, run-scoped name the trusted pusher downloads by run id via `workflow_run`.
          name: prflow-telemetry-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect_telemetry.outputs.path }}
          # LOAD-BEARING: the entire collected tree lives under the DOT-prefixed `.prflow/`,
          # and actions/upload-artifact@v4 EXCLUDES hidden files by default (include-hidden-files
          # defaults to 'false' since v4.4.0). Without this the upload would match nothing and the
          # whole relay would silently transfer zero telemetry (a no-op with no error). The store-
          # relative `.prflow/logs/…` paths are load-bearing for the validator allowlist and
          # telemetry-branch.sh, so keeping the hidden root + this flag is the correct fix.
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
