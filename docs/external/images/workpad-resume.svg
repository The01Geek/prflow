<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" role="img" aria-labelledby="title" aria-describedby="description">
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#FAF7EE"] { fill: #4A3221; }
      [stroke="#D9CFB6"] { stroke: #6C7440; }
      rect[fill="#FFFFFF"] { fill: #5D4230; }
      [fill="#555934"] { fill: #6C7440; }
      [stroke="#555934"] { stroke: #A9B06B; }
      [fill="#565A35"] { fill: #A9B06B; }
      [fill="#4F5430"] { fill: #DCE0B8; }
      [fill="#E7DFC6"] { fill: #3E4425; }
      [fill="#3B2A1E"] { fill: #F2E6D8; }
      [fill="#6E5D4C"] { fill: #D9C6B2; }
      [fill="#FFF8EC"] { fill: #4C3A20; }
      [fill="#7A4D00"] { fill: #F0C980; }
      [fill="#F0F8F4"] { fill: #2E4034; }
      [fill="#2F6B51"] { fill: #9FD4BC; }
      [stroke="#70A38B"] { stroke: #9FD4BC; }
      [stroke="#D49A3A"] { stroke: #F0C980; }
      [fill="#F7F3E6"] { fill: #FFFFFF; }
    }
  </style>
  <title id="title">How PRFlow resumes implementation work</title>
  <desc id="description">PRFlow reads recovery evidence from the GitHub issue workpad and the remote branch. The prflow implement skill uses both sources. A Blocked workpad causes PRFlow to surface the recorded cause. If matching open work exists, PRFlow adopts it, inspects the current tree and repeats checks that can block the run.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#565A35"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="698" rx="28" fill="#FAF7EE" stroke="#D9CFB6" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="46" y="52" fill="#3B2A1E" font-size="26" font-weight="600">Resume uses two kinds of recovery evidence</text>
    <text x="46" y="83" fill="#6E5D4C" font-size="16">The progress record and pushed code answer different questions.</text>

    <g>
      <rect x="48" y="132" width="360" height="194" rx="18" fill="#FFFFFF" stroke="#555934" stroke-width="2"/>
      <rect x="72" y="156" width="192" height="32" rx="16" fill="#E7DFC6"/>
      <text x="168" y="178" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">GitHub issue workpad</text>
      <text x="72" y="226" fill="#3B2A1E" font-size="19" font-weight="600">Human-readable progress</text>
      <text x="72" y="259" fill="#6E5D4C" font-size="16">Status and feature branch</text>
      <text x="72" y="284" fill="#6E5D4C" font-size="16">Plan and acceptance criteria</text>
      <text x="72" y="309" fill="#6E5D4C" font-size="16">Blockers, deferrals and reflections</text>
    </g>

    <g>
      <rect x="492" y="132" width="360" height="194" rx="18" fill="#FFFFFF" stroke="#555934" stroke-width="2"/>
      <rect x="516" y="156" width="150" height="32" rx="16" fill="#E7DFC6"/>
      <text x="591" y="178" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">Remote branch</text>
      <text x="516" y="226" fill="#3B2A1E" font-size="19" font-weight="600">Durable code checkpoints</text>
      <text x="516" y="259" fill="#6E5D4C" font-size="16">Scoped commits</text>
      <text x="516" y="284" fill="#6E5D4C" font-size="16">Verified pushes</text>
      <text x="516" y="309" fill="#6E5D4C" font-size="16">Matching pull request head</text>
    </g>

    <line x1="228" y1="326" x2="355" y2="400" stroke="#555934" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="672" y1="326" x2="545" y2="400" stroke="#555934" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="260" y="396" width="380" height="104" rx="20" fill="#555934"/>
    <text x="450" y="436" fill="#F7F3E6" font-size="16" font-weight="700" text-anchor="middle">prflow:implement</text>
    <text x="450" y="470" fill="#F7F3E6" font-size="20" font-weight="600" text-anchor="middle">Read both before planning</text>

    <line x1="365" y1="500" x2="235" y2="552" stroke="#555934" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="535" y1="500" x2="665" y2="552" stroke="#555934" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="48" y="550" width="360" height="108" rx="18" fill="#FFF8EC" stroke="#D49A3A" stroke-width="2"/>
      <text x="72" y="588" fill="#7A4D00" font-size="19" font-weight="600">If the Workpad is Blocked</text>
      <text x="72" y="620" fill="#6E5D4C" font-size="16">Surface the recorded cause and wait</text>
      <text x="72" y="644" fill="#6E5D4C" font-size="16">for the required human action.</text>
    </g>

    <g>
      <rect x="492" y="550" width="360" height="108" rx="18" fill="#F0F8F4" stroke="#70A38B" stroke-width="2"/>
      <text x="516" y="588" fill="#2F6B51" font-size="19" font-weight="600">If matching open work exists</text>
      <text x="516" y="620" fill="#6E5D4C" font-size="16">Adopt the branch or pull request, inspect</text>
      <text x="516" y="644" fill="#6E5D4C" font-size="16">the tree and repeat blocking checks.</text>
    </g>
  </g>
</svg>
