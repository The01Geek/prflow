<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title" aria-describedby="description">
  <style>
    @media (prefers-color-scheme: dark) {
      [fill="#FAF7EE"] { fill: #4A3221; }
      [stroke="#D9CFB6"] { stroke: #6C7440; }
      rect[fill="#FFFFFF"] { fill: #5D4230; }
      [fill="#555934"] { fill: #6C7440; }
      [stroke="#555934"] { stroke: #A9B06B; }
      [fill="#565A35"] { fill: #A9B06B; }
      [fill="#4F5430"] { fill: #DCE0B8; }
      [fill="#6E7544"] { fill: #B9BF7E; }
      [fill="#E7DFC6"] { fill: #3E4425; }
      [fill="#DDD3BC"] { fill: #4E5330; }
      [fill="#EEE7D3"] { fill: #4F3A28; }
      [fill="#A89F84"] { fill: #B7A98F; }
      [fill="#3B2A1E"] { fill: #F2E6D8; }
      [fill="#6E5D4C"] { fill: #D9C6B2; }
      [fill="#FFF8EC"] { fill: #4C3A20; }
      [fill="#7A4D00"] { fill: #F0C980; }
      [fill="#F0F8F4"] { fill: #2E4034; }
      [fill="#E8F5EF"] { fill: #2E4034; }
      [fill="#2F6B51"] { fill: #9FD4BC; }
    }
  </style>
  <title id="title">Choose a PRFlow skill by outcome</title>
  <desc id="description">Four core delivery skills create an issue, implement an issue, review changes or review and fix changes. Three supporting skills update a pull request description, maintain documentation or run the weekly retrospective.</desc>

  <rect x="1" y="1" width="898" height="758" rx="28" fill="#FAF7EE" stroke="#D9CFB6" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="46" y="52" fill="#3B2A1E" font-size="26" font-weight="600">Choose the skill that matches the outcome</text>
    <text x="46" y="83" fill="#6E5D4C" font-size="16">Start with the smallest workflow that has the edit authority you need.</text>

    <text x="48" y="130" fill="#6E5D4C" font-size="14" font-weight="700" letter-spacing="0.7">CORE DELIVERY SKILLS</text>

    <g>
      <rect x="48" y="150" width="385" height="142" rx="18" fill="#FFFFFF" stroke="#DDD3BC" stroke-width="2"/>
      <rect x="72" y="174" width="190" height="31" rx="15" fill="#E7DFC6"/>
      <text x="167" y="195" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">prflow:create-issue</text>
      <text x="72" y="239" fill="#3B2A1E" font-size="20" font-weight="600">Create an approved issue</text>
      <text x="72" y="268" fill="#6E5D4C" font-size="16">Turns a rough request into a reviewed ticket.</text>
    </g>

    <g>
      <rect x="467" y="150" width="385" height="142" rx="18" fill="#FFFFFF" stroke="#555934" stroke-width="2"/>
      <rect x="491" y="174" width="166" height="31" rx="15" fill="#555934"/>
      <text x="574" y="195" fill="#F7F3E6" font-size="15" font-weight="700" text-anchor="middle">prflow:implement</text>
      <text x="491" y="239" fill="#3B2A1E" font-size="20" font-weight="600">Complete an existing issue</text>
      <text x="491" y="268" fill="#6E5D4C" font-size="16">Prepares a review-ready or draft pull request.</text>
    </g>

    <g>
      <rect x="48" y="322" width="385" height="142" rx="18" fill="#FFFFFF" stroke="#70A38B" stroke-width="2"/>
      <rect x="72" y="346" width="144" height="31" rx="15" fill="#E8F5EF"/>
      <text x="144" y="367" fill="#2F6B51" font-size="15" font-weight="700" text-anchor="middle">prflow:review</text>
      <text x="72" y="411" fill="#3B2A1E" font-size="20" font-weight="600">Assess without tree edits</text>
      <text x="72" y="440" fill="#6E5D4C" font-size="16">Returns findings and an APPROVE or REJECT verdict.</text>
    </g>

    <g>
      <rect x="467" y="322" width="385" height="142" rx="18" fill="#FFFFFF" stroke="#555934" stroke-width="2"/>
      <rect x="491" y="346" width="214" height="31" rx="15" fill="#E7DFC6"/>
      <text x="598" y="367" fill="#4F5430" font-size="15" font-weight="700" text-anchor="middle">prflow:review-and-fix</text>
      <text x="491" y="411" fill="#3B2A1E" font-size="20" font-weight="600">Assess and correct</text>
      <text x="491" y="440" fill="#6E5D4C" font-size="16">Commits corrections only when you authorize edits.</text>
    </g>

    <text x="48" y="516" fill="#6E5D4C" font-size="14" font-weight="700" letter-spacing="0.7">SUPPORTING SKILLS</text>

    <g>
      <rect x="48" y="536" width="250" height="154" rx="18" fill="#FFFFFF" stroke="#DDD3BC" stroke-width="2"/>
      <text x="72" y="572" fill="#4F5430" font-size="15" font-weight="700">prflow:pr-description</text>
      <text x="72" y="610" fill="#3B2A1E" font-size="18" font-weight="600">Explain the change</text>
      <text x="72" y="640" fill="#6E5D4C" font-size="15">Refreshes the pull request</text>
      <text x="72" y="663" fill="#6E5D4C" font-size="15">description.</text>
    </g>

    <g>
      <rect x="325" y="536" width="250" height="154" rx="18" fill="#FFFFFF" stroke="#DDD3BC" stroke-width="2"/>
      <text x="349" y="572" fill="#4F5430" font-size="15" font-weight="700">prflow:docs</text>
      <text x="349" y="610" fill="#3B2A1E" font-size="18" font-weight="600">Document the change</text>
      <text x="349" y="640" fill="#6E5D4C" font-size="15">Runs the complete branch</text>
      <text x="349" y="663" fill="#6E5D4C" font-size="15">documentation pass.</text>
    </g>

    <g>
      <rect x="602" y="536" width="250" height="154" rx="18" fill="#FFFFFF" stroke="#DDD3BC" stroke-width="2"/>
      <text x="626" y="572" fill="#4F5430" font-size="15" font-weight="700">prflow:retrospective-weekly</text>
      <text x="626" y="610" fill="#3B2A1E" font-size="18" font-weight="600">Learn from merged work</text>
      <text x="626" y="640" fill="#6E5D4C" font-size="15">Produces bounded proposals</text>
      <text x="626" y="663" fill="#6E5D4C" font-size="15">for human triage.</text>
    </g>

    <text x="450" y="726" fill="#6E5D4C" font-size="15" text-anchor="middle">Skill names stay the same; invocation syntax varies by client.</text>
  </g>
</svg>
