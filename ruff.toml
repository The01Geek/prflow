# Ruff configuration for this repository. Refs issue #742.
# Do not add `exclude`, `extend-exclude` or `force-exclude`: lib/test/run.sh's #1621
# gate passes --no-force-exclude so such a pairing cannot turn it vacuously green.

[lint]
ignore = [
  # This repo inspects `returncode` deliberately instead of raising on a non-zero exit.
  "PLW1510",
  # Blind `except Exception` is the deliberate shape of this repo's best-effort helpers.
  "BLE001",
  # Several shebang-bearing modules here are imported rather than executed.
  "EXE001",
  # `try`/`except`/`pass` is deliberate best-effort suppression in this repo.
  "S110",
]
